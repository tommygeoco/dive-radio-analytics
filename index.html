  let out = `<div class="h">Health ${h.score} — ${esc(short(e.title))}</div>`;
  out += `<div>Its first three weeks, measured against the show as it stood when it aired. 50 means a typical episode; newer episodes never change it.</div>`;
  return out;
}

function sameAgeSub(e) {
  // PRD v9 W22b: pace is read from data.baselines — YouTube views at this
  // episode's current age against the other episodes' readings at that age,
  // promo outliers left out, at least three peers or nothing. Never recomputed here.
  if (!hasYoutubeReading(e)) return null;
  const p = DATA.baselines?.pace?.[e.slug];
  if (!p || !(p.value > 0) || p.rank == null || !Number.isFinite(p.pct)) return null;
  return { pct: p.pct, n: p.n, rank: p.rank, of: p.of };
}
function launchOf(e) {
  const launch = hasYoutubeReading(e) ? DATA.baselines?.launch?.[e.slug] : null;
  return launch?.value > 0 ? launch : null;
}

function healthTrend(points) {
  if (!Array.isArray(points) || points.length < 7) return "";
  // fixed scale (critic 2026-09-01 F6): the show's usual level (50) is the
  // middle line and the bands are ten points wide, so a five-point drift
  // draws as a five-point drift — never stretched to the data's own range
  const LO = 25, HI = 75, W = 150, H = 36, PAD = 3;
  const y = (v) => Math.round((PAD + (HI - Math.min(HI, Math.max(LO, v))) / (HI - LO) * (H - 2 * PAD)) * 10) / 10;
  const x = (i) => Math.round((1 + i / (points.length - 1) * (W - 2)) * 10) / 10;
  const coords = points.map((p, i) => `${x(i)},${y(p.score)}`).join(" ");
  const first = points[0], last = points[points.length - 1];
  const since = fmtDate(premiereMs(first.date));
  return `<div class="trendwrap"><span class="tv">${first.score}</span><svg class="trend" viewBox="0 0 ${W} ${H}" role="img" aria-label="Saved health scores since ${esc(since)}: ${first.score} then, ${last.score} now. 50 is the show’s usual level."><line class="mid" x1="0" y1="${y(50)}" x2="${W}" y2="${y(50)}"></line><polyline points="${coords}"></polyline><circle class="end" cx="${x(points.length - 1)}" cy="${y(last.score)}" r="2.5"></circle></svg><span class="tv now">${last.score}</span><span class="cap">since ${esc(since)}</span></div>`;
}

/* Six-check diagnosis labels and states. The words stay plain; the exact saved
   numbers live one click away in the evidence card, never at glance layer. */
// [full label, what the check reads, short name] — the short name is the
// full label cut to one or two words so the six names fit two short lines
const CHECK_LABELS = {
  growth: ["Growth", "How new episodes start", "Growth"],
  audienceQuality: ["Audience quality", "Watch time and reactions", "Audience"],
  reachEfficiency: ["Reach", "X announces being seen and played", "Reach"],
  livePull: ["Live turnout", "Peak, average, people, and minutes watched live", "Live turnout"],
  participation: ["Participation", "Chatters and chat pace", "Participation"],
  conversion: ["Subscribers", "Subscriber pull", "Subscribers"],
  sentiment: ["Goodwill", "How feedback reads", "Goodwill"],
};
// PRD v10: the direction lens's measure names, and the launch-word tooltip —
// words only; every number they show comes from the stored read
const DIRECTION_LABELS = {
  firstWeek: "First weeks without a promo spike", liveAverage: "Average live viewers", livePeak: "Peak live viewers",
  chattersPer100: "Chatters per hundred at the peak", messagesPerHour: "Chat messages an hour",
  engagementWeekOne: "First-week likes and comments", exposureWeekOne: "First-week X reach",
  announceToPlay: "Announce-to-play on X", watching: "Share of the video watched", subscribers: "Subscribers per thousand views",
  liveViewers: "People who watched live", minutesWatched: "Minutes watched live", minutesPerViewer: "Minutes each live viewer stayed",
  holdRate: "Share of the peak still watching at the end", discoveryShare: "YouTube views from search and suggestions",
};
const cap = (w) => (w ? w.charAt(0).toUpperCase() + w.slice(1) : "");
/* PRD v12 W43: the episode's chapters — model-written from its transcript,
   every timestamp and quote grounded; a link only when the transcript runs on
   the YouTube upload's clock (captions), never on the live recording's */
function chaptersHTML(e) {
  const ch = e.chapters;
  if (!ch || !ch.list || !ch.list.length) return "";
  const yt = Object.entries(e.links || {}).find(([k]) => k.startsWith("yt:"))?.[1] || null;
  const linkable = ch.clock === "upload" && yt;
  const clock = (t) => String(t).replace(/^00:/, "").replace(/^0(\d)/, "$1");
  const rows = ch.list.map((c) => `<div class="chrow"><span class="cht">${linkable ? `<a href="${esc(yt)}&t=${c.seconds}s" target="_blank" rel="noopener">${esc(clock(c.start))}</a>` : esc(clock(c.start))}</span><span class="chb"><b>${esc(c.title)}</b><span class="chg">${esc(c.gist)}</span></span></div>`).join("");
  const note = linkable ? "Timestamps follow the YouTube upload — each one opens the moment." : "Timestamps follow the live recording, which starts a few minutes before the upload — read them as approximate.";
  return `<div class="chapters"><h3 class="kicker">Chapters <span class="kh">${ch.status === "complete" ? "model-written, every timestamp checked against the transcript" : "incomplete"}</span></h3>${rows}<div class="mut chnote">${note}</div></div>`;
}
function launchNote(l) {
  const when = l.provisional ? `${Math.round(l.ageDays)} days in` : l.late ? `at its earliest reading, day ${Math.round(l.ageDays)}` : "at the end of its first week";
  const body = l.pct != null
    ? `${nfmt(l.value)} YouTube views ${when}, typically ${nfmt(l.typical)} at that age across ${l.n} other episodes (${l.pct >= 0 ? "+" : ""}${l.pct}%)`
    : (l.reason || "");
  return `${body}${l.promoDriven ? " — promo-driven: shown here, not scored in show health" : ""}${l.provisional ? " — an early read that settles at day seven" : ""}.`;
}
/* A check's state comes from the bands the saved read stamped for it — bands
   that follow how much that check normally swings between episodes (rule 23);
   a read written before the rule carries none and gets the fixed bands */
function checkState(score, bands) {
  const b = bands && Number.isFinite(bands.healthy) && Number.isFinite(bands.steady) ? bands : BANDS;
  if (score == null) return ["waiting", "Not in yet"];
  if (score >= b.healthy) return ["healthy", "Healthy"];
  if (score >= b.steady) return ["steady", "Steady"];
  return ["fragile", "Fragile"];
}

/* The saved score's band in words — the same thresholds the checks use
   (data.baselines BANDS), so the strip and the rows can never disagree;
   50 is the show's usual level, and the bands sit five points either side */
function scoreBandWords(score) {
  if (score >= BANDS.healthy) return "Above usual";
  if (score >= BANDS.steady) return "Near usual";
  return "Below usual";
}

function buildHealth() {
  const el = document.getElementById("health");
  const h = DATA.health;
  if (!h || !Number.isFinite(h.score) || !h.headline || !Array.isArray(h.pros) || !Array.isArray(h.cons)) {
    // rule 15: after a week behind, the score is withheld — the card says so and
    // what happens next; no gauge, no zero
    el.className = "healthrow empty";
    const title = h?.withheld ? "Show health read withheld" : "Show health read not saved yet";
    const body = h?.withheld
      ? "The last saved read is more than a week behind the data, so its score is held back. The next morning run saves a fresh one."
      : "The first morning run that can read the show saves it here.";
    el.innerHTML = `<div class="card hempty"><span class="hempty-ic" aria-hidden="true">${ICONS.clock}</span><div><h2 class="hempty-t">${title}</h2><p class="hempty-b">${body}</p></div></div>`;
    return;
  }
  // No saved-age or early-read line here (owner directive 2026-08-23): the
  // header stamp already says when the data last refreshed, and an early read
  // shows itself as a check named under "Not in yet".
  const R = 26, C = Math.round(2 * Math.PI * R * 10) / 10;
  // drill data behind each check: the SAVED measures from the public projection
  // (never scoring inputs) — this value against the show's typical, or the
  // stored reason when a measure has no honest number yet
  // measure words follow the formula the served read was written under:
  // health-v4 counts likes and comments at the same age, earlier formulas
  // read them per thousand views
  const v4 = Number(String(h.formulaVersion || "").replace(/\D/g, "")) >= 4;
  const MEASURE_WORDS = {
    firstWeek: "How each clean launch week compares with the one before",
    sameAge: "YouTube views at the newest episode’s age",
    engagement: v4 ? "Likes and comments at the newest episode’s age" : "Likes and comments per 1,000 views",
    watching: "Share of the video people watch",
    exposure: "Times the X announces were seen at the newest episode’s age",
    announceToPlay: "Watches per 100 announce views on X",
    xShare: "Share of watching happening on X",
    peak: "Peak live viewers",
    average: "Average live viewers",
    chat: "Live chat messages",
    chattersPer100: "Chatters per hundred people at the peak",
    messagesPerHour: "Chat messages an hour",
    liveViewers: "People who watched live",
    minutesWatched: "Minutes watched live, all together",
    minutesPerViewer: "Minutes each live viewer stayed",
    holdRate: "Share of the peak still watching in the last ten minutes",
    discoveryShare: "Share of YouTube views from search and suggested videos",
    subscribers: "Subscribers gained per 1,000 views",
    balance: "Share of feedback leaning positive",
    commentRate: "People commenting per 1,000 watches",
  };
  const PCT_MEASURES = new Set(["watching", "xShare", "balance", "holdRate", "discoveryShare"]);
  // one drill payload per check: the name in the strip and its tooltip can
  // never tell two stories
  const checks = (h.checks || []).map((c) => {
    const [label, , shortName] = CHECK_LABELS[c.key] || [c.key, "", c.key];
    const [cls, word] = checkState(c.score, c.bands);
    const fmtM = (k, v) => `${nfmt(v)}${PCT_MEASURES.has(k) ? "%" : ""}`;
    // structured drill rows for the tooltip: label, strong value, comparison
    // direction (the shared quiet-zone gate from data.baselines), the sample,
    // and each measure's stored note — how it was compared (same age, or as
    // the earlier episodes stand now). Stored honesty reaches the click layer
    // (PRD v9 rule 17) inside the measure-block layout, never as prose lines.
    const drill = (c.measures || []).map((m) => {
      const name = MEASURE_WORDS[m.key] || m.key;
      if (m.value == null) return m.reason ? { n: name, r: m.reason } : null;
      const row = { n: name, v: fmtM(m.key, m.value), note: m.note || null };
      if (m.typical != null) {
        row.t = fmtM(m.key, m.typical);
        if (m.typical > 0) {
          const pct = Math.round(Math.abs(m.value / m.typical - 1) * 100);
          row.d = pct <= QUIET_ZONE ? "mid" : m.value > m.typical ? "up" : "down";
          if (row.d !== "mid") row.p = pct;
        }
      }
      if (m.sample) row.s = m.sample;
      // PRD v10: a promo-qualified lift says so under its numbers; a carried
      // read says which episode it came from and that it counts half
      if (m.qualified && m.reason) row.q = m.reason;
      if (m.carriedNote) row.cn = tidyTitles(m.carriedNote);
      // rule 23: how much this measure normally swings, so a reader can see
      // why a dip reads steady on a noisy measure and fragile on a quiet one
      if (Number.isFinite(m.swing) && m.swing !== c.swing) row.sw = `the show’s usual swing on this is about ±${m.swing}%`;
      return row;
    }).filter(Boolean);
    // an unscored check's stored reason is the measure reasons joined — when
    // the measure rows already say it, a footer repeating them is noise
    const bandNote = c.bands && Number.isFinite(c.bands.healthy) ? ` Healthy from ${c.bands.healthy}, fragile under ${c.bands.steady}${Number.isFinite(c.swing) ? `, because this check usually swings about ±${c.swing}%` : ""}.` : "";
    // stored reasons name episodes by their upload titles; the page says each
    // title the short way, and when a measure row already says which episode
    // it was carried from, the footer doesn't repeat it
    const carried = drill.some((r) => r.cn);
    const reasonText = tidyTitles(c.reason || "").replace(carried ? /\s*read from [^.]*?the latest finished episode\.?/i : /$^/, "").trim();
    const note = c.score != null
      ? `This check scored ${c.score} of 100 — 50 is the show’s usual level.${bandNote}${reasonText ? ` ${reasonText.charAt(0).toUpperCase() + reasonText.slice(1)}` : ""}`
      : (drill.length ? "" : reasonText);
    // say each fact once: when the footer already says the check was carried
    // from an older episode, the measure rows don't repeat it
    if (/carried/i.test(note)) for (const r of drill) delete r.cn;
    const rest = `data-state="${esc(word)}" data-stcls="${cls}"${drill.length ? ` data-mrows="${esc(JSON.stringify(drill))}"` : ""}${note ? ` data-note="${esc(note)}"` : ""}`;
    return { label, shortName, cls, word, rest };
  });
  // the checks as words, grouped by state — fragile first, then steady,
  // healthy, and the checks with no reading yet; a state with no checks is
  // simply absent. Each name is a real button (keyboard focus shows the
  // tooltip, Enter or a tap pins it); its accessible name carries the state.
  const GROUP_ORDER = ["fragile", "steady", "healthy", "waiting"];
  const groups = GROUP_ORDER.map((cls) => {
    const members = checks.filter((c) => c.cls === cls);
    if (!members.length) return "";
    const names = members.map((c) => `<button type="button" class="hname" data-stat="${esc(c.label)}" ${c.rest} aria-label="${esc(`${c.label}: ${c.word}`)}"><i class="hcd" aria-hidden="true"></i>${esc(c.shortName)}</button>`)
      .join("");
    return `<div class="hgroup ${cls}" data-state="${esc(members[0].word)}"><span class="hnames">${names}</span></div>`;
  }).join("");
  // W27: between saved reads the set of scored checks can change — a scoring
  // rule ships, a check gains or loses the history it needs. The number then
  // rests on different checks than the last read, and silence lets it pass as
  // continuity (2026-08-24: two checks left, the score held still, and the
  // owners read the designed absence as breakage). Deterministic words built
  // from the stored change, never a number; the strip names where each stands.
  const change = h.checkSetChange;
  const checkName = (k) => (CHECK_LABELS[k] || [k])[0].toLowerCase();
  const nameWords = (keys) => keys.map(checkName).map((w, i, all) =>
    (i === 0 ? "" : i === all.length - 1 ? " and " : ", ") + w).join("");
  const changeNote = change && (change.left?.length || change.joined?.length) ? (() => {
    const parts = [];
    if (change.left?.length) parts.push(`the ${nameWords(change.left)} check${change.left.length > 1 ? "s" : ""} left the score`);
    if (change.joined?.length) parts.push(`the ${nameWords(change.joined)} check${change.joined.length > 1 ? "s" : ""} joined the score`);
    return `<p class="setchange">Since the last saved read, ${parts.join(" and ")} — today’s number rests on different checks than the last one. The checks above say where each stands.</p>`;
  })() : "";
  // each bullet carries exactly one validated number — bolding it gives the
  // eye an anchor; the dot carries direction alongside the column header
  const emphNum = (text) => esc(text).replace(/\d[\d,]*(?:\.\d+)?%?/, (m) => `<b>${m}</b>`);
  const bullets = (items, dir) => items.map(item => `<li class="${dir}"><i aria-hidden="true"></i><span>${emphNum(typeof item === "string" ? item : item.text)}</span></li>`).join("");
  const trend = healthTrend(h.trend?.points);
  // Today's read (owner directive 2026-08-23): no methodology copy — the
  // grounded headline plus the top do-next actions, straight from the saved
  // recommendation store (first item of each of the two leading categories).
  // Methodology lives in About; the deterministic pick keeps build-out honest.
  const topRecs = (() => {
    const ranked = (DATA.insights || []).filter((ins) => ins.rank && ins.recommendation).sort((a, b) => a.rank - b.rank);
    if (ranked.length) return ranked.slice(0, 2);   // W35: the two biggest levers of the day's read
    const seen = new Set(); const out = [];
    for (const ins of DATA.insights || []) {
      if (!ins.recommendation || seen.has(ins.category)) continue;
      seen.add(ins.category); out.push(ins);
      if (out.length === 2) break;
    }
    return out;
  })();
  // PRD v10: what the read is on (the newest episode and its age, the checks
  // carried from an older one, the lifts shown but not scored) — words built
  // from the stored asOf block, numbers only where the store has them
  const QUALIFIED_WORDS = { "growth.sameAge": "the latest launch", "reachEfficiency.exposure": "the latest X reach", "reachEfficiency.announceToPlay": "announce-to-play on X", "audienceQuality.engagement": "engagement" };
  const readsOn = (() => {
    if (!h.asOf?.newestTitle) return "";
    const parts = [`Reads <b>${esc(h.asOf.newestTitle)}</b>, ${nfmt(Math.round(h.asOf.ageDays))} days in${h.asOf.provisional ? " (an early read)" : ""}`];
    if (h.asOf.carried?.length) parts.push(`${h.asOf.carried.map((k) => (CHECK_LABELS[k] || [k])[0].toLowerCase()).join(" and ")} carried from the latest finished episode at half weight`);
    if (h.asOf.qualified?.length) parts.push(`shown but not scored: ${h.asOf.qualified.map((k) => QUALIFIED_WORDS[k] || k).join(" and ")} — promo-driven`);
    return `<p class="readson">${parts.join(" · ")}.</p>`;
  })();
  // PRD v10: the direction and outlook lenses are read from data.baselines —
  // computed once by build-data, served every build, never gated on the
  // model; the entry keeps a copy for the ledger. Words carry the state; a
  // series with a slope but too few episodes for a word says so.
  const lens = DATA.baselines?.direction || null;
  const out = DATA.baselines?.outlook || null;
  const headingColumn = (() => {
    if (!lens?.measures?.length) return "";
    const rows = lens.measures.filter((t) => t.pctPerEpisode != null).map((t) => {
      const tip = [t.note, t.reason].filter(Boolean).join(" — ");
      const word = t.direction ? `<span class="dw ${esc(t.direction)}">${esc(t.direction)}</span>` : `<span class="dw thin">too few to call</span>`;
      return `<div class="dirrow"><span class="dl"${tip ? ` data-tip="${esc(tip)}" tabindex="0"` : ""}>${esc(DIRECTION_LABELS[t.key] || t.key)}</span>${word}</div>`;
    }).join("");
    const nfw = out?.nextFirstWeek;
    const slope = nfw && nfw.pctPerEpisode != null ? ` Across them, first weeks ${nfw.pctPerEpisode >= 0 ? "grow" : "shrink"} about ${nfmt(Math.abs(nfw.pctPerEpisode))}% an episode${nfw.direction ? "" : " — too few weeks for a direction word"}.` : "";
    const outlook = nfw && nfw.low != null
      ? `<p class="outlook">The last three launches without a promo spike drew <b>${nfmt(nfw.low)}</b>–<b>${nfmt(nfw.high)}</b> YouTube views in their first week (typical <b>${nfmt(nfw.typical)}</b>) — where the next one lands if it follows them.${esc(slope)}</p>`
      : (nfw?.reason ? `<p class="outlook">${esc(nfw.reason)}</p>` : "");
    const co = out?.coolOff;
    const cool = co?.word ? `<p class="outlook">The newest episode is ${esc(co.word)} at day ${nfmt(Math.round(co.ageDays))}.</p>`
      : (co?.promoDriven ? `<p class="outlook">The newest episode’s cool-off is promo-driven — shown on the chart, not judged.</p>` : "");
    return `<div class="hdcol hc-dir"><h3 class="kicker">Where it’s heading</h3>
      <p class="dirlede">Over the last few episodes without a promo spike: <b class="${esc(lens.overall || "holding")}">${esc(lens.overall || "too few to call")}</b></p>
      <div class="dirrows">${rows}</div>${outlook}${cool}</div>`;
  })();
  const open = !!state.evidenceOpen;
  el.className = "healthrow";
  el.innerHTML = `<div class="card hcard" data-open="${open ? "true" : "false"}">
    <div class="hstrip">
      <div class="hz hz-score">
        <div class="gauge" role="img" aria-label="Show health ${h.score} out of 100. 50 is the show’s usual level.">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <circle class="track" cx="32" cy="32" r="${R}"></circle>
            ${h.score > 0 ? `<circle class="fill" cx="32" cy="32" r="${R}" stroke-dasharray="${Math.round(C * h.score / 100 * 10) / 10} ${C}"></circle>` : ""}
            <line class="tick" x1="1" y1="32" x2="11" y2="32"></line>
          </svg>
          <div class="num"><b data-fold-number>${h.score}</b></div>
        </div>
        <div class="hz-words"><h2 class="kicker">Show health</h2><div class="hband">${scoreBandWords(h.score)}</div>${lens?.overall ? `<div class="hband hdir ${esc(lens.overall)}">${esc(lens.overall)}</div>` : ""}</div>
      </div>
      <div class="hz hz-checks"><h3 class="kicker">Health diagnosis</h3><div class="hgroups" role="group" aria-label="Health checks">${groups}</div></div>
      <div class="hz hz-read">
        <div class="hz-readbody"><h3 class="kicker">${h.date === phoenixDateKey() ? "Today’s read" : "Latest read"}</h3><p class="headline${open ? "" : " clamped"}"${open ? ` style="max-height:none"` : ""}>${esc(h.headline)}</p></div>
        <button type="button" class="hxbtn" id="whyscore" aria-expanded="${open ? "true" : "false"}" aria-controls="hdetails">${ICONS.chevdown}<span class="hxlabel">${open ? "Hide details" : "Why this score"}</span></button>
      </div>
    </div>
    <div class="hdetails" id="hdetails">
      <div class="hdinner"${open ? "" : " inert"}>
        <div class="hdbody cols-${1 + (headingColumn ? 1 : 0) + (topRecs.length ? 1 : 0)}">
          <div class="hdcol health-evidence">
            <h3 class="kicker">Why this score</h3>
            ${readsOn}
            <div class="evidence"><div><h4 class="up">Helping</h4><ul>${bullets(h.pros, "up")}</ul></div>
            <div><h4 class="down">Needs work</h4><ul>${bullets(h.cons, "down")}</ul></div></div>
            ${changeNote}
            ${(() => { const ds = (h.drivers || []).filter((d) => !(headingColumn && /^direction\b/i.test(d))); return ds.length ? `<div class="drivers">${ds.map((d) => `<p>${esc(d)}</p>`).join("")}</div>` : ""; })()}
            ${trend}
          </div>
          ${headingColumn}
          ${topRecs.length ? `<div class="hdcol hc-meta"><h3 class="kicker">Do next</h3><div class="donext">${topRecs.map((r, i) => `<a class="dnrow" href="#actions/${encodeURIComponent(r.id || "")}"><span class="dnnum" aria-hidden="true">${i + 1}</span><span class="dntext">${esc(r.recommendation)}</span>${IC('<path d="m9.5 6.5 5.5 5.5-5.5 5.5"/>', "dnchev")}</a>`).join("")}</div><a class="herolink alllink" href="#actions">All actions${IC('<path d="m9.5 6.5 5.5 5.5-5.5 5.5"/>')}</a></div>` : ""}
        </div>
      </div>
    </div>
  </div>`;
  // Expand / Collapse toggles the card in place — no render() — so the
  // details can move: the same DOM goes from 0fr to 1fr and back. A re-render
  // for any other reason draws the card straight into its current state.
  const card = el.querySelector(".hcard");
  const btn = document.getElementById("whyscore");
  const inner = el.querySelector(".hdinner");
  const details = document.getElementById("hdetails");
  const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  const headline = el.querySelector(".hz-read .headline");
  let settle = 0;
  // open: no cap, so a later reflow (a wider window) never clips the text;
  // closed: the three-line clamp with its ellipsis returns
  const settled = () => {
    if (state.evidenceOpen) headline.style.maxHeight = "none";
    else headline.classList.add("clamped");
  };
  const setOpen = (next) => {
    state.evidenceOpen = next;
    card.dataset.open = String(next);
    btn.setAttribute("aria-expanded", String(next));
    btn.querySelector(".hxlabel").textContent = next ? "Hide details" : "Why this score";
    // closed details are inert: nothing inside can take focus or be read
    if (next) inner.removeAttribute("inert"); else inner.setAttribute("inert", "");
    if (next) {
      // lift the clamp, then ease the box up to the text's full height
      headline.classList.remove("clamped");
      headline.style.maxHeight = `${headline.scrollHeight}px`;
      // bring the region in WITH the motion, not after it: the closed inner
      // already lays out its content, so its scrollHeight is the final size
      const need = details.getBoundingClientRect().top + inner.scrollHeight + 24 - window.innerHeight;
      if (need > 0) window.scrollBy({ top: need, behavior: reduced() ? "auto" : "smooth" });
    } else {
      // ease back down to the clamp: start from a real length (an open,
      // settled headline sits at max-height none, which cannot animate),
      // commit it, then let the stylesheet's cap take over
      headline.style.maxHeight = `${headline.scrollHeight}px`;
      void headline.offsetHeight;
      headline.style.maxHeight = "";
    }
    // the headline settles when its motion ends — or on a timer, since a
    // headline that already fits never changes height and so never fires
    // transitionend (nor does anything under reduced motion)
    clearTimeout(settle);
    settle = setTimeout(settled, reduced() ? 0 : 380);
  };
  headline.addEventListener("transitionend", (ev) => {
    if (ev.propertyName !== "max-height") return;
    clearTimeout(settle);
    settled();
  });
  btn.addEventListener("click", () => setOpen(!state.evidenceOpen));
  // the score and the read are click targets too (pointer only — the button
  // is the keyboard path): "why 46" sits on the 46, and a headline invites a
  // click; a drag to select text is not a click
  const toggleOnClick = () => { if (String(getSelection && getSelection())) return; setOpen(!state.evidenceOpen); };
  el.querySelector(".hz-score").addEventListener("click", toggleOnClick);
  el.querySelector(".hz-readbody").addEventListener("click", toggleOnClick);
  // Escape inside the open details collapses them and hands focus back
  card.addEventListener("keydown", (ev) => {
    if (ev.key !== "Escape") return;
    // a showing tooltip goes first; the next Escape collapses the details
    if (rtt.style.opacity === "1") { ev.stopPropagation(); rttPinned = null; hideRtt(); return; }
    if (!state.evidenceOpen) return;
    ev.stopPropagation();
    setOpen(false);
    btn.focus();
  });
}

/* ================= hero: latest episode card ================= */
let sparkChart = null;
// The hero mirrors the chart (owner directive 2026-08-23): it shows the
// selected episode — latest when none is selected — and leads with whichever
// measure the chart is on. One primary number per measure branch; only one
// branch ever renders.
function heroMetricKey() { return state.mode === "live" ? "live" : state.metric; }
// Split bar + its labels from ONE definition, so the two can never disagree.
// The 8px bar is too thin to be the only hover target, so each segment and its
// label share the same tooltip; the labels also carry the keyboard focus and
// the spoken numbers. A segment with no honest number is left out entirely.
function splitBar(segments, wholeWords) {
  const segs = segments.filter((s) => Number.isFinite(s.value) && s.value >= 0);
  const total = segs.reduce((a, s) => a + s.value, 0);
  if (segs.length < 2 || !(total > 0)) return "";
  const parts = segs.map((s) => {
    const share = Math.round((s.value / total) * 100);
    const stat = `${nfmt(s.value)} ${s.unit}`;
    const rows = (s.rows || []).filter((r) => r.value != null).map((r) => `${r.name}: ${nfmt(r.value)}`);
    const tip = `data-stat="${esc(stat)}"${rows.length ? ` data-rows="${esc(rows.join("||"))}"` : ""} data-note="${esc(`${share}% of ${wholeWords}`)}"`;
    return { s, stat, share, tip };
  });
  return `<div class="platform-bar" aria-hidden="true">${parts.map(({ s, tip }) =>
      `<span class="pseg" style="flex:${s.value};background:${s.color}" ${tip}></span>`).join("")}</div>
    <div class="splitlabels">${parts.map(({ s, stat, share, tip }) =>
      `<span class="sl" ${tip} tabindex="0" aria-label="${esc(`${s.label}: ${stat}, ${share}% of ${wholeWords}`)}"><i style="background:${s.color}" aria-hidden="true"></i>${esc(s.label)}</span>`).join("")}</div>`;
}
// Every chart this dashboard draws, in ONE list (owner directive
// 2026-08-23): the view tabs and the measure picker were two controls for one
// decision, so they collapse into a single dropdown whose current item IS the
// chart's heading. Each entry names the chart's mode and, for the per-episode
// bars, which measure it charts.
const VIEW_DEFS = [
  { key: "views", group: "By episode", title: "Episode views", mode: "standings", metric: "views" },
  { key: "watched", group: "By episode", title: "Share watched", mode: "standings", metric: "watched" },
  { key: "liveavg", group: "By episode", title: "Average live viewers", mode: "standings", metric: "live" },
  { key: "reach", group: "By episode", title: "X reach", mode: "standings", metric: "reach" },
  { key: "race", group: "Over time", title: "Views after release", mode: "race", metric: "views" },
  { key: "watch", group: "Over time", title: "How much people watch", mode: "watch", metric: "views" },
  { key: "minutes", group: "Over time", title: "Live viewers by minute", mode: "live", metric: "views" },
];
// The table is a DISPLAY of the current view, not a view of its own: the
// Table toggle beside the chart swaps the drawing for the numbers while the
// dropdown keeps deciding what data is on screen (owner feedback 2026-08-23:
// a "Data table" menu row that showed whichever view came before it read as
// a mystery option).
const METRIC_TITLES = Object.fromEntries(VIEW_DEFS.filter((v) => v.mode === "standings").map((v) => [v.metric, v.title]));
function currentView() {
  return VIEW_DEFS.find((v) => v.mode === state.mode && (state.mode !== "standings" || v.metric === state.metric)) || VIEW_DEFS[0];
}
const METRIC_TREND_TITLE = {
  watched: "Share watched — by episode",
  live: "Live viewers — by episode",
  reach: "X reach — by episode",
};
function buildHero() {
  const el = document.getElementById("hero");
  const sel = state.solo || state.panel;
  const e = (sel && EPS.find(x => x.slug === sel)) || NEWEST;
  const metric = heroMetricKey();
  const c = color(e);
  let html = `<div class="main"><p class="kicker">${sel && e.slug === sel && e.slug !== NEWEST.slug ? "Selected episode" : "Latest episode"}</p><h2>${esc(short(e.title))}</h2>`;

  if (metric === "live") {
    if (e.live) {
      html += e.live.avg == null
        ? `<div class="unavailable">Average live viewers are not available.</div>`
        : `<div class="metricline"><div class="big"><span data-fold-number>${nfmt(e.live.avg)}</span> <small>average live viewers</small></div></div>`;
      const liveFacts = [];
      if (e.live.peak != null) liveFacts.push(`<span class="g" data-tip="peak live viewers" tabindex="0">${ICONS.users}<b>${nfmt(e.live.peak)}</b></span>`);
      if (e.live.liveViews != null) liveFacts.push(`<span class="g" data-tip="people who watched live" tabindex="0">${ICONS.eye}<b>${nfmt(e.live.liveViews)}</b></span>`);
      if (e.live.watchedMin != null) liveFacts.push(`<span class="g" data-tip="minutes watched live" tabindex="0">${ICONS.clock}<b>${nfmt(e.live.watchedMin)} min</b></span>`);
      if (liveFacts.length) html += `<div class="gline">${liveFacts.join("")}</div>`;
    } else {
      html += `<div class="unavailable">Live data is not available for this episode.</div>`;
    }
  } else if (metric === "watched") {
    if (hasYoutubeReading(e) && e.watch?.avgPercent != null) {
      html += `<div class="metricline"><div class="big"><span data-fold-number>${e.watch.avgPercent}%</span> <small>of the video watched on average</small></div></div>`;
      const chans = (e.watch.byChannel || []).filter(ch => ch.avgPercent != null);
      // multi-number chips get the structured tooltip, never a prose wrap
      if (chans.length) html += `<div class="gline">${chans.map(ch => `<span class="g" data-stat="${esc(TT_NAME[ch.key] || ch.key)}" data-dot="${esc(PLAT_COLORS[ch.key] || FG3)}" data-mrows="${esc(JSON.stringify([{ n: "Share of the video watched", v: `${ch.avgPercent}%` }, { n: "YouTube views", v: nfmt(ch.views) }]))}" tabindex="0"><i class="cdot" style="background:${PLAT_COLORS[ch.key] || FG3}"></i><span class="gl">${TT_HTML[ch.key] || TT_NAME[ch.key] || ch.key}</span><b>${ch.avgPercent}%</b></span>`).join("")}</div>`;
      const pending = pendingWatchMessage(e, NEWEST.slug);
      if (pending) html += `<div class="unavailable">${esc(pending)}</div>`;
    } else {
      html += `<div class="unavailable">${esc(pendingWatchMessage(e, NEWEST.slug) || "Watch data is not available for this episode.")}</div>`;
    }
  } else if (metric === "reach") {
    if (e.latest.xImpressions != null) {
      html += `<div class="metricline"><div class="big"><span data-fold-number>${nfmt(e.latest.xImpressions)}</span> <small>times the announces were seen</small></div></div>`;
      html += splitBar([
        { label: "@ridd_design", color: PLAT_COLORS["x:ridd_design"], value: e.latest.byDest["x:ridd_design"]?.views, unit: "times seen" },
        { label: "@designertom", color: PLAT_COLORS["x:designertom"], value: e.latest.byDest["x:designertom"]?.views, unit: "times seen" },
      ], "this episode’s reach");
    } else {
      html += `<div class="unavailable">X reach is not available for this episode.</div>`;
    }
  } else {
    const mk = heroMarker(e);
    const hasYoutube = hasYoutubeReading(e);
    const tv = displayedTotal(e);
    const totalText = tv == null
      ? `<span class="unavailable">Views are not available yet.</span>`
      : `<span class="big"><span data-fold-number>${nfmt(tv)}</span> <small>${hasYoutube ? "total views" : "X plays"}</small></span>`;
    html += `<div class="metricline">${totalText}${mk ? `<span class="mk">${mk}</span>` : ""}</div>`;
    const yt = youtubeValue(e, e.latest.ytTotal);
    const x = e.latest.xPlays;
    const splitReady = hasYoutube && Number.isFinite(tv) && Number.isFinite(yt) && Number.isFinite(x) && tv > 0 && yt + x === tv;
    if (splitReady) {
      const bd2 = e.latest.byDest || {};
      html += splitBar([
        { label: "YouTube", color: TOK("--series-1"), value: yt, unit: "views", rows: [
          { name: "Dive Club", value: youtubeValue(e, bd2["yt:joindiveclub"]?.views) },
          { name: "DesignerTom", value: youtubeValue(e, bd2["yt:designertom"]?.views) },
        ] },
        { label: "X", color: TOK("--series-2"), value: x, unit: "plays", rows: [
          { name: "@ridd_design", value: bd2["x:ridd_design"]?.plays },
          { name: "@designertom", value: bd2["x:designertom"]?.plays },
        ] },
      ], "total views");
    } else if (tv != null) {
      html += `<div class="unavailable">The YouTube and X split is not available.</div>`;
    }
    // the live session's peak, average, people and minutes live in the
    // Live view of this card and in the episode panel (glance budget, rule 8)
  }
  // No health chip here (owner directive 2026-08-23): the hero states one
  // measure. Episode health lives on the episode cards and in the panel.
  // One tap opens this episode in full on the Episodes page.
  html += `<a class="herolink" href="#episodes/e${e.ep}">E${e.ep} in detail${IC('<path d="m9.5 6.5 5.5 5.5-5.5 5.5"/>')}</a>`;
  html += `</div>`;
  // The per-minute sparkline rides the live measure only. Other measures have
  // no honest per-episode series to draw (X plays have no week-1 history
  // before 8/21, and we never fabricate history).
  const isLive = metric === "live";
  if (isLive) html += `<div class="spark"><div class="cv"><canvas id="spark"></canvas></div><div class="cap">concurrent viewers by minute</div></div>`;
  el.innerHTML = html;

  if (sparkChart) { sparkChart.destroy(); sparkChart = null; }
  if (!isLive) return;
  const ctx = document.getElementById("spark");
  const pts = e.live ? e.live.series.map(p => ({ x: p.m, y: p.v })) : [];
  el.querySelector(".spark").style.visibility = pts.length > 1 ? "" : "hidden";
  if (pts.length > 1 && window.Chart) {
    sparkChart = new Chart(ctx, {
      type: "line",
      data: { datasets: [{ data: pts, borderColor: c, backgroundColor: c + "22", borderWidth: 2,
        pointRadius: 0, fill: true, tension: 0.3 }] },
      options: { responsive: true, maintainAspectRatio: false, animation: false,
        scales: { x: { type: "linear", display: false }, y: { display: false, beginAtZero: true } },
        plugins: { legend: { display: false }, tooltip: { enabled: false } }, events: [] },
    });
  }
}

/* ================= episode carousel (above the chart) ================= */
function buildStrip() {
  const isLive = state.mode === "live";
  const strip = document.getElementById("strip");
  // keep where the reader scrolled: the row lands on the newest episode once,
  // and a re-render (a selection, a view change) never yanks it back
  const keepLeft = strip.dataset.landed ? strip.scrollLeft : null;
  strip.innerHTML = "";
  // oldest → newest, left → right: the latest episode is always far right
  // (locked rule) — read in order, the finished health scores ARE the
  // trajectory of the show.
  for (const e of EPS) {
    // the card is a container; ONE full-card overlay button selects the
    // episode, and the drill words (health score, launch word) are sibling
    // buttons above it — no control nested inside another (design system)
    const card = document.createElement("div");
    card.className = "sitem" + (e.slug === NEWEST.slug ? " newest" : "");
    card.setAttribute("role", "listitem");
    card.dataset.slug = e.slug;
    const it = document.createElement("button");
    it.type = "button";
    it.className = "sitem-hit";
    // This row is the chart's stable episode legend. Its number never changes
    // meaning as the view changes: it is always stored YouTube views plus
    // resolved X broadcast plays. The selected chart measure stays in the
    // hero, plot, popup, and table.
    let spokenValue = "Data not available.";
    const mk = heroMarker(e);
    const total = displayedTotal(e);
    const num = total == null ? `<span class="num">not available</span>` : `<span class="num" data-fold-number>${kfmt(total)}</span>${mk ? `<span class="mk">${mk}</span>` : ""}`;
    if (total != null) spokenValue = `${currentTotalSummary(e, true)}.${healthOf(e) ? ` Episode health ${healthOf(e).score} of 100.` : ""}`;
    // Episode health: a finished three-week read shows its score; younger
    // episodes show nothing score-like at all (their wait date lives in the
    // click panel).
    // PRD v10: every episode's launch standing as a WORD from
    // data.baselines.launch — never a number; the frozen three-week score,
    // once it exists, takes the slot
    const launch = launchOf(e);
    // a promo-driven launch never wears a strength word (rule 18): the card
    // says what it is, the panel carries the numbers
    // one line, always (owner directive 2026-09-01): the card word stays short
    // ("Promo launch · so far"); the tooltip carries the full promo-driven sentence
    const launchWord = launch?.word ? (launch.promoDriven ? "Promo launch" : `${cap(launch.word)} launch`) + (launch.provisional ? " · so far" : "") : "";
    const hs = healthOf(e) ? healthChip(e) : (launch?.word
      ? `<button type="button" class="hs launch ${launch.promoDriven ? "promo" : esc(launch.word)}" data-stat="${esc(launchWord)}" data-note="${esc(launchNote(launch))}" aria-label="${esc(`${launchWord}. ${launchNote(launch)}`)}">${esc(launchWord)}</button>`
      : `<span class="hs quiet" aria-hidden="true"></span>`);
    it.setAttribute("aria-label", `${label(e)}. ${spokenValue}`);
    card.innerHTML = `<span class="r1" aria-hidden="true"><span class="epk">E${e.ep}</span>${num}</span>
      <span class="t" aria-hidden="true">${esc(short(e.title))}</span>${hs}`;
    card.prepend(it);
    it.addEventListener("click", (ev) => {
      // a tap on the health chip is the tooltip's, not the panel's — one tap,
      // one disclosure (critic 2026-08-23 F9)
      if (ev.target.closest(".hs[data-hslug], .hs.launch")) return;
      const opening = state.panel !== e.slug;
      if (opening) { state.panel = e.slug; state.solo = e.slug; }
      else { state.panel = null; state.solo = null; }
      render();
      // the click's answer is the soloed chart — bring it into view; the
      // detail panel waits directly beneath it
      if (opening) document.getElementById("chartcard").scrollIntoView({
        block: "nearest",
        behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth",
      });
    });
    strip.appendChild(card);
  }
  // the strip scrolls when episodes outgrow the row; land it on the NEWEST
  // episode (far right) — the locked order rule keeps its value on any width
  // (a row rendered on a hidden page has no width yet: it lands when first shown)
  if (keepLeft == null) { strip.scrollLeft = strip.scrollWidth; if (strip.offsetParent) strip.dataset.landed = "1"; }
  else strip.scrollLeft = keepLeft;
  // a selected card is always in view
  const picked = strip.querySelector(`.sitem[data-slug="${CSS.escape(state.solo || "")}"]`);
  if (picked) {
    const r = picked.getBoundingClientRect(), b = strip.getBoundingClientRect();
    if (r.left < b.left + 8) strip.scrollLeft -= b.left + 8 - r.left;
    else if (r.right > b.right - 8) strip.scrollLeft += r.right - (b.right - 8);
  }
  const edges = () => {
    strip.classList.toggle("more-left", strip.scrollLeft > 1);
    strip.classList.toggle("more-right", strip.scrollLeft + strip.clientWidth < strip.scrollWidth - 1);
  };
  edges();
  if (!strip.dataset.edges) { strip.dataset.edges = "1"; strip.addEventListener("scroll", edges, { passive: true }); window.addEventListener("resize", edges); }
}

/* ================= detail panel (Layer 2) ================= */
function buildPanel() {
  const el = document.getElementById("panel");
  const e = EPS.find(x => x.slug === state.panel);
  if (!e) { el.style.display = "none"; el.innerHTML = ""; return; }
  // Numbers lead, labels recede. Unit words, methodology sentences, and the
  // late-reg explainer live in "About this data" — never repeated here.
  // Section grammar (readability pass 2026-08-23): one kicker per section, a
  // single lead number, short rows beneath; sections flow in a two-column
  // grid so no line stretches the full panel width.
  const bd = e.latest.byDest || {};
  const tvi = e.latest.totalViewsInfo || {};
  let html = "";
  // header cluster: premiere date · one quiet text link (platform mark +
  // channel name) per destination the episode actually lives on · the
  // transcript chip, the row's one emphasized action · the close button,
  // in-row so everything shares a centerline. Rendered ONLY from stored
  // e.links — a destination without a stored link renders nothing.
  let hmeta = `<span class="pdate">${fmtDate(premiereMs(e.premiere))}</span>`;
  for (const d of DATA.dests) {
    const url = e.links?.[d.key];
    if (!url) continue;
    hmeta += `<a class="plink" href="${esc(url)}" target="_blank" rel="noopener">${d.platform === "linkedin" ? LI_MARK : d.key.startsWith("yt:") ? PLOGO.yt : PLOGO.x}${TT_HTML[d.key] || TT_NAME[d.key]}</a>`;
  }
  if (e.transcript) {
    hmeta += `<a class="tlink" href="transcripts/${esc(e.slug)}.txt" download="${esc(short(e.title))} transcript.txt">${ICONS.download}Transcript</a>`;
  }
  // no leading dot: the span had no size rule, so it drew nothing and only
  // pushed the title off the left edge the wrapped meta rows share on mobile
  html += `<div class="h"><h2 class="htitle" id="ptitle">${esc(label(e))}</h2><span class="hmeta">${hmeta}</span><button type="button" class="x" id="panelx" aria-label="Close episode details"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>`;
  html += `<div class="pgrid">`;
  // Bento IA (owner readability pass 2026-08-23 r2): contrasted tiles on a
  // tight 6px grid. Row one answers "how did it do" (verdict, views, reach),
  // row two "how the session and watching went" (live, watch, sources), and
  // the voices span the bottom. Absent sections simply leave the grid.
  // — episode health (W12): one row per check, stored number + plain colored
  //   comparison. Missing checks say so; never rendered as zeros. Young
  //   episodes state when their read completes; no score renders early. —
  const h = e.health;
  const pace = sameAgeSub(e);
  const paceText = !pace
    ? `<span class="hint">no same-age comparison yet</span>`
    : pace.pct === 0
      ? "typical"
      : `${pace.pct > 0 ? "+" : "−"}${Math.abs(pace.pct)}% vs typical`;
  // PRD v10: the launch read behind the card word, same store
  const launch = launchOf(e);
  if (launch?.word) {
    html += `<div class="psec"><h3 class="kicker">Launch<span data-tip="YouTube views at the end of the first week — or at the earliest reading for episodes tracked late, or at the current age while under a week old — against the other episodes at that same age, promo outliers left out, three or nothing" tabindex="0">${ICONS.info}</span></h3>
      <div class="pnum">${launch.promoDriven ? "Promo-driven" : cap(launch.word)}${launch.provisional ? " · so far" : ""}</div>
      <div class="hint">${esc(launchNote(launch))}</div></div>`;
  }
  if (healthOf(e)) {
    const excludedN = (h.excluded || []).length;
    const peers = Math.max(0, (h.windowIds || []).length - 1 - excludedN);
    const basisTip = `Its first three weeks against the ${peers === 1 ? "episode" : `${peers} episodes`} before it${excludedN ? ` (${excludedN} promo outlier${excludedN === 1 ? "" : "s"} left out)` : ""} — newer episodes never change this score.`;
    html += `<div class="psec"><h3 class="kicker">Episode health<span data-tip="${esc(basisTip)}" tabindex="0">${ICONS.info}</span></h3>`;
    const bc = Object.fromEntries((e.watch?.byChannel || []).map((c) => [c.key, c]));
    const subsSplit = bc["yt:joindiveclub"]?.subsPer1k != null && bc["yt:designertom"]?.subsPer1k != null
      ? ` — Dive Club ${bc["yt:joindiveclub"].subsPer1k} · DesignerTom ${bc["yt:designertom"].subsPer1k}` : "";
    const CHECK_ROWS = [
      ["watch", "eye", "Views", "YouTube views at three weeks, same age as the episodes before it"],
      ["engagement", "heart", "Engagement", "likes + comments per 1,000 views"],
      ["retention", "clock", "Watching", "how much of the video people watch"],
      ["live", "signal", "Live turnout", "peak viewers and chat messages"],
      ["conversion", "userplus", "Subscribers", `subscribers gained per 1,000 views${subsSplit}`],
      ["sentiment", "smile", "Goodwill", "share of feedback leaning positive"],
    ];
    html += `<div class="pnum">${h.score} <span class="hint">of 100 · 50 is typical</span></div>`;
    const notCompared = [];
    for (const [k, icon, lab, tip] of CHECK_ROWS) {
      const c = h.checks?.[k];
      if (!c || c.ratio == null) { if (c?.reason) notCompared.push(lab); continue; }
      const fmtV = (v) => k === "live" ? `${v.peak} · ${nfmt(v.chat)}` : (k === "retention" || k === "sentiment") ? `${v}%` : nfmt(v);
      // the stored note says how the comparison was made (same age, or as
      // the earlier episodes stand now) — click layer only, never recomputed
      const rowTip = c.note ? `${tip} — ${c.note}` : tip;
      // the "typical" tag is a word, not a second target: its meaning rides in the row's tooltip
      const rowTipTypical = Math.round(Math.abs(c.ratio - 1) * 100) <= QUIET_ZONE ? `${rowTip} · typical means right at the show’s usual level` : rowTip;
      html += `<div class="irow" data-tip="${esc(rowTipTypical)}" tabindex="0">${ICONS[icon]}<span class="lb">${lab}</span><b>${fmtV(c.value)}</b>${deltaBadge(c.ratio)}</div>`;
    }
    if (notCompared.length) html += `<div class="hint">Not compared: ${notCompared.join(", ")} — fewer than three earlier episodes had a reading.</div>`;
    if (pace) {
      const paceTip = `YouTube views at the same age as the other episodes, promo outliers left out — appears after three of them have real data at that age.${Math.abs(pace.pct) <= QUIET_ZONE ? " Typical means right at the usual level." : ""}`;
      html += `<div class="irow" data-tip="${esc(paceTip)}" tabindex="0">${ICONS.gauge}<span class="lb">Same-age pace</span>${
        Math.abs(pace.pct) <= QUIET_ZONE
          ? `<span class="db mid">typical</span>`

  } else {

// The pane's sections are one hairline grid (1 px gaps over the line color). A
// row the cells do not fill would show that color as an empty slot, so the
// rightmost cell of a short row spans the columns that are left.
// moment pins: each has a 44 px tap area; where a neighbour's area would cover
// one of its own (a pin on the same level within 44 px, or one straight above
// or below), the two split the space between them
function spaceMoments() {
  const groups = new Map();
  for (const pin of document.querySelectorAll("#panel .wmark")) {
    if (!pin.offsetParent) return;
    for (const side of ["t", "r", "b", "l"]) pin.style.setProperty(`--hit-${side}`, "16px");
    groups.set(pin.parentElement, [...(groups.get(pin.parentElement) || []), pin]);
  }
  const half = (gap) => `${Math.max(0, Math.floor(gap / 2) - 6)}px`;
  for (const pins of groups.values()) {
    for (let i = 0; i < pins.length; i++) for (let j = i + 1; j < pins.length; j++) {
      const a = pins[i], b = pins[j];
      const dx = b.offsetLeft - a.offsetLeft, dy = b.offsetTop - a.offsetTop;
      if (Math.abs(dy) < 22 && Math.abs(dx) < 44) {
        const [left, right] = dx >= 0 ? [a, b] : [b, a];
        left.style.setProperty("--hit-r", half(Math.abs(dx))); right.style.setProperty("--hit-l", half(Math.abs(dx)));
      } else if (Math.abs(dx) < 22 && Math.abs(dy) < 44) {
        const [upper, lower] = dy >= 0 ? [a, b] : [b, a];
        upper.style.setProperty("--hit-b", half(Math.abs(dy))); lower.style.setProperty("--hit-t", half(Math.abs(dy)));
      }
    }
  }
}
function fillGridRows(grid) {
  if (!grid || !grid.offsetParent) return;
  const cells = [...grid.children];
  for (const c of cells) c.style.removeProperty("grid-column");
  const tracks = getComputedStyle(grid).gridTemplateColumns.split(" ").filter(Boolean).length;
  if (tracks < 2) return;
  const rows = new Map();
  for (const c of cells) rows.set(c.offsetTop, [...(rows.get(c.offsetTop) || []), c]);
  for (const row of rows.values()) {
    if (row.some((c) => c.classList.contains("wide"))) continue;
    const width = row.reduce((w, c) => w + c.offsetWidth, 0) + row.length - 1;
    if (width >= grid.clientWidth - 2) continue;
    const used = row.reduce((n, c) => n + Math.max(1, Math.round((c.offsetWidth + 1) / ((grid.clientWidth + 1) / tracks))), 0);
    const right = row.reduce((a, b) => (b.offsetLeft > a.offsetLeft ? b : a));
    right.style.gridColumn = `span ${Math.max(1, tracks - used + 1)}`;
  }
}
window.addEventListener("resize", () => { fillGridRows(document.querySelector("#panel .pgrid")); spaceMoments(); });
function feedbackSource(comment) {

}
function feedbackOriginal(comment) {

      const views = splitTotal(split);
      if (views == null) continue;
      const t = Date.parse(s.ts);
      if (phoenixDateKey(t) <= e.premiere) continue;
      const day = historyDay(e.premiere, t);

        ? { x: t, y: views, meta: { ts: s.ts, split } }

    // which then sums only what is drawn and says so
    const segVis = chart.data.datasets.map((_, di) => chart.isDatasetVisible(di));
    const allShown = segVis.every(Boolean);
    const tvi = ep.latest.totalViewsInfo || {};
    html = `<div class="h">${esc(label(ep))}</div>`;
    const rows = [
      ["yt:joindiveclub", youtubeValue(ep, bd["yt:joindiveclub"]?.views), "views"],
      ["yt:designertom", youtubeValue(ep, bd["yt:designertom"]?.views), "views"],
      ["x:ridd_design", bd["x:ridd_design"]?.plays, "plays"],
      ["x:designertom", bd["x:designertom"]?.plays, "plays"],
    ].filter((_, ri) => segVis[ri] !== false);
    if (allShown) {
      const total = displayedTotal(ep);
      const formatted = metricText(total, "not available");
      const totalWords = describeTotalViews(total, tvi, true, nfmt);
      const totalName = total == null ? "views" : totalWords.slice(formatted.length).trim();
      html += `<div class="big">${metricText(total, "not available")} <small>${totalName}</small></div>`;
    } else {
      const shown = rows.map(([, value]) => value).filter(Number.isFinite);
      const drawn = shown.length ? shown.reduce((total, value) => total + value, 0) : null;
      html += `<div class="big">${metricText(drawn, "not available")} <small>across shown destinations</small></div>`;
    }
    html += `<div class="div"></div>`;
    for (const [k, v, unit] of rows) {
      html += `<div class="row"><span class="sq" style="background:${PLAT_COLORS[k]}"></span>${TT_HTML[k] || TT_NAME[k]}<span class="val">${v == null ? "not available" : nfmt(v)}${v == null ? "" : ` <span class="u">${unit}</span>`}</span></div>`;
    }
    if (allShown && tvi.partial) {
      html += `<div class="note">Some X broadcasts are missing — plays from ${tvi.have} of ${tvi.total}.${!hasYoutubeReading(ep) ? " YouTube views are not available yet." : ""}</div>`;
    } else if (allShown && tvi.stale) {
      html += `<div class="note">X plays are from an older reading.${!hasYoutubeReading(ep) ? " YouTube views are not available yet." : ""}</div>`;
    } else if (allShown && !hasYoutubeReading(ep)) {
      html += `<div class="note">${tvi.includesPlays ? "YouTube views are not available yet; this is X plays only." : "YouTube views and X plays are not available yet."}</div>`;
    } else if (allShown && tvi.youtubeStale) {
      html += `<div class="note">YouTube views are from an older reading.</div>`;
    }
  } else {
    const item = tooltip.dataPoints[0];
    const ds = item.dataset, e = ds.episode, p = item.raw;
    const isWatch = !isLive && state.mode === "watch";
    if (isWatch) {
      const at = p.x <= 0 ? "the start" : p.x >= 100 ? "the end" : `${Math.round(p.x)}% through`;
      if (ds.isTypical) {
        html = `<div class="h">Typical episode</div><div class="meta">At ${at}</div><div class="big">${pct1(p.y)} <small>still watching</small></div><div class="chg">The middle value across episodes with watch curves</div>`;
      } else {
        html = `<div class="h">${esc(label(e))}</div><div class="meta">At ${at}</div><div class="big">${pct1(p.y)} <small>still watching</small></div>`;
        if (e.watch?.avgPercent != null) html += `<div class="chg">${e.watch.avgPercent}% of the video watched on average</div>`;
        const channels = YT_KEYS.filter((key) => e.links?.[key]);
        if (channels.length) {
          html += `<div class="sub">Full-video average by channel</div>`;
          for (const key of channels) {
            const channel = e.watch?.byChannel?.find((item) => item.key === key);
            html += `<div class="row"><span class="sq" style="background:${PLAT_COLORS[key]}"></span>${TT_HTML[key] || TT_NAME[key]}<span class="val">${channel?.avgPercent == null ? "not available" : `${channel.avgPercent}%`}</span></div>`;
          }
          html += `<div class="chg">YouTube provides one combined curve; channel rows are full-video averages.</div>`;
        }
      }
      el.innerHTML = html;
      const p0 = chartCursor || { x: tooltip.caretX, y: tooltip.caretY };
      placeChartTooltip(el, p0);
      return;
    }
    html = `<div class="h">${esc(label(e))}</div>`;
    if (isLive) {
      html += `<div class="meta">Minute ${p.x}</div>`;
      html += `<div class="big">${p.y} watching</div>`;
      const chatTotal = p.meta.ct == null ? "not available" : `${nfmt(p.meta.ct)} messages so far`;
      html += `<div class="chg">Chat: ${chatTotal}${p.meta.c ? ` (+${p.meta.c} this minute)` : ""}</div>`;
      const LIVE_CHAN_COLORS = { "YT Dive Club": PLAT_COLORS["yt:joindiveclub"], "YT DesignerTom": PLAT_COLORS["yt:designertom"], "X": PLAT_COLORS["x:ridd_design"], "X #2": PLAT_COLORS["x:designertom"] };
      // stored channel labels keep their "YT"/"X" prefix; the mark replaces it on screen
      const chanHTML = (l) => esc(l).replace(/^YT /, `${PLOGO.yt} `).replace(/^X\b/, PLOGO.x);
      const byChan = p.meta.byChan || {};
      const liveLabels = [...new Set([...(e.live?.byChannel || []).map((channel) => channel.label), ...Object.keys(byChan)])];
      if (liveLabels.length) {
        html += `<div class="div"></div>`;
        for (const l of liveLabels) {
          const v = byChan[l];
          html += `<div class="row"><span class="sq" style="background:${LIVE_CHAN_COLORS[l] || FG3}"></span>${chanHTML(l)}<span class="val">${v == null ? "not available" : nfmt(v)}</span></div>`;
        }
        html += `<div class="chg foot">Restream total across all simulcast destinations</div>`;
      }
    } else {
      // grouped weekly-gains bars carry plain numbers + a parallel metas array;
      // line views carry {x, y, meta} points
      const grouped = isDelta && !state.byDate;
      const yVal = grouped ? item.raw : p.y;
      const meta = grouped ? ds.metas?.[item.dataIndex] : p.meta;
      if (meta == null) { el.style.opacity = 0; return; }
      if (meta.week !== undefined) html += `<div class="meta">Week ${grouped ? meta.week : meta.week + 1} · ${fmtDate(Date.parse(meta.ts))}</div>`;
      else html += `<div class="meta">${meta.day == null ? "" : `Day ${Math.round(meta.day)} · `}${fmtDate(Date.parse(meta.ts))}</div>`;
      html += `<div class="big">${nfmt(yVal)} total views${isDelta ? " gained" : ""}</div>`;
      if (!isDelta && item.dataIndex > 0) {
        const prev = ds.data[item.dataIndex - 1].y;
        const d = yVal - prev;
        if (d !== 0) html += `<div class="chg">${d >= 0 ? "+" : ""}${nfmt(d)}${prev > 0 ? ` (${d >= 0 ? "+" : ""}${Math.round(d/prev*1000)/10}%)` : ""}</div>`;
      }
      if (meta.split) {
        html += `<div class="div"></div>`;
        for (const k of VIEW_KEYS.filter((key) => e.links?.[key])) {
          const v = meta.split[k];
          const unit = X_KEYS.includes(k) ? " plays" : " views";
          html += `<div class="row"><span class="sq" style="background:${PLAT_COLORS[k]}"></span>${TT_HTML[k] || TT_NAME[k]}<span class="val">${v != null && isDelta && meta.note === null && v >= 0 ? "+" : ""}${metricText(v, "not available")}${v == null ? "" : unit}</span></div>`;
        }
      }
      if (meta.note) html += `<div class="note">${meta.note}</div>`;
    }
  }

  el.innerHTML = html;
  const p = chartCursor || { x: tooltip.caretX, y: tooltip.caretY };
  placeChartTooltip(el, p);
}

let chart;
// Alternate totals measures (owner directive 2026-08-23). Each charts one
// stored per-episode number in its own unit; a missing value draws no bar and
// no label (absence stays silent, never zero).
const CHART_METRICS = {
  watched: { get: (e) => hasYoutubeReading(e) ? e.watch?.avgPercent ?? null : null, text: (v) => `${v}%`, tick: (v) => `${v}%`,
    card: (v) => `${v}%`, short: (v) => `${Math.round(v)}%`, spoken: (v) => `${v}% of the video watched on average` },
  live: { get: (e) => e.live?.avg ?? null, text: (v) => nfmt(v), tick: (v) => kfmt(v),
    card: (v) => nfmt(v), short: (v) => kfmt(v), spoken: (v) => `${nfmt(v)} average live viewers` },
  reach: { get: (e) => e.latest?.xImpressions ?? null, text: (v) => nfmt(v), tick: (v) => kfmt(v),
    card: (v) => kfmt(v), short: (v) => kfmt(v), spoken: (v) => `${nfmt(v)} times the announces were seen` },
};
function renderMetricBars(all, ordered, soloed) {
  const M = CHART_METRICS[state.metric];
  // focus + context: the selected episode (else the newest) is the white
  // bar; the others are one neutral gray, dimmed further while one is selected
  const focusSlug = state.solo || NEWEST.slug;
  const fill = (e) => e.slug === focusSlug ? FOCUS : state.solo ? CONTEXT : FG3;
  const cfg = {
    type: "bar",
    data: {
      labels: ordered.map(e => "E" + e.ep),
      datasets: [{
        data: ordered.map(M.get),
        backgroundColor: ordered.map(fill),
        borderColor: TOK("--chart-gap"), borderWidth: 2, borderSkipped: false, borderRadius: 4,
        barThickness: 20,
      }],
    },
    options: {
      indexAxis: "y",
      responsive: true, maintainAspectRatio: false,
      layout: { padding: { right: 64 } },
      interaction: { mode: "index", axis: "y", intersect: false },
      scales: {
        x: { beginAtZero: true, grace: "4%",
          suggestedMax: soloed ? Math.max(...all.map(e => M.get(e) ?? 0)) : undefined,
          ticks: { padding: 8, callback: v => M.tick(v) }, grid: { color: GRID, drawTicks: false }, border: { display: false } },
        y: { ticks: { color: FG2, padding: 8, font: { size: 12, weight: 500 } }, grid: { display: false }, border: { display: false } },
      },
      plugins: {
        legend: { display: false },
        tooltip: { enabled: false, external: externalTooltip },
      },
      onClick: (event, _, ch) => {
        const hit = closestBar(ch, event);
        if (!hit) return;
        const e = ordered[hit.index];
        const same = state.solo === e.slug;
        state.solo = same ? null : e.slug;
        state.panel = same ? null : e.slug;
        requestAnimationFrame(render); // never rebuild the chart inside its own event
      },
    },
    plugins: [barTotals, comparisonHover],
  };
  cfg._ordered = ordered;
  cfg._valueText = (e) => { const v = M.get(e); return v == null ? null : M.text(v); };
  cfg._missingText = state.metric === "watched"
    ? (e) => pendingWatchMessage(e, NEWEST.slug, { compact: true })
    : null;
  return cfg;
}
function renderStandings() {
  const all = [...EPS].reverse(); // newest bar on top — the anchor position
  // a selection is focus + context (design system data-viz rule 2, 2026-10-06;
  // it replaced the 2026-08-23 one-bar collapse): every episode stays on the
  // scale, the selected one keeps its colors and the rest drop to context,
  // while the shorter box (#chartbox.mini) lets the open panel share the viewport
  const soloRows = state.solo ? all.filter(e => e.slug === state.solo) : [];
  const ordered = all;
  if (state.metric !== "views" && CHART_METRICS[state.metric]) return renderMetricBars(all, ordered, soloRows.length > 0);
  const SEGS = [
    ["yt:joindiveclub", (e) => youtubeValue(e, e.latest.byDest["yt:joindiveclub"]?.views)],
    ["yt:designertom", (e) => youtubeValue(e, e.latest.byDest["yt:designertom"]?.views)],
    ["x:ridd_design", (e) => e.latest.byDest["x:ridd_design"]?.plays ?? null],
    ["x:designertom", (e) => e.latest.byDest["x:designertom"]?.plays ?? null],
  ];
  // full-strength series fills separated by 2 px gaps in the card's own
  // surface; a selection dims every other episode's stack to a quarter
  const dim = (hex, e) => state.solo && state.solo !== e.slug ? hex + "40" : hex;
  const cfg = {
    type: "bar",
    data: {
      labels: ordered.map(e => "E" + e.ep),
      datasets: SEGS.map(([key, val]) => ({
        label: TT_NAME[key],
        key,
        data: ordered.map(val),
        backgroundColor: ordered.map(e => dim(PLAT_COLORS[key], e)),
        borderColor: TOK("--chart-gap"), borderWidth: 2, // surface gap between segments
        borderSkipped: false, borderRadius: 4,
        barThickness: 20,
      })),
    },
    options: {
      indexAxis: "y",
      responsive: true, maintainAspectRatio: false,
      layout: { padding: { right: 64 } },
      interaction: { mode: "index", axis: "y", intersect: false },
      scales: {
        // solo keeps the full-standings scale: the selected bar holds its
        // length while the others leave, and nothing reads as growth
        x: { stacked: true, beginAtZero: true, grace: "4%",
          suggestedMax: soloRows.length ? Math.max(...all.map(e => displayedTotal(e) || 0)) : undefined,
          ticks: { padding: 8, callback: v => kfmt(v) }, grid: { color: GRID, drawTicks: false }, border: { display: false } },
        y: { stacked: true, ticks: { color: FG2, padding: 8, font: { size: 12, weight: 500 } }, grid: { display: false }, border: { display: false } },
      },
      plugins: {
        legend: { display: true, position: "top", align: "start", labels: { color: FG2, font: { family: FONT, size: 12, weight: 500 }, usePointStyle: true, pointStyle: "circle", boxWidth: 8, boxHeight: 8, padding: 16 } },
        tooltip: { enabled: false, external: externalTooltip },
      },
      onClick: (event, _, ch) => {
        const hit = closestBar(ch, event);
        if (!hit) return;
        const e = ordered[hit.index];
        const same = state.solo === e.slug;
        state.solo = same ? null : e.slug;
        state.panel = same ? null : e.slug;
        requestAnimationFrame(render); // never rebuild the chart inside its own event
      },
    },
    plugins: [barTotals, comparisonHover],
  };
  cfg._ordered = ordered;
  return cfg;
}

function render() {
  const isLive = state.mode === "live";
  const [t, s] = chartTitle();
  document.getElementById("ctitle").textContent = t;
  // scope strings are build-authored constants (no data interpolation); the
  // race view carries a pill so a unit switch is never announced in gray only
  document.getElementById("cscope").innerHTML = s;

  buildHealth();
  buildHero();
  buildStrip();
  buildPanel();
  buildAudiencePreview();
  buildCompound();
  buildTable();
  buildEmptyNote();
  syncUI();
  tooltipTriggers();
  {
    const touch = matchMedia("(hover: none)").matches;
    const sel = EPS.find((e) => e.slug === state.solo);
    document.getElementById("chint").textContent = state.table ? ""
      : touch ? "Tap a bar or line to open that episode · Table lists every value"
      : "Point at the chart for its numbers · click a bar or line to open that episode · the arrow keys step through episodes";
    document.getElementById("chart").setAttribute("aria-label", `${t}${sel ? `, ${label(sel)} selected` : ""}. Use the arrow keys to step through episodes; the Table button lists every value.`);
  }
  monoFigures();
  syncRouteParam();

  if (state.table) { if (chart) { chart.destroy(); chart = null; } return; }

  if (!isLive && state.mode === "standings") {
    const cfg = renderStandings();
    if (chart) chart.destroy();
    chart = new Chart(document.getElementById("chart"), cfg);
    chart.config._ordered = cfg._ordered;
    chart.config._valueText = cfg._valueText;
    chart.config._missingText = cfg._missingText;
    document.getElementById("tt").style.opacity = 0;
    return;
  }

  const isDelta = !isLive && state.mode === "delta";
  const isCal = !isLive && state.byDate;
  const isRace = !isLive && state.mode === "race" && !isCal;
  const source = isLive ? EPS.filter(e => e.live) : EPS;
  const clickSolo = (event, _, ch) => {
    const hit = ch.config.type === "line" ? closestEpisodeLine(ch, event) : closestBar(ch, event);
    if (!hit) return;
    const ds = ch.data.datasets[hit.datasetIndex];
    if (!ds.slug) return; // the typical line is a reference, not a selectable episode
    const same = state.solo === ds.slug;
    state.solo = same ? null : ds.slug;
    state.panel = same ? null : ds.slug;
    requestAnimationFrame(render); // never rebuild the chart inside its own event
  };

  // W13 Watching: every finished drop-off curve overlaid, newest in color,
  // priors receding to gray until soloed — plus a dashed typical line once
  // three real curves exist (the same three-peer honesty gate as everywhere).
  if (!isLive && state.mode === "watch") {
    const withCurve = EPS.filter(e => e.watch?.curve?.length);
    const refSlug = withCurve.length ? withCurve[withCurve.length - 1].slug : null; // newest episode whose curve exists
    const datasets = withCurve.map((e) => {
      const isRef = e.slug === refSlug;
      const soloed = state.solo === e.slug;
      const hidden = false; // a selection is focus + context: the others stay as gray context
      // one focus: the selected episode, else the newest with a curve
      const deemph = state.solo ? !soloed : !isRef;
      const base = { border: deemph ? DIMLINE : color(e), lab: deemph ? FG3 : color(e), width: deemph ? 1.5 : 2, ord: deemph ? 1 : 0 };
      return {
        label: label(e), epNum: e.ep, slug: e.slug,
        data: e.watch.curve.map(p => ({ x: Math.round(p.at * 100), y: Math.round(p.watching * 1000) / 10 })),
        borderColor: base.border, labelColor: base.lab,
        backgroundColor: "transparent",
        borderWidth: base.width,
        pointRadius: 0, pointHoverRadius: 4, tension: 0.25, spanGaps: false, hidden,
        // tails converge: only the emphasized line keeps an end label
        noEndLabel: deemph,
        baseBorderColor: base.border, baseLabelColor: base.lab, baseWidth: base.width,
        baseOrder: base.ord, baseNoEndLabel: deemph, hoverColor: color(e),
        episode: e, order: base.ord,
      };
    });
    // the typical line is read from data.baselines.typicalCurve — the middle
    // value across three-week-old episodes' curves with promo outliers left out,
    // drawn only once three such curves exist; never computed here (PRD v9 F29)
    const typical = DATA.baselines?.typicalCurve;
    if (typical?.points?.length) {
      const pts = typical.points.map((p) => ({ x: Math.round(p.at * 100), y: Math.round(p.watching * 1000) / 10 }));
      datasets.push({ isTypical: true, data: pts, borderColor: TOK("--series-typical"), labelColor: FG3, backgroundColor: "transparent",
        borderDash: [4, 4], borderWidth: 1.5, pointRadius: 0, pointHoverRadius: 4, tension: 0.25, order: 3 });
    }
    const cfg = {
      type: "line",
      data: { datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        layout: { padding: { right: 64 } },
        interaction: { mode: "nearest", intersect: false },
        scales: {
          x: { type: "linear", min: 0, max: 100, title: { display: true, text: "How far into the video", color: FG3, font: { family: FONT, size: 12 } },
            ticks: { padding: 8, stepSize: 25, font: { family: FONT }, callback: v => v === 0 ? "start" : v === 100 ? "end" : v + "%" }, grid: { color: GRID, drawTicks: false }, border: { display: false } },
          y: { beginAtZero: true, title: { display: true, text: "Still watching", color: FG3, font: { family: FONT, size: 12 } },
            ticks: { padding: 8, callback: v => v + "%" }, grid: { color: GRID, drawTicks: false }, border: { display: false } },
        },
        plugins: { legend: { display: false }, tooltip: { enabled: false, external: externalTooltip } },
        onClick: clickSolo,
      },
      plugins: [endLabels, comparisonHover],
    };
    if (chart) chart.destroy();
    chart = new Chart(document.getElementById("chart"), cfg);
    document.getElementById("tt").style.opacity = 0;
    return;
  }


  // Weekly gains: grouped bars on a category axis — one column per week,
  // episodes side by side (a linear axis stacked every episode's week-1 bar
  // on the same x and made the view unreadable).
  if (isDelta && !isCal) {
    const maxWeek = Math.max(1, ...EPS.flatMap(e => weeklyWithViews(e).map(w => w.week)));
    const labels = Array.from({ length: maxWeek }, (_, i) => "week " + (i + 1));
    const datasets = source.map((e) => {
      const soloed = state.solo === e.slug;
      const hidden = false; // a selection is focus + context: the others stay as gray context

        backgroundColor: state.solo && !soloed ? CONTEXT : e.slug === NEWEST.slug ? FOCUS : FG3,
        borderRadius: 4, hidden, episode: e, categoryPercentage: 0.74, barPercentage: 0.9 };
    });
    const cfg = {
      type: "bar",
      data: { labels, datasets },
      options: {
