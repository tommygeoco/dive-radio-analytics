<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%2359b0ff'/%3E%3Ccircle cx='8' cy='8' r='3' fill='%230b0e13'/%3E%3C/svg%3E" />
<title>Dive Radio — Episode Analytics</title>
<style>
  /* Design tokens (2026-08-22 redesign): 3-step surface ramp, 2 border tints,
     3 text tiers, one accent that data never wears. Type scale 11/12/13/14/16/
     20/28, weights 400/500/700, radii 4/8/12, 4px spacing grid. */
  :root {
    --bg: #0b0e13; --s1: #12161f; --s2: #1a212e;
    --border: rgba(148,163,184,.10); --border-strong: rgba(148,163,184,.18);
    --t1: #eef1f6; --t2: #b7c1d1; --t3: #8a94a8;
    --accent: #59b0ff; --good: #3ecf8e; --bad: #ff7a59; --amber: #d9a24a;
    /* one gutter for every card, column, and row (owner directive 2026-08-23) */
    --gap: 14px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--t1);
    font: 15px/1.5 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 20px 24px 24px; }
  button { font: inherit; }

  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: var(--gap); }
  h1 { font-size: 21px; margin: 0; letter-spacing: -.01em; font-weight: 700; }
  .stamp { color: var(--t3); font-size: 14px; margin-left: auto; }
  .agentslink { color: var(--t2); font-size: 14px; font-weight: 600; text-decoration: none; padding: 6px 12px; border-radius: 999px; background: var(--s2); box-shadow: inset 0 0 0 1px var(--border); }
  .agentslink:hover, .agentslink:focus-visible { color: var(--t1); box-shadow: inset 0 0 0 1px var(--border-strong); }
  /* PRD v12 W44: the Agents view replaces the dashboard body while #agents is in the URL */
  body.agents-open > .wrap > :not(header):not(#agents):not(.agents) { display: none; }
  .agents { display: grid; gap: var(--gap); }
  /* PRD v12 W43: chapters in the episode panel */
  .chapters .chrow { display: grid; grid-template-columns: 72px 1fr; gap: 12px; padding: 7px 0; border-top: 1px solid var(--border); font-size: 13.5px; line-height: 1.45; }
  .chapters .chrow:first-of-type { border-top: 0; }
  .chapters .cht { color: var(--t3); font-variant-numeric: tabular-nums; }
  .chapters .cht a { color: var(--accent); text-decoration: underline dotted rgba(148,163,184,.55); text-underline-offset: 3px; }
  .chapters .chb b { display: block; color: var(--t1); font-weight: 600; }
  .chapters .chg { color: var(--t2); }
  .chapters .chnote { margin-top: 8px; font-size: 12.5px; }
  .agents .card h2 { margin: 0 0 8px; font-size: 18px; }
  .agents .card p { margin: 6px 0; color: var(--t2); line-height: 1.55; }
  .agents .prompt { display: flex; gap: 10px; align-items: flex-start; }
  .agents .prompt code { flex: 1; display: block; padding: 12px 14px; border-radius: 10px; background: var(--s2); box-shadow: inset 0 0 0 1px var(--border); color: var(--t1); font-size: 13.5px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .agents .copy { flex: none; border: 0; border-radius: 999px; padding: 8px 14px; background: var(--accent); color: #0b0f17; font-weight: 700; cursor: pointer; }
  .agents .urls { display: grid; gap: 6px; }
  .agents .urls a { color: var(--t1); text-decoration: underline dotted rgba(148,163,184,.55); text-underline-offset: 3px; word-break: break-all; }
  .agents .urls span { color: var(--t3); }
  .agents ul { margin: 6px 0 0 18px; padding: 0; color: var(--t2); line-height: 1.55; }
  .agents .runtimes { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
  .agents .runtimes div { padding: 10px 12px; border-radius: 10px; background: var(--s2); box-shadow: inset 0 0 0 1px var(--border); color: var(--t2); font-size: 13.5px; line-height: 1.5; }
  .agents .runtimes b { color: var(--t1); display: block; margin-bottom: 2px; }
  .stamp i { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    margin-right: 7px; vertical-align: 1px; background: var(--good); }
  .stamp i.old { background: var(--amber); }

  .plogo { width: 13px; height: 13px; vertical-align: -2px; }
  button:focus-visible, summary:focus-visible, .hs:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* ---- Card system (2026-08-23 redesign): every surface is a quiet card on
     the page ground — no ruled separators; whitespace and card edges carry the
     grouping. Kickers are the one sanctioned small-caps element. ---- */
  /* Cards carry no border (owner directive 2026-08-23): the surface fill is
     the whole edge. State — hover, selection — rides fill and shadow instead. */
  .card { background: var(--s1); border: 0; border-radius: 14px;
    padding: 18px 20px; min-width: 0; }
  .kicker { font-size: 11.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
    color: var(--t3); margin-bottom: 12px; }

  /* ---- W12 / W28: show health — one strip, one disclosure (2026-09-01) ----
     Glance: a small gauge with its band in words, the six checks as short
     worded lines (the state word, then the names in that state), the day's
     headline whole, and Expand. Click: the details region opens under the
     strip — the evidence behind the score and the do-next actions. Round 2
     (critic 2026-09-01): the pills became words so no state rides on color
     alone, the read zone grew so the headline fits, and the check rows left
     the region because the strip now says what they said. The details are
     always in the DOM (inert while closed) so opening is a transition on the
     existing card, never a re-render: the row grows from 0fr to 1fr and the
     body fades in a beat later; the chevron turns; the headline lets go of
     its clamp. */
  .healthrow { margin-bottom: var(--gap); }
  .hcard { padding: 16px 20px; }
  /* zone widths are budgeted for the 1240px page: the ring and its caption,
     two worded lines of checks (~360px), and a read zone wide enough for the
     whole headline in two lines beside its button */
  .hstrip { display: grid; grid-template-columns: 176px minmax(360px, 1fr) minmax(400px, 1.4fr);
    gap: 0 20px; align-items: start; }
  .hz { min-width: 0; }
  .hz .kicker { margin-bottom: 8px; }
  /* the score zone is a media object: ring left, kicker over the band word;
     the words sit at the zone's top so the three kickers share one line.
     "Why 46" lives on the 46: a click on the score opens the details */
  .hz-score { display: flex; align-items: start; gap: 14px; cursor: pointer; }
  .hz-score .kicker { margin-bottom: 3px; }
  .hz-score .hband { color: var(--t2); font-size: 14.5px; font-weight: 500; line-height: 1.3; }
  /* PRD v10: the band carries the direction word — level and movement in one
     breath ("Near usual · softening"); the word is the signal, color only helps */
  .hz-score .hband.hdir { font-size: 13.5px; margin-top: 1px; }
  .hz-score .hband.hdir.building { color: var(--good); }
  .hz-score .hband.hdir.softening { color: var(--bad); }
  .hz-score .hband.hdir.holding, .hz-score .hband.hdir.mixed { color: var(--t2); }
  .gauge { width: 64px; height: 64px; position: relative; flex: none; }
  .gauge svg { width: 100%; height: 100%; display: block; transform: rotate(-90deg); }
  .gauge .track { fill: none; stroke: var(--s2); stroke-width: 6; }
  .gauge .fill { fill: none; stroke: var(--accent); stroke-width: 6; stroke-linecap: round; }
  /* the usual level (50) is a notch across the track: the fill's end against
     the notch is the whole read — "just under usual" needs no second number */
  .gauge .tick { stroke: var(--t1); stroke-width: 3; }
  .gauge .num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .gauge .num b { font-size: 22px; line-height: 1; font-weight: 700; letter-spacing: -.03em; color: var(--t1); }
  /* the six checks as words: every state that has checks gets a part — the
     state word, then the names in that state — fragile first. A name is a
     real button wearing the page's dotted drill mark: hover, focus, or tap
     opens the shared tooltip with the saved numbers. No dots, no pills: the
     word IS the state, so nothing rides on color alone (critic 2026-09-01) */
  /* the pills the owner liked (the mock's), kept inside state groups so the
     state is a word (the group label) and the pill carries the name and a
     dot: hover, focus, or tap opens the drill; a pill reads as a control */
  /* owner directive 2026-09-01 (later the same day): no state labels at a
     glance — the dot beside each name carries the state (orange fragile,
     gray steady, green healthy, hollow when the check has no reading), pills
     run fragile-first in one row; the word stays in the accessible name and
     the tooltip */
  .hgroups { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .hgroup, .hnames { display: contents; }
  .hgword, .hnames .sep { display: none; }
  .hname { display: inline-flex; align-items: center; gap: 7px; border: 0; border-radius: 999px;
    padding: 5px 11px 5px 9px; margin: 0; background: var(--s2); box-shadow: inset 0 0 0 1px var(--border);
    color: var(--t1); font-size: 13px; font-weight: 500; line-height: 1.25; white-space: nowrap;
    cursor: pointer; transition: background .15s, box-shadow .15s; }
  .hname:hover, .hname:focus-visible { background: #212a3a; box-shadow: inset 0 0 0 1px var(--border-strong); }
  .hname .hcd { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
  .hgroup.healthy .hname .hcd { color: var(--good); }
  .hgroup.steady .hname .hcd { color: var(--t2); }
  .hgroup.fragile .hname .hcd { color: var(--bad); }
  .hgroup.waiting .hname .hcd { background: none; box-shadow: inset 0 0 0 1.5px var(--border-strong); }
  /* drillable labels elsewhere say so the same way */
  .panel .irow[data-tip] .lb, .panel .trow[tabindex] .tl, .hero .splitlabels .sl[data-stat] {
    text-decoration: underline dotted rgba(148,163,184,.45); text-underline-offset: 3px; }
  /* the read zone: kicker over the headline, the one disclosure at its side.
     Opening must not move what was just clicked: the button is pinned beside
     the headline's first line, and only the headline's own box grows */
  .hz-read { display: flex; align-items: start; gap: 14px; border-left: 1px solid var(--border); padding-left: 20px; }
  .hz-readbody { flex: 1; min-width: 0; cursor: pointer; }
  .hz-read .hxbtn { margin-top: 18px; }
  /* the headline is the largest text in the strip after the score. It holds
     three lines while the card is closed (the 1240 page needs two); opening
     lifts the clamp and lets its height ease up to the full text, closing
     eases it back and re-clamps only once the motion has ended (a clamp
     can't animate, so the ellipsis waits for the last frame) */
  .hz-read .headline { margin: 0; color: var(--t1); font-size: 16px; font-weight: 600; line-height: 1.4;
    text-wrap: pretty; overflow: hidden; max-height: calc(3 * 1.4em);
    transition: max-height .32s cubic-bezier(.22,1,.36,1); }
  .hz-read .headline.clamped { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; }
  .hxbtn { display: inline-flex; align-items: center; gap: 6px; flex: none; border: 0; border-radius: 999px;
    padding: 8px 13px 8px 10px; background: var(--s2); color: var(--t2); font-size: 13px;
    font-weight: 600; line-height: 1; cursor: pointer; transition: background .15s, color .15s; }
  .hxbtn .hxlabel { display: inline-block; min-width: 58px; text-align: left; }
  .hxbtn:hover, .hxbtn[aria-expanded="true"] { background: #212a3a; color: var(--t1); }
  .hxbtn svg { width: 14px; height: 14px; flex: none; color: inherit; transition: transform .28s cubic-bezier(.22,1,.36,1); }
  .hxbtn[aria-expanded="true"] svg { transform: rotate(180deg); }
  /* the details region: a 0fr → 1fr grid row, so the card grows with what it
     reveals; the body itself fades and settles a beat after the row opens */
  .hdetails { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .32s cubic-bezier(.22,1,.36,1); }
  .hcard[data-open="true"] .hdetails { grid-template-rows: 1fr; }
  .hdinner { min-height: 0; overflow: hidden; }
  .hdbody { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr) minmax(0, 1fr); gap: 20px 32px;
    margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border);
    opacity: 0; transform: translateY(-4px); transition: opacity .16s ease-out, transform .28s cubic-bezier(.22,1,.36,1); }
  /* the grid follows the columns actually rendered — never an empty track */
  .hdbody.cols-2 { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); }
  .hdbody.cols-1 { grid-template-columns: minmax(0, 1fr); }
  .hc-dir .dirrow .dw.thin { color: var(--t3); font-weight: 500; }
  .hc-dir .dirrow .dl[data-tip] { text-decoration: underline dotted rgba(148,163,184,.45); text-underline-offset: 3px; cursor: pointer; }
  .hc-dir .votes { margin: 0 0 10px; color: var(--t3); font-size: 12.5px; line-height: 1.5; }
  /* what the read is on, and the lifts shown but not scored — one quiet line each */
  .health-evidence .readson { margin: -4px 0 12px; color: var(--t3); font-size: 12.5px; line-height: 1.5; }
  .health-evidence .readson b { color: var(--t2); font-weight: 600; }
  /* PRD v10: where it's heading — one word per durable measure over the last
     few clean episodes, then the outlook sentence; words carry the state */
  .hc-dir .dirlede { margin: 0 0 10px; color: var(--t2); font-size: 13.5px; line-height: 1.5; }
  .hc-dir .dirlede b { font-weight: 700; }
  .hc-dir .dirlede b.building { color: var(--good); }
  .hc-dir .dirlede b.softening { color: var(--bad); }
  .hc-dir .dirlede b.holding, .hc-dir .dirlede b.mixed { color: var(--t1); }
  .hc-dir .dirrows { display: grid; }
  .hc-dir .dirrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 5px 0; font-size: 13.5px; }
  .hc-dir .dirrow + .dirrow { border-top: 1px solid var(--border); }
  .hc-dir .dirrow .dl { color: var(--t2); min-width: 0; }
  .hc-dir .dirrow .dw { font-weight: 600; white-space: nowrap; }
  .hc-dir .dirrow .dw.building { color: var(--good); }
  .hc-dir .dirrow .dw.softening { color: var(--bad); }
  .hc-dir .dirrow .dw.holding { color: var(--t3); }
  .hc-dir .outlook { margin: 12px 0 0; padding-top: 10px; border-top: 1px solid var(--border); color: var(--t2); font-size: 13.5px; line-height: 1.5; }
  .hc-dir .outlook b { color: var(--t1); font-weight: 700; font-variant-numeric: tabular-nums; }
  .hc-dir .outlook + .outlook { border-top: 0; padding-top: 0; margin-top: 6px; }
  /* the launch word on an episode card: a word, never a number; the dot only
     helps the eye scan a row of cards */
  /* owner directive 2026-09-01: one colored dot per card (the episode's);
     the launch word carries its meaning in the word alone */
  .hs.launch { color: var(--t2); font-size: 12px; cursor: pointer; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis;
    /* owner directive 2026-09-01: the dotted underline says "there is a tooltip here",
       the same mark the direction rows wear */
    text-decoration: underline dotted rgba(148,163,184,.55); text-underline-offset: 3px; }
  .hs.launch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .hcard[data-open="true"] .hdbody { opacity: 1; transform: none; transition-delay: .06s; }
  .hdcol { min-width: 0; }
  .hdcol .kicker { margin-bottom: 10px; }
  /* Do next: the top actions, each led by a quiet ordinal so two actions read
     as a short ranked list (decorative: the order is the ranking, and it
     carries no measurement) */
  .hc-meta .donext { display: grid; gap: 10px; }
  .hc-meta .dnrow { display: flex; gap: 10px; color: var(--t2); font-size: 13.5px; line-height: 1.5; }
  .hc-meta .dnnum { flex: none; width: 19px; height: 19px; margin-top: 1px; border-radius: 50%;
    border: 1px solid var(--border-strong); color: var(--t3); font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; }
  .health-evidence .evidence { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 32px; }
  .health-evidence h3 { margin: 0 0 8px; font-size: 12.5px; font-weight: 700; letter-spacing: .02em; }
  .health-evidence h3.up { color: var(--good); }
  .health-evidence h3.down { color: var(--bad); }
  .health-evidence ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
  .health-evidence li { display: flex; gap: 10px; color: var(--t2); font-size: 14px; line-height: 1.5; }
  .health-evidence li i { width: 7px; height: 7px; border-radius: 50%; flex: none; margin-top: 7px; }
  .health-evidence li.up i { background: var(--good); }
  .health-evidence li.down i { background: var(--bad); }
  .health-evidence li span { min-width: 0; }
  .health-evidence li b { color: var(--t1); font-weight: 700; font-variant-numeric: tabular-nums; }
  /* W27: when the set of scored checks changed since the last saved read,
     the evidence says so in one quiet line — words, never a number */
  .health-evidence .setchange { margin: 14px 0 0; padding-top: 12px; border-top: 1px solid var(--border);
    color: var(--t3); font-size: 12.5px; line-height: 1.5; }
  /* the saved judgment sentences (drivers): the model's stored reasoning,
     digit-free by contract, rendered only inside this click layer */
  .health-evidence .drivers { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
  .health-evidence .drivers p { margin: 0 0 6px; color: var(--t2); font-size: 13.5px; line-height: 1.55; }
  .health-evidence .drivers p:last-child { margin-bottom: 0; }
  /* the saved-score trend on a fixed scale: the usual level is the middle
     line and the bands are ten points wide, so a five-point drift draws as
     five points and is never stretched to fill the box; the first and the
     newest saved scores are labeled */
  .health-evidence .trendwrap { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
  .health-evidence .trend { width: 150px; height: 36px; display: block; }
  .health-evidence .trend polyline { fill: none; stroke: var(--accent); stroke-width: 2; vector-effect: non-scaling-stroke; }
  .health-evidence .trend .mid { stroke: var(--border-strong); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .health-evidence .trend .end { fill: var(--accent); }
  .health-evidence .trendwrap .tv { font-size: 12px; font-weight: 600; color: var(--t3); font-variant-numeric: tabular-nums; }
  .health-evidence .trendwrap .tv.now { color: var(--t1); }
  .health-evidence .trendwrap .cap { color: var(--t3); font-size: 12.5px; margin-left: 4px; }
  .healthrow.empty { display: block; color: var(--t2); font-size: 15px; }
  @media (prefers-reduced-motion: reduce) {
    .hdetails, .hdbody, .hxbtn, .hxbtn svg, .hz-read .headline { transition: none; }
  }

  /* ---- Primary answers: latest episode + growth trend cards ---- */
  .overview { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(280px, 1fr);
    gap: var(--gap); margin-bottom: var(--gap); }
  .overview.single { grid-template-columns: 1fr; }
  .hero { display: flex; gap: 24px; }
  .hero .main { flex: 1; min-width: 0; }
  .hero h2 { margin: 0; font-size: 19px; line-height: 1.3; font-weight: 700; text-wrap: balance; }
  .hero .metricline { display: flex; align-items: baseline; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .hero .big { font-size: 34px; line-height: 1; font-weight: 700; letter-spacing: -.02em;
    font-variant-numeric: tabular-nums; }
  .hero .big small { font-size: 14px; font-weight: 500; color: var(--t3); letter-spacing: 0; }
  .hero .mk { font-size: 14px; font-weight: 600; color: var(--amber); }
  .hero .platform-bar .pseg { min-width: 2px; }
  .hero .splitlabels .sl { display: inline-flex; align-items: center; gap: 6px; border-radius: 4px; }
  .hero .splitlabels .sl:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .hero .platform-bar { display: flex; gap: 2px; width: min(100%, 520px); height: 8px; overflow: hidden;
    border-radius: 4px; background: var(--s2); margin-top: 16px; }
  /* segment colors ride inline from one definition (see splitBar); the
     YouTube red is a brand hue and must not read as the --bad status coral */
  .hero .splitlabels { display: flex; justify-content: space-between; width: min(100%, 520px);
    margin-top: 8px; color: var(--t3); font-size: 13.5px; }
  .hero .splitlabels i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .hero .state { color: var(--t3); font-size: 13.5px; margin-top: 14px; }
  .hero .unavailable { color: var(--t3); font-size: 15px; margin-top: 12px; }
  .hero .spark { width: min(34%, 320px); flex: none; display: flex; flex-direction: column; gap: 5px; justify-content: flex-end; }
  .hero .spark .cv { position: relative; height: 86px; width: 100%; }
  .hero .spark .cap { font-size: 13.5px; color: var(--t3); text-align: right; }

  .compound .cv2 { color: var(--t2); font-size: 15px; font-weight: 600; line-height: 1.4; margin: 0; }
  /* trend bars (owner directive 2026-08-23: minimal, modern, useful): slim
     neutral columns from a shared baseline; ONE bar — the selected episode,
     else the newest — carries its episode color; each bar names its value
     above and its episode below, so the shape and the numbers read together */
  .compound .bars { display: flex; gap: 10px; align-items: stretch; margin-bottom: 12px; }
  .compound .cbar { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
  .compound .cbar .bnum { font-size: 11.5px; color: var(--t3); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .compound .cbar.hot .bnum { color: var(--t1); font-weight: 700; }
  .compound .cbar .bwrap { height: 68px; width: 100%; display: flex; align-items: flex-end; justify-content: center; }
  .compound .cbar .b { width: 100%; max-width: 28px; border-radius: 3px 3px 0 0; min-height: 4px;
    background: rgba(148,163,184,.22); }
  .compound .cbar .bep { font-size: 11px; font-weight: 600; color: var(--t3); letter-spacing: .03em; }
  .compound .cbar.hot .bep { color: var(--t1); }
  .compound .waitline { color: var(--t3); font-size: 14px; }
  /* the not-ready card is a sketched empty chart: dashed gridlines, a tick
     axis, and a circled trend mark around the plain sentence — the frame of
     the coming answer with no data and no direction implied */
  .compound .skelplot { position: relative; padding-top: 4px; }
  .compound .skelgrid { position: absolute; inset: 4px 0 20px; display: flex; flex-direction: column;
    justify-content: space-between; pointer-events: none; }
  .compound .skelgrid i { display: block; border-top: 1px dashed var(--border-strong); opacity: .55; }
  .compound .skelcenter { position: relative; display: flex; flex-direction: column; align-items: center;
    gap: 12px; padding: 22px 0 26px; text-align: center; }
  .compound .skelicon { width: 62px; height: 62px; color: var(--t3); flex: none; }
  .compound .skelplot .waitline { color: var(--t1); font-weight: 700; font-size: 15px; }
  .compound .waitsub { color: var(--t3); font-size: 12.5px; margin-top: -6px; }
  .compound .skelaxis { position: relative; border-top: 1px solid var(--border-strong);
    height: 7px; display: flex; justify-content: space-between; padding: 0 6px; }
  .compound .skelaxis i { width: 1px; height: 6px; background: var(--border-strong); display: block; }

  /* ---- Episode carousel: selector + legend + finished health reads,
     oldest → newest, latest always far right (locked rule) ---- */
  /* the 2px inset only exists so a focused card's ring isn't clipped by the
     scroll container; negative margins pull the painted card edges back onto
     the page grid, and the bottom gutter subtracts it so the rhythm holds */
  .carousel { display: flex; gap: var(--gap); overflow-x: auto; padding: 2px;
    margin: -2px -2px calc(var(--gap) - 2px);
    scrollbar-width: none; scroll-snap-type: x proximity; }
  /* no visible scrollbar under the cards (owner directive 2026-09-01): the row
     still scrolls by trackpad, wheel, and touch, and the clipped first card
     plus the newest-far-right rule already say there is more to the left */
  .carousel::-webkit-scrollbar { display: none; }
  .sitem { flex: 1 0 168px; min-width: 168px; scroll-snap-align: end; background: var(--s1);
    border: 0; border-radius: 12px; padding: 12px 14px; cursor: pointer;
    position: relative; transition: background .15s, box-shadow .15s; color: inherit; text-align: left; }
  .sitem:hover { background: var(--s2); box-shadow: 0 4px 16px rgba(0,0,0,.35); }
  .sitem.newest { box-shadow: inset 0 0 0 1px rgba(148,163,184,.3); }
  /* selection still has to be unmistakable — an inset ring reads as state,
     not as card chrome, so the flat surface survives it */
  .sitem.solo { background: var(--s2); box-shadow: inset 0 0 0 2px var(--accent); }
  .sitem.dim { opacity: .38; }
  .sitem .r1 { display: flex; align-items: baseline; gap: 6px; font-size: 12px; font-weight: 700;
    color: var(--t3); letter-spacing: .04em; }
  .sitem .r1 .epk { display: inline-flex; align-items: center; gap: 6px; }
  .sitem .r1 .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .sitem .r1 .num { font-size: 17px; font-weight: 700; letter-spacing: -.01em; color: var(--t1); }
  .sitem .r1 .mk { font-size: 12px; font-weight: 600; color: var(--amber); margin-left: auto; }
  .sitem .t { font-size: 12.5px; color: var(--t2); white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; margin: 3px 0 0; display: block; }
  /* three-week health read: number + track, present ONLY once the read is done */
  .hs { display: flex; align-items: center; gap: 8px; min-height: 18px;
    font-size: 12px; color: var(--t3); }
  .sitem .hs { margin-top: 10px; }
  .hero .hs { max-width: 300px; }
  .hs b { font-size: 14px; color: var(--t1); font-variant-numeric: tabular-nums; }
  .hs .mk { color: var(--amber); font-weight: 600; }
  .hs .htrack { flex: 1; height: 4px; border-radius: 2px; background: var(--s2);
    position: relative; overflow: hidden; }
  .hs .htrack span { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: var(--accent); }
  .sitem .hs.quiet { font-size: 12px; color: var(--t3); cursor: default; }
  /* health tooltip — instant, works on tap; native title is neither */
  #rtt { position: fixed; z-index: 60; max-width: 320px; background: #0d1017; border: 1px solid var(--border-strong);
    border-radius: 10px; padding: 10px 12px; font-size: 14px; line-height: 1.45; color: var(--t2);
    box-shadow: 0 8px 24px rgba(0,0,0,.5); opacity: 0; pointer-events: none; transition: opacity .12s ease-out; }
  #rtt .h { font-weight: 700; color: var(--t1); margin-bottom: 4px; }
  #rtt .warn { color: var(--amber); margin-top: 4px; }
  #rtt .mut { color: var(--t3); margin-top: 4px; }
  /* structured check tooltip: name + state chip up top, then one block per
     measure (muted label over a strong value with its comparison), and the
     score sentence as a hairline footer — organization over labels */
  #rtt .th { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 2px; }
  #rtt .tst { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; flex: none; }
  #rtt .tst i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
  #rtt .tst.healthy { color: var(--good); }
  #rtt .tst.steady { color: var(--t2); }
  #rtt .tst.fragile { color: var(--bad); }
  #rtt .tst.waiting { color: var(--t3); font-weight: 500; }
  #rtt .tst.waiting i { background: none; border: 1px solid var(--border-strong); }
  #rtt .mrow { margin-top: 9px; }
  #rtt .ml { display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    font-size: 12px; line-height: 1.35; color: var(--t3); }
  #rtt .ml .ms { font-size: 11px; opacity: .75; white-space: nowrap; }
  #rtt .mv { display: flex; align-items: center; gap: 7px; margin-top: 3px; }
  #rtt .mv b { font-size: 15px; color: var(--t1); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  #rtt .mv .mt { color: var(--t3); font-size: 12.5px; }
  #rtt .mv.mr { font-size: 12.5px; line-height: 1.4; color: var(--t3); display: block; }
  #rtt .hdot { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 8px; }
  #rtt .mnote { color: var(--t3); font-size: 11.5px; line-height: 1.35; margin-top: 3px; opacity: .85; }
  #rtt .fnote { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border); font-size: 12.5px; }
  /* ---- Layer 2: pinned episode detail panel ---- */
  @keyframes panelIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  .panel { background: var(--s2); border: 0; border-radius: 14px;
    /* no border to count, so the frame inset is exactly the shared gutter */
    padding: var(--gap); margin: var(--gap) 0; position: relative; font-size: 14px;
    animation: panelIn .16s ease-out; }
  @media (prefers-reduced-motion: reduce) { .panel { animation: none; } .sitem, .insight { transition: none; } #chartbox { transition: none; } }
  .panel .pgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: var(--gap); margin-top: var(--gap); grid-auto-flow: dense; }
  .panel .psec { min-width: 0; background: var(--s1); border-radius: 10px; padding: 13px 15px 14px; }
  .panel .psec.wide { grid-column: 1 / -1; }
  .panel .psec .kicker { margin-bottom: 8px; }
  .panel .kicker .kh { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--t3); margin-left: 4px; }
  .panel .pnum { font-size: 22px; font-weight: 700; color: var(--t1); letter-spacing: -.01em;
    font-variant-numeric: tabular-nums; margin-bottom: 6px; }
  .panel .pnum.hint { font-size: 15px; font-weight: 600; color: var(--t3); }
  .panel .pnum .hint { font-size: 13px; font-weight: 500; letter-spacing: 0; }
  /* The transcript chip is the header's one emphasized action: a soft
     accent-tinted fill, no hairline — border chrome left this page. */
  .panel .tlink { display: inline-flex; align-items: center; gap: 6px; color: var(--accent);
    font-size: 12.5px; font-weight: 600; line-height: 1; text-decoration: none;
    border-radius: 999px; padding: 5px 11px; background: rgba(89,176,255,.12); }
  .panel .tlink svg { width: 12px; height: 12px; }
  .panel .tlink:hover, .panel .tlink:focus-visible { background: rgba(89,176,255,.22); }
  /* basis 0 so the close button always fits the title line — a long title
     wraps inside its own span instead of pushing the × to the next row */
  .panel .h .htitle { flex: 1 1 0; min-width: 0; }
  .panel .h .hmeta { color: var(--t3); font-weight: 400; font-size: 13px;
    display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .panel .h .pdate { margin-right: 2px; }
  /* destination links are quiet text links — platform mark + channel name,
     no badge chrome; the transcript pill stays the one emphasized action */
  .panel .plink { display: inline-flex; align-items: center; gap: 5px; color: var(--t2);
    font-size: 13px; font-weight: 600; text-decoration: none; }
  .panel .plink .plogo { width: 13px; height: 13px; }
  .panel .plink:hover, .panel .plink:focus-visible { color: var(--t1); text-decoration: underline;
    text-underline-offset: 3px; }
  .panel .plink + .plink { margin-left: 2px; }
  .cdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .panel .frate { color: var(--t3); font-size: 13px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .panel .fline { color: var(--t2); font-size: 14px; margin-bottom: 4px; }
  .panel .trow { display: flex; align-items: center; gap: 9px; padding: 4.5px 0; color: var(--t2); font-size: 13.5px; }
  .panel .trow .tl { width: 118px; flex: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .panel .trow .tb { flex: 1; height: 4px; border-radius: 2px; background: var(--s2); overflow: hidden; }
  .panel .trow .tb span { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
  /* the detail swaps in WHERE the bar was — a floating tooltip anchored to a
     full-width row lands nowhere near the pointer, so the row answers in place */
  .panel .trow .tbv { flex: 1; display: none; text-align: right; color: var(--t3);
    font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .panel .trow:hover .tb, .panel .trow:focus-visible .tb { display: none; }
  .panel .trow:hover .tbv, .panel .trow:focus-visible .tbv { display: block; }
  .panel .trow .tv { width: 52px; text-align: right; font-variant-numeric: tabular-nums; color: var(--t1); flex: none; }
  .panel .trow .tn { width: 48px; text-align: right; font-variant-numeric: tabular-nums; color: var(--t3); font-size: 12px; flex: none; }
  /* W14 glyph grammar: icons carry identity, badges carry direction */
  .ic { width: 14px; height: 14px; flex: none; color: var(--t3); }
  .ki { width: 13px; height: 13px; color: var(--t3); vertical-align: -2px; margin-left: 6px; }
  /* four fixed columns so every row's icon, label, value, and badge share
     left edges — flex push-right left the value column ragged */
  .panel .irow { display: grid; grid-template-columns: 14px minmax(0, 1fr) 76px 48px; align-items: center;
    column-gap: 9px; padding: 4.5px 0; color: var(--t2); font-size: 13.5px; }
  .panel .irow .lb { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .panel .irow b { color: var(--t1); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap;
    justify-self: start; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .panel .irow .db { grid-column: 4; justify-self: start; margin-left: 0; }
  .db { display: inline-flex; align-items: center; font-size: 11.5px; font-weight: 700; border-radius: 5px;
    padding: 1.5px 6px; margin-left: 4px; font-variant-numeric: tabular-nums; flex: none; }
  .db.up { color: var(--good); background: rgba(62,207,142,.1); }
  .db.down { color: var(--bad); background: rgba(255,122,89,.1); }
  .db.mid { color: var(--t3); background: var(--s2); }
  .db.none { color: var(--t3); background: none; border: 1px dashed var(--border-strong); }
  .gline { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; color: var(--t2);
    font-size: 13.5px; padding: 3px 0 0; }
  .gline .g { display: inline-flex; align-items: center; gap: 6px; }
  .gline .g b { color: var(--t1); font-weight: 600; font-variant-numeric: tabular-nums; }
  .panel .pnum .mk { color: var(--amber); font-weight: 700; margin-left: 5px; }
  .hs .ic { width: 12px; height: 12px; }
  .panel .row.head { font-weight: 700; color: var(--t1); }
  .panel .val.big { font-size: 17px; }
  .panel .hint { color: var(--t3); font-size: 12px; font-weight: 400; }
  .panel .pchip { font-size: 12px; color: var(--amber); border: 1px solid rgba(217,162,74,.4);
    border-radius: 4px; padding: 1px 6px; font-weight: 600; }
  /* The close button rides IN the header row (last flex item), so it shares
     one centerline with the links and chip instead of floating above them. */
  .panel .x { width: 26px; height: 26px; padding: 0; flex: none; margin-left: 2px;
    display: flex; align-items: center; justify-content: center; border-radius: 50%;
    background: none; border: 0;
    color: var(--t3); font-size: 16px; line-height: 1; cursor: pointer; }
  .panel .x:hover, .panel .x:focus-visible { color: var(--t1); background: var(--s2); }
  /* symmetric padding: the title, chips, and close button sit on the row's
     true vertical center instead of riding high on a 6px/2px split */
  .panel .h { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; padding: 4px 8px; }
  .panel .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 4px 28px; margin-top: 10px; }
  .panel .row { display: flex; align-items: center; gap: 8px; padding: 3px 0; color: var(--t2); }
  .panel .row .sq { width: 9px; height: 9px; border-radius: 3px; flex: none; }
  .panel .row .val { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--t1); }
  .panel .sect { border-top: 1px solid var(--border); margin-top: 10px; padding-top: 8px; }
  .panel .note { color: var(--amber); font-size: 13px; margin-top: 4px; }
  .panel .mut { color: var(--t3); font-size: 13px; margin-top: 4px; }
  .panel .q { color: var(--t2); font-size: 13.5px; margin: 6px 0; }
  .panel .q .by { color: var(--t3); }
  .panel .senti-link { color: var(--accent); cursor: pointer; text-decoration: underline; }
  .panel .wcurve { margin: 10px 0 2px; }
  /* padding gives the moment pins their own band so no disc ever covers the
     curve; drops hang below their curve point, holds sit above it */
  .panel .wcurve .wplot { position: relative; padding: 4px 0 28px; }
  .panel .wcurve svg { display: block; width: 100%; height: 64px; }
  .panel .wcurve line { stroke: var(--border); stroke-width: 0.4; }
  .panel .wcurve polyline { fill: none; stroke: var(--accent); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
  .panel .wcap { display: flex; justify-content: space-between; color: var(--t3); font-size: 12px; margin-top: 3px; }
  /* W16 moment pins: a hairline tick to the curve point, a small disc whose
     stroked chevron carries the only color — below the line = people left,
     above = extra people watching. Buttons, so keyboards reach the tooltip;
     the ::after pad keeps a ~32px touch target on a 12px visual. */
  .wmark { position: absolute; width: 12px; height: 12px; border-radius: 50%; transform: translate(-50%, -50%);
    display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer;
    background: var(--s1); border: 1px solid var(--border-strong); }
  .wmark .ic { width: 9px; height: 9px; color: inherit; }
  .wmark::before { content: ""; position: absolute; left: 50%; width: 1px; background: var(--border-strong); }
  .wmark.drop::before { bottom: 100%; height: var(--tick, 6px); }
  .wmark.hold::before { top: 100%; height: var(--tick, 6px); }
  .wmark::after { content: ""; position: absolute; inset: -10px; }
  .wmark.drop { color: var(--bad); }
  .wmark.hold { color: var(--good); }
  .wmark:hover, .wmark:focus-visible { background: var(--s2); border-color: currentColor; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .panel .themegrid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 8px; }
  /* audience feedback tile (2026-08-23): pills, quote, chips, footnote */
  .panel .fb .fbhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .panel .fb .fbhead .kicker { margin-bottom: 0; }
  .panel .pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .panel .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--s1);
    border: 1px solid var(--border); color: var(--t2); font-size: 12.5px; font-variant-numeric: tabular-nums; cursor: pointer; text-decoration: none; line-height: 1.2; }
  .panel .pill:hover, .panel .pill:focus-visible { border-color: var(--border-strong); color: var(--t1); }
  .panel .pill.more { color: var(--accent); }
  .panel .pill .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .panel .pill .dot.good { background: var(--good); } .panel .pill .dot.bad { background: var(--bad); }
  .panel .bq { margin: 12px 0 0; padding: 12px 14px; border-left: 3px solid var(--accent); background: var(--s1); border-radius: 0 10px 10px 0; }
  .panel .bq p { margin: 0; color: var(--t1); font-size: 15px; line-height: 1.45; }
  .panel .bq footer { margin-top: 6px; color: var(--t3); font-size: 12.5px; }
  .panel .bq .likes { color: var(--t3); margin-left: 4px; }
  .panel .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .panel .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 12.5px; border: 1px solid var(--border); color: var(--t2); }
  .panel .chip b { font-weight: 600; color: var(--t1); }
  .panel .chip.good { border-color: color-mix(in srgb, var(--good) 35%, transparent); }
  .panel .chip.bad { border-color: color-mix(in srgb, var(--bad) 35%, transparent); }
  .panel .fbfoot { margin-top: 10px; color: var(--t3); font-size: 12px; }
  .panel .themehead { color: var(--t2); font-size: 12px; font-weight: 700; margin-bottom: 3px; }
  .panel .themeitem { color: var(--t2); font-size: 13px; padding: 2px 0; }
  .panel .themeempty { color: var(--t3); font-size: 12px; line-height: 1.35; }

  /* ---- controls ---- */
  .controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-left: auto; }
  /* head-row controls are one shape in two states: same box, same padding,
     same radius — only weight and fill say which is active */
  .toggle, .viewbtn { display: inline-flex; align-items: center; gap: 6px; height: 32px;
    padding: 0 11px; border: 0; border-radius: 8px; background: none; cursor: pointer;
    font-size: 14px; line-height: 1; }
  .toggle { color: var(--t3); }
  .toggle:hover { background: var(--s2); color: var(--t1); }
  .toggle.on { color: var(--t1); background: var(--s2); font-weight: 700; }
  .reset { color: var(--t3); font-size: 14px; background: none; border: 0;
    cursor: pointer; text-decoration: underline; }
  .reset:hover { color: var(--t1); }

  /* ---- chart card ---- */
  #chartcard { background: var(--s1); border: 0; border-radius: 14px;
    padding: 12px 16px 10px; margin-bottom: var(--gap); }
  .chead { display: flex; align-items: center; gap: 10px; margin: 0 4px 8px; flex-wrap: wrap; }
  .chead .ct { font-size: 15px; font-weight: 700; }
  .chead .cs { font-size: 14px; color: var(--t3); }
  /* the platform scope mark stands bare — no pill box; sized near the
     heading beside it so the mark itself carries the weight */
  .chead .cs .scopepill { display: inline-flex; align-items: center; vertical-align: -4px; }
  .chead .cs .scopepill:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .chead .cs .scopepill .plogo { width: 18px; height: 18px; }
  /* ---- the chart heading IS the view picker ---- */
  .ctsel { position: relative; }
  /* the view picker wears its fill at rest — a bare bold title reads as a
     label, not a control (owner directive 2026-08-23); hover/open step one
     tone brighter than the resting s2 */
  .viewbtn { font-weight: 700; color: var(--t1); background: var(--s2); }
  .viewbtn svg { width: 15px; height: 15px; color: var(--t3); flex: none; }
  .viewbtn:hover { background: #212a3a; }
  .viewbtn:hover svg, .viewbtn[aria-expanded="true"] svg { color: var(--t1); }
  .viewbtn[aria-expanded="true"] { background: #212a3a; }
  .viewbtn[aria-expanded="true"] svg { transform: rotate(180deg); }
  .viewmenu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 40; min-width: 232px;
    background: #0d1017; border: 1px solid var(--border-strong); border-radius: 10px;
    padding: 6px; box-shadow: 0 14px 40px rgba(0,0,0,.5); }
  .viewmenu .vgroup { color: var(--t3); font-size: 11px; font-weight: 700; letter-spacing: .09em;
    text-transform: uppercase; padding: 8px 8px 4px 30px; }
  .viewmenu .vsep { height: 1px; background: var(--border); margin: 6px 8px; }
  .viewmenu .vopt { display: flex; align-items: center; gap: 8px; width: 100%; background: none;
    border: 0; border-radius: 7px; padding: 7px 8px; cursor: pointer; text-align: left;
    color: var(--t2); font-size: 14px; font-weight: 500; }
  .viewmenu .vopt .vtick { width: 14px; height: 14px; flex: none; color: var(--accent); opacity: 0; }
  .viewmenu .vopt .vtick svg { width: 14px; height: 14px; }
  .viewmenu .vopt.on { color: var(--t1); font-weight: 600; }
  .viewmenu .vopt.on .vtick { opacity: 1; }
  .viewmenu .vopt:hover, .viewmenu .vopt:focus-visible { background: var(--s2); color: var(--t1); outline: none; }
  .chart-copy { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  #chartbox { height: 440px; position: relative; transition: height .25s ease; }
  #chartbox.mini { height: 168px; }
  #tablebox { overflow-x: auto; display: none; }
  /* visible scroll affordance (taste audit F1): macOS hides scrollbars, so a
     clipped column looked cut off instead of scrollable */
  #tablebox::-webkit-scrollbar { height: 8px; }
  #tablebox::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
  #tablebox::-webkit-scrollbar-track { background: transparent; }
  #tablebox table { border-collapse: collapse; width: 100%; font-size: 13.5px;
    font-variant-numeric: tabular-nums; }
  #tablebox th { text-align: right; color: var(--t3); font-size: 12px; text-transform: uppercase;
    letter-spacing: .06em; padding: 8px 10px; border-bottom: 1px solid var(--border-strong); white-space: nowrap; }
  #tablebox th:first-child, #tablebox td:first-child { text-align: left; }
  #tablebox td { padding: 7px 10px; border-bottom: 1px solid var(--border); text-align: right;
    color: var(--t2); white-space: nowrap; }
  #tablebox td.t { color: var(--t1); }
  #tablebox .mk { color: var(--amber); font-size: 12px; }
  .st-good { color: var(--good); } .st-bad { color: var(--bad); } .st-mid { color: var(--t2); }
  .emptynote { color: var(--t3); font-size: 13px; margin: 6px 4px 0; }

  .tt { position: absolute; pointer-events: none; background: var(--s2); border: 1px solid var(--border-strong);
    border-radius: 8px; padding: 10px 12px; font-size: 13.5px; min-width: 216px; opacity: 0;
    transition: opacity .08s; z-index: 5; box-shadow: 0 10px 28px rgba(0,0,0,.45); }
  /* one text edge for the whole tooltip: the color chips hang in a fixed
     gutter so the title, the number, and every row name start at the same x */
  .tt { --chip: 15px; }
  .tt .h { display: flex; align-items: center; gap: 7px; font-weight: 700; }
  .tt .meta, .tt .big, .tt .chg, .tt .note { padding-left: var(--chip); }
  .tt .meta { color: var(--t3); font-size: 12px; margin: 1px 0 7px; }
  .tt .big { font-size: 17px; font-weight: 700; }
  .tt .chg { font-size: 12px; color: var(--t3); margin-bottom: 2px; }
  .tt .div { border-top: 1px solid var(--border); margin: 7px 0 5px; }
  .tt .row { display: flex; align-items: center; gap: 7px; padding: 2.5px 0; font-size: 13px; color: var(--t2); }
  .tt .row .sq { width: 8px; height: 8px; border-radius: 2px; flex: none; }
  .tt .row .val { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--t1); }
  .tt .note { color: var(--amber); font-size: 12px; margin-top: 5px; }

  /* ---- insights: readable claim up front, recommendation one click away ---- */
  .insights { display: grid; gap: var(--gap); }
  /* W35: a ranked item wears its rank where the category icon sits; the
     check it helps rides after the category in muted text */
  .insight .ic .rk { font-style: normal; font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
  .insight { background: var(--s1); border: 0; border-radius: 8px;
    padding: 10px 14px; font-size: 14px; display: flex; align-items: flex-start; gap: 12px;
    cursor: pointer; transition: background .15s; }
  .insight:hover { background: var(--s2); }
  .insight .ic { width: 28px; height: 28px; border-radius: 8px; flex: none; display: flex;
    align-items: center; justify-content: center; margin-top: 1px; }
  .insight .ic svg { width: 15px; height: 15px; }
  .insight .body { flex: 1; min-width: 0; }
  .insight .cat { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    margin-bottom: 1px; }
  .insight .txt { color: var(--t1); }
  .insight .txt b, .insight .rec b { font-weight: 700; color: var(--t1); }
  .insight .cav { display: none; color: var(--t3); font-size: 12px; margin-top: 4px; }
  .insight .reveal { display: inline-block; margin-top: 6px; color: var(--good); font-size: 12px;
    font-weight: 700; letter-spacing: .02em; cursor: pointer; }
  .insight .reveal:hover { text-decoration: underline; }
  .insight .rec { display: none; margin-top: 6px; padding: 8px 12px; border-left: 2px solid var(--good);
    background: rgba(62,207,142,.06); border-radius: 0 6px 6px 0; color: var(--t2); font-size: 13.5px; }
  .insight.open .rec, .insight.open .cav { display: block; }

  /* ---- drilldown modal ---- */
  #drill { position: fixed; inset: 0; background: rgba(4,6,10,.62); z-index: 50; display: none;
    align-items: flex-start; justify-content: center; padding: 6vh 16px; }
  #drill.on { display: flex; }
  .dcard { background: var(--s1); border: 0; border-radius: 12px;
    max-width: 680px; width: 100%; max-height: 82vh; display: flex; flex-direction: column;
    box-shadow: 0 24px 64px rgba(0,0,0,.6); }
  .dhead { display: flex; align-items: center; gap: 10px; padding: 14px 18px 10px; }
  .dhead .h { font-weight: 700; font-size: 15px; flex: 1; min-width: 0; }
  .dhead .x { background: none; border: 0; color: var(--t3); font-size: 19px; cursor: pointer; padding: 2px 6px; }
  .dhead .x:hover { color: var(--t1); }
  .dtabs { display: flex; gap: 6px; padding: 0 18px 10px; flex-wrap: wrap; }
  .dtabs button { border: 1px solid var(--border); background: var(--s1); color: var(--t3);
    border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer; }
  .dtabs button.on { background: var(--s2); color: var(--t1); border-color: var(--border-strong); font-weight: 700; }
  .dlist { overflow-y: auto; border-top: 1px solid var(--border); padding: 6px 18px 14px; }
  .drow { padding: 10px 0; border-bottom: 1px solid var(--border); }
  .drow:last-child { border-bottom: none; }
  .drow .m { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--t3); flex-wrap: wrap; }
  .drow .m .who { color: var(--t1); font-weight: 700; }
  .drow .m .src { border: 1px solid var(--border-strong); border-radius: 4px; padding: 0 5px;
    font-size: 12px; letter-spacing: .04em; }
  .drow .m .senti { margin-left: auto; font-size: 12px; }
  .drow .m .senti.positive { color: var(--good); } .drow .m .senti.negative { color: var(--bad); }
  .drow .m .senti.mixed { color: var(--amber); }
  .drow .txt { color: var(--t2); font-size: 14px; margin-top: 4px; white-space: pre-wrap; word-wrap: break-word; }
  .dempty { color: var(--t3); padding: 18px 0; text-align: center; }

  /* ---- about / footer ---- */
  details.about { margin-top: 20px; color: var(--t3); font-size: 13.5px; }
  details.about summary { cursor: pointer; color: var(--t3); }
  details.about summary:hover { color: var(--t1); }
  details.about .inner { border-left: 2px solid var(--border-strong); margin-top: 8px;
    padding: 2px 0 2px 14px; max-width: 78ch; }
  details.about p { margin: 6px 0; }
  details.about b { color: var(--t2); }
  footer { color: var(--t3); font-size: 13px; margin-top: 18px; }

  @media (max-width: 1100px) {
    /* the strip takes two lines: score and read share the first, the checks
       get the second in full; the helping / needs-work pair stacks */
    .hstrip { grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); }
    .hz-read { grid-row: 1; grid-column: 2; }
    .hz-checks { grid-row: 2; grid-column: 1 / -1; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
    .health-evidence .evidence { grid-template-columns: 1fr; gap: 14px; }
    .hdbody, .hdbody.cols-2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .hdbody.cols-1 { grid-template-columns: minmax(0, 1fr); }
    .hdbody .health-evidence { grid-column: 1 / -1; }
  }
  @media (max-width: 1020px) {
    .panel .pgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 720px) {
    /* Mobile is a denser cut of the same system: inline stamp, the gauge
       riding beside its caption instead of a tall centered column, one
       tightened gutter, and methodology copy deferred to About. */
    :root { --gap: 10px; }
    .wrap { padding: 12px 12px 20px; }
    h1 { font-size: 19px; }
    .stamp { font-size: 12.5px; }
    .overview { grid-template-columns: 1fr; }
    .card { padding: 13px 14px; }
    .kicker { margin-bottom: 8px; }
    /* the strip stacks: the score with the Expand button beside it, then the
       headline, then the checks — the one disclosure stays on the first line */
    .hcard { padding: 13px 14px 14px; }
    .hstrip { grid-template-columns: minmax(0, 1fr) auto; gap: 0 12px;
      grid-template-areas: "score btn" "read read" "checks checks"; }
    .hz-score { grid-area: score; gap: 12px; }
    .gauge { width: 54px; height: 54px; }
    .gauge .num b { font-size: 18px; }
    .hz-checks { grid-area: checks; margin-top: 12px; padding-top: 12px; }
    .hz-read .headline { font-size: 15px; }
    .hz-read { display: contents; }
    .hz-readbody { grid-area: read; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
    .hxbtn { grid-area: btn; align-self: center; margin-top: 0; }
    .hdbody, .hdbody.cols-2, .hdbody.cols-1 { grid-template-columns: 1fr; gap: 18px; }
    .hdbody .hc-meta { order: -2; }
    .hdbody .hc-dir { order: -1; }
    /* a card whose only content is a one-line wait note keeps its words but
       not a tall frame — a sketched empty chart keeps the full frame */
    .card:has(.waitline):not(:has(.skelplot)) { padding: 11px 14px; }
    .hero { flex-direction: column; gap: 10px; }
    .hero .spark { width: 100%; }
    .hero .big { font-size: 30px; }
    .controls { width: 100%; margin-left: 0; }
    .sitem { flex: 0 0 160px; padding: 11px 12px; }
    #chartbox { height: 340px; }
    .panel .themegrid { grid-template-columns: 1fr; }
    .panel .pgrid { grid-template-columns: 1fr; }
    /* the destination links leave the title row on phones: squeezed beside
       the title they stack one per line, so they take a wrapped row of
       their own under it; order keeps the in-row close button up on the
       title line */
    .panel .h { flex-wrap: wrap; }
    .panel .h .hmeta { flex-basis: 100%; order: 5; justify-content: flex-start; row-gap: 6px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Dive Radio</h1>
    <div class="stamp" id="stamp"></div>
    <a class="agentslink" id="agentslink" href="#agents">Agents</a>
  </header>

  <section class="healthrow" id="health" aria-label="Show health"></section>
  <div class="overview" id="overview">
    <div class="card hero" id="hero"></div>
    <div class="card compound" id="compound" style="display:none"></div>
  </div>

  <div class="carousel" id="strip" role="list" aria-label="Episodes, oldest to newest"></div>

  <div id="chartcard" class="card">
    <div class="chead">
      <div class="chart-copy">
        <div class="ctsel">
          <button type="button" class="viewbtn" id="viewbtn" aria-haspopup="listbox" aria-expanded="false" aria-controls="viewmenu">
            <span id="ctitle"></span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>
          </button>
          <div class="viewmenu" id="viewmenu" role="listbox" aria-label="What the chart shows" hidden></div>
        </div>
        <span class="cs" id="cscope"></span></div>
      <div class="controls">
        <button type="button" class="toggle" id="astable" aria-pressed="false">Table</button>
        <button type="button" class="toggle traj-only" id="bydate">Dates</button>
        <button type="button" class="reset" id="reset">Reset</button>
      </div>
    </div>
    <div id="chartbox"><canvas id="chart"></canvas><div class="tt" id="tt"></div></div>
    <div id="tablebox"></div>
    <div class="emptynote" id="emptynote" style="display:none"></div>
  </div>
  <div class="panel" id="panel" style="display:none"></div>

  <div class="insights" id="insights" aria-label="What matters"></div>

  <!-- PRD v12 W44: the Agents view — one link, one prompt, any agent. Hidden
       until the URL carries #agents; toggled without a reload. No number on
       it but the two dates (the glance-number budget is untouched). -->
  <section class="agents" id="agents" hidden aria-label="Agents"></section>

  <details class="about">
    <summary>About this data</summary>
    <div class="inner" id="about"></div>
  </details>

</div>

<div id="drill"><div class="dcard">
  <div class="dhead"><span class="h" id="dtitle"></span><button type="button" class="x" id="dclose" aria-label="Close feedback">×</button></div>
  <div class="dtabs" id="dtabs"></div>
  <div class="dlist" id="dlist"></div>
</div></div>

<script src="chart.umd.js"></script>
<script src="data.js"></script>
<script>
const DATA = window.DIVE_DATA;
const EPS = DATA.episodes;
const DAY = 86400000, WEEK = 7 * DAY, PHX = 7 * 3600000;
// Episode palette, 2026-08-22: E2 re-stepped (#8a6bd6 → #8e4ce0) to clear the
// normal-vision floor vs E1's slate; slots 3↔8 and 5↔7 swapped so no ACTIVE
// episode wears a status hue (#3ecf8e = --good, #ff7a59 = --bad now sit in
// the unused tail; anti-pattern "status color as series identity").
// E1 low-chroma and E6=platform-blue remain accepted, documented debts —
// episode identity is always doubled by labels (strip, end labels, tooltips).
const PALETTE = ["#6b7a94", "#8e4ce0", "#5eead4", "#e6c74a", "#ff5d8f", "#59b0ff", "#ff7a59", "#3ecf8e"];
const color = (e) => PALETTE[(e.ep - 1) % PALETTE.length];
const NEWEST = EPS[EPS.length - 1];
const FONT = getComputedStyle(document.body).fontFamily;
if (window.Chart) { Chart.defaults.font.family = FONT; Chart.defaults.font.size = 14; Chart.defaults.animation.duration = 300; }

// @ridd_design's near-white #d7dbe0 (chroma 0.008, the brightest mark on the
// page — read as "highlighted" in every bar) stepped down to a true light
// gray; still unmistakably "the gray one".
const PLAT_COLORS = {
  "yt:joindiveclub": "#ff4f5e", "yt:designertom": "#ffa14f",
  "x:ridd_design": "#b7c2d4", "x:designertom": "#59b0ff",
};
const TT_NAME = {
  "yt:joindiveclub": "Dive Club", "yt:designertom": "DesignerTom",
  "x:ridd_design": "@ridd_design", "x:designertom": "@designertom",
};
const YT_KEYS = ["yt:joindiveclub", "yt:designertom"];
const X_KEYS = ["x:ridd_design", "x:designertom"];
const GRID = "#1d2433", DIMLINE = "#3a4458";

// Strategy-impact categories: colors validated distinct from the platform
// colors AND the episode palette (OKLab ΔE, 2026-08-22). Falls back to an
// id-based mapping for data.js files built before categories shipped.
const CATS = {
  content:      { name: "Content",         color: "#a8b339", svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.1 5.4L20 10l-5.9 1.6L12 17l-2.1-5.4L4 10l5.9-1.6z"/></svg>` },
  distribution: { name: "Distribution",    color: "#32b5ae", svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v8M12 12l-6 6M12 12l6 6"/><circle cx="12" cy="4" r="1.6" fill="currentColor" stroke="none"/><circle cx="6" cy="18" r="1.6" fill="currentColor" stroke="none"/><circle cx="18" cy="18" r="1.6" fill="currentColor" stroke="none"/></svg>` },
  promotion:    { name: "Promotion",       color: "#c04a6e", svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4l10 4V6L4 10z"/><path d="M17 9a4 4 0 0 1 0 6"/></svg>` },
  audience:     { name: "Audience health", color: "#d946ef", svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-5 3 9 2-6 1.5 2H21"/></svg>` },
  data:         { name: "Data note",       color: "#8b95a7", svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor" stroke="none"/></svg>` },
};
const CAT_RANK = { content: 0, distribution: 1, promotion: 2, audience: 3, data: 4 };
function catKeyFor(ins) {
  if (ins.category && CATS[ins.category]) return ins.category;
  const id = ins.id;
  if (id === "pace-rank") return "content";
  if (id === "engagement" || id.startsWith("live")) return "audience";
  if (id === "host-split" || id === "reach-conversion" || id.startsWith("anomaly")) return "promotion";
  if (id === "flatline" || id === "platform-phase" || id === "watch-split" || id === "host-plays-split") return "distribution";
  return "data";
}

const state = { mode: "standings", metric: "views", byDate: false, solo: null, panel: null, table: false, evidenceOpen: false };

function premiereMs(dateStr) {
  const [y,m,d] = dateStr.split("-").map(Number);
  return Date.UTC(y, m-1, d, 12) + PHX;
}
// Trajectory math sums YouTube views only — the one complete watch history.
// X broadcast plays have no series before 2026-08-21; the chart title states
// this scope in place (no fabricated history, no silently mixed units).
function sum(byDest) { let t = 0; for (const k of YT_KEYS) t += (byDest[k]?.views || 0); return t; }
function splitOf(byDest) { const o = {}; for (const k of YT_KEYS) o[k] = byDest[k]?.views || 0; return o; }
function splitDelta(cur, prev) { const o = {}; for (const k of YT_KEYS) o[k] = (cur[k]?.views || 0) - (prev?.[k]?.views || 0); return o; }
function fmtDate(ms) { return new Date(ms - PHX).toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" }); }
const ORDINAL_DAY = ["", "first", "second", "third", "fourth", "fifth", "sixth", "seventh", "eighth", "ninth", "tenth", "eleventh", "twelfth", "thirteenth", "fourteenth", "fifteenth", "sixteenth", "seventeenth", "eighteenth", "nineteenth", "twentieth", "twenty-first", "twenty-second", "twenty-third", "twenty-fourth", "twenty-fifth", "twenty-sixth", "twenty-seventh", "twenty-eighth", "twenty-ninth", "thirtieth", "thirty-first"];
const MONTH_NAME = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
function phoenixDateKey(value = Date.now()) {
  const parts = new Intl.DateTimeFormat("en-US", { timeZone: "America/Phoenix", year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(new Date(value));
  const take = (type) => parts.find(part => part.type === type)?.value;
  return `${take("year")}-${take("month")}-${take("day")}`;
}
function dateInWords(dateKey) {
  const [, month, day] = dateKey.split("-").map(Number);
  return `${MONTH_NAME[month - 1]} ${ORDINAL_DAY[day]}`;
}
function relativeDayWords(dateKey) {
  const today = phoenixDateKey();
  const days = Math.round((Date.parse(`${today}T12:00:00Z`) - Date.parse(`${dateKey}T12:00:00Z`)) / DAY);
  return days === 0 ? "today" : days === 1 ? "yesterday" : dateInWords(dateKey);
}
function kfmt(n) { if (Math.abs(n) >= 1000) return (n/1000).toFixed(Math.abs(n) >= 10000 ? 0 : 1).replace(/\.0$/,"") + "k"; return String(Math.round(n)); }
function nfmt(n) { return n.toLocaleString("en-US"); }
function metricText(value, missing = "–") { return value == null ? missing : nfmt(value); }
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function short(t) { return t.replace(/^Dive Radio:\s*/i, "").replace(/\s*\+?\s*Live Call-?Ins?$/i, "").replace(/[,\s]+$/, ""); }
function label(e) { return `E${e.ep} · ${short(e.title)}`; }
function heroMarker(e) {
  const tvi = e.latest.totalViewsInfo || {};
  if (!tvi.includesPlays) return `${PLOGO.yt} only`;
  if (tvi.partial) return "some X plays missing";
  if (tvi.stale && tvi.asOf) return "X plays are old";
  return "";
}

/* W12 episode health: read-only render of the frozen store entry attached by
   build-data (definition-lock — no score math at render time, ever). An episode
   younger than three weeks carries only the date its read completes; nothing
   score-like renders for it anywhere. */
/* Inline icon set (W14): 14px stroked glyphs that replace micro text labels.
   Every icon rides with an accessible name via its row's words or a data-tip. */
const IC = (path, cls = "ic") => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${path}</svg>`;
const ICONS = {
  eye: IC('<path d="M2.5 12S6 6.5 12 6.5 21.5 12 21.5 12 18 17.5 12 17.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.6"/>'),
  heart: IC('<path d="M12 19.5s-7.4-4.7-9.3-8.9C1.2 7.2 3.4 4.5 6.4 4.5c2.2 0 3.6 1.2 4.4 2.4h2.4c.8-1.2 2.2-2.4 4.4-2.4 3 0 5.2 2.7 3.7 6.1-1.9 4.2-9.3 8.9-9.3 8.9z"/>'),
  clock: IC('<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>'),
  signal: IC('<path d="M6.2 17.8a8 8 0 0 1 0-11.6M17.8 6.2a8 8 0 0 1 0 11.6M9 15a4.2 4.2 0 0 1 0-6M15 9a4.2 4.2 0 0 1 0 6"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/>'),
  userplus: IC('<circle cx="9.5" cy="8" r="3.4"/><path d="M3.5 19.5c0-3.2 2.7-5.3 6-5.3s6 2.1 6 5.3"/><path d="M18.5 8v5M16 10.5h5"/>'),
