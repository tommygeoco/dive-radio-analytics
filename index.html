    if (!h.asOf?.newestTitle) return "";
    const parts = [`Reads <b>${esc(h.asOf.newestTitle)}</b>, ${nfmt(Math.round(h.asOf.ageDays))} days in${h.asOf.provisional ? " (an early read)" : ""}`];
    if (h.asOf.carried?.length) parts.push(`${h.asOf.carried.map((k) => (CHECK_LABELS[k] || [k])[0].toLowerCase()).join(" and ")} carried from the latest finished episode at half weight`);
    if (h.asOf.qualified?.length) parts.push(`shown but not scored: ${h.asOf.qualified.map((k) => QUALIFIED_WORDS[k] || k).join(" and ")} — promo-driven`);
    return `<p class="readson">${parts.join(" · ")}.</p>`;
  })();
  // PRD v10: the direction and outlook lenses are read from data.baselines —
  // computed once by build-data, served every build, never gated on the
  // model; the entry keeps a copy for the ledger. Words carry the state; a
  // series with a slope but too few episodes for a word says so.
  const lens = DATA.baselines?.direction || null;
  const out = DATA.baselines?.outlook || null;
  const headingColumn = (() => {
    if (!lens?.measures?.length) return "";
    const rows = lens.measures.filter((t) => t.pctPerEpisode != null).map((t) => {
      const tip = [t.note, t.reason].filter(Boolean).join(" — ");
      const word = t.direction ? `<span class="dw ${esc(t.direction)}">${esc(t.direction)}</span>` : `<span class="dw thin">too few to call</span>`;
      return `<div class="dirrow"><span class="dl"${tip ? ` data-tip="${esc(tip)}" tabindex="0"` : ""}>${esc(DIRECTION_LABELS[t.key] || t.key)}</span>${word}</div>`;
    }).join("");
    const votes = (lens.votes || []).map((v) => `${(CHECK_LABELS[v.check] || [v.check])[0].toLowerCase()} ${v.direction}`).join(" · ");
    const nfw = out?.nextFirstWeek;
    const slope = nfw && nfw.pctPerEpisode != null ? ` The slope over them runs ${nfw.pctPerEpisode >= 0 ? "up" : "down"} about ${nfmt(Math.abs(nfw.pctPerEpisode))}% each episode${nfw.direction ? "" : " — too few weeks for a direction word"}.` : "";
    const outlook = nfw && nfw.low != null
      ? `<p class="outlook">The last three clean launches’ first weeks ran <b>${nfmt(nfw.low)}</b>–<b>${nfmt(nfw.high)}</b> YouTube views (typical <b>${nfmt(nfw.typical)}</b>) — where the next one lands if it follows them.${esc(slope)}</p>`
      : (nfw?.reason ? `<p class="outlook">${esc(nfw.reason)}</p>` : "");
    const co = out?.coolOff;
    const cool = co?.word ? `<p class="outlook">The newest episode is ${esc(co.word)} at day ${nfmt(Math.round(co.ageDays))}.</p>`
      : (co?.promoDriven ? `<p class="outlook">The newest episode’s cool-off is promo-driven — shown on the chart, not judged.</p>` : "");
    return `<div class="hdcol hc-dir"><div class="kicker">Where it’s heading</div>
      <p class="dirlede">Over the last few clean episodes: <b class="${esc(lens.overall || "holding")}">${esc(lens.overall || "too few to call")}</b></p>
      ${votes ? `<p class="votes">${esc(votes)}</p>` : ""}
      <div class="dirrows">${rows}</div>${outlook}${cool}</div>`;
  })();
  const open = !!state.evidenceOpen;
  el.className = "healthrow";
  el.innerHTML = `<div class="card hcard" data-open="${open ? "true" : "false"}">
    <div class="hstrip">
      <div class="hz hz-score">
        <div class="gauge" role="img" aria-label="Show health ${h.score} out of 100. 50 is the show’s usual level.">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <circle class="track" cx="32" cy="32" r="${R}"></circle>
            ${h.score > 0 ? `<circle class="fill" cx="32" cy="32" r="${R}" stroke-dasharray="${Math.round(C * h.score / 100 * 10) / 10} ${C}"></circle>` : ""}
            <line class="tick" x1="1" y1="32" x2="11" y2="32"></line>
          </svg>
          <div class="num"><b data-fold-number>${h.score}</b></div>
        </div>
        <div class="hz-words"><div class="kicker">Show health</div><div class="hband">${scoreBandWords(h.score)}</div>${lens?.overall ? `<div class="hband hdir ${esc(lens.overall)}">${esc(lens.overall)}</div>` : ""}</div>
      </div>
      <div class="hz hz-checks"><div class="kicker">Health diagnosis</div><div class="hgroups" role="group" aria-label="Health checks">${groups}</div></div>
      <div class="hz hz-read">
        <div class="hz-readbody"><div class="kicker">Today’s read</div><p class="headline${open ? "" : " clamped"}"${open ? ` style="max-height:none"` : ""}>${esc(h.headline)}</p></div>
        <button type="button" class="hxbtn" id="whyscore" aria-expanded="${open ? "true" : "false"}" aria-controls="hdetails">${ICONS.chevdown}<span class="hxlabel">${open ? "Collapse" : "Expand"}</span></button>
      </div>
    </div>
    <div class="hdetails" id="hdetails">
      <div class="hdinner"${open ? "" : " inert"}>
        <div class="hdbody cols-${1 + (headingColumn ? 1 : 0) + (topRecs.length ? 1 : 0)}">
          <div class="hdcol health-evidence">
            <div class="kicker">Why this score</div>
            ${readsOn}
            <div class="evidence"><div><h3 class="up">Helping</h3><ul>${bullets(h.pros, "up")}</ul></div>
            <div><h3 class="down">Needs work</h3><ul>${bullets(h.cons, "down")}</ul></div></div>
            ${changeNote}
            ${h.drivers?.length ? `<div class="drivers">${h.drivers.map((d) => `<p>${esc(d)}</p>`).join("")}</div>` : ""}
            ${trend}
          </div>
          ${headingColumn}
          ${topRecs.length ? `<div class="hdcol hc-meta"><div class="kicker">Do next</div><div class="donext">${topRecs.map((r, i) => `<div class="dnrow"><span class="dnnum" aria-hidden="true">${i + 1}</span><span>${esc(r.recommendation)}</span></div>`).join("")}</div></div>` : ""}
        </div>
      </div>
    </div>
  </div>`;
  // Expand / Collapse toggles the card in place — no render() — so the
  // details can move: the same DOM goes from 0fr to 1fr and back. A re-render
  // for any other reason draws the card straight into its current state.
  const card = el.querySelector(".hcard");
  const btn = document.getElementById("whyscore");
  const inner = el.querySelector(".hdinner");
  const details = document.getElementById("hdetails");
  const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  const headline = el.querySelector(".hz-read .headline");
  let settle = 0;
  // open: no cap, so a later reflow (a wider window) never clips the text;
  // closed: the three-line clamp with its ellipsis returns
  const settled = () => {
    if (state.evidenceOpen) headline.style.maxHeight = "none";
    else headline.classList.add("clamped");
  };
  const setOpen = (next) => {
    state.evidenceOpen = next;
    card.dataset.open = String(next);
    btn.setAttribute("aria-expanded", String(next));
    btn.querySelector(".hxlabel").textContent = next ? "Collapse" : "Expand";
    // closed details are inert: nothing inside can take focus or be read
    if (next) inner.removeAttribute("inert"); else inner.setAttribute("inert", "");
    if (next) {
      // lift the clamp, then ease the box up to the text's full height
      headline.classList.remove("clamped");
      headline.style.maxHeight = `${headline.scrollHeight}px`;
      // bring the region in WITH the motion, not after it: the closed inner
      // already lays out its content, so its scrollHeight is the final size
      const need = details.getBoundingClientRect().top + inner.scrollHeight + 24 - window.innerHeight;
      if (need > 0) window.scrollBy({ top: need, behavior: reduced() ? "auto" : "smooth" });
    } else {
      // ease back down to the clamp: start from a real length (an open,
      // settled headline sits at max-height none, which cannot animate),
      // commit it, then let the stylesheet's cap take over
      headline.style.maxHeight = `${headline.scrollHeight}px`;
      void headline.offsetHeight;
      headline.style.maxHeight = "";
    }
    // the headline settles when its motion ends — or on a timer, since a
    // headline that already fits never changes height and so never fires
    // transitionend (nor does anything under reduced motion)
    clearTimeout(settle);
    settle = setTimeout(settled, reduced() ? 0 : 380);
  };
  headline.addEventListener("transitionend", (ev) => {
    if (ev.propertyName !== "max-height") return;
    clearTimeout(settle);
    settled();
  });
  btn.addEventListener("click", () => setOpen(!state.evidenceOpen));
  // the score and the read are click targets too (pointer only — the button
  // is the keyboard path): "why 46" sits on the 46, and a headline invites a
  // click; a drag to select text is not a click
  const toggleOnClick = () => { if (String(getSelection && getSelection())) return; setOpen(!state.evidenceOpen); };
  el.querySelector(".hz-score").addEventListener("click", toggleOnClick);
  el.querySelector(".hz-readbody").addEventListener("click", toggleOnClick);
  // Escape inside the open details collapses them and hands focus back
  card.addEventListener("keydown", (ev) => {
    if (ev.key !== "Escape") return;
    // a showing tooltip goes first; the next Escape collapses the details
    if (rtt.style.opacity === "1") { ev.stopPropagation(); rttPinned = null; hideRtt(); return; }
    if (!state.evidenceOpen) return;
    ev.stopPropagation();
    setOpen(false);
    btn.focus();
  });
}

/* ================= hero: latest episode card ================= */
let sparkChart = null;
// The hero mirrors the chart (owner directive 2026-08-23): it shows the
// selected episode — latest when none is selected — and leads with whichever
// measure the chart is on. One primary number per measure branch; only one
// branch ever renders.
function heroMetricKey() { return state.mode === "live" ? "live" : state.metric; }
// Split bar + its labels from ONE definition, so the two can never disagree.
// The 8px bar is too thin to be the only hover target, so each segment and its
// label share the same tooltip; the labels also carry the keyboard focus and
// the spoken numbers. A segment with no honest number is left out entirely.
function splitBar(segments, wholeWords) {
  const segs = segments.filter((s) => Number.isFinite(s.value) && s.value >= 0);
  const total = segs.reduce((a, s) => a + s.value, 0);
  if (segs.length < 2 || !(total > 0)) return "";
  const parts = segs.map((s) => {
    const share = Math.round((s.value / total) * 100);
    const stat = `${nfmt(s.value)} ${s.unit}`;
    const rows = (s.rows || []).filter((r) => r.value != null).map((r) => `${r.name}: ${nfmt(r.value)}`);
    const tip = `data-stat="${esc(stat)}"${rows.length ? ` data-rows="${esc(rows.join("||"))}"` : ""} data-note="${esc(`${share}% of ${wholeWords}`)}"`;
    return { s, stat, share, tip };
  });
  return `<div class="platform-bar" aria-hidden="true">${parts.map(({ s, tip }) =>
      `<span class="pseg" style="flex:${s.value};background:${s.color}" ${tip}></span>`).join("")}</div>
    <div class="splitlabels">${parts.map(({ s, stat, share, tip }) =>
      `<span class="sl" ${tip} tabindex="0" aria-label="${esc(`${s.label}: ${stat}, ${share}% of ${wholeWords}`)}"><i style="background:${s.color}" aria-hidden="true"></i>${esc(s.label)}</span>`).join("")}</div>`;
}
// Every chart this dashboard draws, in ONE list (owner directive
// 2026-08-23): the view tabs and the measure picker were two controls for one
// decision, so they collapse into a single dropdown whose current item IS the
// chart's heading. Each entry names the chart's mode and, for the per-episode
// bars, which measure it charts.
const VIEW_DEFS = [
  { key: "views", group: "By episode", title: "Episode views", mode: "standings", metric: "views" },
  { key: "watched", group: "By episode", title: "Share watched", mode: "standings", metric: "watched" },
  { key: "liveavg", group: "By episode", title: "Average live viewers", mode: "standings", metric: "live" },
  { key: "reach", group: "By episode", title: "X reach", mode: "standings", metric: "reach" },
  { key: "race", group: "Over time", title: "Views after release", mode: "race", metric: "views" },
  { key: "watch", group: "Over time", title: "How much people watch", mode: "watch", metric: "views" },
  { key: "minutes", group: "Over time", title: "Live viewers by minute", mode: "live", metric: "views" },
];
// The table is a DISPLAY of the current view, not a view of its own: the
// Table toggle beside the chart swaps the drawing for the numbers while the
// dropdown keeps deciding what data is on screen (owner feedback 2026-08-23:
// a "Data table" menu row that showed whichever view came before it read as
// a mystery option).
const METRIC_TITLES = Object.fromEntries(VIEW_DEFS.filter((v) => v.mode === "standings").map((v) => [v.metric, v.title]));
function currentView() {
  return VIEW_DEFS.find((v) => v.mode === state.mode && (state.mode !== "standings" || v.metric === state.metric)) || VIEW_DEFS[0];
}
const METRIC_TREND_TITLE = {
  watched: "Share watched — by episode",
  live: "Live viewers — by episode",
  reach: "X reach — by episode",
};
function buildHero() {
  const el = document.getElementById("hero");
  const sel = state.solo || state.panel;
  const e = (sel && EPS.find(x => x.slug === sel)) || NEWEST;
  const metric = heroMetricKey();
  const c = color(e);
  let html = `<div class="main"><div class="kicker">${sel && e.slug === sel ? "Selected episode" : "Latest episode"}</div><h2>${esc(short(e.title))}</h2>`;

  if (metric === "live") {
    if (e.live) {
      html += `<div class="metricline"><div class="big"><span data-fold-number>${nfmt(e.live.avg)}</span> <small>average live viewers</small></div></div>`;
      html += `<div class="gline"><span class="g" data-tip="peak live viewers" tabindex="0">${ICONS.users}<b>${nfmt(e.live.peak)}</b></span><span class="g" data-tip="chat messages" tabindex="0">${ICONS.chat}<b>${nfmt(e.live.chatMessages)}</b></span><span class="g" data-tip="live session length" tabindex="0">${ICONS.clock}<b>${e.live.durationMin ?? "–"} min</b></span></div>`;
    } else {
      html += `<div class="unavailable">Live data is not available for this episode.</div>`;
    }
  } else if (metric === "watched") {
    if (e.watch?.avgPercent != null) {
      html += `<div class="metricline"><div class="big"><span data-fold-number>${e.watch.avgPercent}%</span> <small>of the video watched on average</small></div></div>`;
      const chans = (e.watch.byChannel || []).filter(ch => ch.avgPercent != null);
      // multi-number chips get the structured tooltip, never a prose wrap
      if (chans.length) html += `<div class="gline">${chans.map(ch => `<span class="g" data-stat="${esc(TT_NAME[ch.key] || ch.key)}" data-dot="${esc(PLAT_COLORS[ch.key] || "#8a94a8")}" data-mrows="${esc(JSON.stringify([{ n: "Share of the video watched", v: `${ch.avgPercent}%` }, { n: "YouTube views", v: nfmt(ch.views) }]))}" tabindex="0"><i class="cdot" style="background:${PLAT_COLORS[ch.key] || "#8a94a8"}"></i><b>${ch.avgPercent}%</b></span>`).join("")}</div>`;
    } else {
      html += `<div class="unavailable">Watch data is not available for this episode.</div>`;
    }
  } else if (metric === "reach") {
    if (e.latest.xImpressions != null) {
      html += `<div class="metricline"><div class="big"><span data-fold-number>${nfmt(e.latest.xImpressions)}</span> <small>times the announces were seen</small></div></div>`;
      html += splitBar([
        { label: "@ridd_design", color: "#b7c2d4", value: e.latest.byDest["x:ridd_design"]?.views, unit: "times seen" },
        { label: "@designertom", color: "var(--accent)", value: e.latest.byDest["x:designertom"]?.views, unit: "times seen" },
      ], "this episode’s reach");
    } else {
      html += `<div class="unavailable">X reach is not available for this episode.</div>`;
    }
  } else {
    const mk = heroMarker(e);
    const tv = e.latest.totalViews ?? e.latest.ytTotal;
    const totalText = tv == null ? `<span class="unavailable">Total views are not available.</span>` : `<span class="big"><span data-fold-number>${nfmt(tv)}</span> <small>total views</small></span>`;
    html += `<div class="metricline">${totalText}${mk ? `<span class="mk">${mk}</span>` : ""}</div>`;
    const yt = e.latest.ytTotal;
    const x = e.latest.xPlays;
    const splitReady = Number.isFinite(tv) && Number.isFinite(yt) && Number.isFinite(x) && tv > 0 && yt + x === tv;
    if (splitReady) {
      const bd2 = e.latest.byDest || {};
      html += splitBar([
        { label: "YouTube", color: "#c25560", value: yt, unit: "views", rows: [
          { name: "Dive Club", value: bd2["yt:joindiveclub"]?.views },
          { name: "DesignerTom", value: bd2["yt:designertom"]?.views },
        ] },
        { label: "X", color: "#7d95b5", value: x, unit: "plays", rows: [
          { name: "@ridd_design", value: bd2["x:ridd_design"]?.plays },
          { name: "@designertom", value: bd2["x:designertom"]?.plays },
        ] },
      ], "total views");
    } else {
      html += `<div class="unavailable">The YouTube and X split is not available.</div>`;
    }
  }
  // No health chip here (owner directive 2026-08-23): the hero states one
  // measure. Episode health lives on the episode cards and in the panel.

  html += `</div>`;
  // The per-minute sparkline rides the live measure only. Other measures have
  // no honest per-episode series to draw (X plays have no week-1 history
  // before 8/21, and we never fabricate history).
  const isLive = metric === "live";
  if (isLive) html += `<div class="spark"><div class="cv"><canvas id="spark"></canvas></div><div class="cap">concurrent viewers by minute</div></div>`;
  el.innerHTML = html;

  if (sparkChart) { sparkChart.destroy(); sparkChart = null; }
  if (!isLive) return;
  const ctx = document.getElementById("spark");
  const pts = e.live ? e.live.series.map(p => ({ x: p.m, y: p.v })) : [];
  el.querySelector(".spark").style.visibility = pts.length > 1 ? "" : "hidden";
  if (pts.length > 1 && window.Chart) {
    sparkChart = new Chart(ctx, {
      type: "line",
      data: { datasets: [{ data: pts, borderColor: c, backgroundColor: c + "22", borderWidth: 2,
        pointRadius: 0, fill: true, tension: 0.3 }] },
      options: { responsive: true, maintainAspectRatio: false, animation: false,
        scales: { x: { type: "linear", display: false }, y: { display: false, beginAtZero: true } },
        plugins: { legend: { display: false }, tooltip: { enabled: false } }, events: [] },
    });
  }
}

/* ================= episode carousel (above the chart) ================= */
function buildStrip() {
  const isLive = state.mode === "live";
  const strip = document.getElementById("strip");
  strip.innerHTML = "";
  // oldest → newest, left → right: the latest episode is always far right
  // (locked rule) — read in order, the finished health scores ARE the
  // trajectory of the show.
  for (const e of EPS) {
    const it = document.createElement("button");
    it.type = "button";
    it.className = "sitem" + (e.slug === NEWEST.slug ? " newest" : "");
    it.setAttribute("role", "listitem");
    it.dataset.slug = e.slug;
    // the card's number IS the chart's measure (owner directive 2026-08-23):
    // one definition (CHART_METRICS) feeds chart, hero, and card alike
    let num = "";
    let spokenValue = "Data not available.";
    const metric = heroMetricKey();
    if (metric === "views") {
      const mk = heroMarker(e);
      // number rides the identity row; the unit is stated once in the hero
      const total = e.latest.totalViews ?? e.latest.ytTotal;
      num = total == null ? `<span class="num">not available</span>` : `<span class="num" data-fold-number>${kfmt(total)}</span>${mk ? `<span class="mk">${mk}</span>` : ""}`;
      if (total != null) spokenValue = `${nfmt(total)} total views.${healthOf(e) ? ` Episode health ${healthOf(e).score} of 100.` : ""}`;
    } else {
      const M = CHART_METRICS[metric];
      const v = M.get(e);
      num = v == null ? `<span class="num">not available</span>` : `<span class="num" data-fold-number>${M.card(v)}</span>`;
      if (v != null) spokenValue = `${M.spoken(v)}.${healthOf(e) ? ` Episode health ${healthOf(e).score} of 100.` : ""}`;
    }
    // Episode health: a finished three-week read shows its score; younger
    // episodes show nothing score-like at all (their wait date lives in the
    // click panel).
    // PRD v10: every episode's launch standing as a WORD from
    // data.baselines.launch — never a number; the frozen three-week score,
    // once it exists, takes the slot
    const launch = DATA.baselines?.launch?.[e.slug];
    // a promo-driven launch never wears a strength word (rule 18): the card
    // says what it is, the panel carries the numbers
    // one line, always (owner directive 2026-09-01): the card word stays short
    // ("Promo launch · so far"); the tooltip carries the full promo-driven sentence
    const launchWord = launch?.word ? (launch.promoDriven ? "Promo launch" : `${cap(launch.word)} launch`) + (launch.provisional ? " · so far" : "") : "";
    const hs = healthOf(e) ? healthChip(e) : (launch?.word
      ? `<span class="hs launch ${launch.promoDriven ? "promo" : esc(launch.word)}" data-stat="${esc(launchWord)}" data-note="${esc(launchNote(launch))}" tabindex="0" aria-label="${esc(`${launchWord}. ${launchNote(launch)}`)}">${esc(launchWord)}</span>`
      : `<span class="hs quiet" aria-hidden="true"></span>`);
    it.innerHTML = `<span class="r1"><span class="epk"><span class="dot" style="background:${color(e)}"></span>E${e.ep}</span>${num}</span>
      <span class="t">${esc(short(e.title))}</span>${hs}`;
    it.setAttribute("aria-label", `${label(e)}. ${spokenValue}`);
    it.addEventListener("click", (ev) => {
      // a tap on the health chip is the tooltip's, not the panel's — one tap,
      // one disclosure (critic 2026-08-23 F9)
      if (ev.target.closest(".hs[data-hslug], .hs.launch")) return;
      const opening = state.panel !== e.slug;
      if (opening) { state.panel = e.slug; state.solo = e.slug; }
      else { state.panel = null; state.solo = null; }
      render();
      // the click's answer is the soloed chart — bring it into view; the
      // detail panel waits directly beneath it
      if (opening) document.getElementById("chartcard").scrollIntoView({
        block: "nearest",
        behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth",
      });
    });
    strip.appendChild(it);
  }
  // the strip scrolls when episodes outgrow the row; land it on the NEWEST
  // episode (far right) — the locked order rule keeps its value on any width
  strip.scrollLeft = strip.scrollWidth;
}

/* ================= detail panel (Layer 2) ================= */
function buildPanel() {
  const el = document.getElementById("panel");
  const e = EPS.find(x => x.slug === state.panel);
  if (!e) { el.style.display = "none"; el.innerHTML = ""; return; }
  // Numbers lead, labels recede. Unit words, methodology sentences, and the
  // late-reg explainer live in "About this data" — never repeated here.
  // Section grammar (readability pass 2026-08-23): one kicker per section, a
  // single lead number, short rows beneath; sections flow in a two-column
  // grid so no line stretches the full panel width.
  const bd = e.latest.byDest || {};
  const tvi = e.latest.totalViewsInfo || {};
  let html = "";
  // header cluster: premiere date · one quiet text link (platform mark +
  // channel name) per destination the episode actually lives on · the
  // transcript chip, the row's one emphasized action · the close button,
  // in-row so everything shares a centerline. Rendered ONLY from stored
  // e.links — a destination without a stored link renders nothing.
  let hmeta = `<span class="pdate">${e.premiere.slice(5).replace("-", "/")}</span>`;
  for (const d of DATA.dests) {
    const url = e.links?.[d.key];
    if (!url) continue;
    hmeta += `<a class="plink" href="${esc(url)}" target="_blank" rel="noopener">${d.key.startsWith("yt:") ? PLOGO.yt : PLOGO.x}${TT_HTML[d.key] || TT_NAME[d.key]}</a>`;
  }
  if (e.transcript) {
    hmeta += `<a class="tlink" href="transcripts/${esc(e.slug)}.txt" download="${esc(short(e.title))} transcript.txt">${ICONS.download}transcript</a>`;
  }
  // no leading dot: the span had no size rule, so it drew nothing and only
  // pushed the title off the left edge the wrapped meta rows share on mobile
  html += `<div class="h"><span class="htitle">${esc(label(e))}</span><span class="hmeta">${hmeta}</span><button type="button" class="x" id="panelx" aria-label="Close episode details">×</button></div>`;
  html += `<div class="pgrid">`;

  // Bento IA (owner readability pass 2026-08-23 r2): contrasted tiles on a
  // tight 6px grid. Row one answers "how did it do" (verdict, views, reach),
  // row two "how the session and watching went" (live, watch, sources), and
  // the voices span the bottom. Absent sections simply leave the grid.
  // — episode health (W12): one row per check, stored number + plain colored
  //   comparison. Missing checks say so; never rendered as zeros. Young
  //   episodes state when their read completes; no score renders early. —
  const h = e.health;
  const pace = sameAgeSub(e);
  const paceText = !pace
    ? `<span class="hint">no same-age comparison yet</span>`
    : pace.pct === 0
      ? "typical"
      : `${pace.pct > 0 ? "▲" : "▼"}${Math.abs(pace.pct)}% vs typical`;
  // PRD v10: the launch read behind the card word, same store
  const launch = DATA.baselines?.launch?.[e.slug];
  if (launch?.word) {
    html += `<div class="psec"><div class="kicker">Launch<span data-tip="YouTube views at the end of the first week — or at the earliest reading for episodes tracked late, or at the current age while under a week old — against the other episodes at that same age, promo outliers left out, three or nothing" tabindex="0">${ICONS.info}</span></div>
      <div class="pnum">${launch.promoDriven ? "Promo-driven" : cap(launch.word)}${launch.provisional ? " · so far" : ""}</div>
      <div class="hint">${esc(launchNote(launch))}</div></div>`;
  }
  if (healthOf(e)) {
    const excludedN = (h.excluded || []).length;
    const peers = Math.max(0, (h.windowIds || []).length - 1 - excludedN);
    const basisTip = `Its first three weeks against the ${peers === 1 ? "episode" : `${peers} episodes`} before it${excludedN ? ` (${excludedN} promo outlier${excludedN === 1 ? "" : "s"} left out)` : ""} — newer episodes never change this score.`;
    html += `<div class="psec"><div class="kicker">Episode health<span data-tip="${esc(basisTip)}" tabindex="0">${ICONS.info}</span></div>`;
    const bc = Object.fromEntries((e.watch?.byChannel || []).map((c) => [c.key, c]));
    const subsSplit = bc["yt:joindiveclub"]?.subsPer1k != null && bc["yt:designertom"]?.subsPer1k != null
      ? ` — Dive Club ${bc["yt:joindiveclub"].subsPer1k} · DesignerTom ${bc["yt:designertom"].subsPer1k}` : "";
    const CHECK_ROWS = [
      ["watch", "eye", "Views", "YouTube views at three weeks, same age as the episodes before it"],
      ["engagement", "heart", "Engagement", "likes + comments per 1,000 views"],
      ["retention", "clock", "Watching", "how much of the video people watch"],
      ["live", "signal", "Live turnout", "peak viewers and chat messages"],
      ["conversion", "userplus", "Subscribers", `subscribers gained per 1,000 views${subsSplit}`],
      ["sentiment", "smile", "Goodwill", "share of feedback leaning positive"],
    ];
    html += `<div class="pnum">${h.score} <span class="hint">of 100 · 50 is typical</span></div>`;
    const notCompared = [];
    for (const [k, icon, lab, tip] of CHECK_ROWS) {
      const c = h.checks?.[k];
      if (!c || c.ratio == null) { if (c?.reason) notCompared.push(lab); continue; }
      const fmtV = (v) => k === "live" ? `${v.peak} · ${nfmt(v.chat)}` : (k === "retention" || k === "sentiment") ? `${v}%` : nfmt(v);
      // the stored note says how the comparison was made (same age, or as
      // the earlier episodes stand now) — click layer only, never recomputed
      const rowTip = c.note ? `${tip} — ${c.note}` : tip;
      html += `<div class="irow" data-tip="${esc(rowTip)}" tabindex="0">${ICONS[icon]}<span class="lb">${lab}</span><b>${fmtV(c.value)}</b>${deltaBadge(c.ratio)}</div>`;
    }
    if (notCompared.length) html += `<div class="hint">Not compared: ${notCompared.join(", ")} — fewer than three earlier episodes had a reading.</div>`;
    if (pace) {
      const paceTip = "YouTube views at the same age as the other episodes, promo outliers left out — appears after three of them have real data at that age.";
      html += `<div class="irow" data-tip="${esc(paceTip)}" tabindex="0">${ICONS.gauge}<span class="lb">Same-age pace</span>${
        Math.abs(pace.pct) <= QUIET_ZONE
          ? `<span class="db mid" data-tip="right at the typical level" tabindex="0">≈</span>`
          : pace.pct > 0 ? `<span class="db up">▲${Math.abs(pace.pct)}%</span>` : `<span class="db down">▼${Math.abs(pace.pct)}%</span>`}</div>`;
    }
    html += `</div>`;
  } else if (h && !h.pending && h.reason) {
    // finished read with no score (D7): the chip stays silent; the reason
    // lives here, at the click layer, in the stored plain words
    html += `<div class="psec"><div class="kicker">Episode health</div><div class="hint">${esc(h.reason.charAt(0).toUpperCase() + h.reason.slice(1))}</div></div>`;
  }

  // — total views —
  const panelTotal = e.latest.totalViews ?? e.latest.ytTotal;
  html += `<div class="psec"><div class="kicker">Total views</div>`;
  html += `<div class="pnum">${panelTotal == null ? "not available" : nfmt(panelTotal)}</div>`;
  const rows = [
    ["yt:joindiveclub", bd["yt:joindiveclub"]?.views],
    ["yt:designertom", bd["yt:designertom"]?.views],
    ["x:ridd_design", bd["x:ridd_design"]?.plays],
    ["x:designertom", bd["x:designertom"]?.plays],
  ];
  for (const [k, v] of rows) {
    html += `<div class="row"><span class="sq" style="background:${PLAT_COLORS[k]}"></span>${TT_HTML[k] || TT_NAME[k]}<span class="val">${v == null ? "–" : nfmt(v)}</span></div>`;
  }
  if (tvi.partial) html += `<div class="note">◐ ${tvi.have} of ${tvi.total} broadcasts — true total higher</div>`;
  else if (tvi.stale && tvi.asOf) html += `<div class="note">X plays as of ${tvi.asOf.slice(5, 10).replace("-", "/")}</div>`;
  else if (!tvi.includesPlays) html += `<div class="note">${PLOGO.yt} only — ${PLOGO.x} plays unavailable</div>`;
  html += `</div>`;

  // — X reach —
  html += `<div class="psec"><div class="kicker">${PLOGO.x} reach <span class="kh">not in total</span></div>`;
  html += `<div class="pnum">${e.latest.xImpressions == null ? "not available" : nfmt(e.latest.xImpressions)}</div>`;
  html += `<div class="row">@ridd_design<span class="val">${bd["x:ridd_design"]?.views == null ? "not available" : nfmt(bd["x:ridd_design"].views)}</span></div>`;
  html += `<div class="row">@designertom<span class="val">${bd["x:designertom"]?.views == null ? "not available" : nfmt(bd["x:designertom"].views)}</span></div>`;
  html += `</div>`;

  // — live —
  if (e.live) {
    html += `<div class="psec"><div class="kicker">Live</div>`;
    html += `<div class="pnum">${e.live.peak} <span class="hint">peak viewers</span></div>`;
    html += `<div class="gline"><span class="g" data-tip="average live viewers" tabindex="0">${ICONS.users}<b>${e.live.avg}</b></span><span class="g" data-tip="chat messages" tabindex="0">${ICONS.chat}<b>${nfmt(e.live.chatMessages)}</b></span><span class="g" data-tip="duration" tabindex="0">${ICONS.clock}<b>${e.live.durationMin ?? "–"} min</b></span></div>`;
    html += `</div>`;
  }

  // — W13 watching: verified analytics — how long people stay. Absent
  //   reports render as absent, never zero. —
  const w = e.watch;
  if (w) {
    const fmtDur = (sec) => sec >= 3600 ? `${Math.floor(sec / 3600)}h ${Math.floor((sec % 3600) / 60)}m` : `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`;
    html += `<div class="psec"><div class="kicker">How people watch <span class="kh" data-tip="YouTube analytics only" tabindex="0">${PLOGO.yt}</span></div>`;
    html += `<div class="pnum">${w.avgPercent == null ? "not available" : `${w.avgPercent}% <span class="hint">of the video on average</span>`}</div>`;
    const wparts = [];
    if (w.avgDurationSec != null) wparts.push(`<span class="g" data-tip="average time watched" tabindex="0">${ICONS.clock}<b>${fmtDur(w.avgDurationSec)}</b></span>`);
    if (w.minutesWatched != null) wparts.push(`<span class="g" data-tip="total watch time across both channels" tabindex="0">${ICONS.stack}<b>${nfmt(Math.round(w.minutesWatched / 60))} h</b></span>`);
    // per-channel split rides beside the blend — same colors as everywhere
    for (const c of w.byChannel || []) {
      if (c.avgPercent == null) continue;
      wparts.push(`<span class="g" data-stat="${esc(TT_NAME[c.key] || c.key)}" data-dot="${esc(PLAT_COLORS[c.key] || "#8a94a8")}" data-mrows="${esc(JSON.stringify([{ n: "Share of the video watched", v: `${c.avgPercent}%` }, { n: "YouTube views", v: nfmt(c.views) }, ...(c.subsPer1k != null ? [{ n: "Subscribers per 1,000 views", v: String(c.subsPer1k) }] : [])]))}" tabindex="0"><i class="cdot" style="background:${PLAT_COLORS[c.key] || "#8a94a8"}"></i><b>${c.avgPercent}%</b></span>`);
    }
    if (wparts.length) html += `<div class="gline">${wparts.join("")}</div>`;
    if (w.curve) {
      const pts = w.curve.map(p => `${(p.at * 100).toFixed(1)},${(40 - Math.min(1, p.watching) * 40).toFixed(1)}`).join(" ");
      // W16 moment pins — rendered ONLY from the stored episode.watch.moments
      // (no marker math at render time); each is a keyboard-reachable tooltip
      // target quoting the transcript from that stretch of the show. Drops pin
      // below their curve point, holds above it, so the line itself stays
      // visible; same-kind neighbors under ~6% apart alternate pin depth
      // instead of fusing (presentation only — the data never moves).
      const timeWords = (sec, approx) => {
        const m = Math.round(sec / 60);
        const h = Math.floor(m / 60);
        const t = m < 60 ? `${m} minute${m === 1 ? "" : "s"} in` : `${h} hour${h === 1 ? "" : "s"}${m % 60 ? ` ${m % 60} minutes` : ""} in`;
        return `${approx ? "roughly" : "about"} ${t}`;
      };
      let marks = "";
      const lastAt = { drop: -1, hold: -1 };
      const deepPin = { drop: false, hold: false };
      (w.moments || []).forEach((mo, i) => {
        const pt = w.curve.find(p => p.at === mo.at) || [...w.curve].sort((a, b) => Math.abs(a.at - mo.at) - Math.abs(b.at - mo.at))[0];
        deepPin[mo.kind] = mo.at - lastAt[mo.kind] < 0.065 ? !deepPin[mo.kind] : false;
        lastAt[mo.kind] = mo.at;
        const hang = deepPin[mo.kind] ? 20 : 12;
        const y = 4 + (1 - Math.min(1, pt.watching)) * 64; // 4px = .wplot top padding
        const top = mo.kind === "drop" ? y + hang : y - hang;
        const stat = mo.kind === "drop"
          ? `${mo.points} of every 100 viewers left here`
          : `${mo.points} of every 100 jumped in here — a spot people skip to`;
        const meta = `${Math.round(mo.at * 100)}% through · ${timeWords(mo.estSec, mo.approx)}`;
        // context is the stored model-written summary of what was happening —
        // never the raw transcript; no summary in the store, no context line
        marks += `<button type="button" class="wmark ${mo.kind}" style="left:clamp(7px, ${(mo.at * 100).toFixed(1)}%, calc(100% - 7px));top:${top.toFixed(1)}px;--tick:${hang - 6}px" data-stat="${esc(stat)}" data-meta="${esc(meta)}"${mo.summary ? ` data-note="${esc(mo.summary)}" aria-describedby="wmq${i}"` : ""} aria-label="${esc(`${stat}, ${meta}`)}">${mo.kind === "drop" ? ICONS.chevdown : ICONS.chevup}</button>${mo.summary ? `<span class="sr" id="wmq${i}">${esc(mo.summary)}</span>` : ""}`;
      });
      html += `<div class="wcurve"><div class="wplot"><svg viewBox="0 0 100 40" preserveAspectRatio="none" role="img" aria-label="Share of the audience still watching across the video: ${Math.round(w.curve[0].watching * 100)}% near the start, ${Math.round(w.curve[w.curve.length - 1].watching * 100)}% at the end.">
        <line x1="25" y1="0" x2="25" y2="40"></line><line x1="50" y1="0" x2="50" y2="40"></line><line x1="75" y1="0" x2="75" y2="40"></line>
        <polyline points="${pts}"></polyline></svg>${marks}</div>
      <div class="wcap" aria-hidden="true"><span>start</span><span>still watching, through the video</span><span>end</span></div></div>`;
    }
    html += `</div>`;

    // — where views came from: share bars, scaled to the top source —
    if (w.traffic) {
      const topShare = Math.max(...w.traffic.map((t) => t.share));
      html += `<div class="psec"><div class="kicker">Where views came from <span class="kh" data-tip="YouTube analytics only" tabindex="0">${PLOGO.yt}</span></div>`;
      for (const t of w.traffic) {
        const tname = TRAFFIC_NAMES[t.source] || esc(t.source.toLowerCase().replace(/_/g, " "));
        const ttip = TRAFFIC_TIPS[t.source];
        html += `<div class="trow" tabindex="0" aria-label="${tname} — ${esc(nfmt(t.views))} views, ${t.share}% of views">${ICONS[TRAFFIC_ICONS[t.source] || "dots"]}<span class="tl"${ttip ? ` data-tip="${esc(ttip)}" tabindex="0"` : ""}>${tname}</span>
          <span class="tb" aria-hidden="true"><span style="width:${topShare > 0 ? Math.max(2, Math.round((t.share / topShare) * 100)) : 0}%"></span></span>
          <span class="tbv" aria-hidden="true">${esc(nfmt(t.views))} views</span>
          <span class="tv">${t.share}%</span></div>`;
      }
      html += `</div>`;
    }
  }

  // — audience feedback — (redesigned 2026-08-23, owner directive: one quiet
  //   header row of pills, the quote as the centrepiece, theme chips only when
  //   a theme exists, one muted footnote; nothing renders for what is missing)
  // PRD v12 W43: chapters sit above the feedback — topics with timestamps
  if (e.chapters?.list?.length) html += `<div class="psec wide">${chaptersHTML(e)}</div>`;
  const comments = e.comments;
  if (comments) {
    const ppl = comments.uniqueCommenters;
    html += `<div class="psec wide fb"><div class="fbhead"><div class="kicker">Audience feedback</div>
      <div class="pills">
        <span class="pill senti-link" data-f="positive" role="button" tabindex="0"><i class="dot good"></i>${comments.enjoyCount} enjoyed</span>
        <span class="pill senti-link" data-f="negative" role="button" tabindex="0"><i class="dot bad"></i>${comments.complaintCount} didn’t</span>
        <span class="pill senti-link more" data-f="all" role="button" tabindex="0">${ppl} ${ppl === 1 ? "person" : "people"} commented →</span>
      </div></div>`;
    for (const q of (comments.featured || []).slice(0, 2)) {
      html += `<blockquote class="bq"><p>“${esc(q.text.length > 160 ? q.text.slice(0, 158).trimEnd() + "…" : q.text)}”</p><footer>${esc(q.author)}${q.likes ? ` <span class="likes">♥ ${q.likes}</span>` : ""}</footer></blockquote>`;
    }
    const chips = (themes, cls) => themes.map((t) => `<span class="chip ${cls}">${esc(t.theme)} <b>${t.count}</b></span>`).join("");
    // the classifier's catch-all theme carries no decision — chips name real themes only
    const enjoy = (comments.enjoyThemes || []).filter((t) => t.theme !== "other");
    const complaint = (comments.complaintThemes || []).filter((t) => t.theme !== "other");
    if (enjoy.length || complaint.length) {
      html += `<div class="chips">${chips(enjoy, "good")}${chips(complaint, "bad")}</div>`;
    }
    const foot = [];
    if (comments.commentersPer1k != null) foot.push(`${comments.commentersPer1k} commenting per 1,000 watches`);
    if (comments.xCoverage === "missed") foot.push("YouTube comments only — X replies weren’t captured for this episode");
    if (foot.length) html += `<div class="fbfoot">${foot.join(" · ")}</div>`;
    html += `</div>`;
  }

  html += `</div>`;
  el.innerHTML = html;
  el.style.display = "";
  el.querySelector("#panelx").addEventListener("click", () => { state.panel = null; state.solo = null; render(); });
  el.querySelectorAll(".senti-link").forEach(a =>
    a.addEventListener("click", () => openDrill(e.slug, a.dataset.f)));
}

/* ================= drilldown modal (Layer 3) ================= */
const drillState = { slug: null, filter: "all" };
function openDrill(slug, filter) {
  const e = EPS.find(x => x.slug === slug);
  if (!e?.comments?.list) return;
  drillState.slug = slug;
  drillState.filter = filter || "all";
  renderDrill();
  document.getElementById("drill").classList.add("on");
}
function closeDrill() { document.getElementById("drill").classList.remove("on"); }
/* ================= growth-trend card: is the show growing? (PRD v2 W2) ================= */
function buildCompound() {
  const el = document.getElementById("compound");
  // Alternate measures chart their own across-episodes trend beside the hero,
  // in air order, from the same stored numbers the chart uses (owner directive
  // 2026-08-23). Episodes without the measure simply don't draw a bar.
  const metric = heroMetricKey();
  // an honest skeleton for the wait states: a sketched empty chart — dashed
  // gridlines, a tick axis, a circled trend mark — around the plain sentence.
  // Chrome is aria-hidden; the sentence stays the accessible content.
  const skelChart = (line, sub) => `<div class="skelplot">
      <div class="skelgrid" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="skelcenter">
        <svg class="skelicon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="24" cy="24" r="21.5"/><path d="M14.5 30.5l6.5-6.5 4 4 8.5-9.5"/><path d="M28.5 18.5h5v5"/></svg>
        <div class="waitline">${line}</div>${sub ? `<div class="waitsub">${sub}</div>` : ""}
      </div>
      <div class="skelaxis" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>`;
  if (metric !== "views") {
    const M = CHART_METRICS[metric];
    const have = EPS.map((e) => ({ e, v: M.get(e) })).filter((r) => r.v != null);
    if (have.length < 3) {
      el.innerHTML = `<div class="kicker">${esc(METRIC_TREND_TITLE[metric])}</div>${skelChart("Not enough episodes to call a direction yet.")}`;
      el.style.display = "";
      return;
    }
    const maxV = Math.max(...have.map((r) => r.v));
    const hotSlug = state.solo && have.some((r) => r.e.slug === state.solo) ? state.solo : have.at(-1).e.slug;
    // the verdict compares the newest episode with the one before it LIKE FOR
    // LIKE (reach and share watched at the same age, live turnout age-free),
    // read from data.baselines — never from the lifetime bars above (PRD v9 F15)
    const cmp = DATA.baselines?.newestVsPrevious?.[metric] || null;
    const pct = cmp && Number.isFinite(cmp.pct) ? cmp.pct : null;
    const cls2 = pct == null || Math.abs(pct) <= QUIET_ZONE ? "" : pct > 0 ? "up" : "down";
    const verdict2 = pct == null ? (cmp?.reason || "Too young to compare with the episode before it at the same age.")
      : Math.abs(pct) <= QUIET_ZONE ? "Holding steady episode to episode."
      : pct > 0 ? `The newest episode is up ${pct}% on the one before it.` : `The newest episode is down ${Math.abs(pct)}% on the one before it.`;
    el.innerHTML = `<div class="kicker">${esc(METRIC_TREND_TITLE[metric])}</div>
      <div class="bars">${have.map((r) => { const hot = r.e.slug === hotSlug; return `<div class="cbar${hot ? " hot" : ""}" role="img" aria-label="${esc(`${short(r.e.title)}: ${M.spoken(r.v)}`)}">
        <span class="bnum" aria-hidden="true">${M.card(r.v)}</span>
        <div class="bwrap"><div class="b" style="height:${Math.max(8, Math.round((r.v / maxV) * 100))}%${hot ? `;background:${color(r.e)}` : ""}"></div></div>
        <span class="bep" aria-hidden="true">E${r.e.ep}</span></div>`; }).join("")}</div>
      <div class="cv2 ${cls2}" style="${cls2 === "up" ? "color:var(--good)" : cls2 === "down" ? "color:var(--bad)" : ""}">${verdict2}</div>`;
    el.style.display = "";
    return;
  }
  const rows = DATA.showTrend?.week1VelocityByEpisode || [];
  if (!rows.length) { el.style.display = "none"; el.innerHTML = ""; return; }
  const enriched = rows.map(r => ({ ...r, e: EPS.find(x => x.slug === r.slug) })).filter(r => r.e);
  const vals = enriched.filter(r => r.value != null);
  const max = Math.max(1, ...vals.map(r => r.value));
  // Direction stays hidden until three real first weeks exist. When it does
  // appear, the visual carries the exact stored values through accessible
  // labels without adding another row of glance-layer numbers.
  let verdict, cls = "";
  if (vals.length < 3) {
    el.innerHTML = `<div class="kicker">Growth trend</div>${skelChart("Growth trend isn’t ready yet.", "Appears once three episodes have clean first weeks.")}`;
    el.style.display = "";
    return;
  } else {
    const last = vals[vals.length - 1], prev = vals[vals.length - 2], before = vals[vals.length - 3];
    const pct = Math.round(((last.value - prev.value) / prev.value) * 100);
    const prevPct = Math.round(((prev.value - before.value) / before.value) * 100);
    // a trend word needs a three-point run in one direction; two points only
    // say how the newest first week compares with the one before it
    // the direction WORD is the stored lens's (PRD v10 rule 16: one first-week
    // direction — data.baselines.direction, four clean weeks for a word); the
    // two-point comparison stays a comparison
    const fw = (DATA.baselines?.direction?.measures || []).find((m) => m.key === "firstWeek") || null;
    if (Math.abs(pct) <= QUIET_ZONE) { verdict = "First-week audience is holding steady."; }
    else if (pct > 0) { verdict = fw?.direction === "building" ? "Each launch is starting stronger." : `The newest first week beat the one before by ${pct}%.`; cls = "up"; }
    else { verdict = fw?.direction === "softening" ? "New launches are starting softer." : `The newest first week came in ${Math.abs(pct)}% under the one before.`; cls = "down"; }
  }
  const hotSlug = state.solo && vals.some((r) => r.e.slug === state.solo) ? state.solo : vals.at(-1).e.slug;
  let bars = "";
  for (const r of vals) {
    const hot = r.e.slug === hotSlug;
    bars += `<div class="cbar${hot ? " hot" : ""}" role="img" aria-label="${esc(short(r.e.title))}: ${nfmt(r.value)} YouTube views in its first week">
      <span class="bnum" aria-hidden="true">${kfmt(r.value)}</span>
      <div class="bwrap"><div class="b" style="height:${Math.max(8, Math.round((r.value / max) * 100))}%${hot ? `;background:${color(r.e)}` : ""}"></div></div>
      <span class="bep" aria-hidden="true">E${r.e.ep}</span></div>`;
  }
  el.innerHTML = `<div class="kicker">Growth trend — first weeks</div><div class="bars">${bars}</div>
    <div class="cv2 ${cls}" style="${cls === "up" ? "color:var(--good)" : cls === "down" ? "color:var(--bad)" : ""}">${verdict}</div>`;
  el.style.display = "";
}

function renderDrill() {
  const e = EPS.find(x => x.slug === drillState.slug);
  if (!e) return;
  const list = e.comments.list || [];
  document.getElementById("dtitle").textContent = `Audience feedback — ${label(e)}`;
  const tabs = [["all", `All feedback ${list.length}`], ["positive", `Enjoyed ${e.comments.enjoyCount}`],
    ["negative", `Didn’t ${e.comments.complaintCount}`]];
  const tEl = document.getElementById("dtabs");
  tEl.innerHTML = "";
  for (const [f, lab] of tabs) {
    const b = document.createElement("button");
    b.textContent = lab;
    b.className = drillState.filter === f ? "on" : "";
    b.addEventListener("click", () => { drillState.filter = f; renderDrill(); });
    tEl.appendChild(b);
  }
  const rows = list.filter(c => drillState.filter === "all" ? true :
    drillState.filter === "positive" ? c.sentiment === "positive" || c.sentiment === "mixed" :
    c.sentiment === "negative" || c.sentiment === "mixed");

  const missedNote = e.comments?.xCoverage === "missed"
    ? `<div class="dempty" style="padding:8px 0 4px;font-size:12px">X replies missing for this episode — it aired before comment tracking started (X search reaches back 7 days). YouTube comments only.</div>` : "";
  lEl.innerHTML = (rows.length ? "" : `<div class="dempty">No feedback in this group.</div>`) + missedNote;
  for (const c of rows) {

      <div class="txt">${esc(c.text)}</div>`;
    lEl.appendChild(d);
  }
}
/* hover highlight (owner request 2026-08-23): pointing at any line lights it
   up in its episode color without needing a carousel selection. Base styles
   ride on each dataset; hover only swaps between them — no re-render. */
function lineHoverHandler(evt, els, ch) {
  const ds0 = els?.length ? ch.data.datasets[els[0].datasetIndex] : null;
  const slug = ds0 && ds0.slug ? ds0.slug : null;
  if (ch._hoverSlug === slug) return;
  ch._hoverSlug = slug;
  let changed = false;
  for (const ds of ch.data.datasets) {
    if (!ds.slug || ds.baseBorderColor === undefined) continue;
    const hl = slug !== null && ds.slug === slug;
    ds.borderColor = hl ? ds.hoverColor : ds.baseBorderColor;
    ds.labelColor = hl ? ds.hoverColor : ds.baseLabelColor;
    ds.borderWidth = hl ? 3 : ds.baseWidth;
    ds.order = hl ? -1 : ds.baseOrder;
    if (ds.baseNoEndLabel !== undefined) ds.noEndLabel = hl ? false : ds.baseNoEndLabel;
    changed = true;
  }
  if (changed) ch.update("none");
  ch.canvas.style.cursor = slug ? "pointer" : "";
}

// stale-tooltip kill (taste audit F5): Chart.js external tooltips only hide on
// tooltip events; a fast pointer exit could strand one over the chart
// chart tooltips follow the pointer, not the bar's caret — the reader's eye
// is at the cursor (owner feedback 2026-08-23). Falls back to the caret when
// no pointer has moved yet (keyboard, touch synthesis).
let chartCursor = null;
document.getElementById("chartbox").addEventListener("pointermove", (ev) => {
  const r = ev.currentTarget.getBoundingClientRect();
  chartCursor = { x: ev.clientX - r.left, y: ev.clientY - r.top };
  // the tooltip TRACKS the pointer, not just its opening spot — Chart.js only
  // re-fires the handler when the hovered element changes, so gliding within
  // one bar would otherwise leave the tip behind
  const el = document.getElementById("tt");
  if (el && el.style.opacity === "1") {
    const x = Math.min(Math.max(chartCursor.x, 120), r.width - 130);
    const above = chartCursor.y > 190;
    el.style.left = x + "px";
    el.style.top = (chartCursor.y + (above ? -14 : 14)) + "px";
    el.style.transform = `translate(-50%, ${above ? "-100%" : "0"})`;
  }
});
document.getElementById("chartbox").addEventListener("mouseleave", () => {
  document.getElementById("tt").style.opacity = 0;
  if (chart) lineHoverHandler(null, [], chart);
});

// health-chip tooltip: delegated so it survives every re-render
const rtt = document.createElement("div");
rtt.id = "rtt";
document.body.appendChild(rtt);
function showRtt(badge) {
  let html = null;
  if (badge.dataset.hslug) {
    const e = EPS.find(x => x.slug === badge.dataset.hslug);
    const r = e && healthOf(e);
    if (r) html = healthTipHTML(e, r);
  } else if (badge.dataset.stat) {
    // structured tooltip grammar: bold payoff (with a state chip when the
    // badge carries one), measure blocks or plain data rows, muted note
    const state = badge.dataset.state
      ? `<span class="tst ${badge.dataset.stcls || ""}"><i aria-hidden="true"></i>${esc(badge.dataset.state)}</span>` : "";
    const hdot = badge.dataset.dot ? `<i class="hdot" style="background:${esc(badge.dataset.dot)}" aria-hidden="true"></i>` : "";
    html = `<div class="h${state ? " th" : ""}"><span>${hdot}${esc(badge.dataset.stat)}</span>${state}</div>`
      + (badge.dataset.meta ? `<div>${esc(badge.dataset.meta)}</div>` : "");
    if (badge.dataset.mrows) {
      // measure blocks: muted label (sample right-aligned), then the value
      // with its direction badge and the typical level beside it
      let measures = [];
      try { measures = JSON.parse(badge.dataset.mrows); } catch { measures = []; }
      html += measures.map((m) => {
        const head = `<div class="ml"><span>${esc(m.n)}</span>${m.s ? `<span class="ms">${esc(String(m.s))} episodes</span>` : ""}</div>`;
        if (m.r) return `<div class="mrow">${head}<div class="mv mr">${esc(m.r)}</div></div>`;
        const dir = m.d ? `<span class="db ${m.d}">${m.d === "mid" ? "≈" : (m.d === "up" ? "▲" : "▼") + m.p + "%"}</span>` : "";
        const mnote = [m.note, m.q, m.cn, m.sw].filter(Boolean).map((t) => `<div class="mnote">${esc(t)}</div>`).join("");
        return `<div class="mrow">${head}<div class="mv"><b>${esc(m.v)}</b>${dir}${m.t ? `<span class="mt">typically ${esc(m.t)}</span>` : ""}</div>${mnote}</div>`;
      }).join("");
      html += badge.dataset.note ? `<div class="mut fnote">${esc(badge.dataset.note)}</div>` : "";
    } else {
      const rows = badge.dataset.rows ? badge.dataset.rows.split("||") : [];
      html += rows.map((r) => `<div>${esc(r)}</div>`).join("")
        + (badge.dataset.note ? `<div class="mut">${esc(badge.dataset.note)}</div>` : "");
    }
  } else if (badge.dataset.tip) {
    html = `<div>${esc(badge.dataset.tip)}</div>`;
  }
  if (!html) return;
  rtt.innerHTML = html;
  const b = badge.getBoundingClientRect();
  rtt.style.opacity = 1;
  // measure after content is set; clamp inside the viewport, flip above if low
  const w = rtt.offsetWidth, h = rtt.offsetHeight;
  let x = Math.min(Math.max(b.left + b.width / 2 - w / 2, 8), window.innerWidth - w - 8);
  let y = b.bottom + 8;
  if (y + h > window.innerHeight - 8) y = b.top - h - 8;
  rtt.style.left = x + "px";
  rtt.style.top = y + "px";
}
function hideRtt() { rtt.style.opacity = 0; }
// A tap pins its tooltip: touch synthesis fires a stray mouseout right after
// the gesture (hover is not sticky on touch), which must not dismiss what the
// tap just opened. Unpin on outside click or when keyboard focus moves on.
const RTT_SEL = ".hs[data-hslug], [data-tip], [data-stat]";
let rttPinned = null;
document.addEventListener("mouseover", (ev) => { const b = ev.target.closest?.(RTT_SEL); if (b) { rttPinned = null; showRtt(b); } });
document.addEventListener("mouseout", (ev) => { if (!rttPinned && ev.target.closest?.(RTT_SEL)) hideRtt(); });
document.addEventListener("focusin", (ev) => { const b = ev.target.closest?.(RTT_SEL); if (b) { rttPinned = null; showRtt(b); } });
document.addEventListener("focusout", (ev) => { if (ev.target.closest?.(RTT_SEL)) { rttPinned = null; hideRtt(); } });
document.addEventListener("click", (ev) => { const b = ev.target.closest?.(RTT_SEL); if (b) { rttPinned = b; showRtt(b); } else { rttPinned = null; hideRtt(); } });
document.getElementById("dclose").addEventListener("click", closeDrill);
document.getElementById("drill").addEventListener("click", (ev) => { if (ev.target.id === "drill") closeDrill(); });
document.addEventListener("keydown", (ev) => {
  if (ev.key !== "Escape") return;
  // a pinned or focus-shown tooltip is the topmost thing on screen (WCAG 1.4.13)
  if (rtt.style.opacity === "1") { rttPinned = null; hideRtt(); return; }
  if (document.getElementById("drill").classList.contains("on")) closeDrill();
  else if (state.panel || state.solo) { state.panel = null; state.solo = null; render(); }
});
// clicking anywhere outside the interactive surfaces closes the panel AND the
// solo emphasis — closing must never strand the page in a dimmed state
document.addEventListener("click", (ev) => {
  if (!state.panel && !state.solo) return;
  // a control whose own handler re-rendered it (drill pills, insight
  // expanders) is detached by the time this bubble arrives — closest() can't
  // see its old ancestors, so a detached target is always an INSIDE click
  if (!(ev.target instanceof Element) || !ev.target.isConnected) return;
  if (ev.target.closest(".panel, .sitem, #chartbox, #tablebox, .controls, .chead, #drill, .chip, .insight, .dcard")) return;
  state.panel = null; state.solo = null; render();
});

/* ================= chart titles / scope (unit trap fix) ================= */
// A platform-scope tag: the mark plus its spoken name, so a unit switch is
// announced by shape and words, never by gray text alone (v4 honesty gate).
function scopeTag(mark, name) {
  return `<b class="scopepill" data-tip="${esc(name)}" tabindex="0">${mark}<span class="sr">${esc(name)}</span></b> ·`;
}
function chartTitle() {
  if (state.mode === "live") return [currentView().title, "Restream, all destinations"];
  if (state.mode === "standings") {
    // The measure picker IS this view's title (owner directive 2026-08-23):
    // titles come from METRIC_TITLES, the same strings the options carry, so
    // the heading and the picker can never disagree. Each measure charts
    // alone, in its own unit — nothing is ever added across units.
    if (state.metric === "watched") return [METRIC_TITLES.watched, `${scopeTag(PLOGO.yt, "YouTube only")} % of the video viewed on average`];
    if (state.metric === "live") return [METRIC_TITLES.live, "Concurrent viewers, averaged across each live session"];
    if (state.metric === "reach") return [METRIC_TITLES.reach, `${scopeTag(PLOGO.x, "X only")} exposure — never added into views`];
    // no unit blurb here: the legend names all four destinations and the
    // tooltip states each one's unit. The coverage warning is not decoration,
    // so it stays whenever a play count is genuinely incomplete.
    const anyPartial = EPS.some(e => (e.latest.totalViewsInfo || {}).partial);
    return [METRIC_TITLES.views, anyPartial ? `some ${PLOGO.x} plays missing` : ""];
  }
  if (state.mode === "watch") {
    // absence is silent (v5 rule): episodes without curves simply aren't drawn
    return [currentView().title, `${scopeTag(PLOGO.yt, "YouTube only")} share still watching through the video`];
  }
  if (state.mode === "race") {
    const hasAnnounce = EPS.some(e => (e.announces || []).length);
    return [currentView().title, `${scopeTag(PLOGO.yt, "YouTube only")} ${state.byDate ? "by date" : "since release"}${hasAnnounce && !state.byDate ? " · \u25b2 X announce posts" : ""}`];
  }
  return ["Weekly YouTube views", "Episodes side by side"];
}

/* ================= charts ================= */
function seriesFor(e) {
  const prem = premiereMs(e.premiere);
  const pts = [];
  if (state.mode === "race") {
    for (const s of e.snapshots) {
      const t = Date.parse(s.ts);
      pts.push(state.byDate
        ? { x: t, y: sum(s.byDest), meta: { ts: s.ts, split: splitOf(s.byDest) } }
        : { x: Math.round(((t - prem) / DAY) * 10) / 10, y: sum(s.byDest), meta: { ts: s.ts, day: (t - prem) / DAY, split: splitOf(s.byDest) } });
    }
  } else {
    for (let i = 0; i < e.weekly.length; i++) {
      const cur = e.weekly[i].byDest;
      const prev = i === 0 ? null : e.weekly[i-1].byDest;
      const first = i === 0;
      const split = first ? splitOf(cur) : splitDelta(cur, prev);
      pts.push({
        x: state.byDate ? Date.parse(e.weekly[i].boundary) : e.weekly[i].week,
        y: YT_KEYS.reduce((a,k) => a + (split[k] || 0), 0),
        meta: { ts: e.weekly[i].boundary, week: e.weekly[i].week, split,
          note: first ? (e.partialHistory ? "views at registration (late-registered)" : "first tracked week") : null }
      });
    }
  }
  return pts;
}

const endLabels = {
  id: "endLabels",
  afterDatasetsDraw(chart) {
    if (chart.config.type !== "line") return;
    const { ctx, chartArea } = chart;
    const placed = [];
    const items = [];
    chart.data.datasets.forEach((ds, i) => {
      const meta = chart.getDatasetMeta(i);
      if (meta.hidden || ds.hidden || !meta.data.length || ds.spark || ds.isAnnounce || ds.noEndLabel) return;
      const pt = meta.data[meta.data.length - 1];
      items.push({ x: pt.x, y: pt.y, text: ds.isTypical ? "typical" : "E" + ds.epNum, color: ds.labelColor || ds.borderColor });
    });
    items.sort((a, b) => a.y - b.y);
    ctx.save();
    ctx.font = `700 14px ${FONT}`;
    for (const it of items) {
      let y = it.y;
      for (const p of placed) if (Math.abs(y - p) < 15) y = p + 15;
      placed.push(y);
      const lx = Math.min(it.x + 8, chartArea.right + 4);
      if (Math.abs(y - it.y) > 6) {
        // leader line: keep a displaced label attached to its series
        ctx.strokeStyle = it.color; ctx.lineWidth = 1; ctx.globalAlpha = 0.6;
        ctx.beginPath(); ctx.moveTo(it.x + 2, it.y); ctx.lineTo(lx - 2, y - 4); ctx.stroke();
        ctx.globalAlpha = 1;
      }
      ctx.fillStyle = it.color;
      ctx.fillText(it.text, lx, y + 4);
    }
    ctx.restore();
  }
};

const barTotals = {
  id: "barTotals",
  afterDatasetsDraw(chart) {
    if (chart.config.options.indexAxis !== "y") return;
    const { ctx } = chart;
    const eps = chart.config._ordered || [];
    ctx.save();
    ctx.font = `700 13px ${FONT}`;
    ctx.textBaseline = "middle";
    // The label always sits just past the END of what is actually drawn. With
    // a destination hidden from the legend the last dataset's bar collapses to
    // the axis, so anchoring to it would drop the label onto the left edge —
    // read the rightmost VISIBLE segment instead, and sum only those segments
    // so the number never describes bars that aren't on screen.
    const visible = chart.data.datasets
      .map((_, di) => chart.getDatasetMeta(di))
      .filter((meta) => !meta.hidden && chart.isDatasetVisible(meta.index));
    eps.forEach((e, i) => {
      const bars = visible.map((meta) => meta.data[i]).filter(Boolean);
      if (!bars.length) return;
      const endX = Math.max(...bars.map((b) => b.x));
      const y = bars[0].y;
      ctx.fillStyle = state.solo && state.solo !== e.slug ? DIMLINE : "#e8ecf4";
      if (chart.config._valueText) {
        // alternate metric: the bar's own value, nothing when absent
        const text = chart.config._valueText(e);
        if (text != null) ctx.fillText(text, endX + 8, y);
        return;
      }
      const showing = visible.map((meta) => chart.data.datasets[meta.index].data[i] ?? 0);
      const drawn = showing.reduce((a, v) => a + v, 0);
      const whole = visible.length === chart.data.datasets.length;
      const total = whole ? (e.latest.totalViews ?? e.latest.ytTotal) : drawn;
      // the ◐ coverage mark is about X plays — it only means anything while
      // every destination is on screen
      const mark = whole && (e.latest.totalViewsInfo || {}).partial ? " ◐" : "";
      ctx.fillText(total == null ? "not available" : nfmt(total) + mark, endX + 8, y);
    });
    ctx.restore();
  }
};

function externalTooltip(context) {
  const { chart, tooltip } = context;
  const el = document.getElementById("tt");
  if (!tooltip.opacity || !tooltip.dataPoints?.length) { el.style.opacity = 0; return; }
  const isLive = state.mode === "live";

  const isDelta = !isLive && state.mode === "delta";
  let html = "";

  if (isStandings) {
    // index mode: one hover reads the whole stack — every channel + total
    const idx = tooltip.dataPoints[0].dataIndex;
    const ep = (chart.config._ordered || [])[idx];
    if (!ep) { el.style.opacity = 0; return; }
    if (state.metric !== "views") {
      // alternate measures: the number, then the small honest context —
      // per-channel split for watching, lowest/highest for live, per-account
      // split for reach; a missing value never becomes zero
      html = `<div class="h"><span class="sq dot" style="background:${color(ep)}"></span>${esc(label(ep))}</div>`;

        }
      } else if (state.metric === "live" && ep.live) {
        html += `<div class="big">${nfmt(ep.live.avg)} <small style="font-weight:500;color:var(--t3)">average live viewers</small></div>`;
        const concurrents = (ep.live.series || []).map(pt => pt.v).filter(Number.isFinite);
        if (concurrents.length) {
