<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dive Radio — Episode Analytics</title>
<style>
  :root {
    --bg: #0b0e13; --panel: #141922; --panel2: #1a2130; --border: #273043;
    --text: #eef1f6; --muted: #94a0b4; --accent: #59b0ff; --good: #3ecf8e; --bad: #ff7a59;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
  .stamp { color: var(--muted); font-size: 12px; margin: 2px 0 14px; }

  /* top-level view tabs — they control everything below, so they sit above everything below */
  .tabs { display: flex; gap: 2px; margin: 0 0 16px; border-bottom: 1px solid var(--border); }
  .tabs button { background: none; border: 0; color: var(--muted); font: inherit; font-size: 14.5px;
    padding: 10px 18px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs button.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 650; }
  .tabs button:hover { color: var(--text); }

  .verdict { background: linear-gradient(90deg, #16233a, #141922); border: 1px solid #2c4266;
    border-radius: 12px; padding: 13px 18px; margin-bottom: 14px; font-size: 15.5px; line-height: 1.45; }
  .verdict b { color: var(--accent); }

  .board { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 10px; margin-bottom: 16px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; cursor: pointer; transition: border-color .15s; position: relative; }
  .card:hover { border-color: var(--accent); }
  .card.dim { opacity: .38; }
  .card.solo { border-color: var(--accent); background: var(--panel2); }
  .card .ep { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 12px;
    color: var(--muted); letter-spacing: .04em; }
  .card .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .card .ttl { font-size: 12.5px; color: var(--text); margin: 3px 0 8px; min-height: 34px;
    line-height: 1.3; overflow: hidden; }
  .card .views { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
  .card .views small { font-size: 12px; font-weight: 500; color: var(--muted); }
  .card .views.hero { font-size: 26px; }
  .card .views .mk { font-size: 10px; font-weight: 600; color: #d9a24a; margin-left: 5px; vertical-align: 2px; }
  .card .reach { font-size: 11px; color: var(--muted); margin-top: 1px; }
  #cardtip { position: fixed; pointer-events: none; z-index: 40; }
  .card .sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .card .sub.up { color: var(--good); }
  .card .sub.down { color: var(--bad); }
  .card .flag { position: absolute; top: 10px; right: 12px; font-size: 10px; color: #d9a24a;
    border: 1px solid #6b5320; border-radius: 4px; padding: 0 5px; }

  .controls { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-bottom: 12px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 9px; overflow: hidden;
    background: var(--panel); }
  .seg button { background: transparent; border: 0; color: var(--muted); padding: 7px 14px;
    cursor: pointer; font: inherit; font-size: 13px; }
  .seg button.on { background: var(--accent); color: #0b1220; font-weight: 650; }
  .chips { display: inline-flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--border); background: var(--panel); color: var(--muted);
    border-radius: 9px; padding: 6px 11px; cursor: pointer; font: inherit; font-size: 12.5px;
    display: inline-flex; align-items: center; gap: 7px; }
  .chip.on { color: var(--text); border-color: #3d4c68; background: var(--panel2); }
  .chip .sq { display: inline-block; width: 9px; height: 9px; border-radius: 2.5px; background: #3a4458; }
  .reset { margin-left: auto; color: var(--muted); font-size: 12.5px; background: none; border: 0;
    cursor: pointer; text-decoration: underline; }

  #chartbox { background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 18px 14px 10px; height: 480px; position: relative; }
  .hint { color: var(--muted); font-size: 12px; margin: 8px 2px 22px; }

  /* HTML tooltip with color-coded channel list */
  .tt { position: absolute; pointer-events: none; background: #171d29; border: 1px solid #3d4c68;
    border-radius: 10px; padding: 10px 12px; font-size: 12.5px; min-width: 216px; opacity: 0;
    transition: opacity .08s; z-index: 5; box-shadow: 0 10px 28px rgba(0,0,0,.45); }
  .tt .h { display: flex; align-items: center; gap: 7px; font-weight: 700; }
  .tt .h .dot { width: 9px; height: 9px; border-radius: 3px; flex: none; }
  .tt .meta { color: var(--muted); font-size: 11.5px; margin: 1px 0 7px; }
  .tt .big { font-size: 16px; font-weight: 700; }
  .tt .chg { font-size: 11.5px; color: var(--muted); margin-bottom: 2px; }
  .tt .div { border-top: 1px solid #273043; margin: 7px 0 5px; }
  .tt .row { display: flex; align-items: center; gap: 7px; padding: 2.5px 0; font-size: 12px;
    color: #c6cede; }
  .tt .row .sq { width: 8px; height: 8px; border-radius: 2px; flex: none; }
  .tt .row .val { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--text); }
  .tt .note { color: #d9a24a; font-size: 11px; margin-top: 5px; }

  h2 { font-size: 15px; margin: 22px 0 8px; }
  .insights { display: grid; gap: 8px; }
  .insight { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 11px 14px; cursor: pointer; transition: border-color .15s; font-size: 13.5px;
    display: flex; align-items: flex-start; gap: 12px; }
  .insight:hover { border-color: var(--accent); }
  .insight .ic { width: 32px; height: 32px; border-radius: 9px; flex: none;
    display: flex; align-items: center; justify-content: center; margin-top: 2px; }
  .insight .ic svg { width: 17px; height: 17px; }
  .insight .cat { font-size: 10px; font-weight: 700; letter-spacing: .08em;
    text-transform: uppercase; margin-bottom: 2px; }
  .insight .body { flex: 1; }
  .insight .go { color: var(--accent); font-size: 12px; margin-left: 6px; white-space: nowrap; }
  footer { color: var(--muted); font-size: 12px; margin-top: 26px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Dive Radio — Episode Analytics</h1>
  <div class="stamp" id="stamp"></div>

  <div class="tabs" id="view">
    <button data-v="growth">Audience growth</button>
    <button data-v="live">Live session</button>
  </div>

  <div class="verdict" id="verdict"></div>

  <div class="board" id="board"></div>

  <div class="controls">
    <span class="seg growth-only" id="cmode">
      <button data-v="standings">Standings</button>
      <button data-v="trajectory">Trajectory</button>
    </span>
    <span class="seg traj-only" id="xmode">
      <button data-v="weeks">Since premiere</button>
      <button data-v="calendar">Calendar</button>
    </span>
    <span class="seg traj-only" id="ymode">
      <button data-v="cumulative">Cumulative</button>
      <button data-v="delta">Per week</button>
    </span>
    <button class="reset" id="reset">reset view</button>
  </div>

  <div id="chartbox"><canvas id="chart"></canvas><div class="tt" id="tt"></div></div>
  <div class="hint" id="hint"></div>

  <h2>What the data says</h2>
  <div class="insights" id="insights"></div>

  <footer>Refreshes daily · new episodes registered automatically.</footer>
</div>

<script src="chart.umd.js"></script>
<script src="data.js"></script>
<script>
const DATA = window.DIVE_DATA;
const EPS = DATA.episodes;
const DAY = 86400000, WEEK = 7 * DAY, PHX = 7 * 3600000;
const PALETTE = ["#6b7a94", "#8a6bd6", "#3ecf8e", "#e6c74a", "#ff7a59", "#59b0ff", "#ff5d8f", "#5eead4"];
const color = (e) => PALETTE[(e.ep - 1) % PALETTE.length];
const NEWEST = EPS[EPS.length - 1];

// fixed platform colors — used in the filter chips AND the tooltip channel list
const PLAT_COLORS = {
  "yt:joindiveclub": "#ff4f5e",
  "yt:designertom": "#ffa14f",
  "x:ridd_design": "#d7dbe0",
  "x:designertom": "#59b0ff",
};
const PLAT_NAME = {
  "yt:joindiveclub": "YouTube · Dive Club",
  "yt:designertom": "YouTube · DesignerTom",
  "x:ridd_design": "X · @ridd_design (reach)",
  "x:designertom": "X · @designertom (reach)",
};
const YT_KEYS = ["yt:joindiveclub", "yt:designertom"];
const X_KEYS = ["x:ridd_design", "x:designertom"];

const HINTS = {
  standings: "Every segment is a watch count · hover for exact numbers · ◐ = partial plays coverage.",
  trajectory: "YouTube views over time (X plays history accumulates from Aug 21) · click a card to focus.",
  live: "Concurrent viewers per minute, from Restream · click a card to focus · hover for chat.",
};

const state = {
  view: "growth",
  chart: "standings", // standings (stacked watch bars) | trajectory (lines)
  xMode: "weeks",
  yMode: "cumulative",
  solo: null,
  showAllCards: false,
};
const CARD_CAP = 6; // newest-first; older episodes collapse behind an expander

function premiereMs(dateStr) {
  const [y,m,d] = dateStr.split("-").map(Number);
  return Date.UTC(y, m-1, d, 12) + PHX;
}
// Trajectory sums YouTube views only — the only complete watch time series.
// X broadcast plays have no history before 2026-08-21; blending them into
// old dates would draw a fake cliff. They join as their series accumulates.
function sum(byDest) {
  let t = 0;
  for (const k of YT_KEYS) t += (byDest[k]?.views || 0);
  return t;
}
function splitOf(byDest) {
  const o = {};
  for (const k of Object.keys(byDest)) o[k] = byDest[k]?.views || 0;
  return o;
}
function splitDelta(cur, prev) {
  const o = {};
  for (const k of Object.keys(cur)) o[k] = (cur[k]?.views || 0) - (prev?.[k]?.views || 0);
  return o;
}
function fmtDate(ms) {
  return new Date(ms - PHX).toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" });
}
function kfmt(n) {
  if (Math.abs(n) >= 1000) return (n/1000).toFixed(Math.abs(n) >= 10000 ? 0 : 1).replace(/\.0$/,"") + "k";
  return String(Math.round(n));
}
function nfmt(n) { return n.toLocaleString("en-US"); }
function short(t) { return t.replace(/^Dive Radio:\s*/i, "").replace(/\s*\+?\s*Live Call-?Ins?$/i, "").replace(/[,\s]+$/, ""); }
// compact channel names for tooltips/hover panels; colors carry the platform
const TT_NAME = {
  "yt:joindiveclub": "Dive Club",
  "yt:designertom": "DesignerTom",
  "x:ridd_design": "@ridd_design",
  "x:designertom": "@designertom",
};
function label(e) { return `E${e.ep} · ${short(e.title)}`; }

function seriesFor(e) {
  const prem = premiereMs(e.premiere);
  const pts = [];
  if (state.yMode === "cumulative") {
    if (state.xMode === "calendar") {
      for (const s of e.snapshots) pts.push({ x: Date.parse(s.ts), y: sum(s.byDest), meta: { ts: s.ts, split: splitOf(s.byDest) } });
    } else {
      for (const s of e.snapshots) {
        const d = (Date.parse(s.ts) - prem) / DAY;
        pts.push({ x: Math.round(d * 10) / 10, y: sum(s.byDest), meta: { ts: s.ts, day: d, split: splitOf(s.byDest) } });
      }
    }
  } else {
    for (let i = 0; i < e.weekly.length; i++) {
      const cur = e.weekly[i].byDest;
      const prev = i === 0 ? null : e.weekly[i-1].byDest;
      const first = i === 0;
      const split = first ? splitOf(cur) : splitDelta(cur, prev);
      pts.push({
        x: state.xMode === "calendar" ? Date.parse(e.weekly[i].boundary) : e.weekly[i].week,
        y: YT_KEYS.reduce((a,k) => a + (split[k] || 0), 0),
        meta: { ts: e.weekly[i].boundary, week: e.weekly[i].week, split,
          note: first ? (e.partialHistory ? "views at registration (late-registered)" : "first tracked week") : null }
      });
    }
  }
  return pts;
}

const endLabels = {
  id: "endLabels",
  afterDatasetsDraw(chart) {
    if (chart.config.type !== "line") return;
    const { ctx, chartArea } = chart;
    const placed = [];
    const items = [];
    chart.data.datasets.forEach((ds, i) => {
      const meta = chart.getDatasetMeta(i);
      if (meta.hidden || !meta.data.length) return;
      const pt = meta.data[meta.data.length - 1];
      items.push({ x: pt.x, y: pt.y, text: "E" + ds.epNum, color: ds.borderColor });
    });
    items.sort((a, b) => a.y - b.y);
    ctx.save();
    ctx.font = "700 12px -apple-system, 'Segoe UI', sans-serif";
    for (const it of items) {
      let y = it.y;
      for (const p of placed) if (Math.abs(y - p) < 15) y = p + 15;
      placed.push(y);
      ctx.fillStyle = it.color;
      ctx.fillText(it.text, Math.min(it.x + 8, chartArea.right + 4), y + 4);
    }
    ctx.restore();
  }
};

// --- HTML tooltip: color-coded channel breakdown ---
function externalTooltip(context) {
  const { chart, tooltip } = context;
  const el = document.getElementById("tt");
  if (!tooltip.opacity || !tooltip.dataPoints?.length) { el.style.opacity = 0; return; }
  const item = tooltip.dataPoints[0];
  const ds = item.dataset, e = ds.episode, p = item.raw;
  const isLive = state.view === "live";
  const isStandings = !isLive && state.chart === "standings";
  const isDelta = !isLive && !isStandings && state.yMode === "delta";

  if (isStandings) {
    const ep = (chart.config._ordered || [])[item.dataIndex];
    if (!ep) { el.style.opacity = 0; return; }
    let html = `<div class="h"><span class="dot" style="background:${color(ep)}"></span>${label(ep)}</div>`;
    html += `<div class="big">${nfmt(item.raw)} <small style="font-weight:500;color:#94a0b4">${ds.label}</small></div>`;
    html += `<div class="chg">of ${nfmt(ep.latest.totalViews ?? 0)} total views</div>`;
    el.innerHTML = html;
    el.style.opacity = 1;
    const box = chart.canvas.parentNode;
    el.style.left = Math.min(Math.max(tooltip.caretX, 120), box.clientWidth - 130) + "px";
    el.style.top = (tooltip.caretY - 12) + "px";
    el.style.transform = "translate(-50%, -100%)";
    return;
  }

  let html = `<div class="h"><span class="dot" style="background:${ds.borderColor}"></span>${label(e)}</div>`;

  if (isLive) {
    html += `<div class="meta">Minute ${p.x}</div>`;
    html += `<div class="big">${p.y} watching</div>`;
    html += `<div class="chg">Chat: ${nfmt(p.meta.ct ?? 0)} messages so far${p.meta.c ? ` (+${p.meta.c} this minute)` : ""}</div>`;
    const LIVE_CHAN_COLORS = { "YT Dive Club": "#ff4f5e", "YT DesignerTom": "#ffa14f", "X": "#d7dbe0", "X #2": "#59b0ff" };
    const chans = Object.entries(p.meta.byChan || {});
    if (chans.length) {
      html += `<div class="div"></div>`;
      for (const [l, v] of chans) {
        html += `<div class="row"><span class="sq" style="background:${LIVE_CHAN_COLORS[l] || "#94a0b4"}"></span>${l}<span class="val">${v}</span></div>`;
      }
      html += `<div class="note" style="color:#94a0b4">Restream total across all simulcast destinations</div>`;
    }
  } else {
    if (p.meta.week !== undefined) {
      html += `<div class="meta">Week ${p.meta.week + 1} · ${fmtDate(Date.parse(p.meta.ts))}</div>`;
    } else {
      const days = Math.round(p.meta.day ?? 0);
      html += `<div class="meta">Day ${days} · ${fmtDate(Date.parse(p.meta.ts))}</div>`;
    }
    html += `<div class="big">${nfmt(p.y)} views${isDelta ? " gained" : ""}</div>`;
    if (!isDelta && item.dataIndex > 0) {
      const prev = ds.data[item.dataIndex - 1].y;
      const d = p.y - prev;
      if (d !== 0) html += `<div class="chg">${d >= 0 ? "+" : ""}${nfmt(d)}${prev > 0 ? ` (${d >= 0 ? "+" : ""}${Math.round(d/prev*1000)/10}%)` : ""}</div>`;
    }
    if (p.meta.split) {
      html += `<div class="div"></div>`;
      for (const k of YT_KEYS) {
        const v = p.meta.split[k] ?? 0;
        html += `<div class="row"><span class="sq" style="background:${PLAT_COLORS[k]}"></span>${TT_NAME[k]}<span class="val">${isDelta && p.meta.note === null ? (v >= 0 ? "+" : "") : ""}${nfmt(v)}</span></div>`;
      }
    }
    if (p.meta.note) html += `<div class="note">${p.meta.note}</div>`;
  }

  el.innerHTML = html;
  el.style.opacity = 1;
  const box = chart.canvas.parentNode;
  const x = Math.min(Math.max(tooltip.caretX, 120), box.clientWidth - 130);
  const above = tooltip.caretY > 190;
  el.style.left = x + "px";
  el.style.top = (tooltip.caretY + (above ? -14 : 14)) + "px";
  el.style.transform = `translate(-50%, ${above ? "-100%" : "0"})`;
}

// Standings: total at the end of each stacked bar (+ coverage marker)
const barTotals = {
  id: "barTotals",
  afterDatasetsDraw(chart) {
    if (chart.config.options.indexAxis !== "y") return;
    const { ctx } = chart;
    const eps = chart.config._ordered || [];
    ctx.save();
    ctx.font = "700 12px -apple-system, 'Segoe UI', sans-serif";
    ctx.textBaseline = "middle";
    const lastMeta = chart.getDatasetMeta(chart.data.datasets.length - 1);
    eps.forEach((e, i) => {
      const bar = lastMeta.data[i];
      if (!bar) return;
      const tvi = e.latest.totalViewsInfo || {};
      const mark = tvi.partial ? " ◐" : "";
      ctx.fillStyle = state.solo && state.solo !== e.slug ? "#3a4458" : "#e8ecf4";
      ctx.fillText(nfmt(e.latest.totalViews ?? 0) + mark, bar.x + 8, bar.y);
    });
    ctx.restore();
  }
};

let chart;
function renderStandings() {
  const ordered = [...EPS].reverse(); // newest first, matches the cards
  const SEGS = [
    ["yt:joindiveclub", (e) => e.latest.byDest["yt:joindiveclub"]?.views || 0],
    ["yt:designertom", (e) => e.latest.byDest["yt:designertom"]?.views || 0],
    ["x:ridd_design", (e) => e.latest.byDest["x:ridd_design"]?.plays || 0],
    ["x:designertom", (e) => e.latest.byDest["x:designertom"]?.plays || 0],
  ];
  const dim = (hex, e) => state.solo && state.solo !== e.slug ? hex + "33" : hex;
  const cfg = {
    type: "bar",
    data: {
      labels: ordered.map(e => "E" + e.ep),
      datasets: SEGS.map(([key, val]) => ({
        label: TT_NAME[key],
        key,
        data: ordered.map(val),
        backgroundColor: ordered.map(e => dim(PLAT_COLORS[key], e)),
        borderRadius: 2,
        barPercentage: 0.72,
      })),
    },
    options: {
      indexAxis: "y",
      responsive: true, maintainAspectRatio: false,
      layout: { padding: { right: 64 } },
      interaction: { mode: "nearest", intersect: true },
      scales: {
        x: { stacked: true, beginAtZero: true, ticks: { color: "#94a0b4", callback: v => kfmt(v) }, grid: { color: "#1d2433" } },
        y: { stacked: true, ticks: { color: "#c6cede", font: { weight: 700 } }, grid: { display: false } },
      },
      plugins: {
        legend: { display: true, position: "bottom", labels: { color: "#94a0b4", boxWidth: 10, boxHeight: 10, padding: 14 } },
        tooltip: { enabled: false, external: externalTooltip },
      },
      onClick: (_, els) => {
        if (!els.length) return;
        const e = ordered[els[0].index];
        state.solo = state.solo === e.slug ? null : e.slug;
        render();
      },
    },
    plugins: [barTotals],
  };
  cfg._ordered = ordered;
  return cfg;
}

function render() {
  const isLive = state.view === "live";
  if (!isLive && state.chart === "standings") {
    const cfg = renderStandings();
    if (chart) chart.destroy();
    chart = new Chart(document.getElementById("chart"), cfg);
    chart.config._ordered = cfg._ordered;
    document.getElementById("tt").style.opacity = 0;
    buildBoard();
    syncUI();
    return;
  }
  const isDelta = !isLive && state.yMode === "delta";
  const isCal = !isLive && state.xMode === "calendar";
  const isRace = !isLive && !isDelta && !isCal;

  const source = isLive ? EPS.filter(e => e.live) : EPS;
  const datasets = source.map((e) => {
    const isNewest = e.slug === NEWEST.slug;
    const soloed = state.solo === e.slug;
    const hidden = state.solo !== null && !soloed;
    return {
      label: label(e),
      epNum: e.ep,
      slug: e.slug,
      data: isLive ? e.live.series.map(p => ({ x: p.m, y: p.v, meta: p })) : seriesFor(e),
      borderColor: color(e),
      backgroundColor: color(e) + (isDelta ? "dd" : "22"),
      borderWidth: soloed ? 3.5 : (isNewest ? 3.5 : 2),
      pointRadius: isLive || isRace || isCal ? 0 : 3,
      pointHoverRadius: 5,
      tension: 0.3, spanGaps: false, hidden,
      episode: e,
    };
  });

  const cfg = {
    type: isDelta ? "bar" : "line",
    data: { datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      layout: { padding: { right: isDelta ? 8 : 34 } },
      interaction: { mode: "nearest", intersect: false },
      scales: {
        x: {
          type: "linear",
          title: { display: true, color: "#94a0b4",
            text: isLive ? "Minutes into the show" : (isCal ? "" : (isRace ? "Time since premiere" : "")) },
          ticks: {
            color: "#94a0b4",
            stepSize: isRace ? 7 : undefined,
            callback: v => {
              if (isLive) return v;
              if (isCal) return fmtDate(v);
              if (isRace) return v === 0 ? "premiere" : (v % 7 === 0 && v > 0 ? `${v/7} wk${v/7 > 1 ? "s" : ""}` : "");
              return Number.isInteger(v) ? "week " + (v + 1) : "";
            },
            maxTicksLimit: isCal ? 9 : 24,
          },
          grid: { color: "#1d2433" },
          offset: isDelta,
        },
        y: {
          beginAtZero: true,
          title: { display: isLive, text: isLive ? "Concurrent viewers" : "", color: "#94a0b4" },
          ticks: { color: "#94a0b4", callback: v => kfmt(v) },
          grid: { color: "#1d2433" },
        },
      },
      plugins: {
        legend: { display: false },
        tooltip: { enabled: false, external: externalTooltip },
      },
    },
    plugins: [endLabels],
  };

  if (chart) chart.destroy();
  chart = new Chart(document.getElementById("chart"), cfg);
  document.getElementById("tt").style.opacity = 0;
  buildBoard();
  syncUI();
}

function sameAgeSub(e) {
  // YT views only — same unit discipline as the build-side metrics
  const ytSum = (byDest) => YT_KEYS.reduce((a,k) => a + (byDest[k]?.views || 0), 0);
  const age = Date.parse(e.latest.ts) - premiereMs(e.premiere);
  const peers = [];
  for (const o of EPS) {
    if (o.slug === e.slug) continue;
    const prem = premiereMs(o.premiere);
    if (Date.parse(o.snapshots[0].ts) - prem > age) continue;
    if (Date.parse(o.snapshots[o.snapshots.length-1].ts) - prem < age) continue;
    let best = null;
    for (const s of o.snapshots) {
      const t = Date.parse(s.ts);
      if (t - prem <= age && (!best || t > best.t)) best = { t, v: ytSum(s.byDest) };
    }
    if (best) peers.push(best.v);
  }
  if (!peers.length) return null;
  peers.sort((a,b)=>a-b);
  const med = peers[Math.floor(peers.length/2)];
  if (med <= 0) return null;
  const pct = Math.round((((e.latest.ytTotal ?? 0) - med) / med) * 100);
  return { pct, n: peers.length };
}

// Card hover panel (progressive disclosure): full per-channel breakdown —
// exact totals per channel, plays coverage, reach kept visibly separate.
const cardTip = document.createElement("div");
cardTip.className = "tt";
cardTip.id = "cardtip";
document.body.appendChild(cardTip);
function hideCardTip() { cardTip.style.opacity = 0; }
function showCardTip(card, e) {
  const bd = e.latest.byDest || {};
  const tvi = e.latest.totalViewsInfo || {};
  let html = `<div class="h"><span class="dot" style="background:${color(e)}"></span>E${e.ep} · ${short(e.title)}</div>`;
  html += `<div class="big">${nfmt(e.latest.totalViews ?? e.latest.ytTotal ?? 0)} views</div>`;
  html += `<div class="div"></div>`;
  const rows = [
    ["yt:joindiveclub", bd["yt:joindiveclub"]?.views],
    ["yt:designertom", bd["yt:designertom"]?.views],
    ["x:ridd_design", bd["x:ridd_design"]?.plays],
    ["x:designertom", bd["x:designertom"]?.plays],
  ];
  for (const [k, v] of rows) {
    html += `<div class="row"><span class="sq" style="background:${PLAT_COLORS[k]}"></span>${TT_NAME[k]}<span class="val">${v == null ? "–" : nfmt(v)}</span></div>`;
  }
  if (tvi.partial) html += `<div class="note">◐ plays from ${tvi.have} of ${tvi.total} broadcasts</div>`;
  else if (tvi.stale && tvi.asOf) html += `<div class="note">plays as of ${tvi.asOf.slice(5, 10).replace("-", "/")}</div>`;
  else if (!tvi.includesPlays) html += `<div class="note">YT only — X plays unavailable</div>`;
  html += `<div class="div"></div>`;
  html += `<div class="row">X reach<span class="val">${nfmt(e.latest.xImpressions ?? 0)}</span></div>`;
  html += `<div class="chg">ridd ${nfmt(bd["x:ridd_design"]?.views ?? 0)} · tom ${nfmt(bd["x:designertom"]?.views ?? 0)} · not in total</div>`;
  cardTip.innerHTML = html;
  const r = card.getBoundingClientRect();
  cardTip.style.left = Math.min(r.left, window.innerWidth - 250) + "px";
  cardTip.style.top = Math.min(r.bottom + 8, window.innerHeight - 240) + "px";
  cardTip.style.opacity = 1;
}

function buildBoard() {
  const isLive = state.view === "live";
  const board = document.getElementById("board");
  board.innerHTML = "";
  // oldest → newest left → right: the latest episode is always the
  // far-right card. When collapsed, the OLDEST episodes hide behind the
  // left-edge expander.
  const ordered = [...EPS];
  const visible = state.showAllCards ? ordered : ordered.slice(-CARD_CAP);
  const hiddenCount = ordered.length - visible.length;
  if (hiddenCount > 0 || (state.showAllCards && ordered.length > CARD_CAP)) {
    const more = document.createElement("div");
    more.className = "card more";
    more.style.display = "flex";
    more.style.alignItems = "center";
    more.style.justifyContent = "center";
    more.innerHTML = state.showAllCards
      ? `<div class="sub">Show latest ${CARD_CAP} only</div>`
      : `<div class="sub">← ${hiddenCount} older episode${hiddenCount === 1 ? "" : "s"}</div>`;
    more.addEventListener("click", () => {
      state.showAllCards = !state.showAllCards;
      buildBoard();
      syncUI();
    });
    board.appendChild(more);
  }
  for (const e of visible) {
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.slug = e.slug;
    let big = "", sub = "", subCls = "";
    if (isLive) {
      if (e.live) {
        big = `${e.live.peak} <small>peak live</small>`;
        sub = `avg ${e.live.avg} · ${nfmt(e.live.chatMessages)} chat msgs · ${e.live.durationMin ?? "?"} min`;
      } else {
        big = `<small>no live data</small>`;
        sub = `premiered ${e.premiere.slice(5).replace("-", "/")}`;
      }
    } else {
      // One hero per card (CARD-RULING-2026-08-21): Total views = YT views +
      // X broadcast plays (both video playback). X reach (impressions) is a
      // different unit: visible but secondary, never part of the total.
      const tvi = e.latest.totalViewsInfo || {};
      const tv = e.latest.totalViews ?? e.latest.ytTotal ?? 0;
      let mk = "";
      if (!tvi.includesPlays) mk = "YT only";
      else if (tvi.partial) mk = `◐${tvi.have}/${tvi.total}`;
      else if (tvi.stale && tvi.asOf) mk = `→${tvi.asOf.slice(5, 10).replace("-", "/")}`;
      big = `<div class="views hero">${kfmt(tv)} <small>views</small>${mk ? `<span class="mk">${mk}</span>` : ""}</div>
      <div class="reach">X reach ${kfmt(e.latest.xImpressions ?? 0)}</div>`;
      const pace = sameAgeSub(e);
      if (pace) {
        sub = `${pace.pct >= 0 ? "▲" : "▼"} ${Math.abs(pace.pct)}% vs same-age median (YT)`;
        subCls = pace.pct >= 0 ? "up" : "down";
      } else {
        sub = `premiered ${e.premiere.slice(5).replace("-", "/")} · no same-age peer yet`;
      }
    }
    card.innerHTML = `
      <span class="ep"><span class="dot" style="background:${color(e)}"></span>E${e.ep}</span>
      ${e.partialHistory && !isLive ? '<span class="flag">◐ late reg</span>' : ""}
      <div class="ttl">${short(e.title)}</div>
      ${isLive ? `<div class="views">${big}</div>` : big}
      <div class="sub ${subCls}">${sub}</div>`;
    card.addEventListener("click", () => {
      state.solo = state.solo === e.slug ? null : e.slug;
      render();
    });
    if (!isLive) {
      card.addEventListener("mouseenter", () => showCardTip(card, e));
      card.addEventListener("mouseleave", hideCardTip);
    }
    board.appendChild(card);
  }
}

function syncUI() {
  const isLive = state.view === "live";
  const isTraj = !isLive && state.chart === "trajectory";
  for (const b of document.querySelectorAll("#view button")) b.classList.toggle("on", b.dataset.v === state.view);
  for (const b of document.querySelectorAll("#cmode button")) b.classList.toggle("on", b.dataset.v === state.chart);
  for (const b of document.querySelectorAll("#xmode button")) b.classList.toggle("on", b.dataset.v === state.xMode);
  for (const b of document.querySelectorAll("#ymode button")) b.classList.toggle("on", b.dataset.v === state.yMode);
  for (const el of document.querySelectorAll(".growth-only")) el.style.display = isLive ? "none" : "";
  for (const el of document.querySelectorAll(".traj-only")) el.style.display = isTraj ? "" : "none";
  document.getElementById("hint").textContent = isLive ? HINTS.live : HINTS[state.chart];
  for (const c of document.querySelectorAll(".card")) {
    c.classList.toggle("solo", state.solo === c.dataset.slug);
    c.classList.toggle("dim", state.solo !== null && state.solo !== c.dataset.slug);
  }
  // verdict adapts to the active view
  const v = document.getElementById("verdict");
  if (isLive) {
    const live = DATA.insights.find(i => i.id === "live-peak");
    v.innerHTML = live
      ? `<b>Live:</b> ${live.text.replace(/^Live turnout:\s*/, "")}`
      : `<b>Live session</b> metrics from Restream.`;
  } else {
    const pace = DATA.insights.find(i => i.id === "pace-rank");
    v.innerHTML = pace
      ? `<b>E${NEWEST.ep} — ${short(NEWEST.title)}:</b> ${pace.text.replace(/^[^:]*? is /, "")}`
      : `<b>E${NEWEST.ep} — ${short(NEWEST.title)}</b> is the latest episode.`;
  }
}

document.getElementById("view").addEventListener("click", e => {
  if (e.target.dataset.v) { state.view = e.target.dataset.v; state.solo = null; render(); }
});
document.getElementById("cmode").addEventListener("click", e => {
  if (e.target.dataset.v) { state.chart = e.target.dataset.v; render(); }
});
document.getElementById("xmode").addEventListener("click", e => {
  if (e.target.dataset.v) { state.xMode = e.target.dataset.v; render(); }
});
document.getElementById("ymode").addEventListener("click", e => {
  if (e.target.dataset.v) { state.yMode = e.target.dataset.v; render(); }
});
document.getElementById("reset").addEventListener("click", () => {
  state.view = "growth"; state.chart = "standings"; state.xMode = "weeks"; state.yMode = "cumulative"; state.solo = null;
  render();
});

// Insight categories — fixed colors (distinct roles, not platform colors),
// icon carries the category at a glance, label confirms it.
const CATS = {
  momentum:   { name: "Momentum",   color: "#e6c74a", svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 16 9 7 13 12 21 12"/></svg>` },
  platforms:  { name: "Platforms",  color: "#3ecf8e", svg: `<svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="5" width="18" height="5" rx="1.5"/><rect x="3" y="14" width="11" height="5" rx="1.5"/></svg>` },
  conversion: { name: "Conversion", color: "#8a6bd6", svg: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 4h18l-7 8v7l-4-3v-4L3 4z"/></svg>` },
  hosts:      { name: "Hosts",      color: "#ff7a59", svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="8.5" cy="12" r="4.5"/><circle cx="15.5" cy="12" r="4.5"/></svg>` },
  outlier:    { name: "Outlier",    color: "#ff5d8f", svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 21.5 20h-19L12 3.5z"/><line x1="12" y1="10" x2="12" y2="14"/><line x1="12" y1="17" x2="12" y2="17.01"/></svg>` },
  engagement: { name: "Engagement", color: "#59b0ff", svg: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 20s-7-4.6-9.3-9C1 7.5 3 4.5 6.2 4.5c2 0 3.3 1 4.3 2.4 1-1.4 2.3-2.4 4.3-2.4 3.2 0 5.2 3 3.5 6.5C19 15.4 12 20 12 20z"/></svg>` },
  live:       { name: "Live",       color: "#ff4f5e", svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none"/><path d="M7.6 7.6a6.2 6.2 0 0 0 0 8.8M16.4 7.6a6.2 6.2 0 0 1 0 8.8"/></svg>` },
  note:       { name: "Data note",  color: "#94a0b4", svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor" stroke="none"/></svg>` },
};
function catFor(id) {
  if (id === "flatline") return CATS.momentum;
  if (id === "platform-phase" || id === "watch-split") return CATS.platforms;
  if (id === "reach-conversion") return CATS.conversion;
  if (id === "host-split" || id === "host-plays-split") return CATS.hosts;
  if (id.startsWith("anomaly")) return CATS.outlier;
  if (id === "engagement") return CATS.engagement;
  if (id.startsWith("live")) return CATS.live;
  return CATS.note;
}

const panel = document.getElementById("insights");
for (const ins of DATA.insights) {
  if (ins.id === "pace-rank") continue;
  const cat = catFor(ins.id);
  const div = document.createElement("div");
  div.className = "insight";
  div.innerHTML = `<span class="ic" style="background:${cat.color}22;color:${cat.color}">${cat.svg}</span><span class="body"><div class="cat" style="color:${cat.color}">${cat.name}</div>${ins.text} <span class="go">show me →</span></span>`;
  div.addEventListener("click", () => {
    const cs = ins.chartState || {};
    state.view = cs.view || "growth";
    // trend-shaped insights open the trajectory; standings answers the rest
    state.chart = (cs.yMode === "delta" || cs.xMode === "calendar" || cs.solo) ? "trajectory" : "standings";
    state.xMode = cs.xMode || "weeks";
    state.yMode = cs.yMode || "cumulative";
    state.solo = cs.solo || null;
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
  panel.appendChild(div);
}

document.getElementById("stamp").textContent =
  `${EPS.length} episodes · data as of ${DATA.generatedAt.replace("T"," ").slice(0,16)} UTC · updates daily, full refresh Mondays`;

render();
</script>
