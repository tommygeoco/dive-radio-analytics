  @font-face { font-family: "Geist Fallback"; src: local("Arial"); ascent-override: 95.94%; descent-override: 28.16%; line-gap-override: 0%; size-adjust: 104.76%; }
  @font-face { font-family: "Geist Mono Fallback"; src: local("Arial"); ascent-override: 74.67%; descent-override: 21.92%; line-gap-override: 0%; size-adjust: 134.59%; }
  /* ===== Smart Sharps design system v2.1 (2026-10-06) =====
     Tokens: ~/.claude/skills/smart-sharps-design-system/tokens.css, inlined so
     the page fetches nothing at runtime (rule 10). Every rule below reads
     them: no raw colors, eight type steps, a 4 px grid, the radius scale. The
     linter (scripts/ds-audit.mjs) keeps it that way. */
  :root {
    color-scheme: dark;
    --font-sans: "Geist", "Geist Fallback", ui-sans-serif, system-ui, -apple-system, sans-serif;
    --font-mono: "Geist Mono", "Geist Mono Fallback", ui-monospace, "SF Mono", Menlo, monospace;
    --type-scale: 1; --body-size: 0.9375rem; --hero-size: 2.125rem;
    --text-caption: calc(0.6875rem * var(--type-scale)); --text-meta: calc(0.75rem * var(--type-scale));
    --text-body-sm: calc(0.8125rem * var(--type-scale)); --text-body: calc(var(--body-size) * var(--type-scale));
    --text-title: calc(1.0625rem * var(--type-scale)); --text-num-lg: calc(1.25rem * var(--type-scale));
    --text-display: calc(1.625rem * var(--type-scale)); --text-hero: calc(var(--hero-size) * var(--type-scale));
    --canvas: #0a0a0b; --surface-1: #111113; --surface-2: #18181b; --surface-3: #202024; --surface-4: #2a2a30;
    --popover: #141417; --line: rgb(255 255 255 / 0.075); --line-strong: rgb(255 255 255 / 0.13);
    --scrim: rgb(0 0 0 / 0.6); --scrim-sheet: rgb(0 0 0 / 0.65);
    --shadow-sheet: 0 -24px 48px -24px rgb(0 0 0 / 0.8);
    --shadow-pop: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1), 0 0 0 1px rgb(242 242 244 / 0.1);
    --shadow-dialog: 0 24px 64px -16px rgb(0 0 0 / 0.75), 0 0 0 1px var(--line-strong);
    --shadow-thumb: 0 1px 2px rgb(0 0 0 / 0.4), inset 0 0 0 1px var(--line-strong);
    --fg-1: #f2f2f4; --fg-2: #a7a7b2; --fg-3: #8a8a95; --fg-4: #5f5f69;
    --pos: #3ad48a; --pos-soft: rgb(58 212 138 / 0.12);
    --neg: #ff6b6b; --neg-soft: rgb(255 107 107 / 0.12);
    --warn: #f2b84b; --warn-soft: rgb(242 184 75 / 0.11); --warn-ring: rgb(242 184 75 / 0.18);
    --tint: #6b93ff; --tint-hover: #82a5ff; --tint-press: #5a83f0; --tint-soft: rgb(107 147 255 / 0.14); --tint-fg: #9fb8ff;
    --selected-bg: var(--fg-1); --selected-fg: var(--canvas); --selection-ring: rgb(255 255 255 / 0.45);
    --series-1: #d4609a; --series-1-dim: #a94f7d; --series-2: #b9b9c3; --series-2-dim: #74747f;
    --series-focus: var(--fg-1); --series-context: rgb(255 255 255 / 0.16); --series-typical: var(--fg-3);
    --chart-grid: rgb(255 255 255 / 0.055); --chart-axis: var(--fg-3); --chart-gap: var(--surface-1);
    --radius-sm: 4px; --radius-md: 8px; --radius-lg: 12px; --radius-xl: 16px; --radius-2xl: 20px; --radius-full: 999px;
    --d-gutter: 16px; --d-card: 16px; --d-inner: 12px; --d-section: 24px; --d-row: 12px;
    --topbar-h: 48px; --content-max: 1240px; --rail-w: 76px; --tabbar-h: 64px;
    --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
    --tab-active-bg: rgb(255 255 255 / 0.1); --tab-active-ring: rgb(255 255 255 / 0.08);
    --shadow-tabbar: inset 0 0 0 1px var(--line-strong), 0 16px 40px -12px rgb(0 0 0 / 0.9);
    --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1); --ease-out-quart: cubic-bezier(0.25, 1, 0.5, 1);
    /* one gutter for every card, column, and row (owner directive 2026-08-23) —
       the design system's stack step on the 4 px grid */
    --gap: 16px;
  }
  @media (min-width: 48rem) {
    :root { --body-size: 0.875rem; --hero-size: 2.5rem; --topbar-h: 56px; --d-gutter: 24px; }
  }
  * { box-sizing: border-box; }
  /* scroll targets (a selected episode brings the chart into view) clear the sticky top bar */
  html { background: var(--canvas); -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
    scrollbar-color: var(--surface-3) transparent; scrollbar-width: thin; scroll-padding-top: calc(var(--topbar-h) + 16px); }
  html:has(#trust:not([hidden])) { scroll-padding-top: calc(var(--topbar-h) + 56px); }
  body { margin: 0; background: var(--canvas); color: var(--fg-1); font-family: var(--font-sans);
    font-size: var(--text-body); line-height: 1.42; font-feature-settings: "cv11";
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; overflow-wrap: break-word; }
  ::selection { background: var(--tint-soft); color: var(--fg-1); }
  :focus-visible { outline: 2px solid var(--tint); outline-offset: 2px; }
  button { font-family: inherit; font-size: inherit; color: inherit; }
  h1, h2, h3 { text-wrap: balance; }
  .wrap { max-width: var(--content-max); margin: 0 auto; padding: 0 var(--d-gutter) 56px; outline: none; }

  /* ---- the system's app shell: a 76 px rail on desktop, a floating tab bar on phones ---- */
  .skip { position: fixed; top: 12px; left: 12px; z-index: 100; padding: 8px 12px; border-radius: var(--radius-lg);
    background: var(--surface-2); color: var(--fg-1); font-size: var(--text-body-sm); transform: translateY(-200%); }
  .skip:focus-visible { transform: none; }
  #pagetitle:focus, #main:focus { outline: none; }
  .rail { display: none; }
  .tabbar { position: fixed; inset: auto 0 0 0; z-index: 40; padding: 0 12px calc(var(--safe-bottom) + 8px); pointer-events: none; }
  /* scroll-edge fade under the pill (components.md §1.3): page text never reads through the tab labels */
  .tabfade { position: absolute; inset: auto 0 0 0; height: calc(var(--tabbar-h) + var(--safe-bottom) + 32px); background: var(--canvas);
    -webkit-mask-image: linear-gradient(to top, black 35%, transparent); mask-image: linear-gradient(to top, black 35%, transparent); }
  .tabpill { pointer-events: auto; position: relative; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); height: var(--tabbar-h);
    max-width: 440px; padding: 4px; border-radius: var(--radius-full); background: color-mix(in oklab, var(--surface-2) 85%, transparent);
    box-shadow: var(--shadow-tabbar); -webkit-backdrop-filter: blur(40px); backdrop-filter: blur(40px); }
  .tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: var(--radius-full);
    color: var(--fg-2); font-size: var(--text-caption); font-weight: 500; text-decoration: none;
    transition: color 150ms var(--ease-out-quart), background 150ms var(--ease-out-quart), transform 150ms var(--ease-out-quart); }
  .tab:active { transform: scale(0.95); }
  .tab svg { width: 22px; height: 22px; stroke-width: 1.75; }
  .tab[aria-current="page"] { color: var(--fg-1); background: var(--tab-active-bg); box-shadow: inset 0 0 0 1px var(--tab-active-ring); }
  .tab[aria-current="page"] svg { stroke-width: 2.25; }
  .tab:focus-visible { outline-offset: -2px; }
  @media (max-width: 47.99rem) { .wrap { padding-bottom: calc(var(--tabbar-h) + var(--safe-bottom) + 32px); } }
  @media (min-width: 48rem) {
    body { padding-left: var(--rail-w); }
    .tabbar { display: none; }
    .rail { position: fixed; inset: 0 auto 0 0; z-index: 50; width: var(--rail-w); display: flex; flex-direction: column; align-items: center;
      padding: 12px 0; background: var(--canvas); box-shadow: inset -1px 0 0 var(--line); }
    .rail-home { width: 44px; height: 44px; margin-bottom: 12px; border-radius: var(--radius-xl); display: flex; align-items: center;
      justify-content: center; color: var(--fg-1); }
    .rail-home:hover { background: var(--surface-2); }
    .rail-home svg { width: 28px; height: 28px; }
    .rail-list { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .rail-list:first-of-type { flex: 1; }
    .rail-item { position: relative; width: 60px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0;
      border-radius: var(--radius-xl); color: var(--fg-3); font-size: var(--text-caption); font-weight: 500; text-decoration: none;
      transition: color 150ms var(--ease-out-quart), background 150ms var(--ease-out-quart); }
    .rail-item:hover { background: var(--surface-1); color: var(--fg-1); }
    .rail-item[aria-current="page"] { background: var(--surface-2); color: var(--fg-1); }
    .rail-item svg { width: 18px; height: 18px; stroke-width: 1.75; }
    .rail-item[aria-current="page"] svg { stroke-width: 2.25; }
  }
  .view[hidden] { display: none; }
  .sechead.first { margin-top: 8px; }
  .pagelead { margin: 8px 0 16px; max-width: 62ch; color: var(--fg-3); font-size: var(--text-body-sm); line-height: 1.39; }
  @media (min-width: 48rem) { .pagelead { margin-top: 4px; font-size: var(--text-meta); } }
  /* Today's link to the Actions page: the system's disclosure row, navigating */
  .herolink { position: relative; display: inline-flex; align-items: center; gap: 4px; margin-top: 24px; height: 28px;
    color: var(--tint-fg); font-size: var(--text-body-sm); font-weight: 500; text-decoration: none; }
  .herolink::after { content: ""; position: absolute; inset: -8px -4px; }
  .herolink:hover { text-decoration: underline; text-underline-offset: 4px; }
  .herolink svg { width: 16px; height: 16px; }
  .donext + .alllink { margin-top: 12px; }
  .nextrow { display: flex; align-items: center; gap: 12px; min-height: 56px; margin-top: var(--gap); padding: var(--d-row) var(--d-card);
    border-radius: var(--radius-2xl); box-shadow: inset 0 0 0 1px var(--line-strong); color: inherit; text-decoration: none;
    transition: background 150ms var(--ease-out-quart); }
  .nextrow:hover { background: var(--surface-1); }
  .nextrow .sumic { width: 16px; height: 16px; color: var(--fg-3); display: flex; flex: none; }
  .nextrow .sumic svg, .nextrow > svg { width: 16px; height: 16px; flex: none; }
  .nextrow > svg { color: var(--fg-3); }
  .nextrow .sumt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .nextrow .sumt b { font-weight: 500; color: var(--fg-1); font-size: var(--text-body); line-height: 1.42; }
  .nextrow .sumt span { color: var(--fg-3); font-size: var(--text-body-sm); line-height: 1.39; }
  @media (min-width: 48rem) { .nextrow .sumt b { font-size: var(--text-body-sm); } .nextrow .sumt span { font-size: var(--text-meta); } }
  /* every number on the page: Geist Mono, tabular figures, never broken */
  /* every figure on the page: Geist Mono, tabular, never broken. monoFigures()
     wraps the figures inside mixed text; words around them stay sans */
  .n, [data-fold-number] { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; white-space: nowrap; }

  /* ---- top bar: brand, freshness, the Agents page ---- */
  header { position: sticky; top: 0; z-index: 30; height: var(--topbar-h); margin-bottom: var(--gap);
    background: color-mix(in oklab, var(--canvas) 85%, transparent); box-shadow: inset 0 -1px 0 var(--line);
    -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); }
  @supports (backdrop-filter: blur(1px)) { header { background: color-mix(in oklab, var(--canvas) 70%, transparent); } }
  .topin { max-width: var(--content-max); height: 100%; margin: 0 auto; padding: 0 var(--d-gutter);
    display: flex; align-items: center; gap: 8px; }
  .brand { display: inline-flex; align-items: center; gap: 8px; flex: none; }
  .brand svg { width: 20px; height: 20px; flex: none; color: var(--fg-1); }
  h1 { margin: 0; flex: none; font-size: var(--text-num-lg); line-height: 1.2; font-weight: 600; letter-spacing: -0.025em; white-space: nowrap; }
  @media (min-width: 48rem) { h1 { font-size: var(--text-title); line-height: 1.3; } }
  /* freshness: the system's status dot — gray when current, amber when behind; never green, never blue */
  .stamp { margin-left: auto; flex: 0 1 auto; display: inline-flex; align-items: center; gap: 8px; min-width: 0; padding: 0 4px;
    color: var(--fg-2); font-size: var(--text-meta); line-height: 1.34; white-space: nowrap; }
  .stamp .sfull { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .stamp .sshort { display: none; }
  /* the system's trust bar: phones move a not-current freshness sentence under the top bar */
  .trust { display: none; }
  #audience-preview { margin-top: var(--gap); }
  .stamp i { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--fg-3); }
  .stamp i.old { background: var(--warn); }
  /* the Agents page: the top bar's pill (outline, no fill) */
  .agentslink { position: relative; display: inline-flex; align-items: center; height: 36px; padding: 0 12px; flex: none;
    border-radius: var(--radius-full); box-shadow: inset 0 0 0 1px var(--line-strong);
    color: var(--fg-1); font-size: var(--text-body-sm); font-weight: 500; text-decoration: none; white-space: nowrap;
    transition: background 150ms var(--ease-out-quart); }
  .agentslink::after { content: ""; position: absolute; inset: -4px 0; }
  .agentslink:hover { background: var(--surface-2); }
  @media (min-width: 48rem) { .agentslink { height: 32px; font-size: var(--text-meta); } }
  /* A copy that is not the live site (a one-off build, a branch preview) whose
     data is from an earlier day says so and links to the live dashboard —
     the system's warning banner. */
  .livecopy { display: flex; align-items: center; gap: 4px 16px; flex-wrap: wrap; margin: 0 0 var(--gap);
    padding: 8px 8px 8px 16px; border-radius: var(--radius-xl); font-size: var(--text-body); color: var(--fg-1);
    background: var(--warn-soft); box-shadow: inset 0 0 0 1px var(--warn-ring); }
  @media (min-width: 48rem) { .livecopy { font-size: var(--text-body-sm); } }
  .livecopy[hidden] { display: none; }
  .livecopy .lcic { width: 16px; height: 16px; flex: none; color: var(--warn); }
  .livecopy a { margin-left: auto; display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px;
    color: var(--tint-fg); font-weight: 500; text-decoration: none; border-radius: var(--radius-md); }
  .livecopy a:hover { text-decoration: underline; text-underline-offset: 3px; }

  /* ---- section titles outside cards (title on phones, body on desktop) ---- */
  .sechead { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin: var(--d-section) 0 12px; }
  .sechead h2 { margin: 0; font-size: var(--text-title); line-height: 1.3; font-weight: 600; letter-spacing: -0.015em; }
  .sechead span { color: var(--fg-3); font-size: var(--text-body-sm); }
  @media (min-width: 48rem) { .sechead h2 { font-size: var(--text-body); } .sechead span { font-size: var(--text-meta); } }

  .plogo { width: 14px; height: 14px; vertical-align: -2px; color: var(--fg-2); }
  /* tooltip targets wear one quiet mark: a dotted underline in the decorative gray */
  .panel .irow[data-tip] .lb, .panel .trow[tabindex] .tl, .hero .splitlabels .sl[data-stat], .hc-dir .dirrow .dl[data-tip] {
    text-decoration: underline dotted var(--fg-4); text-underline-offset: 4px; }

  /* ---- cards: surface-1, a 1 px inset hairline (never a border, so nothing
     eats the gutter), radius 20, the system's card padding ---- */
  .card { background: var(--surface-1); border: 0; border-radius: var(--radius-2xl);
    box-shadow: inset 0 0 0 1px var(--line); padding: var(--d-card); min-width: 0; }
  /* a label over a block (the system's metric label): sentence case, meta, tertiary */
  .kicker { font-size: var(--text-meta); line-height: 1.34; font-weight: 400; color: var(--fg-3); margin: 0 0 8px; letter-spacing: 0; }
  .kicker .kh { color: var(--fg-3); margin-left: 4px; }
  /* a card's own title (the section header inside a panel): title on phones, body from md */
  .compound > .kicker, #audience-preview .fbhead .kicker { font-size: var(--text-title); line-height: 1.3; font-weight: 600;
    letter-spacing: -0.015em; color: var(--fg-1); }
  @media (min-width: 48rem) { .compound > .kicker, #audience-preview .fbhead .kicker { font-size: var(--text-body); } }

  /* ---- W12 / W28: show health — one strip, one disclosure (2026-09-01) ----
     Glance: the gauge with its band in words, the checks as state-dotted
     pills, the day's headline, and Expand. Click: the details region opens
     under the strip — the evidence behind the score and the do-next actions.
     The details are always in the DOM (inert while closed) so opening is a
     transition on the existing card, never a re-render. */
  .healthrow { margin-bottom: var(--gap); }
  .hstrip { display: grid; grid-template-columns: 188px minmax(392px, 1fr) minmax(360px, 1.15fr);
    gap: 0 24px; align-items: start; }
  .hz { min-width: 0; }
  .hz-score { display: flex; align-items: center; gap: 16px; cursor: pointer; }
  .hz-score .kicker { margin-bottom: 4px; }
  .hz-score .hband { color: var(--fg-1); font-size: var(--text-body); font-weight: 500; line-height: 1.3; }
  /* PRD v10: the band carries the direction word — level and movement in one
     breath; the word is the signal, color only helps */
  .hz-score .hband.hdir { font-size: var(--text-meta); font-weight: 500; color: var(--fg-2); margin-top: 4px; }
  .hz-score .hband.hdir.building { color: var(--pos); }
  .hz-score .hband.hdir.softening { color: var(--neg); }
  .gauge { width: 64px; height: 64px; position: relative; flex: none; }
  .gauge svg { width: 100%; height: 100%; display: block; transform: rotate(-90deg); }
  .gauge .track { fill: none; stroke: var(--surface-3); stroke-width: 6; }
  .gauge .fill { fill: none; stroke: var(--fg-1); stroke-width: 6; stroke-linecap: round; }
  /* the usual level (50) is a notch across the track: the fill's end against
     the notch is the whole read — "just under usual" needs no second number */
  .gauge .tick { stroke: var(--fg-3); stroke-width: 2; }
  .gauge .num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .gauge .num b { font-family: var(--font-mono); font-size: var(--text-num-lg); line-height: 1; font-weight: 600;
    letter-spacing: -0.02em; color: var(--fg-1); font-variant-numeric: tabular-nums; }
  /* the checks: pills grouped fragile-first; the dot carries the state at a
     glance (amber fragile, gray steady, green healthy, hollow with no
     reading); the word rides the accessible name and the drill tooltip */
  .hgroups { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .hgroup, .hnames { display: contents; }
  .hgword, .hnames .sep { display: none; }
  /* the system's chip: outline on the card, fills on hover */
  .hname { position: relative; display: inline-flex; align-items: center; gap: 8px; height: 36px; border: 0;
    border-radius: var(--radius-full); padding: 0 16px 0 12px; margin: 0; background: var(--surface-1);
    box-shadow: inset 0 0 0 1px var(--line-strong); color: var(--fg-1); font-size: var(--text-body-sm); font-weight: 500;
    line-height: 1; white-space: nowrap; cursor: pointer; transition: background 150ms var(--ease-out-quart); }
  .hname::after { content: ""; position: absolute; inset: -4px 0; }
  .hname:hover { background: var(--surface-2); }
  @media (min-width: 48rem) { .hname { height: 32px; padding: 0 12px 0 8px; } }
  .hname .hcd { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
  .hgroup.healthy .hname .hcd { color: var(--pos); }
  .hgroup.steady .hname .hcd { color: var(--fg-3); }
  .hgroup.fragile .hname .hcd { color: var(--warn); }
  .hgroup.waiting .hname .hcd { background: none; box-shadow: inset 0 0 0 1.5px var(--fg-3); }
  /* the read zone: label over the headline, the one disclosure at its side.
     Opening must not move what was just clicked: the button is pinned beside
     the headline's first line, and only the headline's own box grows */
  .hz-read { display: flex; align-items: start; gap: 16px; box-shadow: inset 1px 0 0 var(--line); padding-left: 24px; }
  .hz-readbody { flex: 1; min-width: 0; cursor: pointer; }
  /* the headline is the largest text in the strip after the score. It holds
     three lines while the card is closed; opening lifts the clamp and lets its
     height ease up to the full text, closing eases it back and re-clamps only
     once the motion has ended (a clamp can't animate) */
  .hz-read .headline { margin: 0; color: var(--fg-1); font-size: var(--text-title); font-weight: 500; line-height: 1.3;
    letter-spacing: -0.01em; text-wrap: pretty; overflow: hidden; max-height: calc(3 * 1.3em);
    transition: max-height 200ms var(--ease-out-quart); }
  .hz-read .headline.clamped { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; }
  /* Expand: the system's secondary button, small (44 on phones, 32 from md) */
  .hxbtn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; flex: none; height: 44px; border: 0;
    border-radius: var(--radius-lg); padding: 0 16px 0 12px; background: var(--surface-3); box-shadow: inset 0 0 0 1px var(--line-strong);
    color: var(--fg-1); font-size: var(--text-body); font-weight: 500; line-height: 1; cursor: pointer;
    transition: background 150ms var(--ease-out-quart), transform 150ms var(--ease-out-quart); }
  .hxbtn:active { transform: scale(0.98); }
  .hxbtn .hxlabel { display: inline-block; min-width: 64px; text-align: left; }
  .hxbtn:hover, .hxbtn[aria-expanded="true"] { background: var(--surface-4); }
  .hxbtn svg { width: 16px; height: 16px; flex: none; color: var(--fg-2); transition: transform 150ms var(--ease-out-quart); }
  .hxbtn[aria-expanded="true"] svg { transform: rotate(180deg); }
  .hz-read .hxbtn { margin-top: 20px; }
  @media (min-width: 48rem) { .hxbtn { height: 32px; padding: 0 12px 0 8px; font-size: var(--text-body-sm); } }
  /* the details region: a 0fr → 1fr grid row, so the card grows with what it
     reveals; the body fades and settles a beat after the row opens */
  .hdetails { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 200ms var(--ease-out-quart); }
  .hcard[data-open="true"] .hdetails { grid-template-rows: 1fr; }
  .hdinner { min-height: 0; overflow: hidden; }
  .hdbody { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr) minmax(0, 1fr); gap: 24px 32px;
    margin-top: 20px; padding-top: 20px; box-shadow: inset 0 1px 0 var(--line);
    opacity: 0; transition: opacity 200ms cubic-bezier(0.5, 0, 0.75, 0); }
  .hcard[data-open="true"] .hdbody { opacity: 1; transition: opacity 200ms var(--ease-out-quart); }
  /* the grid follows the columns actually rendered — never an empty track */
  .hdbody.cols-2 { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); }
  .hdbody.cols-3 { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); grid-template-areas: "ev dir" "meta dir"; grid-template-rows: auto 1fr; align-items: start; }
  .hdbody.cols-3 .health-evidence { grid-area: ev; }
  .hdbody.cols-3 .hc-dir { grid-area: dir; }
  .hdbody.cols-3 .hc-meta { grid-area: meta; }
  .hdbody.cols-1 { grid-template-columns: minmax(0, 1fr); }
  .hdcol { min-width: 0; }
  .hdcol .kicker { margin-bottom: 12px; }
  /* what the read is on, and the lifts shown but not scored */
  .health-evidence .readson { margin: -4px 0 12px; color: var(--fg-3); font-size: var(--text-body-sm); line-height: 1.39; }
  .health-evidence .readson b { color: var(--fg-2); font-weight: 500; }
  .health-evidence .evidence { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 32px; }
  .health-evidence h4 { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font-size: var(--text-meta); font-weight: 500; color: var(--fg-2); }
  .health-evidence h4::before { content: ""; width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .health-evidence h4.up::before { background: var(--pos); }
  .health-evidence h4.down::before { background: var(--neg); }
  .health-evidence ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
  .health-evidence li { display: flex; gap: 12px; color: var(--fg-2); font-size: var(--text-body-sm); line-height: 1.45; }
  .health-evidence li i { width: 4px; align-self: stretch; border-radius: var(--radius-full); flex: none; }
  .health-evidence li.up i { background: color-mix(in srgb, var(--pos) 55%, transparent); }
  .health-evidence li.down i { background: color-mix(in srgb, var(--neg) 55%, transparent); }
  .health-evidence li span { min-width: 0; }
  .health-evidence li b { color: var(--fg-1); font-weight: 600; font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  /* W27: when the set of scored checks changed since the last saved read */
  .health-evidence .setchange { margin: 16px 0 0; padding-top: 12px; box-shadow: inset 0 1px 0 var(--line);
    color: var(--fg-3); font-size: var(--text-body-sm); line-height: 1.45; }
  /* the saved judgment sentences (drivers) */
  .health-evidence .drivers { margin-top: 16px; padding-top: 12px; box-shadow: inset 0 1px 0 var(--line); }
  .health-evidence .drivers p { margin: 0 0 8px; color: var(--fg-2); font-size: var(--text-body-sm); line-height: 1.5; }
  .health-evidence .drivers p:last-child { margin-bottom: 0; }
  /* the saved-score trend on a fixed scale: the usual level is the middle line */
  .health-evidence .trendwrap { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
  .health-evidence .trend { width: 152px; height: 36px; display: block; }
  .health-evidence .trend polyline { fill: none; stroke: var(--fg-1); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
  .health-evidence .trend .mid { stroke: var(--line-strong); stroke-width: 1; stroke-dasharray: 4 4; vector-effect: non-scaling-stroke; }
  .health-evidence .trend .end { fill: var(--fg-1); }
  .health-evidence .trendwrap .tv { font-family: var(--font-mono); font-size: var(--text-meta); font-weight: 500; color: var(--fg-3); font-variant-numeric: tabular-nums; }
  .health-evidence .trendwrap .tv.now { color: var(--fg-1); }
  .health-evidence .trendwrap .cap { color: var(--fg-3); font-size: var(--text-meta); }
  /* PRD v10: where it's heading — one word per durable measure */
  .hc-dir .dirlede { margin: 0 0 12px; color: var(--fg-2); font-size: var(--text-body-sm); line-height: 1.45; }
  .hc-dir .dirlede b { font-weight: 600; color: var(--fg-1); }
  .hc-dir .dirlede b.building { color: var(--pos); }
  .hc-dir .dirlede b.softening { color: var(--neg); }
  .hc-dir .dirrows { display: grid; }
  .hc-dir .dirrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; font-size: var(--text-body-sm); line-height: 1.3; }
  .hc-dir .dirrow + .dirrow { box-shadow: inset 0 1px 0 var(--line); }
  .hc-dir .dirrow .dl { color: var(--fg-2); min-width: 0; }
  /* the whole row is the definition's target */
  .hc-dir .dirrow { position: relative; }
  .hc-dir .dirrow .dl[data-tip] { cursor: pointer; }
  .hc-dir .dirrow .dl[data-tip]::after { content: ""; position: absolute; inset: 0; }
  .hc-dir .dirrow .dw { font-weight: 500; white-space: nowrap; color: var(--fg-1); }
  .hc-dir .dirrow .dw.building { color: var(--pos); }
  .hc-dir .dirrow .dw.softening { color: var(--neg); }
  .hc-dir .dirrow .dw.holding, .hc-dir .dirrow .dw.thin { color: var(--fg-3); }
  .hc-dir .outlook { margin: 12px 0 0; padding-top: 12px; box-shadow: inset 0 1px 0 var(--line); color: var(--fg-2); font-size: var(--text-body-sm); line-height: 1.5; }
  .hc-dir .outlook b { color: var(--fg-1); font-weight: 600; font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .hc-dir .outlook + .outlook { box-shadow: none; padding-top: 0; margin-top: 8px; }
  /* Do next: the top actions, each led by a quiet decorative ordinal */
  .hc-meta .donext { display: grid; gap: 12px; }
  .hc-meta .dnrow { display: flex; gap: 12px; color: var(--fg-1); font-size: var(--text-body-sm); line-height: 1.5; text-decoration: none; border-radius: var(--radius-md); }
  /* each row opens its card on the Actions page */
  .hc-meta .dnrow .dntext { flex: 1; min-width: 0; }
  .hc-meta .dnrow .dnchev { flex: none; width: 16px; height: 16px; margin-top: 2px; color: var(--fg-3); }
  .hc-meta .dnrow:hover .dntext { text-decoration: underline; text-decoration-color: var(--fg-4); text-underline-offset: 4px; }
  .hc-meta .dnrow:hover .dnchev { color: var(--fg-1); }
  .hc-meta .dnnum { flex: none; width: 20px; height: 20px; border-radius: var(--radius-md); background: var(--surface-2);
    box-shadow: inset 0 0 0 1px var(--line-strong); color: var(--fg-2); font-family: var(--font-mono); font-size: var(--text-caption);
    font-weight: 600; display: flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; }
  .healthrow.empty { display: block; }
  .hempty { display: flex; align-items: flex-start; gap: 16px; }
  .hempty-ic { width: 40px; height: 40px; flex: none; border-radius: var(--radius-full); background: var(--surface-2);
    box-shadow: inset 0 0 0 1px var(--line); color: var(--fg-2); display: flex; align-items: center; justify-content: center; }
  .hempty-ic svg { width: 20px; height: 20px; color: inherit; }
  .hempty-t { margin: 8px 0 0; font-size: var(--text-title); line-height: 1.25; font-weight: 600; letter-spacing: -0.015em; }
  .hempty-b { margin: 4px 0 0; max-width: 60ch; font-size: var(--text-body-sm); line-height: 1.5; color: var(--fg-2); }

  /* ---- Primary answers: latest episode + share-watched cards ---- */
  .overview { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: var(--gap); margin-bottom: var(--gap); }
  .overview.single { grid-template-columns: 1fr; }
  .hero { display: flex; gap: 24px; }
  .hero .main { flex: 1; min-width: 0; }
  .hero h2 { margin: 0; font-size: var(--text-title); line-height: 1.3; font-weight: 600; letter-spacing: -0.015em; }
  .hero .metricline { display: flex; align-items: baseline; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
  .hero .big { font-size: var(--text-hero); line-height: 1; font-weight: 600; letter-spacing: -0.02em; }
  .hero .big [data-fold-number] { font-variant-numeric: tabular-nums; letter-spacing: -0.04em; }
  .hero .big small { font-family: var(--font-sans); font-size: var(--text-body); font-weight: 400; color: var(--fg-2); letter-spacing: 0; }
  .hero .mk { font-size: var(--text-body-sm); font-weight: 500; color: var(--warn); }
  .hero .platform-bar { display: flex; gap: 4px; width: min(100%, 520px); height: 8px; overflow: hidden;
    border-radius: var(--radius-full); background: var(--surface-3); margin-top: 20px; }
  .hero .platform-bar .pseg { min-width: 2px; }
  .hero .splitlabels { display: flex; justify-content: space-between; width: min(100%, 520px);
    margin-top: 8px; color: var(--fg-2); font-size: var(--text-body-sm); }
  .hero .splitlabels .sl { position: relative; display: inline-flex; align-items: center; gap: 8px; border-radius: var(--radius-sm); }
  .hero .splitlabels .sl::after { content: ""; position: absolute; inset: -16px -12px; }
  .hero .splitlabels i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .hero .state { color: var(--fg-3); font-size: var(--text-body-sm); margin-top: 16px; }
  .hero .unavailable { color: var(--fg-3); font-size: var(--text-body); margin-top: 12px; }
  .hero .spark { width: min(34%, 320px); flex: none; display: flex; flex-direction: column; gap: 4px; justify-content: flex-end; }
  .hero .spark .cv { position: relative; height: 88px; width: 100%; }
  .hero .spark .cap { font-size: var(--text-meta); color: var(--fg-3); text-align: right; }
  .hero .hs { max-width: 300px; }

  .compound .cv2 { color: var(--fg-2); font-size: var(--text-body-sm); font-weight: 500; line-height: 1.39; margin: 0; }
  .compound .cv2 .db { margin: 0 2px; vertical-align: 1px; }
  /* slim neutral columns from a shared baseline; ONE bar — the selected
     episode, else the newest — is the focus white; each bar names its value
     above and its episode below */
  .compound .bars { display: flex; gap: 8px; align-items: stretch; margin: 12px 0; }
  .compound .cbar { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
  .compound .cbar .bnum { font-family: var(--font-mono); font-size: var(--text-caption); color: var(--fg-3); font-variant-numeric: tabular-nums; white-space: nowrap; letter-spacing: -0.02em; }
  .compound .cbar .bnum .bs { display: none; }
  /* twelve labelled bars need ~44 px each for the full value; a narrower card
     (phone, tablet, a squeezed column) shows whole numbers — the title carries the unit */
  .compound { container-type: inline-size; }
  @container (max-width: 560px) {
    .compound .cbar .bnum .bl { display: none; }
    .compound .cbar .bnum .bs { display: inline; }
  }
  .compound .cbar.pending .bnum { color: var(--fg-2); font-family: var(--font-sans); }
  .compound .cbar.hot .bnum { color: var(--fg-1); font-weight: 600; }
  .compound .cbar .bwrap { height: 72px; width: 100%; display: flex; align-items: flex-end; justify-content: center;
    box-shadow: inset 0 -1px 0 var(--line-strong); }
  .compound .cbar .b { width: 100%; max-width: 28px; border-radius: var(--radius-sm) var(--radius-sm) 0 0; min-height: 4px; background: var(--series-context); }
  .compound .cbar.hot .b { background: var(--fg-1); }
  .compound .cbar .bep { font-family: var(--font-mono); font-size: var(--text-caption); font-weight: 500; color: var(--fg-3); }
  .compound .cbar.hot .bep { color: var(--fg-1); }
  .compound .waitline { color: var(--fg-3); font-size: var(--text-body); }
  /* the not-ready card is a sketched empty chart around the plain sentence */
  .compound .skelplot { position: relative; padding-top: 4px; }
  .compound .skelgrid { position: absolute; inset: 4px 0 20px; display: flex; flex-direction: column;
    justify-content: space-between; pointer-events: none; }
  .compound .skelgrid i { display: block; border-top: 1px dashed var(--line-strong); }
  .compound .skelcenter { position: relative; display: flex; flex-direction: column; align-items: center;
    gap: 12px; padding: 24px 0 28px; text-align: center; }
  .compound .skelicon { width: 44px; height: 44px; flex: none; border-radius: var(--radius-full); background: var(--surface-2);
    box-shadow: inset 0 0 0 1px var(--line); color: var(--fg-2); display: flex; align-items: center; justify-content: center; }
  .compound .skelicon svg { width: 20px; height: 20px; }
  .compound .skelplot .waitline { color: var(--fg-1); font-weight: 600; font-size: var(--text-body); }
  .compound .waitsub { color: var(--fg-3); font-size: var(--text-body-sm); margin-top: -4px; }
  .compound .skelaxis { position: relative; box-shadow: inset 0 1px 0 var(--line-strong);
    height: 8px; display: flex; justify-content: space-between; padding: 0 8px; }
  .compound .skelaxis i { width: 1px; height: 8px; background: var(--line-strong); display: block; }

  /* ---- Episode carousel: the chart's stable legend, oldest → newest, the
     latest always far right (locked rule) ---- */
  /* the 8px inset (the system's chip-row recipe) only exists so focus rings
     and hit areas aren't clipped by the scroll container; negative margins pull
     the painted card edges back onto the page grid, and the bottom gutter
     subtracts it so the rhythm holds */
  .carousel { display: flex; gap: var(--gap); overflow-x: auto; padding: 8px;
    margin: -8px -8px calc(var(--gap) - 8px);
    scrollbar-width: none; scroll-snap-type: x proximity; }
  .carousel::-webkit-scrollbar { display: none; }
  .carousel.more-left { -webkit-mask-image: linear-gradient(to right, transparent 0, black 32px); mask-image: linear-gradient(to right, transparent 0, black 32px); }
  .carousel.more-right { -webkit-mask-image: linear-gradient(to left, transparent 0, black 32px); mask-image: linear-gradient(to left, transparent 0, black 32px); }
  .carousel.more-left.more-right { -webkit-mask-image: linear-gradient(to right, transparent 0, black 32px, black calc(100% - 32px), transparent 100%); mask-image: linear-gradient(to right, transparent 0, black 32px, black calc(100% - 32px), transparent 100%); }
  .sitem { flex: 0 0 200px; min-width: 200px; scroll-snap-align: end; background: var(--surface-1);
    border: 0; border-radius: var(--radius-2xl); box-shadow: inset 0 0 0 1px var(--line); padding: 12px 16px; cursor: pointer;
    position: relative; transition: background 150ms var(--ease-out-quart), box-shadow 150ms var(--ease-out-quart);
    color: inherit; text-align: left; display: flex; flex-direction: column; }
  /* the full-card button (the system's card overlay) — the ring hugs the card */
  .sitem-hit { position: absolute; inset: 0; z-index: 0; margin: 0; padding: 0; border: 0; border-radius: inherit;
    background: transparent; cursor: pointer; }
  .sitem-hit:focus-visible { outline-offset: 0; }
  .sitem > .r1, .sitem > .t { position: relative; pointer-events: none; }
  /* the title takes the slack, so every card's third row sits on one baseline */
  .sitem > .t { flex: 1 0 auto; }
  .sitem > .hs { position: relative; z-index: 1; }
  .sitem:hover { background: var(--surface-2); }
  /* the current card: the system's white ring */
  .sitem.solo { background: var(--surface-2); box-shadow: inset 0 0 0 1.5px var(--selection-ring); }
  /* context cards stay legible: their figures step down a token, never an opacity */
  .sitem.dim .num { color: var(--fg-2); }
  .sitem.dim .t, .sitem.dim .epk { color: var(--fg-3); }
  .sitem .r1 { display: flex; align-items: baseline; gap: 8px; }
  .sitem .r1 .epk { font-family: var(--font-mono); font-size: var(--text-meta); font-weight: 500; color: var(--fg-3); }
  .sitem.newest .r1 .epk { color: var(--fg-1); }
  .sitem .r1 .num { font-size: var(--text-title); font-weight: 600; letter-spacing: -0.02em; color: var(--fg-1); font-variant-numeric: tabular-nums; }
  .sitem .r1 .mk { font-size: var(--text-meta); font-weight: 500; color: var(--warn); margin-left: auto; }
  .sitem .t { font-size: var(--text-body-sm); color: var(--fg-2); overflow: hidden; margin: 4px 0 12px;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-height: 1.39; }
  /* three-week health read: number + meter, present ONLY once the read is done */
  .hs { display: flex; align-items: center; gap: 8px; min-height: 20px; font-size: var(--text-meta); color: var(--fg-3);
    border: 0; background: none; padding: 0; margin: 0; font-family: inherit; text-align: left; cursor: pointer; }
  button.hs[data-hslug] { width: 100%; }
  button.hs[data-hslug]::after { content: ""; position: absolute; inset: -12px -4px; }
  .hs b { font-family: var(--font-mono); font-size: var(--text-body-sm); font-weight: 600; color: var(--fg-1); font-variant-numeric: tabular-nums; }
  .hs .mk { color: var(--warn); font-weight: 500; }
  .hs .htrack { flex: 1; height: 4px; border-radius: var(--radius-full); background: var(--surface-3); position: relative; overflow: hidden; }
  .hs .htrack span { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: var(--fg-2); }
  .hs .ic { width: 12px; height: 12px; }
  .hero .state .n, .gline .n { color: var(--fg-2); }
  /* the launch word: a word, never a number; dotted = there is a tooltip here */
  .hs.launch { display: inline-block; color: var(--fg-2); font-size: var(--text-meta); line-height: 20px; white-space: nowrap; max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; text-decoration: underline dotted var(--fg-4); text-underline-offset: 4px; align-self: flex-start; }
  /* the hit area reaches 44 px without moving the focus ring off the word */
  .sitem > .hs.launch::after { content: ""; position: absolute; inset: -12px -4px; }
  .sitem > .hs.launch { overflow: visible; }
  .hs.launch:focus-visible { border-radius: var(--radius-sm); }
  .sitem .hs.quiet { cursor: default; }

  /* ---- the one tooltip (hover, focus, tap) ---- */
  #rtt { position: fixed; z-index: 60; max-width: 320px; background: var(--popover); box-shadow: var(--shadow-pop);
    border-radius: var(--radius-lg); padding: 12px; font-size: var(--text-body-sm); line-height: 1.45; color: var(--fg-2);
    opacity: 0; pointer-events: none; transition: opacity 100ms ease; }
  #rtt .h { font-weight: 600; color: var(--fg-1); margin-bottom: 4px; }
  #rtt .warn { color: var(--warn); margin-top: 4px; }
  #rtt .mut { color: var(--fg-3); margin-top: 4px; }
  /* structured check tooltip: name + state up top, one block per measure,
     the score sentence as a hairline footer */
  #rtt .th { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 4px; }
  #rtt .tst { display: inline-flex; align-items: center; gap: 8px; font-size: var(--text-meta); font-weight: 500; flex: none; }
  #rtt .tst i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
  #rtt .tst.healthy { color: var(--pos); }
  #rtt .tst.steady { color: var(--fg-2); }
  #rtt .tst.fragile { color: var(--warn); }
  #rtt .tst.waiting { color: var(--fg-3); }
  #rtt .tst.waiting i { background: none; box-shadow: inset 0 0 0 1.5px var(--fg-3); }
  #rtt .mrow { margin-top: 12px; }
  #rtt .ml { display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    font-size: var(--text-meta); line-height: 1.34; color: var(--fg-3); }
  #rtt .ml .ms { font-size: var(--text-caption); white-space: nowrap; }
  #rtt .mv { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  #rtt .mv b { font-family: var(--font-mono); font-size: var(--text-body); font-weight: 600; color: var(--fg-1); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  #rtt .mv .mt { color: var(--fg-3); font-size: var(--text-meta); }
  #rtt .mv.mr { font-size: var(--text-meta); line-height: 1.4; color: var(--fg-3); display: block; }
  #rtt .hdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; }
  #rtt .mnote { color: var(--fg-3); font-size: var(--text-caption); line-height: 1.36; margin-top: 4px; }
  #rtt .fnote { margin-top: 12px; padding-top: 8px; box-shadow: inset 0 1px 0 var(--line); font-size: var(--text-meta); }

  /* ---- Layer 2: the episode detail pane. One container level only: the
     header sits on the canvas like a section header, and the sections are one
     metric grid whose 1 px gaps show the hairline between cells (the system's
     detail-pane block) — never a card inside a card. ---- */
  @keyframes panelIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .panel { background: transparent; border: 0; border-radius: 0; padding: 0; margin: var(--gap) 0;
    position: relative; font-size: var(--text-body-sm); animation: panelIn 320ms var(--ease-out-expo); }
  .panel .pgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 1px; margin-top: 12px; grid-auto-flow: dense; overflow: hidden;
    border-radius: var(--radius-2xl); background: var(--line); box-shadow: inset 0 0 0 1px var(--line); }
  .panel .psec { min-width: 0; background: var(--surface-1); padding: 16px; }
  .panel .psec.wide { grid-column: 1 / -1; }
  .panel .psec .kicker { margin-bottom: 8px; display: flex; align-items: center; gap: 4px; }
  .panel .pnum { font-size: var(--text-num-lg); line-height: 1.25; font-weight: 600; color: var(--fg-1); letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums; margin-bottom: 8px; }
  .panel .pnum.hint { font-size: var(--text-body); font-weight: 500; color: var(--fg-2); letter-spacing: 0; }
  .panel .pnum .hint { font-size: var(--text-body-sm); font-weight: 400; letter-spacing: 0; color: var(--fg-3); }
  .panel .pnum .mk { color: var(--warn); font-weight: 600; margin-left: 4px; }
  /* header: title · date · destination chips · transcript · close, one centerline */
  /* the pane header: the title and close on one line, the destinations under them */
  .panel .h { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; min-height: 36px; }
  .panel .h .hmeta { flex-basis: 100%; order: 5; justify-content: flex-start; row-gap: 8px; }
  .panel .h .htitle { flex: 1 1 0; min-width: 0; margin: 0; font-size: var(--text-title); line-height: 1.3; font-weight: 600; letter-spacing: -0.015em; }
  .panel .h .hmeta { color: var(--fg-3); font-size: var(--text-meta);
    display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .panel .h .pdate { margin-right: 4px; }
  /* destination links: the system's outline pill — tappable, quiet */
  .panel .plink { position: relative; display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: var(--radius-full);
    box-shadow: inset 0 0 0 1px var(--line-strong); color: var(--fg-1);
    font-size: var(--text-body-sm); font-weight: 500; text-decoration: none; white-space: nowrap; transition: background 150ms var(--ease-out-quart); }
  .panel .plink::after { content: ""; position: absolute; inset: -4px 0; }
  .panel .plink .plogo { width: 14px; height: 14px; color: var(--fg-2); }
  .panel .plink:hover { background: var(--surface-2); }
  .panel .psec .plink { height: auto; padding: 0; background: none; box-shadow: none; color: var(--tint-fg); font-size: var(--text-body-sm); white-space: normal; }
  .panel .psec .plink::after { content: none; }
  .panel .psec .plink:hover { text-decoration: underline; text-underline-offset: 3px; }
  /* the transcript: the header's one emphasized action — a tonal button */
  .panel .tlink { position: relative; display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; color: var(--tint-fg);
    font-size: var(--text-body-sm); font-weight: 500; line-height: 1; text-decoration: none; white-space: nowrap;
    border-radius: var(--radius-full); background: var(--tint-soft); transition: background 150ms var(--ease-out-quart); }
  .panel .tlink::after { content: ""; position: absolute; inset: -4px 0; }
  .panel .tlink svg { width: 14px; height: 14px; color: inherit; }
  .panel .tlink:hover { background: color-mix(in oklab, var(--tint) 20%, transparent); }
  /* close: the system's ghost icon button (44 on phones, 32 from md) */
  .panel .x { position: relative; width: 44px; height: 44px; padding: 0; flex: none;
    display: flex; align-items: center; justify-content: center; border-radius: var(--radius-lg);
    background: none; border: 0; color: var(--fg-3); font-size: var(--text-num-lg); line-height: 1; cursor: pointer;
    transition: background 150ms var(--ease-out-quart), color 150ms var(--ease-out-quart); }
  .panel .x:hover { color: var(--fg-1); background: var(--surface-2); }
  .panel .x svg, .dhead .x svg { width: 16px; height: 16px; }
  @media (min-width: 48rem) { .panel .x { width: 32px; height: 32px; } }
  .cdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .panel .frate { color: var(--fg-3); font-size: var(--text-meta); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .panel .fline { color: var(--fg-2); font-size: var(--text-body-sm); margin-bottom: 4px; }
  /* distribution rows: icon · label · meter · value */
  .panel .trow { display: flex; align-items: center; gap: 8px; padding: 4px 0; color: var(--fg-2); font-size: var(--text-body-sm); }
  .panel .trow .tl { width: 120px; flex: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .panel .trow .tb { flex: 1; max-width: 320px; height: 4px; border-radius: var(--radius-full); background: var(--surface-3); overflow: hidden; }
  .panel .trow .tb span { display: block; height: 100%; background: var(--fg-2); border-radius: inherit; }
  /* the detail swaps in WHERE the bar was, so the row answers in place */
  .panel .trow .tbv { flex: 1; max-width: 320px; display: none; text-align: right; color: var(--fg-3);
    font-size: var(--text-meta); font-variant-numeric: tabular-nums; }
  .panel .trow:hover .tb, .panel .trow:focus-visible .tb { display: none; }
  .panel .trow:hover .tbv, .panel .trow:focus-visible .tbv { display: block; }
  .panel .trow .tv { width: 52px; text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--fg-1); flex: none; }
  .panel .trow .tn { width: 48px; text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--fg-3); font-size: var(--text-meta); flex: none; }
  /* W14 glyph grammar: icons carry identity, badges carry direction */
  .ic { width: 16px; height: 16px; flex: none; color: var(--fg-3); }
  .ki { width: 14px; height: 14px; color: var(--fg-3); vertical-align: -2px; }
  .kicker [data-tip] { position: relative; display: inline-flex; }
  .kicker [data-tip]::after { content: ""; position: absolute; inset: -16px; }
  /* four fixed columns so every row's icon, label, value, and badge share edges */
  .panel .irow { display: grid; grid-template-columns: 16px minmax(0, 1fr) 76px 64px; align-items: center;
    column-gap: 8px; padding: 4px 0; color: var(--fg-2); font-size: var(--text-body-sm); }
  .panel .irow .lb { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .panel .irow b { color: var(--fg-1); font-weight: 500; font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap;
    justify-self: start; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .panel .irow .db { grid-column: 4; justify-self: start; margin-left: 0; }
  /* delta badge: up/down against the show's typical — sign + number + soft fill */
  .db { display: inline-flex; align-items: center; min-height: 20px; padding: 0 8px; border-radius: var(--radius-full); line-height: 1;
    font-family: var(--font-mono); font-size: var(--text-caption); font-weight: 600; font-variant-numeric: tabular-nums; flex: none; margin-left: 4px; }
  .db.up { color: var(--pos); background: var(--pos-soft); }
  .db.down { color: var(--neg); background: var(--neg-soft); }
  .db.mid { color: var(--fg-2); background: var(--surface-3); font-family: var(--font-sans); }
  .db.none { color: var(--fg-3); background: none; box-shadow: inset 0 0 0 1px var(--line-strong); }
  .gline { display: flex; gap: 24px 16px; align-items: center; flex-wrap: wrap; color: var(--fg-2);
    font-size: var(--text-body-sm); padding: 4px 0 0; }
  .gline .g { position: relative; display: inline-flex; align-items: center; gap: 8px; min-height: 20px; }
  .gline .g::after { content: ""; position: absolute; inset: -12px -4px; }
  .gline .g b { color: var(--fg-1); font-weight: 600; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .gline .g .gl { color: var(--fg-3); font-size: var(--text-meta); }
  .panel .row.head { font-weight: 600; color: var(--fg-1); }
  .panel .val.big { font-size: var(--text-title); }
  .panel .hint { color: var(--fg-3); font-size: var(--text-meta); font-weight: 400; line-height: 1.45; margin-top: 4px; }
  .panel .pchip { font-size: var(--text-meta); color: var(--warn); background: var(--warn-soft); border-radius: var(--radius-full); padding: 0 8px; font-weight: 500; }
  .panel .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 4px 28px; margin-top: 12px; }
  /* label · value rows, hairline-free; values right in mono */
  .panel .row { display: flex; align-items: center; gap: 8px; padding: 4px 0; color: var(--fg-2); }
  .panel .row .sq { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .panel .row .val { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--fg-1); text-align: right; }
  .panel .sect { box-shadow: inset 0 1px 0 var(--line); margin-top: 16px; padding-top: 12px; }
  .panel .sect h4.mut { margin: 0 0 4px; font-weight: 400; }
  /* the live session's numbers: a KPI strip, label over value */
  .panel .lkpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(136px, 1fr)); gap: 16px 24px; }
  .panel .lk { min-width: 0; }
  .panel .lkl { font-size: var(--text-meta); line-height: 1.34; color: var(--fg-3); }
  .panel .lkv { margin-top: 4px; font-size: var(--text-num-lg); line-height: 1.25; font-weight: 600; letter-spacing: -0.02em; color: var(--fg-1); font-variant-numeric: tabular-nums; }
  .panel .lkv small { font-size: var(--text-body-sm); font-weight: 400; letter-spacing: 0; color: var(--fg-3); }
  .panel .lkv .na { font-size: var(--text-body-sm); font-weight: 400; letter-spacing: 0; color: var(--fg-3); }
  .panel .dest { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 32px; }
  .panel .dest .row .plogo { width: 14px; height: 14px; }
  /* a disclosure inside a cell: chevron, no native triangle */
  .panel .pdisc summary { display: inline-flex; align-items: center; gap: 4px; list-style: none; min-height: 28px; cursor: pointer; color: var(--fg-2); }
  .panel .pdisc summary::-webkit-details-marker { display: none; }
  .panel .pdisc summary .ic { width: 16px; height: 16px; color: var(--fg-3); transition: transform 150ms var(--ease-out-quart); }
  .panel .pdisc[open] summary .ic { transform: rotate(180deg); }
  .chapters .chg { max-width: 72ch; }
  .panel .note { color: var(--warn); font-size: var(--text-meta); margin-top: 8px; line-height: 1.45; }
  .panel .mut { color: var(--fg-3); font-size: var(--text-meta); margin-top: 4px; }
  .panel .unavailable { color: var(--fg-3); font-size: var(--text-body-sm); margin-top: 8px; }
  .panel details { margin-top: 8px; color: var(--fg-3); font-size: var(--text-meta); }
  .panel .q { color: var(--fg-2); font-size: var(--text-body-sm); margin: 8px 0; }
  .panel .q .by { color: var(--fg-3); }
  .panel .senti-link { cursor: pointer; }
  .panel .wcurve { margin: 12px 0 4px; }
  /* padding gives the moment pins their own band so no disc ever covers the
     curve; drops hang below their curve point, holds sit above it */
  .panel .wcurve .wplot { position: relative; padding: 4px 0 28px; }
  .panel .wcurve .wplot > svg { display: block; width: 100%; height: 64px; }
  .panel .wcurve line { stroke: var(--line); stroke-width: 0.4; }
  .panel .wcurve polyline { fill: none; stroke: var(--fg-1); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
  .panel .wcap { display: flex; justify-content: space-between; color: var(--fg-3); font-size: var(--text-meta); margin-top: 4px; }
  /* W16 moment pins: a hairline tick to the curve point, a small disc whose
     chevron carries the only color — below the line = people left (red),
     above = extra people watching (green). Buttons, so keyboards reach the
     tooltip; the ::after pad keeps a 32px touch target on a 12px visual. */
  .wmark { position: absolute; width: 12px; height: 12px; border-radius: 50%; transform: translate(-50%, -50%);
    display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer;
    background: var(--surface-2); border: 0; box-shadow: inset 0 0 0 1px var(--line-strong); }
  .wmark .ic { width: 8px; height: 8px; color: inherit; pointer-events: none; }
  .wmark::before { content: ""; position: absolute; left: 50%; width: 1px; background: var(--line-strong); }
  .wmark.drop::before { bottom: 100%; height: var(--tick, 6px); }
  .wmark.hold::before { top: 100%; height: var(--tick, 6px); }
  /* a 44 px tap area; spaceMoments() splits the space between two pins whose areas would cover each other */
  .wmark::after { content: ""; position: absolute;

  .panel .wmdisc { margin-top: 8px; }

    background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line-strong); }

  /* PRD v12 W43: chapters in the episode panel */
  .chapters .chrow { display: grid; grid-template-columns: 72px 1fr; gap: 12px; padding: 8px 0; box-shadow: inset 0 1px 0 var(--line); font-size: var(--text-body-sm); line-height: 1.45; }
  .chapters .chrow:first-of-type { box-shadow: none; }

  /* audience feedback: count chips, the quotes as the centrepiece, one footnote */
  .panel .fb .fbhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .panel .fb .fbhead .kicker { margin-bottom: 0; }
  .panel .pills { display: flex; gap: 8px; flex-wrap: wrap; }
  .panel .pill { position: relative; display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 16px 0 12px; border: 0; border-radius: var(--radius-full);
    background: var(--surface-1); box-shadow: inset 0 0 0 1px var(--line-strong); color: var(--fg-1); font-size: var(--text-body-sm); font-weight: 500;
    font-variant-numeric: tabular-nums; cursor: pointer; text-decoration: none; line-height: 1; transition: background 150ms var(--ease-out-quart); }
  .panel .pill::after { content: ""; position: absolute; inset: -4px 0; }

  @media (min-width: 48rem) { .panel .pill { height: 32px; padding: 0 12px 0 8px; } .panel .pill.more { padding: 0 12px; } }
  .panel .pill .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .panel .pill .dot.good { background: var(--pos); } .panel .pill .dot.bad { background: var(--neg); }
  /* a quote: a nested block marked by a 2 px rule (the system's parlay-leg

  .panel .bq { margin: 16px 0 0; padding: 0 0 0 12px; border-left: 2px solid var(--line-strong); }
  .panel .bq p { margin: 0; color: var(--fg-1); font-size: var(--text-body); line-height: 1.5; }

  .panel .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

  .panel .fbfoot { margin-top: 12px; color: var(--fg-3); font-size: var(--text-meta); line-height: 1.45; }
  .panel .themehead { color: var(--fg-2); font-size: var(--text-meta); font-weight: 600; margin-bottom: 4px; }
  .panel .themeitem { color: var(--fg-2); font-size: var(--text-body-sm); padding: 4px 0; }
  .panel .themeempty { color: var(--fg-3); font-size: var(--text-meta); line-height: 1.36; }
  .feedback-source { position: relative; display: inline-flex; align-items: center; gap: 4px; color: var(--tint-fg); text-decoration: none; }
  .feedback-source::after { content: ""; position: absolute; inset: -16px -8px; }

  .drow .txt, .bq p { overflow-wrap: anywhere; white-space: pre-wrap; }

  /* the audience preview is one card like every other: the frame is the card

    box-shadow: inset 0 0 0 1px var(--line); padding: var(--d-card); }

  /* ---- chart card ---- */
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-left: auto; }
  /* head-row toggles: the system's filter chip — outline at rest, inverted white when pressed */
  .toggle { position: relative; display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 16px; border: 0;
    border-radius: var(--radius-full); background: var(--surface-1); box-shadow: inset 0 0 0 1px var(--line-strong); cursor: pointer;

  .toggle::after { content: ""; position: absolute; inset: -4px 0; }

  .viewmenu .vgroup { color: var(--fg-3); font-size: var(--text-meta); padding: 8px 8px 4px 32px; }

  .chart-copy { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; min-width: 0; }
  #chartbox { height: 440px; position: relative; transition: height 320ms var(--ease-out-expo); }

  #chartbox.mini { height: 340px; }
  /* a selection that arrives with the page (a deep link, Back) lands without the resize animation */

  .chead .cs .tri { width: 8px; height: 8px; fill: var(--fg-3); vertical-align: 0; }

  /* chart popup: the system tooltip, following the cursor */

    border-radius: var(--radius-lg); padding: 12px; font-size: var(--text-body-sm); min-width: 216px;

    transition: opacity 100ms ease; z-index: 5; }

  .tt .row .sq { width: 8px; height: 8px; border-radius: 50%; flex: none; }

  .tt .row.focus .ep, .tt .row.focus .val { color: var(--fg-1); font-weight: 600; }
  .tt .row .when { color: var(--fg-3); font-size: var(--text-caption); }
  .tt .row .val { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--fg-1); text-align: right; }
  .tt .row .val .u { color: var(--fg-3); font-size: var(--text-meta); }
  .tt .row .plogo { width: 12px; height: 12px; }
  .tt .sub { color: var(--fg-3); font-size: var(--text-meta); font-weight: 500; margin: 8px 0 4px; }
  .tt .note { color: var(--warn); font-size: var(--text-meta); margin-top: 8px; }

  /* ---- Actions: the action leads, the finding under it is the reason, how it is counted is one tap away ---- */
  .insights { display: grid; gap: var(--gap); }
  @media (min-width: 64rem) { .insights { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; } }
  .insight { background: var(--surface-1); border: 0; border-radius: var(--radius-2xl); box-shadow: inset 0 0 0 1px var(--line);
    padding: var(--d-card); font-size: var(--text-body); display: flex; align-items: flex-start; gap: 12px; }
  /* the rank (or the category glyph) in the system's muted grade badge — a
     priority that is neither money green nor tap blue; the category is a word */
  .insight .ic { width: 24px; height: 24px; border-radius: var(--radius-md); flex: none; display: flex;
    align-items: center; justify-content: center; background: var(--surface-2); color: var(--fg-2);
    box-shadow: inset 0 0 0 1px var(--line-strong); }
  .insight .ic svg { width: 14px; height: 14px; }
  .insight .ic .rk { font-style: normal; font-family: var(--font-mono); font-weight: 700; font-size: var(--text-body-sm); color: var(--fg-1); font-variant-numeric: tabular-nums; }

  .insight .lead b, .insight .why b { font-weight: 600; color: var(--fg-1); font-variant-numeric: tabular-nums; }
  /* How this is counted: the system's link button with a disclosure chevron */

    background: none; border: 0; color: var(--tint-fg); font-size: var(--text-body-sm); font-weight: 500; cursor: pointer; }
  .insight .rec-toggle::after { content: ""; position: absolute; inset: -8px -4px; }

  .insight.open .rec-toggle svg { transform: rotate(180deg); }

  .insight .more { display: grid; grid-template-rows: 0fr; opacity: 0;

  .insight .more > div { min-height: 0; overflow: hidden; }
  .insight.open .more { grid-template-rows: 1fr; opacity: 1; transition: grid-template-rows 200ms var(--ease-out-quart), opacity 200ms var(--ease-out-quart); }
  .insight .cav { margin-top: 12px; padding-top: 12px; box-shadow: inset 0 1px 0 var(--line);
    color: var(--fg-3); font-size: var(--text-body-sm); line-height: 1.5; }
  @media (min-width: 48rem) { .insight .cav { font-size: var(--text-meta); } }

  /* ---- drilldown: a dialog on desktop, a bottom sheet on phones ---- */
  /* the system's dialog on desktop; a bottom sheet on phones (below) */
  #drill { position: fixed; inset: 0; background: var(--scrim); z-index: 50; display: none;
    align-items: center; justify-content: center; padding: 16px; animation: fadeIn 150ms ease; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes dlgIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: none; } }
  .dcard { background: var(--surface-1); border: 0; border-radius: var(--radius-2xl); box-shadow: var(--shadow-dialog);
    max-width: 640px; width: 100%; max-height: min(88vh, 820px); display: flex; flex-direction: column; overflow: hidden;
    animation: dlgIn 150ms ease; }
  .dhead { position: relative; display: flex; align-items: center; gap: 12px; padding: 16px 56px 16px 20px; box-shadow: inset 0 -1px 0 var(--line); }
  .dhead .h { margin: 0; font-weight: 600; font-size: var(--text-title); line-height: 1.3; letter-spacing: -0.01em; flex: 1; min-width: 0; outline: none; }
  .dhead .x { position: absolute; top: 8px; right: 8px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
    background: none; border: 0; border-radius: var(--radius-lg); color: var(--fg-3); font-size: var(--text-num-lg); cursor: pointer;
    transition: background 150ms var(--ease-out-quart), color 150ms var(--ease-out-quart); }
  .dhead .x:hover { color: var(--fg-1); background: var(--surface-2); }

  .dtabs { display: flex; margin: 16px 20px 12px; padding: 4px; border-radius: var(--radius-xl);

    border-radius: var(--radius-lg); font-size: var(--text-body); font-weight: 500; cursor: pointer;
    transition: background 150ms var(--ease-out-quart), color 150ms var(--ease-out-quart), box-shadow 150ms var(--ease-out-quart); }
  .dtabs button::after { content: ""; position: absolute; inset: -4px 0; }

  .dtabs button .cnt { font-family: var(--font-mono); font-size: var(--text-meta); font-weight: 400; color: var(--fg-3); }
  /* fields: surface-2 wells with a hairline; focus is a 1.5 px blue inset ring */
  .dtools { display: flex; gap: 8px; padding: 0 20px 16px; }
  .dtools input, .dtools select { min-width: 0; height: 44px; padding: 0 12px; background: var(--surface-2); border: 0;
    box-shadow: inset 0 0 0 1px var(--line); border-radius: var(--radius-xl); color: var(--fg-1);

<script>
// A tab left open keeps the day it loaded. Coming back to it after half an
// hour away reloads the page, so the morning publish shows up on its own.
// data.js is revalidated on every load (max-age=0), so a reload is always current.
(function () {
  var loadedAt = Date.now();
  var STALE_MS = 30 * 60 * 1000;
  function refreshIfOld() {
    if (document.visibilityState === "visible" && Date.now() - loadedAt > STALE_MS) location.reload();
  }
  document.addEventListener("visibilitychange", refreshIfOld);
  window.addEventListener("focus", refreshIfOld);
  window.addEventListener("pageshow", function (event) { if (event.persisted) refreshIfOld(); });
})();
</script>
