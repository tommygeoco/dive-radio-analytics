<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dive Radio — Episode Analytics</title>
<style>
  :root {
    --bg: #0b0e13; --panel: #141922; --panel2: #1a2130; --border: #273043;
    --text: #eef1f6; --muted: #94a0b4; --accent: #59b0ff; --good: #3ecf8e; --bad: #ff7a59;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
  .stamp { color: var(--muted); font-size: 12px; margin: 2px 0 14px; }

  /* top-level view tabs — they control everything below, so they sit above everything below */
  .tabs { display: flex; gap: 2px; margin: 0 0 16px; border-bottom: 1px solid var(--border); }
  .tabs button { background: none; border: 0; color: var(--muted); font: inherit; font-size: 14.5px;
    padding: 10px 18px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs button.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 650; }
  .tabs button:hover { color: var(--text); }

  .verdict { background: linear-gradient(90deg, #16233a, #141922); border: 1px solid #2c4266;
    border-radius: 12px; padding: 13px 18px; margin-bottom: 14px; font-size: 15.5px; line-height: 1.45; }
  .verdict b { color: var(--accent); }

  .board { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 10px; margin-bottom: 16px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; cursor: pointer; transition: border-color .15s; position: relative; }
  .card:hover { border-color: var(--accent); }
  .card.dim { opacity: .38; }
  .card.solo { border-color: var(--accent); background: var(--panel2); }
  .card .ep { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 12px;
    color: var(--muted); letter-spacing: .04em; }
  .card .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .card .ttl { font-size: 12.5px; color: var(--text); margin: 3px 0 8px; min-height: 34px;
    line-height: 1.3; overflow: hidden; }
  .card .views { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
  .card .views small { font-size: 12px; font-weight: 500; color: var(--muted); }
  .card .sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .card .sub.up { color: var(--good); }
  .card .sub.down { color: var(--bad); }
  .card .flag { position: absolute; top: 10px; right: 12px; font-size: 10px; color: #d9a24a;
    border: 1px solid #6b5320; border-radius: 4px; padding: 0 5px; }

  .controls { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-bottom: 12px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 9px; overflow: hidden;
    background: var(--panel); }
  .seg button { background: transparent; border: 0; color: var(--muted); padding: 7px 14px;
    cursor: pointer; font: inherit; font-size: 13px; }
  .seg button.on { background: var(--accent); color: #0b1220; font-weight: 650; }
  .chips { display: inline-flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--border); background: var(--panel); color: var(--muted);
    border-radius: 9px; padding: 6px 11px; cursor: pointer; font: inherit; font-size: 12.5px;
    display: inline-flex; align-items: center; gap: 7px; }
  .chip.on { color: var(--text); border-color: #3d4c68; background: var(--panel2); }
  .chip .sq { display: inline-block; width: 9px; height: 9px; border-radius: 2.5px; background: #3a4458; }
  .reset { margin-left: auto; color: var(--muted); font-size: 12.5px; background: none; border: 0;
    cursor: pointer; text-decoration: underline; }

  #chartbox { background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 18px 14px 10px; height: 480px; position: relative; }
  .hint { color: var(--muted); font-size: 12px; margin: 8px 2px 22px; }

  /* HTML tooltip with color-coded channel list */
  .tt { position: absolute; pointer-events: none; background: #171d29; border: 1px solid #3d4c68;
    border-radius: 10px; padding: 10px 12px; font-size: 12.5px; min-width: 216px; opacity: 0;
    transition: opacity .08s; z-index: 5; box-shadow: 0 10px 28px rgba(0,0,0,.45); }
  .tt .h { display: flex; align-items: center; gap: 7px; font-weight: 700; }
  .tt .h .dot { width: 9px; height: 9px; border-radius: 3px; flex: none; }
  .tt .meta { color: var(--muted); font-size: 11.5px; margin: 1px 0 7px; }
  .tt .big { font-size: 16px; font-weight: 700; }
  .tt .chg { font-size: 11.5px; color: var(--muted); margin-bottom: 2px; }
  .tt .div { border-top: 1px solid #273043; margin: 7px 0 5px; }
  .tt .row { display: flex; align-items: center; gap: 7px; padding: 2.5px 0; font-size: 12px;
    color: #c6cede; }
  .tt .row .sq { width: 8px; height: 8px; border-radius: 2px; flex: none; }
  .tt .row .val { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--text); }
  .tt .note { color: #d9a24a; font-size: 11px; margin-top: 5px; }

  h2 { font-size: 15px; margin: 22px 0 8px; }
  .insights { display: grid; gap: 8px; }
  .insight { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px; cursor: pointer; transition: border-color .15s; font-size: 13.5px; }
  .insight:hover { border-color: var(--accent); }
  .insight .go { color: var(--accent); font-size: 12px; margin-left: 6px; white-space: nowrap; }
  footer { color: var(--muted); font-size: 12px; margin-top: 26px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Dive Radio — Episode Analytics</h1>
  <div class="stamp" id="stamp"></div>

  <div class="tabs" id="view">
    <button data-v="growth">Audience growth</button>
    <button data-v="live">Live session</button>
  </div>

  <div class="verdict" id="verdict"></div>

  <div class="board" id="board"></div>

  <div class="controls">
    <span class="seg growth-only" id="xmode">
      <button data-v="weeks">Episode race — time since premiere</button>
      <button data-v="calendar">Timeline — calendar</button>
    </span>
    <span class="seg growth-only" id="ymode">
      <button data-v="cumulative">Total views</button>
      <button data-v="delta">Views gained per week</button>
    </span>
    <span class="chips growth-only" id="platforms"></span>
    <button class="reset" id="reset">reset view</button>
  </div>

  <div id="chartbox"><canvas id="chart"></canvas><div class="tt" id="tt"></div></div>
  <div class="hint" id="hint"></div>

  <h2>What the data says</h2>
  <div class="insights" id="insights"></div>

  <footer>Static page — no server, no tracking. Post-live views refresh daily; live-session metrics come from Restream event archives. New episodes are discovered and registered automatically. Built from <code>data/restream/</code>.</footer>
</div>

<script src="chart.umd.js"></script>
<script src="data.js"></script>
<script>
const DATA = window.DIVE_DATA;
const EPS = DATA.episodes;
const DAY = 86400000, WEEK = 7 * DAY, PHX = 7 * 3600000;
const PALETTE = ["#6b7a94", "#8a6bd6", "#3ecf8e", "#e6c74a", "#ff7a59", "#59b0ff", "#ff5d8f", "#5eead4"];
const color = (e) => PALETTE[(e.ep - 1) % PALETTE.length];
const NEWEST = EPS[EPS.length - 1];

// fixed platform colors — used in the filter chips AND the tooltip channel list
const PLAT_COLORS = {
  "yt:joindiveclub": "#ff4f5e",
  "yt:designertom": "#ffa14f",
  "x:ridd_design": "#d7dbe0",
  "x:designertom": "#59b0ff",
};
const PLAT_NAME = {
  "yt:joindiveclub": "YouTube · Dive Club",
  "yt:designertom": "YouTube · DesignerTom",
  "x:ridd_design": "X · @ridd_design",
  "x:designertom": "X · @designertom",
};

const HINTS = {
  growth: "Click an episode card to focus it. Hover any point for the color-coded channel split. ◐ = registered late: totals are right, early week-by-week history doesn't exist.",
  live: "Concurrent viewers minute-by-minute during the live broadcast, from Restream. Click a card to focus one episode; hover for viewers + chat at that minute.",
};

const state = {
  view: "growth",
  xMode: "weeks",
  yMode: "cumulative",
  dests: new Set(Object.keys(PLAT_COLORS)),
  solo: null,
  showAllCards: false,
};
const CARD_CAP = 6; // newest-first; older episodes collapse behind an expander

function premiereMs(dateStr) {
  const [y,m,d] = dateStr.split("-").map(Number);
  return Date.UTC(y, m-1, d, 12) + PHX;
}
function sum(byDest) {
  let t = 0;
  for (const k of state.dests) t += (byDest[k]?.views || 0);
  return t;
}
function splitOf(byDest) {
  const o = {};
  for (const k of Object.keys(byDest)) o[k] = byDest[k]?.views || 0;
  return o;
}
function splitDelta(cur, prev) {
  const o = {};
  for (const k of Object.keys(cur)) o[k] = (cur[k]?.views || 0) - (prev?.[k]?.views || 0);
  return o;
}
function fmtDate(ms) {
  return new Date(ms - PHX).toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" });
}
function kfmt(n) {
  if (Math.abs(n) >= 1000) return (n/1000).toFixed(Math.abs(n) >= 10000 ? 0 : 1).replace(/\.0$/,"") + "k";
  return String(Math.round(n));
}
function nfmt(n) { return n.toLocaleString("en-US"); }
function short(t) { return t.replace(/^Dive Radio:\s*/i, "").replace(/\s*\+?\s*Live Call-?Ins?$/i, ""); }
function label(e) { return `E${e.ep} · ${short(e.title)}`; }

function seriesFor(e) {
  const prem = premiereMs(e.premiere);
  const pts = [];
  if (state.yMode === "cumulative") {
    if (state.xMode === "calendar") {
      for (const s of e.snapshots) pts.push({ x: Date.parse(s.ts), y: sum(s.byDest), meta: { ts: s.ts, split: splitOf(s.byDest) } });
    } else {
      for (const s of e.snapshots) {
        const d = (Date.parse(s.ts) - prem) / DAY;
        pts.push({ x: Math.round(d * 10) / 10, y: sum(s.byDest), meta: { ts: s.ts, day: d, split: splitOf(s.byDest) } });
      }
    }
  } else {
    for (let i = 0; i < e.weekly.length; i++) {
      const cur = e.weekly[i].byDest;
      const prev = i === 0 ? null : e.weekly[i-1].byDest;
      const first = i === 0;
      const split = first ? splitOf(cur) : splitDelta(cur, prev);
      pts.push({
        x: state.xMode === "calendar" ? Date.parse(e.weekly[i].boundary) : e.weekly[i].week,
        y: Object.keys(split).filter(k => state.dests.has(k)).reduce((a,k) => a + split[k], 0),
        meta: { ts: e.weekly[i].boundary, week: e.weekly[i].week, split,
          note: first ? (e.partialHistory ? "views at registration (late-registered)" : "first tracked week") : null }
      });
    }
  }
  return pts;
}

const endLabels = {
  id: "endLabels",
  afterDatasetsDraw(chart) {
    if (chart.config.type !== "line") return;
    const { ctx, chartArea } = chart;
    const placed = [];
    const items = [];
    chart.data.datasets.forEach((ds, i) => {
      const meta = chart.getDatasetMeta(i);
      if (meta.hidden || !meta.data.length) return;
      const pt = meta.data[meta.data.length - 1];
      items.push({ x: pt.x, y: pt.y, text: "E" + ds.epNum, color: ds.borderColor });
    });
    items.sort((a, b) => a.y - b.y);
    ctx.save();
    ctx.font = "700 12px -apple-system, 'Segoe UI', sans-serif";
    for (const it of items) {
      let y = it.y;
      for (const p of placed) if (Math.abs(y - p) < 15) y = p + 15;
      placed.push(y);
      ctx.fillStyle = it.color;
      ctx.fillText(it.text, Math.min(it.x + 8, chartArea.right + 4), y + 4);
    }
    ctx.restore();
  }
};

// --- HTML tooltip: color-coded channel breakdown ---
function externalTooltip(context) {
  const { chart, tooltip } = context;
  const el = document.getElementById("tt");
  if (!tooltip.opacity || !tooltip.dataPoints?.length) { el.style.opacity = 0; return; }
  const item = tooltip.dataPoints[0];
  const ds = item.dataset, e = ds.episode, p = item.raw;
  const isLive = state.view === "live";
  const isDelta = !isLive && state.yMode === "delta";

  let html = `<div class="h"><span class="dot" style="background:${ds.borderColor}"></span>${label(e)}</div>`;

  if (isLive) {
    html += `<div class="meta">Minute ${p.x}</div>`;
    html += `<div class="big">${p.y} watching</div>`;
    html += `<div class="chg">Chat: ${nfmt(p.meta.ct ?? 0)} messages so far${p.meta.c ? ` (+${p.meta.c} this minute)` : ""}</div>`;
  } else {
    if (p.meta.week !== undefined) {
      html += `<div class="meta">Week ${p.meta.week + 1} · ${fmtDate(Date.parse(p.meta.ts))}</div>`;
    } else {
      const days = Math.round(p.meta.day ?? 0);
      html += `<div class="meta">Day ${days} (week ${Math.floor(days / 7) + 1}) · ${fmtDate(Date.parse(p.meta.ts))}</div>`;
    }
    html += `<div class="big">${nfmt(p.y)} views${isDelta ? " gained" : ""}</div>`;
    if (!isDelta && item.dataIndex > 0) {
      const prev = ds.data[item.dataIndex - 1].y;
      const d = p.y - prev;
      html += `<div class="chg">since prior snapshot: ${d >= 0 ? "+" : ""}${nfmt(d)}${prev > 0 ? ` (${d >= 0 ? "+" : ""}${Math.round(d/prev*1000)/10}%)` : ""}</div>`;
    }
    if (p.meta.split) {
      html += `<div class="div"></div>`;
      for (const k of Object.keys(PLAT_COLORS)) {
        if (!state.dests.has(k)) continue;
        const v = p.meta.split[k] ?? 0;
        html += `<div class="row"><span class="sq" style="background:${PLAT_COLORS[k]}"></span>${PLAT_NAME[k]}<span class="val">${isDelta && p.meta.note === null ? (v >= 0 ? "+" : "") : ""}${nfmt(v)}</span></div>`;
      }
    }
    if (p.meta.note) html += `<div class="note">${p.meta.note}</div>`;
  }

  el.innerHTML = html;
  el.style.opacity = 1;
  const box = chart.canvas.parentNode;
  const x = Math.min(Math.max(tooltip.caretX, 120), box.clientWidth - 130);
  const above = tooltip.caretY > 190;
  el.style.left = x + "px";
  el.style.top = (tooltip.caretY + (above ? -14 : 14)) + "px";
  el.style.transform = `translate(-50%, ${above ? "-100%" : "0"})`;
}

let chart;
function render() {
  const isLive = state.view === "live";
  const isDelta = !isLive && state.yMode === "delta";
  const isCal = !isLive && state.xMode === "calendar";
  const isRace = !isLive && !isDelta && !isCal;

  const source = isLive ? EPS.filter(e => e.live) : EPS;
  const datasets = source.map((e) => {
    const isNewest = e.slug === NEWEST.slug;
    const soloed = state.solo === e.slug;
    const hidden = state.solo !== null && !soloed;
    return {
      label: label(e),
      epNum: e.ep,
      slug: e.slug,
      data: isLive ? e.live.series.map(p => ({ x: p.m, y: p.v, meta: p })) : seriesFor(e),
      borderColor: color(e),
      backgroundColor: color(e) + (isDelta ? "dd" : "22"),
      borderWidth: soloed ? 3.5 : (isNewest ? 3.5 : 2),
      pointRadius: isLive || isRace || isCal ? 0 : 3,
      pointHoverRadius: 5,
      tension: 0.3, spanGaps: false, hidden,
      episode: e,
    };
  });

  const cfg = {
    type: isDelta ? "bar" : "line",
    data: { datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      layout: { padding: { right: isDelta ? 8 : 34 } },
      interaction: { mode: "nearest", intersect: false },
      scales: {
        x: {
          type: "linear",
          title: { display: true, color: "#94a0b4",
            text: isLive ? "Minutes into the show" : (isCal ? "" : (isRace ? "Time since premiere" : "")) },
          ticks: {
            color: "#94a0b4",
            stepSize: isRace ? 7 : undefined,
            callback: v => {
              if (isLive) return v;
              if (isCal) return fmtDate(v);
              if (isRace) return v === 0 ? "premiere" : (v % 7 === 0 && v > 0 ? `${v/7} wk${v/7 > 1 ? "s" : ""}` : "");
              return Number.isInteger(v) ? "week " + (v + 1) : "";
            },
            maxTicksLimit: isCal ? 9 : 24,
          },
          grid: { color: "#1d2433" },
          offset: isDelta,
        },
        y: {
          beginAtZero: true,
          title: { display: isLive, text: isLive ? "Concurrent viewers" : "", color: "#94a0b4" },
          ticks: { color: "#94a0b4", callback: v => kfmt(v) },
          grid: { color: "#1d2433" },
        },
      },
      plugins: {
        legend: { display: false },
        tooltip: { enabled: false, external: externalTooltip },
      },
    },
    plugins: [endLabels],
  };

  if (chart) chart.destroy();
  chart = new Chart(document.getElementById("chart"), cfg);
  document.getElementById("tt").style.opacity = 0;
  buildBoard();
  syncUI();
}

function sameAgeSub(e) {
  const age = Date.parse(e.latest.ts) - premiereMs(e.premiere);
  const peers = [];
  for (const o of EPS) {
    if (o.slug === e.slug) continue;
    const prem = premiereMs(o.premiere);
    if (Date.parse(o.snapshots[0].ts) - prem > age) continue;
    if (Date.parse(o.snapshots[o.snapshots.length-1].ts) - prem < age) continue;
    let best = null;
    for (const s of o.snapshots) {
      const t = Date.parse(s.ts);
      if (t - prem <= age && (!best || t > best.t)) best = { t, v: Object.values(s.byDest).reduce((a,m)=>a+(m.views||0),0) };
    }
    if (best) peers.push(best.v);
  }
  if (!peers.length) return null;
  peers.sort((a,b)=>a-b);
  const med = peers[Math.floor(peers.length/2)];
  if (med <= 0) return null;
  const pct = Math.round(((e.latest.total - med) / med) * 100);
  return { pct, n: peers.length };
}

function buildBoard() {
  const isLive = state.view === "live";
  const board = document.getElementById("board");
  board.innerHTML = "";
  // newest episode always first, descending from there
  const ordered = [...EPS].reverse();
  const visible = state.showAllCards ? ordered : ordered.slice(0, CARD_CAP);
  const hiddenCount = ordered.length - visible.length;
  for (const e of visible) {
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.slug = e.slug;
    let big = "", sub = "", subCls = "";
    if (isLive) {
      if (e.live) {
        big = `${e.live.peak} <small>peak live</small>`;
        sub = `avg ${e.live.avg} · ${nfmt(e.live.chatMessages)} chat msgs · ${e.live.durationMin ?? "?"} min`;
      } else {
        big = `<small>no live data</small>`;
        sub = `premiered ${e.premiere.slice(5).replace("-", "/")}`;
      }
    } else {
      big = kfmt(e.latest.total);
      const pace = sameAgeSub(e);
      if (pace) {
        sub = `${pace.pct >= 0 ? "▲" : "▼"} ${Math.abs(pace.pct)}% vs same-age median (of ${pace.n})`;
        subCls = pace.pct >= 0 ? "up" : "down";
      } else {
        sub = `premiered ${e.premiere.slice(5).replace("-", "/")} · no same-age peer yet`;
      }
    }
    card.innerHTML = `
      <span class="ep"><span class="dot" style="background:${color(e)}"></span>E${e.ep}</span>
      ${e.partialHistory && !isLive ? '<span class="flag">◐ late reg</span>' : ""}
      <div class="ttl">${short(e.title)}</div>
      <div class="views">${big}</div>
      <div class="sub ${subCls}">${sub}</div>`;
    card.addEventListener("click", () => {
      state.solo = state.solo === e.slug ? null : e.slug;
      render();
    });
    board.appendChild(card);
  }
  if (hiddenCount > 0 || (state.showAllCards && ordered.length > CARD_CAP)) {
    const more = document.createElement("div");
    more.className = "card more";
    more.style.display = "flex";
    more.style.alignItems = "center";
    more.style.justifyContent = "center";
    more.innerHTML = state.showAllCards
      ? `<div class="sub">Show latest ${CARD_CAP} only</div>`
      : `<div class="sub">Show ${hiddenCount} older episode${hiddenCount === 1 ? "" : "s"} →</div>`;
    more.addEventListener("click", () => {
      state.showAllCards = !state.showAllCards;
      buildBoard();
      syncUI();
    });
    board.appendChild(more);
  }
}

function syncUI() {
  const isLive = state.view === "live";
  for (const b of document.querySelectorAll("#view button")) b.classList.toggle("on", b.dataset.v === state.view);
  for (const b of document.querySelectorAll("#xmode button")) b.classList.toggle("on", b.dataset.v === state.xMode);
  for (const b of document.querySelectorAll("#ymode button")) b.classList.toggle("on", b.dataset.v === state.yMode);
  for (const el of document.querySelectorAll(".growth-only")) el.style.display = isLive ? "none" : "";
  document.getElementById("hint").textContent = HINTS[state.view];
  for (const c of document.querySelectorAll(".card")) {
    c.classList.toggle("solo", state.solo === c.dataset.slug);
    c.classList.toggle("dim", state.solo !== null && state.solo !== c.dataset.slug);
  }
  for (const ch of document.querySelectorAll("#platforms .chip")) {
    const on = state.dests.has(ch.dataset.key);
    ch.classList.toggle("on", on);
    ch.querySelector(".sq").style.background = on ? PLAT_COLORS[ch.dataset.key] : "#3a4458";
  }
  // verdict adapts to the active view
  const v = document.getElementById("verdict");
  if (isLive) {
    const live = DATA.insights.find(i => i.id === "live-peak");
    v.innerHTML = live
      ? `<b>Live:</b> ${live.text.replace(/^Live turnout:\s*/, "")}`
      : `<b>Live session</b> metrics from Restream.`;
  } else {
    const pace = DATA.insights.find(i => i.id === "pace-rank");
    v.innerHTML = pace
      ? `<b>E${NEWEST.ep} — ${short(NEWEST.title)}:</b> ${pace.text.replace(/^[^:]*? is /, "")}`
      : `<b>E${NEWEST.ep} — ${short(NEWEST.title)}</b> is the latest episode.`;
  }
}

document.getElementById("view").addEventListener("click", e => {
  if (e.target.dataset.v) { state.view = e.target.dataset.v; state.solo = null; render(); }
});
document.getElementById("xmode").addEventListener("click", e => {
  if (e.target.dataset.v) { state.xMode = e.target.dataset.v; render(); }
});
document.getElementById("ymode").addEventListener("click", e => {
  if (e.target.dataset.v) { state.yMode = e.target.dataset.v; render(); }
});
document.getElementById("reset").addEventListener("click", () => {
  state.view = "growth"; state.xMode = "weeks"; state.yMode = "cumulative"; state.solo = null;
  state.dests = new Set(Object.keys(PLAT_COLORS));
  render();
});
const plat = document.getElementById("platforms");
for (const k of Object.keys(PLAT_COLORS)) {
  const b = document.createElement("button");
  b.className = "chip on";
  b.dataset.key = k;
  b.innerHTML = `<span class="sq"></span>${PLAT_NAME[k]}`;
  b.addEventListener("click", () => {
    if (state.dests.has(k)) {
      if (state.dests.size > 1) state.dests.delete(k);
    } else state.dests.add(k);
    render();
  });
  plat.appendChild(b);
}

const panel = document.getElementById("insights");
for (const ins of DATA.insights) {
  if (ins.id === "pace-rank") continue;
  const div = document.createElement("div");
  div.className = "insight";
  div.innerHTML = `${ins.text} <span class="go">show me →</span>`;
  div.addEventListener("click", () => {
    const cs = ins.chartState || {};
    state.view = cs.view || "growth";
    state.xMode = cs.xMode || "weeks";
    state.yMode = cs.yMode || "cumulative";
    state.solo = cs.solo || null;
    state.dests = new Set(cs.dests || Object.keys(PLAT_COLORS));
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
  panel.appendChild(div);
}

document.getElementById("stamp").textContent =
  `${EPS.length} episodes · data as of ${DATA.generatedAt.replace("T"," ").slice(0,16)} UTC · updates daily, full refresh Mondays`;

render();
</script>
</body>
</html>
