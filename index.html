        interaction: { mode: "nearest", intersect: true },
        scales: {
          x: { ticks: { color: FG2, font: { size: 12, weight: 500 } }, grid: { display: false }, border: { display: false } },
          y: { beginAtZero: true, title: { display: true, text: "Total views gained", color: FG3, font: { family: FONT, size: 12 } },
            ticks: { padding: 8, callback: v => kfmt(v) }, grid: { color: GRID, drawTicks: false }, border: { display: false } },
        },
        plugins: { legend: { display: false }, tooltip: { enabled: false, external: externalTooltip } },
        onClick: clickSolo,
      },
    };
    cfg.plugins = [comparisonHover];
    if (chart) chart.destroy();
    chart = new Chart(document.getElementById("chart"), cfg);
    document.getElementById("tt").style.opacity = 0;
    return;
  }

  const newestSeriesSlug = state.mode === "race"
    ? [...source].reverse().find((e) => seriesFor(e).length)?.slug
    : NEWEST.slug;
  const datasets = source.map((e) => {
    const isNewest = e.slug === newestSeriesSlug;
    const soloed = state.solo === e.slug;
    const hidden = false; // a selection is focus + context: the others stay as gray context
    // emphasis form (live AND pacing race): the newest episode keeps its
    // color, priors recede to one context gray until soloed — the question
    // both views answer is "newest vs typical", not "six equal series"
    // one focus: the selected episode, else the newest with history
    const deemph = state.solo ? !soloed : !isNewest;
    const base = { border: deemph ? DIMLINE : color(e), lab: deemph ? FG3 : color(e), width: deemph ? 1.5 : 2, ord: deemph ? 1 : 0 };
    return {
      label: label(e),
      epNum: e.ep,
      slug: e.slug,
      data: isLive ? e.live.series.map(p => ({ x: p.m, y: p.v, meta: p })) : seriesFor(e),
      borderColor: base.border,
      labelColor: base.lab,
      backgroundColor: isDelta ? (deemph ? CONTEXT : FOCUS) : "transparent",
      borderWidth: base.width,
      pointRadius: 0,
      pointHoverRadius: 5,
      tension: 0.3, spanGaps: false, hidden,
      baseBorderColor: base.border, baseLabelColor: base.lab, baseWidth: base.width,
      baseOrder: base.ord, hoverColor: color(e),
      episode: e,
      pastOnly: state.mode === "race",
      order: base.ord, // newest drawn on top
      barThickness: isDelta ? 14 : undefined,
    };
  });

  // Announce receipts (PRD v2 W6): each host's X announce post as a triangle
  // on the chart floor — a views bump gets a visible cause candidate. Markers
  // sit at y=0 on purpose: plotting them on the line would fake a data point.
  if (isRace) {
    const mpts = [];
    for (const e of source) {
      if (!seriesFor(e).length) continue;
      if (state.solo && state.solo !== e.slug) continue;
      for (const a of e.announces || []) {
        const x = historyDay(e.premiere, Date.parse(a.ts));
        if (!isFinite(x) || x < 0 || x > 60) continue;
        mpts.push({ x, y: 0, acct: a.account });
      }
    }
    if (mpts.length) datasets.push({
      isAnnounce: true, type: "scatter", data: mpts, showLine: false,
      pointStyle: "triangle", pointRadius: 5, pointHoverRadius: 5, pointHitRadius: 0,
      backgroundColor: mpts.map(p => PLAT_COLORS["x:" + p.acct] || FG3),
      borderColor: "transparent", order: 5,
    });
  }

  const cfg = {
    type: isDelta ? "bar" : "line",
    data: { datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      layout: { padding: { right: isDelta ? 8 : 34 } },
      interaction: { mode: "nearest", intersect: false },
      scales: {
        x: {
          type: "linear",
          ticks: {
            padding: 8,
            font: { family: isLive ? MONO : FONT },
            stepSize: isRace ? 7 : undefined,
            callback: v => {
              if (isLive) return v;
              if (isCal) return fmtDate(v);
              if (isRace) return v === 0 ? "premiere" : (v % 7 === 0 && v > 0 ? `${v/7} wk${v/7 > 1 ? "s" : ""}` : "");
              return Number.isInteger(v) ? "week " + (v + 1) : "";
            },
            maxTicksLimit: isCal ? 9 : matchMedia("(max-width: 720px)").matches ? 5 : 24,
            ...(isRace && matchMedia("(max-width: 720px)").matches ? { stepSize: 28 } : {}),
            maxRotation: 0, autoSkip: true,
          },
          grid: { color: GRID, drawTicks: false },
          border: { display: false },
          offset: isDelta,
          max: isRace ? Math.max(7, ...datasets.filter((d) => !d.isAnnounce).flatMap((d) => (d.data || []).map((p) => p.x)).filter(Number.isFinite)) : undefined,
          title: { display: isLive, text: "Minutes into the show", color: FG3, font: { family: FONT, size: 12 } },
        },
        y: {
          beginAtZero: true,
          title: { display: true, text: isLive ? "Concurrent viewers" : "Total views", color: FG3, font: { family: FONT, size: 12 } },
          ticks: { padding: 8, callback: v => kfmt(v) },
          grid: { color: GRID, drawTicks: false },
          border: { display: false },
        },
      },
      plugins: {
        legend: { display: false }, // the episode strip directly above is the legend
        tooltip: { enabled: false, external: externalTooltip },
      },
      onClick: clickSolo,
    },
    plugins: [endLabels, comparisonHover],
  };

  if (chart) chart.destroy();
  chart = new Chart(document.getElementById("chart"), cfg);
  document.getElementById("tt").style.opacity = 0;
}

/* ================= table view (Layer 3: every value, no hover needed) ================= */
function buildTable() {
  const box = document.getElementById("tablebox");
  if (!state.table) { box.style.display = "none"; return; }
  // The table mirrors the SELECTED view: the same question, numbers instead
  // of marks (owner feedback 2026-08-23 — one generic table standing in for
  // five different views read as a mystery). Each measure gets its own
  // columns; the views table serves only the views question.
  const kind = state.mode === "live" || (state.mode === "standings" && state.metric === "live") ? "live"
    : state.mode === "watch" || (state.mode === "standings" && state.metric === "watched") ? "watched"
    : state.mode === "standings" && state.metric === "reach" ? "reach"
    : state.mode === "race" ? "race"
    : "views";
  // watched-vs-typical reads each row's typical from data.baselines (the
  // other three-week-old episodes, outliers and the row itself left out);
  // nothing is computed here (PRD v9 F16)
  const watchedCellFor = (e) => {
    if (!hasYoutubeReading(e) || e.watch?.avgPercent == null) {
      return pendingWatchMessage(e, NEWEST.slug, { compact: true }) || "–";
    }
    const v = e.watch.avgPercent;
    const wTypical = DATA.baselines?.watchPctBySlug?.[e.slug]?.typical ?? null;
    if (wTypical != null && wTypical > 0 && Math.abs(v - wTypical) / wTypical * 100 > QUIET_ZONE) {
      return v > wTypical ? `<span class="st-good">↑${pct1(v)}</span>` : `<span class="st-bad">↓${pct1(v)}</span>`;
    }
    return `<span class="st-mid">${pct1(v)}</span>`;
  };
  // same shape the panel uses for time watched
  const fmtDur = (sec) => sec >= 3600 ? `${Math.floor(sec / 3600)}h ${Math.floor((sec % 3600) / 60)}m` : `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`;
  let html = `<div class="tscroll"><table><tr>`;
  if (kind === "live") {
    html += "<th>Episode</th><th>Peak</th><th>Average</th><th>Watched live</th><th>Minutes watched</th><th>Chat messages</th><th>Chatters</th><th>Length</th></tr>";
    for (const e of [...EPS].reverse()) {
      html += `<tr><td class="t"><span class="tid">E${e.ep}</span><span class="ttl"> · ${esc(short(e.title))}</span></td>`;
      html += e.live
        ? `<td class="t">${metricText(e.live.peak)}</td><td>${metricText(e.live.avg)}</td><td>${metricText(e.live.liveViews)}</td><td>${metricText(e.live.watchedMin)}</td><td>${metricText(e.live.chatMessages)}</td><td>${metricText(e.live.chatters)}</td><td>${e.live.durationMin == null ? "–" : nfmt(e.live.durationMin) + " min"}</td>`
        : `<td colspan="7" class="gap">live data is not available</td>`;
      html += "</tr>";
    }
  } else if (kind === "watched") {
    html += `<th>Episode</th><th>Watched</th><th>${PLOGO.yt} Dive Club</th><th>${PLOGO.yt} DesignerTom</th><th>Avg time</th><th>Total time</th></tr>`;
    for (const e of [...EPS].reverse()) {
      html += `<tr><td class="t"><span class="tid">E${e.ep}</span><span class="ttl"> · ${esc(short(e.title))}</span></td>`;
      if (!hasYoutubeReading(e) || !e.watch) {
        html += `<td colspan="5" class="gap">${esc(pendingWatchMessage(e, NEWEST.slug) || "Watch report not available.")}</td></tr>`;
        continue;
      }
      const by = (key) => e.watch.byChannel?.find((c) => c.key === key)?.avgPercent;
      html += `<td class="t">${watchedCellFor(e)}</td>`;
      html += `<td>${by("yt:joindiveclub") == null ? "–" : pct1(by("yt:joindiveclub"))}</td>`;
      html += `<td>${by("yt:designertom") == null ? "–" : pct1(by("yt:designertom"))}</td>`;
      html += `<td>${e.watch.avgDurationSec == null ? "–" : fmtDur(e.watch.avgDurationSec)}</td>`;
      html += `<td>${e.watch.minutesWatched == null ? "–" : nfmt(Math.round(e.watch.minutesWatched / 60)) + " h"}</td></tr>`;
    }
  } else if (kind === "reach") {
    html += `<th>Episode</th><th>${PLOGO.x} @ridd_design</th><th>${PLOGO.x} @designertom</th><th>Total reach</th></tr>`;
    for (const e of [...EPS].reverse()) {
      const bd = e.latest.byDest || {};
      html += `<tr><td class="t"><span class="tid">E${e.ep}</span><span class="ttl"> · ${esc(short(e.title))}</span></td>`;
      html += `<td class="t">${bd["x:ridd_design"]?.views == null ? "–" : nfmt(bd["x:ridd_design"].views)}</td>`;
      html += `<td>${bd["x:designertom"]?.views == null ? "–" : nfmt(bd["x:designertom"].views)}</td>`;
      html += `<td>${e.latest.xImpressions == null ? "–" : nfmt(e.latest.xImpressions)}</td></tr>`;
    }
  } else if (kind === "race") {
    html += `<th>Episode</th><th>History</th><th>Total views now</th><th>${PLOGO.yt} now</th><th>${PLOGO.x} plays now</th></tr>`;
    for (const e of [...EPS].reverse()) {
      html += `<tr><td class="t"><span class="tid">E${e.ep}</span><span class="ttl"> · ${esc(short(e.title))}</span></td>`;
      html += `<td class="t">${e.historyReady ? "ready" : "waiting for full-day read"}</td>`;
      html += `<td>${metricText(displayedTotal(e))}</td>`;
      html += `<td>${metricText(youtubeValue(e, e.latest.ytTotal))}</td>`;
      html += `<td>${metricText(e.latest.xPlays)}</td></tr>`;
    }
  } else {
    html += `<th>Episode</th><th>Health</th><th>Total views</th><th>${PLOGO.yt} Dive Club</th><th>${PLOGO.yt} DesignerTom</th><th>${PLOGO.x} ridd plays</th><th>${PLOGO.x} tom plays</th><th>Watched</th><th>${PLOGO.yt} Pace vs typical</th></tr>`;
    // episode scores are each against a different set of earlier episodes —
    // one neutral colour, never the show-health bands (PRD v9 F17)
    for (const e of [...EPS].reverse()) {
      const bd = e.latest.byDest || {};
      const mk = heroMarker(e);
      const pace = sameAgeSub(e);
      const healthCell = healthOf(e)
        ? `<span class="st-mid">${healthOf(e).score}</span>`
        : "–";
      html += `<tr><td class="t"><span class="tid">E${e.ep}</span><span class="ttl"> · ${esc(short(e.title))}</span></td>`;
      html += `<td class="t">${healthCell}</td>`;
      html += `<td class="t">${metricText(displayedTotal(e))}${mk ? ` <span class="mk">${mk}</span>` : ""}</td>`;
      html += `<td>${metricText(youtubeValue(e, bd["yt:joindiveclub"]?.views))}</td><td>${metricText(youtubeValue(e, bd["yt:designertom"]?.views))}</td>`;
      html += `<td>${bd["x:ridd_design"]?.plays == null ? "–" : nfmt(bd["x:ridd_design"].plays)}</td>`;
      html += `<td>${bd["x:designertom"]?.plays == null ? "–" : nfmt(bd["x:designertom"].plays)}</td>`;
      html += `<td>${watchedCellFor(e)}</td>`;
      html += `<td>${pace ? `<span class="${Math.abs(pace.pct) <= QUIET_ZONE ? "st-mid" : pace.pct > 0 ? "st-good" : "st-bad"}">${(pace.pct >= 0 ? "+" : "−") + Math.abs(pace.pct) + "%"}</span>` : "–"}</td></tr>`;
    }
  }
  html += "</table></div>";
  if (kind === "watched" || kind === "views") html += `<p class="tcap">↑ ↓ mark a share watched above or below the typical episode</p>`;
  box.innerHTML = html;
  box.style.display = "block"; // stylesheet default is none — must set explicitly
  // the columns scroll inside .tscroll; its right edge fades while more columns wait
  const fade = () => { const sc = box.querySelector(".tscroll"); if (sc) sc.classList.toggle("more-right", sc.scrollLeft + sc.clientWidth < sc.scrollWidth - 1); };
  fade();
  box.querySelector(".tscroll").addEventListener("scroll", fade, { passive: true });
  if (!box.dataset.fade) { box.dataset.fade = "1"; window.addEventListener("resize", fade); }
}

/* M-1: the per-week view silently rendered nothing for episodes first tracked
   this week — say so instead of showing an unexplained empty state. */
function buildEmptyNote() {
  const el = document.getElementById("emptynote");
  el.style.display = "none";
  if (state.mode === "live" || state.mode !== "delta" || state.table) return;
  const waiting = historyWaitScope();
  const missing = EPS.filter(e => e.historyReady && weeklyWithViews(e).length === 0);
  if (!waiting && !missing.length) return;
  const next = new Date(mondayNoonAfter(Date.now()) - PHX);
  const when = next.toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" });
  // in the scope line, IN VIEW — not a note below 440px of empty grid
  const notes = [waiting];
  if (missing.length) notes.push(`${missing.map(e => "E" + e.ep).join(", ")} first tracked this week — their weekly bars appear after ${when}`);
  document.getElementById("cscope").textContent = notes.filter(Boolean).join(" · ");
}
function mondayNoonAfter(ms) {
  const shifted = new Date(ms - PHX);
  const noon = Date.UTC(shifted.getUTCFullYear(), shifted.getUTCMonth(), shifted.getUTCDate(), 12) + PHX;
  const dow = shifted.getUTCDay();
  let candidate = noon - ((dow + 6) % 7) * DAY;
  while (candidate <= ms) candidate += WEEK;
  return candidate;
}

function applyChartState(cs) {
  if (cs.view === "live" || cs.mode === "live") { state.mode = "live"; }
  else {
    // Weekly-gains (delta) chart removed 2026-08-22 (owner: "only YouTube and

    const chartKind = cs.chart || (cs.yMode === "delta" || cs.xMode === "calendar" ? "trajectory" : "standings");
    state.mode = chartKind === "standings" ? "standings" : "race";
    state.byDate = cs.xMode === "calendar";

function buildInsightsPanel() {
  const panel = document.getElementById("insights");
  panel.innerHTML = "";
  // W35: ranked items (the five things to do this week, from today's read)
  // keep their stored order; anything unranked follows, grouped by category
  const all = DATA.insights
    .map(i => ({ ...i, cat: catKeyFor(i) }))
    .sort((a, b) => (a.rank ?? 99) - (b.rank ?? 99) || (CAT_RANK[a.cat] ?? 9) - (CAT_RANK[b.cat] ?? 9));

  // Every insight shows, always (owner directive 2026-08-23): no top-3 fold,
  // no expander, no outer group headers. build-data ships at most five
  // (owner directive 2026-09-01, restated 2026-09-29). Like categories sit together (the
  // sort above), every card carries its category label inside its container,
  // and the shared grid gap is the only rhythm.
  // metrics and key callouts read bold (owner directive 2026-08-23) — same
  // anchor idea as the evidence bullets, applied at render time only: number
  // tokens (ranges and % included), episode refs, and the channel names.
  // The validated store text itself never changes.
  const emphasize = (text) => esc(text)
    .replace(/\d{1,3}(?:,\d{3})*(?:\.\d+)?(?:[–-]\d{1,3}(?:,\d{3})*(?:\.\d+)?)?%?/g, (m) => `<b>${m}</b>`)
    .replace(/\bE<b>(\d+)<\/b>/g, "<b>E$1</b>")
    .replace(/\b(Dive Club|DesignerTom|@ridd_design|@designertom)\b/g, "<b>$1</b>");
  const add = (ins) => {
    const cat = CATS[ins.cat];
    const div = document.createElement("div");
    div.className = "insight";
    // Today's Do next rows land here (#actions/<id>); the card takes focus when they do
    if (ins.id) { div.id = `act-${ins.id}`; div.tabIndex = -1; }
    // The Actions page leads with the action (PRODUCT.md: lead with the
    // decision, then reveal the evidence): the recommendation first, the
    // finding under it as its reason, how it is counted one tap away.
    // owner directive 2026-09-01: the category alone — no "helps <check>" eyebrow
    const lead = ins.recommendation || ins.text;
    const why = ins.recommendation ? ins.text : "";
    div.innerHTML = `<span class="ic">${ins.rank ? `<b class="rk">${ins.rank}</b>` : cat.svg}</span>
      <span class="body"><div class="cat">${cat.name}</div>
      <p class="lead">${emphasize(lead)}</p>
      ${why ? `<p class="why">${emphasize(why)}</p>` : ""}
      ${ins.caveat ? `<button type="button" class="rec-toggle" aria-expanded="false">How this is counted${IC('<path d="M6.5 9.5 12 15l5.5-5.5"/>', "rchev")}</button><div class="more" inert><div><div class="cav">${esc(ins.caveat)}</div></div></div>` : ""}</span>`;
    div.querySelector(".rec-toggle")?.addEventListener("click", (ev) => {
      const open = div.classList.toggle("open");
      ev.currentTarget.setAttribute("aria-expanded", String(open));
      const more = div.querySelector(".more");
      if (open) more.removeAttribute("inert"); else more.setAttribute("inert", "");
    });
    panel.appendChild(div);
  };

  for (const ins of all) add(ins);
  const ranked = all.some((i) => i.rank);
  document.getElementById("insightsmeta").textContent = ranked
    ? "What to do this week, biggest lever first."
    : "What to do this week, most timely first.";
  document.getElementById("actionsmeta").textContent = ranked
    ? `${all.length} action${all.length === 1 ? "" : "s"} for this week, biggest lever first`
    : "What to do this week";
}

/* ================= about ================= */
function buildAbout() {
  document.getElementById("aboutbody").innerHTML = `
  <h3 id="ab-show">Show health</h3>
  <p><b>Show health</b> is saved once a day and reads the newest episode at its age against this show’s usual levels — a today read, not a running total over any fixed stretch of days. The score and checks come from the day’s checked facts. The headline and evidence use model wording when available; when it is unavailable, validated fixed wording uses the same facts for that day’s read. If neither wording path passes validation, the previous dated read remains and the refresh reports a failure.</p>
  <p>Seven checks feed it (growth, audience quality, reach, live turnout, participation, subscribers, goodwill); each check is a pill whose dot shows its state — amber fragile, gray steady, green healthy, hollow when the check has no reading yet — with the fragile ones first, and only the checks that are honestly available on the saved date count. A promo-driven lift — a launch or an X reach more than double what a typical episode gets at the same age — is shown with its numbers but never scored, so promotion can neither flatter nor punish the number. A check that has to read an older episode because the newest is too young is carried at half weight and says which episode it read.</p>
  <p>Live turnout reads the whole live session — peak and average viewers, how many people watched live, and the minutes they watched all together; participation reads chatters per hundred people at the peak, chat messages an hour, how many minutes each live viewer stayed, and how much of the peak audience was still there in the last ten minutes, so a short show and a long one compare. Reach adds the share of YouTube views that YouTube itself brought through search and suggested videos.</p>
  <p>Each check’s state word comes from bands fitted to how much that check normally swings between episodes — never narrower than ten percent either side of usual, never wider than thirty — so a small dip on a measure that always jumps around reads steady, and the same dip on a measure that usually holds still reads fragile; the details behind each check say where its bands sit and why. Beside the score the band carries a direction word — building, holding, softening, or mixed — read from how each durable measure moved over the last few clean episodes, and the Where it’s heading column lists each one, with the range the next first week is expected to land in if it follows the last three clean launches: an expectation, never a result.</p>
  <p>Missing checks drop out instead of becoming zero, and the remaining checks share their weight (goodwill keeps its own weight, so an absent check can never lift it). Every check compares like with like: at the same age, or — until enough same-age history exists — as the earlier episodes stand now, and the row’s details say which. Typical means the last eight comparable episodes with promo outliers left out, and it needs at least three of them; a check with fewer shows Not in yet. When the saved read is behind the data the header says so, and after a week without a fresh read the score is withheld rather than shown as today’s. Each helping or needs-work bullet carries one stored number. A trend appears only after a week of real saved scores; missing days are never filled in.</p>
  <p>Hover, tap, or tab to any check’s name for the saved numbers behind it: the newest result against the show’s typical level, or the reason a check isn’t in yet. Today’s read shows the day’s saved headline; Expand opens the evidence behind the score — the helping and needs-work facts, the saved reasoning, and the saved scores since the first read under the current rules, drawn on a fixed scale with the usual level marked — and the top do-next actions, in order, with All actions leading to the full list and the finding behind each one.</p>
  <p>The set of checks feeding the score can itself change between saved reads — a scoring rule ships, or a check gains or loses the history it needs — and when that happens the evidence under Expand says so, because a number resting on different checks is a different read even when it lands in the same place. Saved reads keep the scoring-rule version they were written under, and the trend only ever connects reads written under the same rules. The episode cards answer the longer question: each finished three-week score is permanent, so reading them left to right shows whether episodes keep clearing the show’s own bar.</p>
  <h3 id="ab-views">Views and reach</h3>
  <p><b>Total views</b> = YouTube views (both channels) + plays from resolved X broadcasts (both hosts). Native videos and teaser clips attached to posts are excluded. Both included sources count video playback — YouTube counts a qualified view (~30s), X counts a broadcast play start, so treat the sum as directional. If YouTube has not reported views yet, its startup zeros are shown as missing and do not start the episode’s history.</p>
  <p><b>X reach</b> = impressions on the hosts' announce posts — the X posts that carry the live broadcast. An impression is one appearance on a timeline — exposure, not watching. Reach is <b>never</b> added into any views number, anywhere. <b>Promo posts</b> (teasers, clips, links to the upload) are listed beside reach on each episode and never added in, because how many an episode gets varies; they were not searched for before E6. X readings from before Sep 4 that blend an announce and a promo post on one account cannot be split and are left out of comparisons.</p>
  <p><b>UX Tools email clicks</b> count clicks on an exact episode link in the newsletter. Beehiiv’s verified count leaves out clicks it could not confirm. These clicks show promotion and are never added to views.</p>
  <p><b>partial</b> beside a total = X plays recovered from only some of the episode’s broadcasts (the true total is higher). <b>old</b> = X plays last confirmed on an earlier date (the broadcast is no longer reachable; the highest confirmed figure is kept — absence is never shown as zero). <b>tracked late</b> = tracking began after the episode aired: all-time totals are right, early weekly history doesn't exist, and the episode stays out of early-growth comparisons.</p>
  <h3 id="ab-charts">Charts and comparisons</h3>
  <p><b>Chart measures</b>: the Totals view can chart total views, share watched (YouTube only), average live viewers (hover a bar for that episode’s lowest and highest), or X reach — each in its own unit, and never added together. Views after release adds YouTube views and X broadcast plays only when every watch destination has a stored count; history begins the morning after air day. Move anywhere over a chart to compare every episode at a saved reading near that point; views after release uses the latest reading already reached. Move onto a line or bar for that episode’s channel detail. The small YouTube and X marks stand for the platforms wherever space is tight; hover any mark for its meaning.</p>
  <p><b>Pace</b> compares YouTube views at the same age across episodes, with promo outliers left out. It appears only after three other episodes have real data at that age. X plays have no history before Aug 21, so mixing them into pace would invent a disadvantage for older episodes.</p>
  <p><b>Promo outliers</b> are episodes where YouTube views, X plays, or X reach came in at more than double what nearby episodes did at the same age (read at three weeks; earlier than that the test is an early read). They are left out of host, announce, topic, and typical comparisons — but they stay in the all-show totals, because those count every real watch.</p>
  <p><b>Launch</b> is each episode’s first-week standing in one word: its YouTube views at the end of its first week — or at its earliest reading for episodes tracked late, or at its current age while it is under a week old, marked "so far" — against the other episodes at that same age, promo outliers left out, and only with three others to compare; strong means more than a tenth above the typical, soft more than a tenth below. A promo-driven launch keeps its word and says so. It is a standing, not a score: it can move while an episode is young and it never replaces the three-week read.</p>
  <h3 id="ab-episode">Episode health</h3>
  <p><b>Episode health</b> (0–100) is each episode’s own three-week report card. It is written once the episode’s first 21 days — the point where growth flattens — are over, and it never changes after that: an episode is judged against the eight episodes that aired before it, promo outliers left out, and only when at least three of them can be compared — so later episodes never rewrite an old score. Two episodes’ scores were measured against different earlier episodes, so a higher score means it beat its own bar by more, not that it was the better episode. 50 means it landed right where the show usually did; higher beat that bar, lower missed it.</p>
  <p>Six checks share the score: YouTube views at three weeks against earlier episodes at the same age (35%), likes and comments per 1,000 views (15%), how much of the video people watch (15%), live turnout (15%), subscribers gained per 1,000 views (10%), and how positive the feedback reads (10%). A check with no honest number drops out and the others share its weight — nothing is guessed or filled with zero, and such a check simply does not appear on the page. Views use YouTube only because older X play history does not exist. Nothing shows for an episode until its three weeks are complete, and the first episode sets the bar rather than receiving a score.</p>
  <p>In the episode panel, a green <b>+</b> or red <b>−</b> percentage says how far above or below the show’s typical level the episode landed, and <b>typical</b> means right at it; hover or tap any label or mark for its definition. Watch and subscriber numbers exist per channel as well as blended — the panel shows each channel’s share watched beside the blend, in the channel’s color.</p>
  <h3 id="ab-watching">Watching</h3>
  <p><b>Watching</b> comes from the verified YouTube analytics both hosts signed in to — not public counters. The share watched averages the two channels together, weighted by their views. The watch curve shows how much of the audience is still watching at each point of the video, blended the same way; the dashed line in the Watching view is a typical episode, drawn only once three episodes have real curves. Small pins on the panel’s curve are the moments the audience moved most — below the line where the most people left, above it where extra people were watching (a spot people skip to). Hover, tap, or tab to one for a short written note on what was being discussed at that stretch of the show; a model writes the note from the transcript, and moment timing comes from the live recording, so read both as close, not exact. Watch data is YouTube only — X does not report it — and an episode whose report has not arrived says Waiting for YouTube instead of showing a zero.</p>
  <h3 id="ab-feedback">Audience feedback</h3>
  <p><b>Live chat and X threads</b> are captured alongside YouTube feedback. Their displayed totals count messages, not distinct people; mixed reactions appear in both positive and criticism lists. Live-chat names are supplied by Restream, which may anonymize them. Only confidently classified feedback is shown; the full source archive is retained privately. Expanded conversation and chat feedback does not change historical health scores or commenting rates.</p>
  <p><b>Scored audience feedback</b> starts with YouTube comments and reply threads from both channels, plus X replies to the announce posts. A model removes spam, unrelated chatter, bare mentions, and questions that do not judge the show. Unclear labels are held for review and never shown. Praise, complaints, and mixed reactions are stored once; a mixed reaction appears in both reading lists with a ± mark. Theme counts are distinct people, and a theme stays hidden until at least three people share it. Neutral suggestions count toward how many people commented, but their text does not appear. Featured quotes must be praise and must also pass a separate negative-word check. Episodes from before X reply tracking say that replies are missing rather than showing a false zero.</p>
  <h3 id="ab-chapters">Chapters</h3>
  <p><b>Chapters</b> are model-written from each transcript and every timestamp and quote is checked against it. A timestamp links into the YouTube upload only when the transcript runs on that upload’s clock.</p>
  <h3 id="ab-actions">Actions</h3>
  <p><b>Actions</b> lists at most five current actions for this week, in order — written by a model over the day’s show-health read (each check’s state, which way every measure is heading, the outlook, each launch word) and the full fact sheet, with the biggest lever first. Every number in an item is copied from a stored fact; an item whose numbers move out from under it is held back rather than shown. Each card leads with the action, the finding under it is the reason, and How this is counted opens the note on how its numbers were read. The category on each item is the decision it informs. The same-age pace of the newest episode stays on its card and in the chart standings. The first two current actions also appear in the health card’s Do next area. When no written list is current, it shows the five most timely fixed-rule findings instead — the newest episode’s own standing first — grouped by the decision they inform.</p>
  <h3 id="ab-cadence">When numbers update</h3>
  <p><b>Cadence</b>: snapshots every morning at 7:00 Phoenix, full refresh Mondays; new episodes are discovered and registered automatically. Every active episode keeps receiving fresh replay counters, including episodes older than 60 days. Historical readings and air-night live totals stay unchanged. YouTube’s analytics arrive two to three days late for every episode alike, so “three weeks in” means the numbers as they stood about then.</p>`;
}

// About's in-page index (from 64rem): one button per section — buttons, not
// hash links, so the page router never sees them; the section in view is marked
function buildAboutNav() {
  const nav = document.getElementById("aboutnav");
  const heads = [...document.querySelectorAll("#aboutbody h3")];
  nav.innerHTML = `<h2>On this page</h2>${heads.map((h) => `<button type="button" data-to="${h.id}">${esc(h.textContent)}</button>`).join("")}`;
  nav.addEventListener("click", (ev) => {
    const b = ev.target.closest("button[data-to]");
    if (b) document.getElementById(b.dataset.to).scrollIntoView({ block: "start", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  });
  const mark = () => {
    let current = heads[0];
    for (const h of heads) if (h.getBoundingClientRect().top < window.innerHeight * 0.35) current = h;
    for (const b of nav.querySelectorAll("button")) {
      if (b.dataset.to === current?.id) b.setAttribute("aria-current", "true"); else b.removeAttribute("aria-current");
    }
  };
  window.addEventListener("scroll", () => { if (document.body.dataset.page === "about") mark(); }, { passive: true });
  mark();
}

/* ================= sync / events ================= */
function syncUI() {
  const isLive = state.mode === "live";
  const isTraj = !isLive && state.mode === "race";
  const view = currentView();
  for (const o of document.querySelectorAll("#viewmenu .vopt")) {
    const selected = o.dataset.view === view.key;
    o.classList.toggle("on", selected);
    o.setAttribute("aria-selected", String(selected));
  }
  const bd = document.getElementById("bydate");
  bd.style.display = isTraj ? "" : "none";
  bd.classList.toggle("on", state.byDate);
  const at = document.getElementById("astable");
  at.classList.toggle("on", state.table);
  at.setAttribute("aria-pressed", String(state.table));
  // the heading always IS the picker, and it always names the data — the
  // Table toggle only swaps the drawing for the numbers. The menu is closed
  // only by pickView, Escape/Tab, or a true outside click — never by a
  // render, so opening it with an episode selected works.
  const chartbox = document.getElementById("chartbox");
  chartbox.style.display = state.table ? "none" : "";
  // solo collapse applies to the totals view only — line views already give
  // the soloed episode the full canvas
  chartbox.classList.toggle("mini", !isLive && state.mode === "standings" && !!state.solo && !state.table);
  const changed = state.table || state.panel || state.solo || (!isLive && (state.mode !== "standings" || state.metric !== "views" || state.byDate));
  document.getElementById("reset").style.display = changed ? "" : "none";
  for (const c of document.querySelectorAll(".sitem")) {
    c.classList.toggle("solo", state.solo === c.dataset.slug);
    c.classList.toggle("dim", state.solo !== null && state.solo !== c.dataset.slug);
  }
}

document.getElementById("bydate").addEventListener("click", () => { state.byDate = !state.byDate; render(); });
// the chart is reachable without a pointer: Tab focuses it, ← → step through the
// episodes (each step selects one and opens its panel), Escape clears; touch
// selects with a tap. The readout line under the plot says which applies.
{
  const canvas = document.getElementById("chart");
  canvas.tabIndex = 0;
  canvas.setAttribute("role", "img");
  canvas.addEventListener("keydown", (ev) => {
    const order = state.mode === "live" ? EPS.filter((e) => e.live) : EPS;
    if (!order.length) return;
    const at = order.findIndex((e) => e.slug === state.solo);
    let next = null;
    if (ev.key === "ArrowRight" || ev.key === "ArrowDown") next = order[at < 0 ? order.length - 1 : Math.min(order.length - 1, at + 1)];
    else if (ev.key === "ArrowLeft" || ev.key === "ArrowUp") next = order[at < 0 ? order.length - 1 : Math.max(0, at - 1)];
    else if (ev.key === "Home") next = order[0];
    else if (ev.key === "End") next = order[order.length - 1];
    if (!next) return;
    ev.preventDefault();
    state.solo = next.slug; state.panel = next.slug;
    render();
    canvas.focus();
  });
}
document.getElementById("astable").addEventListener("click", () => { state.table = !state.table; render(); });

/* ---- view dropdown: the heading is the control (listbox pattern) ---- */
const viewBtn = document.getElementById("viewbtn");
const viewMenu = document.getElementById("viewmenu");
(function buildViewMenu() {
  let lastGroup = null;
  for (const v of VIEW_DEFS) {
    if (v.group !== lastGroup) {
      if (lastGroup !== null) {
        const sep = document.createElement("div");
        sep.className = "vsep"; sep.setAttribute("role", "separator");
        viewMenu.appendChild(sep);
      }
      const g = document.createElement("div");
      g.className = v.group ? "vgroup" : "vsep";
      if (v.group) g.textContent = v.group;
      g.setAttribute("role", "presentation");
      viewMenu.appendChild(g);
      lastGroup = v.group;
    }
    const o = document.createElement("button");
    o.type = "button";
    o.className = "vopt";
    o.setAttribute("role", "option");
    o.dataset.view = v.key;
    o.innerHTML = `<span class="vtick" aria-hidden="true">${ICONS.check}</span>${esc(v.title)}`;
    o.addEventListener("click", () => { pickView(v.key); });
    viewMenu.appendChild(o);
  }
})();
function pickView(key) {
  const v = VIEW_DEFS.find((x) => x.key === key);
  if (!v) return;
  // the picker only decides WHAT is on screen; the Table toggle decides how
  // it renders, and survives a view switch. A prior episode drill does not
  // carry into a new comparison and hide every other episode — especially
  // when the selected episode's delayed watch report has not arrived yet.
  const changed = currentView().key !== v.key;
  state.mode = v.mode; state.metric = v.metric;
  if (changed) { state.solo = null; state.panel = null; }
  closeViewMenu({ focus: true });
  render();
}
function openViewMenu() {
  viewMenu.hidden = false;
  viewBtn.setAttribute("aria-expanded", "true");
  const on = viewMenu.querySelector('.vopt[aria-selected="true"]') || viewMenu.querySelector(".vopt");
  on?.focus();
}
function closeViewMenu({ focus = false } = {}) {
  if (viewMenu.hidden) return;
  viewMenu.hidden = true;
  viewBtn.setAttribute("aria-expanded", "false");
  if (focus) viewBtn.focus();
}
viewBtn.addEventListener("click", () => { viewMenu.hidden ? openViewMenu() : closeViewMenu(); });
viewBtn.addEventListener("keydown", (ev) => {
  if (ev.key === "ArrowDown" || ev.key === "ArrowUp") { ev.preventDefault(); openViewMenu(); }
});
viewMenu.addEventListener("keydown", (ev) => {
  const opts = [...viewMenu.querySelectorAll(".vopt")];
  const at = opts.indexOf(document.activeElement);
  if (ev.key === "Escape") { ev.preventDefault(); closeViewMenu({ focus: true }); }
  else if (ev.key === "ArrowDown") { ev.preventDefault(); opts[Math.min(at + 1, opts.length - 1)]?.focus(); }
  else if (ev.key === "ArrowUp") { ev.preventDefault(); opts[Math.max(at - 1, 0)]?.focus(); }
  else if (ev.key === "Home") { ev.preventDefault(); opts[0]?.focus(); }
  else if (ev.key === "End") { ev.preventDefault(); opts.at(-1)?.focus(); }
  else if (ev.key === "Tab") closeViewMenu();
});
document.addEventListener("click", (ev) => { if (!ev.target.closest?.(".ctsel")) closeViewMenu(); });
// reset is scoped to the current tab (it no longer teleports Live → Growth)
document.getElementById("reset").addEventListener("click", () => {
  state.mode = "standings"; state.metric = "views"; state.byDate = false; state.solo = null; state.panel = null; state.table = false;
  render();
});
const stamp = document.getElementById("stamp");
{
  const when = relativeDayWords(phoenixDateKey(DATA.generatedAt));
  // dot state is honest: green only when the data really is from today; when
  // the saved show-health read is behind the data it says so (D5 — the date
  // lives in the hover title, so no digit is added above the fold)
  const h = DATA.health;
  const behind = h && Number.isFinite(h.ageDays) && h.ageDays >= 1;
  // Data is current until the next scheduled publish is missed: the morning
  // run lands by about 07:05 Phoenix and the recovery check retries at 08:15,
  // so yesterday's data is on time until 08:45 Phoenix (UTC−7) today. Only a
  // missed publish or a health read behind the data turns the dot amber.
  const [gy, gm, gd] = phoenixDateKey(DATA.generatedAt).split("-").map(Number);
  const late = Date.now() > Date.UTC(gy, gm - 1, gd + 1, 15, 45);
  const current = !late && !behind;
  stamp.innerHTML = `<i class="${current ? "" : "old"}" aria-hidden="true"></i><span class="sfull">Data refreshed ${esc(when)}${behind ? ` · health read is ${h.withheld ? "withheld" : "behind"}` : ""}</span><span class="sshort" aria-hidden="true">${current ? esc(cap(when)) : "Behind"}</span>`;
  stamp.classList.toggle("behind", !current);
  // the system's trust bar: on phones a not-current statement moves under the
  // top bar in short words (the bar keeps the dot and one word)
  const trust = document.getElementById("trust");
  if (!current) {
    const parts = [late ? `No new data since ${esc(when)}` : "", behind ? `health read ${h.withheld ? "withheld" : "behind the data"}` : ""].filter(Boolean);
    trust.innerHTML = `${ICONS.clock}<span>${cap(parts.join(" · "))}</span>`;
    trust.hidden = false;
  }
  stamp.title = `Exact refresh: ${DATA.generatedAt}${h?.date ? ` · health read saved ${h.date}` : ""}`;
  // Every Vercel build keeps its own address and its own data forever. Only the
  // live addresses move to each morning's publish; any other copy holding an
  // earlier day's data says so and links to the live dashboard.
  const LIVE = "https://dive-radio-analytics.vercel.app";
  const LIVE_HOSTS = ["dive-radio-analytics.vercel.app", "dive-radio-analytics-toolbenders.vercel.app", "dive-radio-analytics-git-main-toolbenders.vercel.app"];
  if (/\.vercel\.app$/.test(location.hostname) && !LIVE_HOSTS.includes(location.hostname) && when !== "today") {
    const note = document.getElementById("livecopy");
    note.innerHTML = `<svg class="lcic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9 2.6 18a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg><span>This copy is not the live dashboard. Its data is from ${esc(when)}.</span><a href="${LIVE}${esc(location.pathname)}">Open the live dashboard</a>`;
    note.hidden = false;
  }
}

buildAbout();
buildAboutNav();
buildInsightsPanel();
render();

/* ================= pages: the system's app shell (rail on desktop, tab bar on phones) =================
   One file, four views behind hash routes. Every surface still renders on
   every state change; the route only decides which view is on screen, so a
   number never differs between pages. #episodes/e12 opens that episode in
   full; the selection survives moving between pages; Back returns the reader
   to where they were on the page they come back to. No element id equals a
   route, so the browser never scrolls to one on its own. */
const PAGES = { today: "Today", episodes: "Episodes", actions: "Actions", about: "About" };
if ("scrollRestoration" in history) history.scrollRestoration = "manual";
// The Episodes page owns the chart's view and the selected episode. Every other
// page reads the newest episode on the default measure, so Today never changes
// with a choice made on another page; leaving Episodes keeps its state aside
// and coming back restores it.
const EPISODE_KEYS = ["solo", "panel", "mode", "metric", "byDate", "table"];
const EPISODE_DEFAULTS = Object.fromEntries(EPISODE_KEYS.map((k) => [k, state[k]]));
let episodesKept = null;
// layout settles after fonts and the chart, so a scroll aimed at the pane or
// a remembered position is applied again once it has
function settleScroll(apply) {
  apply();
  document.fonts.ready.then(() => requestAnimationFrame(() => requestAnimationFrame(apply)));
}
function rememberScroll() {
  // a browser that rate-limits history writes only costs the restore
  try { history.replaceState({ ...(history.state || {}), y: Math.round(window.scrollY) }, ""); } catch { /* keep going */ }
}
// the open episode rides in the address, so Back, a reload or a shared link
// return to it; replacing the entry never adds one to the history
function syncRouteParam() {
  if (document.body.dataset.page !== "episodes") return;
  const open = EPS.find((e) => e.slug === state.panel);
  const want = open ? `#episodes/e${open.ep}` : "#episodes";
  if (location.hash !== want) { try { history.replaceState(history.state, "", want); } catch { /* keep going */ } }
}
function route({ focus = false } = {}) {
  const [key, arg] = location.hash.slice(1).split("/");
  const current = document.body.dataset.page;
  // a hash that names no page never moves the reader off the page they are on
  if (!PAGES[key] && current) {
    try { history.replaceState(history.state, "", `#${current}`); } catch { /* keep going */ }
    syncRouteParam();
    return;
  }
  const page = PAGES[key] ? key : "today";
  for (const view of document.querySelectorAll(".view")) view.hidden = view.dataset.view !== page;
  for (const link of document.querySelectorAll("[data-nav]")) {
    if (link.dataset.nav === page) link.setAttribute("aria-current", "page"); else link.removeAttribute("aria-current");
  }
  const title = document.getElementById("pagetitle");
  title.textContent = PAGES[page];
  document.title = `${PAGES[page]} — Dive Radio`;
  document.body.dataset.page = page;
  closeViewMenu();
  if (current === "episodes" && page !== "episodes") episodesKept = Object.fromEntries(EPISODE_KEYS.map((k) => [k, state[k]]));
  let opened = null;
  let landed = null;
  for (const card of document.querySelectorAll(".insight.landed")) card.classList.remove("landed");
  if (page !== "episodes" && EPISODE_KEYS.some((k) => state[k] !== EPISODE_DEFAULTS[k])) { Object.assign(state, EPISODE_DEFAULTS); render(); }
  if (page === "actions" && arg) {
    landed = document.getElementById(`act-${decodeURIComponent(arg)}`);
    if (landed) landed.classList.add("landed");
  }
  if (page === "episodes") {
    if (episodesKept) { Object.assign(state, episodesKept); episodesKept = null; }
    const ep = /^e(\d+)$/i.exec(arg || "");
    opened = ep ? EPS.find((e) => String(e.ep) === ep[1]) || null : null;
    if (opened) { state.solo = opened.slug; state.panel = opened.slug; }
    // measured while hidden, the row, the chart and the pane re-measure now;
    // a selection that comes with the page lands without the chart's resize animation
    const box = document.getElementById("chartbox");
    box.classList.add("still");
    render();
    requestAnimationFrame(() => requestAnimationFrame(() => box.classList.remove("still")));
    const strip = document.getElementById("strip");
    if (!strip.dataset.landed) { strip.scrollLeft = strip.scrollWidth; strip.dataset.landed = "1"; }
    strip.dispatchEvent(new Event("scroll"));
    fillGridRows(document.querySelector("#panel .pgrid"));
    spaceMoments();
    syncRouteParam();
  }
  const y = history.state?.y;
  if (Number.isFinite(y)) settleScroll(() => window.scrollTo(0, y));
  else if (opened) settleScroll(() => document.getElementById("panel").scrollIntoView({ block: "start" }));
  else if (landed) settleScroll(() => landed.scrollIntoView({ block: "start" }));
  else window.scrollTo(0, 0);
  if (page === "about") window.dispatchEvent(new Event("scroll"));
  // the page's name takes focus, so a screen reader announces where it landed;
  // a Do next row hands focus to the action it opened
  if (landed) landed.focus({ preventScroll: true });
  else if (focus) title.focus({ preventScroll: true });
}
let scrollMemo = 0;
window.addEventListener("scroll", () => { clearTimeout(scrollMemo); scrollMemo = setTimeout(rememberScroll, 150); }, { passive: true });
// the entry being left keeps its scroll position before the address changes
document.addEventListener("click", (ev) => {
  if (ev.target instanceof Element && ev.target.closest('a[href^="#"]')) { clearTimeout(scrollMemo); rememberScroll(); }
}, true);
// the skip link moves focus past the navigation without changing the page
document.querySelector(".skip").addEventListener("click", (ev) => { ev.preventDefault(); document.getElementById("main").focus(); });
window.addEventListener("hashchange", () => route({ focus: true }));
route();
</script>
