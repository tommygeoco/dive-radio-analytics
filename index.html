      const chatTotal = p.meta.ct == null ? "not available" : `${nfmt(p.meta.ct)} messages so far`;
      html += `<div class="chg">Chat: ${chatTotal}${p.meta.c ? ` (+${p.meta.c} this minute)` : ""}</div>`;
      const LIVE_CHAN_COLORS = { "YT Dive Club": "#ff4f5e", "YT DesignerTom": "#ffa14f", "X": "#b7c2d4", "X #2": "#59b0ff" };
      // stored channel labels keep their "YT"/"X" prefix; the mark replaces it on screen
      const chanHTML = (l) => esc(l).replace(/^YT /, `${PLOGO.yt} `).replace(/^X\b/, PLOGO.x);
      const chans = Object.entries(p.meta.byChan || {});
      if (chans.length) {
        html += `<div class="div"></div>`;
        for (const [l, v] of chans) html += `<div class="row"><span class="sq" style="background:${LIVE_CHAN_COLORS[l] || "#94a0b4"}"></span>${chanHTML(l)}<span class="val">${v}</span></div>`;
        html += `<div class="chg" style="margin-top:5px">Restream total across all simulcast destinations</div>`;
      }
    } else {
      // grouped weekly-gains bars carry plain numbers + a parallel metas array;
      // line views carry {x, y, meta} points
      const grouped = isDelta && !state.byDate;
      const yVal = grouped ? item.raw : p.y;
      const meta = grouped ? ds.metas?.[item.dataIndex] : p.meta;
      if (meta == null) { el.style.opacity = 0; return; }
      if (meta.week !== undefined) html += `<div class="meta">Week ${grouped ? meta.week : meta.week + 1} · ${fmtDate(Date.parse(meta.ts))}</div>`;
      else html += `<div class="meta">${meta.day == null ? "" : `Day ${Math.round(meta.day)} · `}${fmtDate(Date.parse(meta.ts))}</div>`;
      html += `<div class="big">${nfmt(yVal)} YT views${isDelta ? " gained" : ""}</div>`;
      if (!isDelta && item.dataIndex > 0) {
        const prev = ds.data[item.dataIndex - 1].y;
        const d = yVal - prev;
        if (d !== 0) html += `<div class="chg">${d >= 0 ? "+" : ""}${nfmt(d)}${prev > 0 ? ` (${d >= 0 ? "+" : ""}${Math.round(d/prev*1000)/10}%)` : ""}</div>`;
      }
      if (meta.split) {
        html += `<div class="div"></div>`;
        for (const k of YT_KEYS) {
          const v = meta.split[k];
          html += `<div class="row"><span class="sq" style="background:${PLAT_COLORS[k]}"></span>${TT_HTML[k] || TT_NAME[k]}<span class="val">${v != null && isDelta && meta.note === null && v >= 0 ? "+" : ""}${metricText(v)}</span></div>`;
        }
      }
      if (meta.note) html += `<div class="note">${meta.note}</div>`;
    }
  }

  el.innerHTML = html;
  el.style.opacity = 1;
  const box = chart.canvas.parentNode;
  const p = chartCursor || { x: tooltip.caretX, y: tooltip.caretY };
  const x = Math.min(Math.max(p.x, 120), box.clientWidth - 130);
  const above = p.y > 190;
  el.style.left = x + "px";
  el.style.top = (p.y + (above ? -14 : 14)) + "px";
  el.style.transform = `translate(-50%, ${above ? "-100%" : "0"})`;
}

let chart;
// Alternate totals measures (owner directive 2026-08-23). Each charts one
// stored per-episode number in its own unit; a missing value draws no bar and
// no label (absence stays silent, never zero).
const CHART_METRICS = {
  watched: { get: (e) => e.watch?.avgPercent ?? null, text: (v) => `${v}%`, tick: (v) => `${v}%`,
    card: (v) => `${v}%`, spoken: (v) => `${v}% of the video watched on average` },
  live: { get: (e) => e.live?.avg ?? null, text: (v) => nfmt(v), tick: (v) => kfmt(v),
    card: (v) => nfmt(v), spoken: (v) => `${nfmt(v)} average live viewers` },
  reach: { get: (e) => e.latest?.xImpressions ?? null, text: (v) => nfmt(v), tick: (v) => kfmt(v),
    card: (v) => kfmt(v), spoken: (v) => `${nfmt(v)} times the announces were seen` },
};
function renderMetricBars(all, ordered, soloed) {
  const M = CHART_METRICS[state.metric];
  const dim = (hex, e) => state.solo && state.solo !== e.slug ? hex + "33" : hex + "d9";
  const cfg = {
    type: "bar",
    data: {
      labels: ordered.map(e => "E" + e.ep),
      datasets: [{
        data: ordered.map(M.get),
        backgroundColor: ordered.map(e => dim(color(e).slice(0, 7), e)),
        borderColor: "#12161f", borderWidth: 1.5, borderSkipped: false, borderRadius: 2,
        barThickness: 22,
      }],
    },
    options: {
      indexAxis: "y",
      responsive: true, maintainAspectRatio: false,
      layout: { padding: { right: 64 } },
      interaction: { mode: "index", axis: "y", intersect: false },
      scales: {
        x: { beginAtZero: true,
          suggestedMax: soloed ? Math.max(...all.map(e => M.get(e) ?? 0)) : undefined,
          ticks: { color: "#8a94a8", callback: v => M.tick(v) }, grid: { color: GRID } },
        y: { ticks: { color: "#b7c1d1", font: { weight: 700 } }, grid: { display: false } },
      },
      plugins: {
        legend: { display: false },
        tooltip: { enabled: false, external: externalTooltip },
      },
      onClick: (_, els) => {
        if (!els.length) return;
        const e = ordered[els[0].index];
        const same = state.solo === e.slug;
        state.solo = same ? null : e.slug;
        state.panel = same ? null : e.slug;
        render();
      },
    },
    plugins: [barTotals],
  };
  cfg._ordered = ordered;
  cfg._valueText = (e) => { const v = M.get(e); return v == null ? null : M.text(v); };
  return cfg;
}
function renderStandings() {
  const all = [...EPS].reverse(); // newest bar on top — the anchor position
  // solo collapse (owner request 2026-08-23): with an episode selected, the
  // totals chart shrinks to that one bar so the open panel shares the
  // viewport; clearing the selection restores the full standings
  const soloRows = state.solo ? all.filter(e => e.slug === state.solo) : [];
  const ordered = soloRows.length ? soloRows : all;
  if (state.metric !== "views" && CHART_METRICS[state.metric]) return renderMetricBars(all, ordered, soloRows.length > 0);
  const SEGS = [
    ["yt:joindiveclub", (e) => e.latest.byDest["yt:joindiveclub"]?.views ?? null],
    ["yt:designertom", (e) => e.latest.byDest["yt:designertom"]?.views ?? null],
    ["x:ridd_design", (e) => e.latest.byDest["x:ridd_design"]?.plays ?? null],
    ["x:designertom", (e) => e.latest.byDest["x:designertom"]?.plays ?? null],
  ];
  // base fills at ~85% alpha: softens the saturated-block read while the
  // 1.5px surface gaps keep segments crisp
  const dim = (hex, e) => state.solo && state.solo !== e.slug ? hex + "33" : hex + "d9";
  const cfg = {
    type: "bar",
    data: {
      labels: ordered.map(e => "E" + e.ep),
      datasets: SEGS.map(([key, val]) => ({
        label: TT_NAME[key],
        key,
        data: ordered.map(val),
        backgroundColor: ordered.map(e => dim(PLAT_COLORS[key], e)),
        borderColor: "#12161f", borderWidth: 1.5, // surface gap between segments
        borderSkipped: false, borderRadius: 2,
        barThickness: 22,
      })),
    },
    options: {
      indexAxis: "y",
      responsive: true, maintainAspectRatio: false,
      layout: { padding: { right: 64 } },
      interaction: { mode: "index", axis: "y", intersect: false },
      scales: {
        // solo keeps the full-standings scale: the selected bar holds its
        // length while the others leave, and nothing reads as growth
        x: { stacked: true, beginAtZero: true,
          suggestedMax: soloRows.length ? Math.max(...all.map(e => (e.latest.totalViews ?? e.latest.ytTotal) || 0)) : undefined,
          ticks: { color: "#8a94a8", callback: v => kfmt(v) }, grid: { color: GRID } },
        y: { stacked: true, ticks: { color: "#b7c1d1", font: { weight: 700 } }, grid: { display: false } },
      },
      plugins: {
        legend: { display: true, position: "bottom", labels: { color: "#8a94a8", boxWidth: 10, boxHeight: 10, padding: 14 } },
        tooltip: { enabled: false, external: externalTooltip },
      },
      onClick: (_, els) => {
        if (!els.length) return;
        const e = ordered[els[0].index];
        const same = state.solo === e.slug;
        state.solo = same ? null : e.slug;
        state.panel = same ? null : e.slug;
        render();
      },
    },
    plugins: [barTotals],
  };
  cfg._ordered = ordered;
  return cfg;
}

function render() {
  const isLive = state.mode === "live";
  const [t, s] = chartTitle();
  document.getElementById("ctitle").textContent = t;
  // scope strings are build-authored constants (no data interpolation); the
  // race view carries a pill so a unit switch is never announced in gray only
  document.getElementById("cscope").innerHTML = s;

  buildHealth();
  buildHero();
  buildStrip();
  buildPanel();
  buildCompound();
  buildTable();
  buildEmptyNote();
  syncUI();

  if (state.table) { if (chart) { chart.destroy(); chart = null; } return; }

  if (!isLive && state.mode === "standings") {
    const cfg = renderStandings();
    if (chart) chart.destroy();
    chart = new Chart(document.getElementById("chart"), cfg);
    chart.config._ordered = cfg._ordered;
    chart.config._valueText = cfg._valueText;
    document.getElementById("tt").style.opacity = 0;
    return;
  }

  const isDelta = !isLive && state.mode === "delta";
  const isCal = !isLive && state.byDate;
  const isRace = !isLive && state.mode === "race" && !isCal;
  const source = isLive ? EPS.filter(e => e.live) : EPS;
  const clickSolo = (_, els, ch) => {
    if (!els.length) return;
    const ds = ch.data.datasets[els[0].datasetIndex];
    if (!ds.slug) return; // the typical line is a reference, not a selectable episode
    const same = state.solo === ds.slug;
    state.solo = same ? null : ds.slug;
    state.panel = same ? null : ds.slug;
    render();
  };

  // W13 Watching: every finished drop-off curve overlaid, newest in color,
  // priors receding to gray until soloed — plus a dashed typical line once
  // three real curves exist (the same three-peer honesty gate as everywhere).
  if (!isLive && state.mode === "watch") {
    const withCurve = EPS.filter(e => e.watch?.curve?.length);
    const refSlug = withCurve.length ? withCurve[withCurve.length - 1].slug : null; // newest episode whose curve exists
    const datasets = withCurve.map((e) => {
      const isRef = e.slug === refSlug;
      const soloed = state.solo === e.slug;
      const hidden = state.solo !== null && !soloed;
      const deemph = !isRef && !soloed;
      const base = { border: deemph ? DIMLINE : color(e), lab: deemph ? "#5a6478" : color(e), width: soloed || isRef ? 3 : 2, ord: isRef ? 0 : 1 };
      return {
        label: label(e), epNum: e.ep, slug: e.slug,
        data: e.watch.curve.map(p => ({ x: Math.round(p.at * 100), y: Math.round(p.watching * 1000) / 10 })),
        borderColor: base.border, labelColor: base.lab,
        backgroundColor: "transparent",
        borderWidth: base.width,
        pointRadius: 0, pointHoverRadius: 4, tension: 0.25, spanGaps: false, hidden,
        // tails converge: only the emphasized line keeps an end label
        noEndLabel: deemph,
        baseBorderColor: base.border, baseLabelColor: base.lab, baseWidth: base.width,
        baseOrder: base.ord, baseNoEndLabel: deemph, hoverColor: color(e),
        episode: e, order: base.ord,
      };
    });
    // the typical line is read from data.baselines.typicalCurve — the middle
    // value across three-week-old episodes' curves with promo outliers left out,
    // drawn only once three such curves exist; never computed here (PRD v9 F29)
    const typical = DATA.baselines?.typicalCurve;
    if (typical?.points?.length) {
      const pts = typical.points.map((p) => ({ x: Math.round(p.at * 100), y: Math.round(p.watching * 1000) / 10 }));
      datasets.push({ isTypical: true, data: pts, borderColor: "#8a94a8", backgroundColor: "transparent",
        borderDash: [6, 5], borderWidth: 1.5, pointRadius: 0, pointHoverRadius: 4, tension: 0.25, order: 3 });
    }
    const cfg = {
      type: "line",
      data: { datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        layout: { padding: { right: 64 } },
        interaction: { mode: "nearest", intersect: false },
        scales: {
          x: { type: "linear", min: 0, max: 100, title: { display: true, text: "How far into the video", color: "#8a94a8" },
            ticks: { color: "#8a94a8", stepSize: 25, callback: v => v === 0 ? "start" : v === 100 ? "end" : v + "%" }, grid: { color: GRID } },
          y: { beginAtZero: true, title: { display: true, text: "Still watching", color: "#8a94a8" },
            ticks: { color: "#8a94a8", callback: v => v + "%" }, grid: { color: GRID } },
        },
        plugins: { legend: { display: false }, tooltip: { enabled: false, external: externalTooltip } },
        onClick: clickSolo,
        onHover: lineHoverHandler,
      },
      plugins: [endLabels],
    };
    if (chart) chart.destroy();
    chart = new Chart(document.getElementById("chart"), cfg);
    document.getElementById("tt").style.opacity = 0;
    return;
  }


  // Weekly gains: grouped bars on a category axis — one column per week,
  // episodes side by side (a linear axis stacked every episode's week-1 bar
  // on the same x and made the view unreadable).
  if (isDelta && !isCal) {
    const maxWeek = Math.max(1, ...EPS.flatMap(e => (e.weekly || []).map(w => w.week)));
    const labels = Array.from({ length: maxWeek }, (_, i) => "week " + (i + 1));
    const datasets = source.map((e) => {
      const soloed = state.solo === e.slug;
      const hidden = state.solo !== null && !soloed;
      const byWeek = new Map((e.weekly || []).map((w, i) => [w.week, i]));
      const data = [], metas = [];
      for (let wk = 1; wk <= maxWeek; wk++) {
        const i = byWeek.get(wk);
        if (i === undefined) { data.push(null); metas.push(null); continue; }
        const w = e.weekly[i];
        const first = i === 0;
        const split = first ? splitOf(w.byDest) : splitDelta(w.byDest, e.weekly[i - 1].byDest);
        data.push(YT_KEYS.reduce((a, k) => a + (split[k] || 0), 0));
        metas.push({ ts: w.boundary, week: w.week, split,
          note: first ? (e.partialHistory ? "views at registration (late-registered)" : "first tracked week") : null });
      }
      return { label: label(e), epNum: e.ep, slug: e.slug, data, metas,
        backgroundColor: (state.solo && !soloed ? color(e) + "33" : color(e) + "d9"),
        borderRadius: 3, hidden, episode: e, categoryPercentage: 0.74, barPercentage: 0.9 };
    });
    const cfg = {
      type: "bar",
      data: { labels, datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: "nearest", intersect: true },
        scales: {
          x: { ticks: { color: "#b7c1d1", font: { weight: 700 } }, grid: { display: false } },
          y: { beginAtZero: true, title: { display: true, text: "YouTube views gained", color: "#8a94a8" },
            ticks: { color: "#8a94a8", callback: v => kfmt(v) }, grid: { color: GRID } },
        },
        plugins: { legend: { display: false }, tooltip: { enabled: false, external: externalTooltip } },
        onClick: clickSolo,
      },
    };
    if (chart) chart.destroy();
    chart = new Chart(document.getElementById("chart"), cfg);
    document.getElementById("tt").style.opacity = 0;
    return;
  }

  const datasets = source.map((e) => {
    const isNewest = e.slug === NEWEST.slug;
    const soloed = state.solo === e.slug;
    const hidden = state.solo !== null && !soloed;
    // emphasis form (live AND pacing race): the newest episode keeps its
    // color, priors recede to one context gray until soloed — the question
    // both views answer is "newest vs typical", not "six equal series"
    const deemph = (isLive || state.mode === "race") && !isNewest && !soloed;
    const base = { border: deemph ? DIMLINE : color(e), lab: deemph ? "#5a6478" : color(e), width: soloed || isNewest ? 3 : 2, ord: isNewest ? 0 : 1 };
    return {
      label: label(e),
      epNum: e.ep,
      slug: e.slug,
      data: isLive ? e.live.series.map(p => ({ x: p.m, y: p.v, meta: p })) : seriesFor(e),
      borderColor: base.border,
      labelColor: base.lab,
      backgroundColor: (deemph ? DIMLINE : color(e)) + (isDelta ? "dd" : "22"),
      borderWidth: base.width,
      pointRadius: 0,
      pointHoverRadius: 5,
      tension: 0.3, spanGaps: false, hidden,
      baseBorderColor: base.border, baseLabelColor: base.lab, baseWidth: base.width,
      baseOrder: base.ord, hoverColor: color(e),
      episode: e,
      order: base.ord, // newest drawn on top
      barThickness: isDelta ? 14 : undefined,
    };
  });

  // Announce receipts (PRD v2 W6): each host's X announce post as a triangle
  // on the chart floor — a views bump gets a visible cause candidate. Markers
  // sit at y=0 on purpose: plotting them on the line would fake a data point.
  if (isRace) {
    const mpts = [];
    for (const e of source) {
      if (state.solo && state.solo !== e.slug) continue;
      for (const a of e.announces || []) {
        const x = (Date.parse(a.ts) - premiereMs(e.premiere)) / DAY;
        if (!isFinite(x) || x < 0 || x > 60) continue;
        mpts.push({ x, y: 0, acct: a.account });
      }
    }
    if (mpts.length) datasets.push({
      isAnnounce: true, type: "scatter", data: mpts, showLine: false,
      pointStyle: "triangle", pointRadius: 5, pointHoverRadius: 5, pointHitRadius: 0,
      backgroundColor: mpts.map(p => PLAT_COLORS["x:" + p.acct] || "#8a94a7"),
      borderColor: "transparent", order: 5,
    });
  }

  const cfg = {
    type: isDelta ? "bar" : "line",
    data: { datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      layout: { padding: { right: isDelta ? 8 : 34 } },
      interaction: { mode: "nearest", intersect: false },
      scales: {
        x: {
          type: "linear",
          ticks: {
            color: "#8a94a8",
            stepSize: isRace ? 7 : undefined,
            callback: v => {
              if (isLive) return v;
              if (isCal) return fmtDate(v);
              if (isRace) return v === 0 ? "premiere" : (v % 7 === 0 && v > 0 ? `${v/7} wk${v/7 > 1 ? "s" : ""}` : "");
              return Number.isInteger(v) ? "week " + (v + 1) : "";
            },
            maxTicksLimit: isCal ? 9 : 24,
          },
          grid: { color: GRID },
          offset: isDelta,
          title: { display: isLive, text: "Minutes into the show", color: "#8a94a8" },
        },
        y: {
          beginAtZero: true,
          title: { display: true, text: isLive ? "Concurrent viewers" : "YouTube views", color: "#8a94a8" },
          ticks: { color: "#8a94a8", callback: v => kfmt(v) },
          grid: { color: GRID },
        },
      },
      plugins: {
        legend: { display: false }, // the episode strip directly above is the legend
        tooltip: { enabled: false, external: externalTooltip },
      },
      onClick: clickSolo,
      onHover: lineHoverHandler,
    },
    plugins: [endLabels],
  };

  if (chart) chart.destroy();
  chart = new Chart(document.getElementById("chart"), cfg);
  document.getElementById("tt").style.opacity = 0;
}

/* ================= table view (Layer 3: every value, no hover needed) ================= */
function buildTable() {
  const box = document.getElementById("tablebox");
  if (!state.table) { box.style.display = "none"; return; }
  // The table mirrors the SELECTED view: the same question, numbers instead
  // of marks (owner feedback 2026-08-23 — one generic table standing in for
  // five different views read as a mystery). Each measure gets its own
  // columns; the views table serves only the views question.
  const kind = state.mode === "live" || (state.mode === "standings" && state.metric === "live") ? "live"
    : state.mode === "watch" || (state.mode === "standings" && state.metric === "watched") ? "watched"
    : state.mode === "standings" && state.metric === "reach" ? "reach"
    : state.mode === "race" ? "race"
    : "views";
  // watched-vs-typical reads each row's typical from data.baselines (the
  // other three-week-old episodes, outliers and the row itself left out);
  // nothing is computed here (PRD v9 F16)
  const watchedCellFor = (e) => {
    if (e.watch?.avgPercent == null) return "–";
    const v = e.watch.avgPercent;
    const wTypical = DATA.baselines?.watchPctBySlug?.[e.slug]?.typical ?? null;
    if (wTypical != null && wTypical > 0 && Math.abs(v - wTypical) / wTypical * 100 > QUIET_ZONE) {
      return v > wTypical ? `<span class="st-good">▲${v}%</span>` : `<span class="st-bad">▼${v}%</span>`;
    }
    return `<span class="st-mid">${v}%</span>`;
  };
  // same shape the panel uses for time watched
  const fmtDur = (sec) => sec >= 3600 ? `${Math.floor(sec / 3600)}h ${Math.floor((sec % 3600) / 60)}m` : `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`;
  let html = "<table><tr>";
  if (kind === "live") {
    html += "<th>Episode</th><th>Peak live</th><th>Avg</th><th>Chat msgs</th><th>Chatters</th><th>Duration</th></tr>";
    for (const e of [...EPS].reverse()) {
      html += `<tr><td class="t">${esc(label(e))}</td>`;
      html += e.live
        ? `<td class="t">${e.live.peak}</td><td>${e.live.avg}</td><td>${nfmt(e.live.chatMessages)}</td><td>${nfmt(e.live.chatters)}</td><td>${e.live.durationMin ?? "–"} min</td>`
        : `<td colspan="5" style="text-align:left;color:var(--t3)">no live data</td>`;
      html += "</tr>";
    }
  } else if (kind === "watched") {
    html += `<th>Episode</th><th>Watched</th><th>${PLOGO.yt} Dive Club</th><th>${PLOGO.yt} DesignerTom</th><th>Avg time</th><th>Total time</th></tr>`;
    for (const e of [...EPS].reverse()) {
      html += `<tr><td class="t">${esc(label(e))}</td>`;
      if (!e.watch) {
        html += `<td colspan="5" style="text-align:left;color:var(--t3)">no watch report yet</td></tr>`;
        continue;
      }
      const by = (key) => e.watch.byChannel?.find((c) => c.key === key)?.avgPercent;
      html += `<td class="t">${watchedCellFor(e)}</td>`;
      html += `<td>${by("yt:joindiveclub") == null ? "–" : by("yt:joindiveclub") + "%"}</td>`;
      html += `<td>${by("yt:designertom") == null ? "–" : by("yt:designertom") + "%"}</td>`;
      html += `<td>${e.watch.avgDurationSec == null ? "–" : fmtDur(e.watch.avgDurationSec)}</td>`;
      html += `<td>${e.watch.minutesWatched == null ? "–" : nfmt(Math.round(e.watch.minutesWatched / 60)) + " h"}</td></tr>`;
    }
  } else if (kind === "reach") {
    html += `<th>Episode</th><th>${PLOGO.x} @ridd_design</th><th>${PLOGO.x} @designertom</th><th>Total reach</th></tr>`;
    for (const e of [...EPS].reverse()) {
      const bd = e.latest.byDest || {};
      html += `<tr><td class="t">${esc(label(e))}</td>`;
      html += `<td class="t">${bd["x:ridd_design"]?.views == null ? "–" : nfmt(bd["x:ridd_design"].views)}</td>`;
      html += `<td>${bd["x:designertom"]?.views == null ? "–" : nfmt(bd["x:designertom"].views)}</td>`;
      html += `<td>${e.latest.xImpressions == null ? "–" : nfmt(e.latest.xImpressions)}</td></tr>`;
    }
  } else if (kind === "race") {
    html += `<th>Episode</th><th>Days old</th><th>First week ${PLOGO.yt}</th><th>${PLOGO.yt} views now</th></tr>`;
    for (const e of [...EPS].reverse()) {
      html += `<tr><td class="t">${esc(label(e))}</td>`;
      html += `<td class="t">${e.ageDays == null ? "–" : e.ageDays}</td>`;
      html += `<td>${e.metrics?.week1Velocity == null ? "–" : nfmt(e.metrics.week1Velocity)}</td>`;
      html += `<td>${e.latest.ytTotal == null ? "–" : nfmt(e.latest.ytTotal)}</td></tr>`;
    }
  } else {
    html += `<th>Episode</th><th>Health</th><th>Total views</th><th>${PLOGO.yt} Dive Club</th><th>${PLOGO.yt} DesignerTom</th><th>${PLOGO.x} ridd plays</th><th>${PLOGO.x} tom plays</th><th>Watched</th><th>Pace ${PLOGO.yt}</th></tr>`;
    // episode scores are each against a different set of earlier episodes —
    // one neutral colour, never the show-health bands (PRD v9 F17)
    for (const e of [...EPS].reverse()) {
      const bd = e.latest.byDest || {};
      const mk = heroMarker(e);
      const pace = sameAgeSub(e);
      const healthCell = healthOf(e)
        ? `<span class="st-mid">${healthOf(e).score}</span>`
        : "–";
      html += `<tr><td class="t">${esc(label(e))}</td>`;
      html += `<td class="t">${healthCell}</td>`;
      html += `<td class="t">${metricText(e.latest.totalViews)}${mk ? ` <span class="mk">${mk}</span>` : ""}</td>`;
      html += `<td>${metricText(bd["yt:joindiveclub"]?.views)}</td><td>${metricText(bd["yt:designertom"]?.views)}</td>`;
      html += `<td>${bd["x:ridd_design"]?.plays == null ? "–" : nfmt(bd["x:ridd_design"].plays)}</td>`;
      html += `<td>${bd["x:designertom"]?.plays == null ? "–" : nfmt(bd["x:designertom"].plays)}</td>`;
      html += `<td>${watchedCellFor(e)}</td>`;
      html += `<td>${pace ? `<span class="${Math.abs(pace.pct) <= QUIET_ZONE ? "st-mid" : pace.pct > 0 ? "st-good" : "st-bad"}">${(pace.pct >= 0 ? "▲" : "▼") + Math.abs(pace.pct) + "%"}</span>` : "–"}</td></tr>`;
    }
  }
  html += "</table>";
  box.innerHTML = html;
  box.style.display = "block"; // stylesheet default is none — must set explicitly
}

/* M-1: the per-week view silently rendered nothing for episodes first tracked
   this week — say so instead of showing an unexplained empty state. */
function buildEmptyNote() {
  const el = document.getElementById("emptynote");
  el.style.display = "none";
  if (state.mode === "live" || state.mode !== "delta" || state.table) return;
  const missing = EPS.filter(e => !e.weekly || e.weekly.length === 0);
  if (!missing.length) return;
  const next = new Date(mondayNoonAfter(Date.now()) - PHX);
  const when = next.toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" });
  // in the scope line, IN VIEW — not a note below 440px of empty grid
  document.getElementById("cscope").innerHTML =
    esc(`${missing.map(e => "E" + e.ep).join(", ")} first tracked this week — their weekly bars appear after ${when}`);
}
function mondayNoonAfter(ms) {
  const shifted = new Date(ms - PHX);
  const noon = Date.UTC(shifted.getUTCFullYear(), shifted.getUTCMonth(), shifted.getUTCDate(), 12) + PHX;
  const dow = shifted.getUTCDay();
  let candidate = noon - ((dow + 6) % 7) * DAY;
  while (candidate <= ms) candidate += WEEK;
  return candidate;
}

function buildInsightsPanel() {
  const panel = document.getElementById("insights");
  panel.innerHTML = "";
  // W35: ranked items (the five things to do this week, from today's read)
  // keep their stored order; anything unranked follows, grouped by category
  const all = DATA.insights
    .map(i => ({ ...i, cat: catKeyFor(i) }))
    .sort((a, b) => (a.rank ?? 99) - (b.rank ?? 99) || (CAT_RANK[a.cat] ?? 9) - (CAT_RANK[b.cat] ?? 9));

  // Every insight shows, always (owner directive 2026-08-23): no top-3 fold,
  // no expander, no outer group headers. Like categories sit together (the
  // sort above), every card carries its category label inside its container,
  // and the shared grid gap is the only rhythm.
  // metrics and key callouts read bold (owner directive 2026-08-23) — same
  // anchor idea as the evidence bullets, applied at render time only: number
  // tokens (ranges and % included), episode refs, and the channel names.
  // The validated store text itself never changes.
  const emphasize = (text) => esc(text)
    .replace(/\d{1,3}(?:,\d{3})*(?:\.\d+)?(?:[–-]\d{1,3}(?:,\d{3})*(?:\.\d+)?)?%?/g, (m) => `<b>${m}</b>`)
    .replace(/\bE<b>(\d+)<\/b>/g, "<b>E$1</b>")
    .replace(/\b(Dive Club|DesignerTom|@ridd_design|@designertom)\b/g, "<b>$1</b>");
  const add = (ins) => {
    const cat = CATS[ins.cat];
    const div = document.createElement("div");
    div.className = "insight";
    const hasMore = !!(ins.recommendation || ins.caveat);
    // owner directive 2026-09-01: the category alone — no "helps <check>" eyebrow
    div.innerHTML = `<span class="ic" style="background:${cat.color}22;color:${cat.color}">${ins.rank ? `<b class="rk">${ins.rank}</b>` : cat.svg}</span>
      <span class="body"><div class="cat" style="color:${cat.color}">${cat.name}</div>
      <span class="txt">${emphasize(ins.text)}</span>
      ${ins.recommendation ? `<br><span class="reveal">Recommendation ▾</span>` : ""}
      ${ins.caveat ? `<div class="cav">${esc(ins.caveat)}</div>` : ""}
      ${ins.recommendation ? `<div class="rec">${emphasize(ins.recommendation)}</div>` : ""}</span>`;
    if (hasMore) div.addEventListener("click", () => {
      div.classList.toggle("open");
      const r = div.querySelector(".reveal");
      if (r) r.textContent = div.classList.contains("open") ? "Recommendation ▴" : "Recommendation ▾";
    });
    panel.appendChild(div);
  };

  for (const ins of all) add(ins);
}

function buildAbout() {
  document.getElementById("about").innerHTML = `
  <p><b>Total views</b> = YouTube views (both channels) + X broadcast plays (both hosts). Both count video playback — YouTube counts a qualified view (~30s), X counts a play start, so treat the sum as directional.</p>
  <p><b>X reach</b> = impressions on the hosts' announce posts. An impression is one appearance on a timeline — exposure, not watching. Reach is <b>never</b> added into any views number, anywhere.</p>
  <p><b>◐ n/m</b> on a total = plays recovered from n of m broadcasts (the true total is higher). <b>→date</b> = X plays last confirmed on that date (broadcast no longer reachable; the highest confirmed figure is kept — absence is never shown as zero). <b>tracked late</b> = tracking began after the episode aired: all-time totals are right, early weekly history doesn't exist, and the episode stays out of early-growth comparisons.</p>
  <p><b>Chart measures</b>: the Totals view can chart total views, share watched (YouTube only), average live viewers (hover a bar for that episode’s lowest and highest), or X reach — each in its own unit, and never added together. The small YouTube and X marks stand for the platforms wherever space is tight; hover any mark for its meaning.</p>
  <p><b>Pace</b> compares YouTube views at the same age across episodes, with promo outliers left out. It appears only after three other episodes have real data at that age. X plays have no history before 08/21, so mixing them into pace would invent a disadvantage for older episodes.</p><p><b>Promo outliers</b> are episodes where YouTube views, X plays, or X reach came in at more than double what nearby episodes did at the same age (read at three weeks; earlier than that the test is an early read). They are left out of host, announce, topic, and typical comparisons — but they stay in the all-show totals, because those count every real watch.</p>
  <p><b>Launch</b> is each episode’s first-week standing in one word: its YouTube views at the end of its first week — or at its earliest reading for episodes tracked late, or at its current age while it is under a week old, marked "so far" — against the other episodes at that same age, promo outliers left out, and only with three others to compare; strong means more than a tenth above the typical, soft more than a tenth below. A promo-driven launch keeps its word and says so. It is a standing, not a score: it can move while an episode is young and it never replaces the three-week read.</p>
  <p><b>Episode health</b> (0–100) is each episode’s own three-week report card. It is written once the episode’s first 21 days — the point where growth flattens — are over, and it never changes after that: an episode is judged against the eight episodes that aired before it, promo outliers left out, and only when at least three of them can be compared — so later episodes never rewrite an old score. Two episodes’ scores were measured against different earlier episodes, so a higher score means it beat its own bar by more, not that it was the better episode. 50 means it landed right where the show usually did; higher beat that bar, lower missed it. Six checks share the score: YouTube views at three weeks against earlier episodes at the same age (35%), likes and comments per 1,000 views (15%), how much of the video people watch (15%), live turnout (15%), subscribers gained per 1,000 views (10%), and how positive the feedback reads (10%). A check with no honest number drops out and the others share its weight — nothing is guessed or filled with zero, and such a check simply does not appear on the page. Views use YouTube only because older X play history does not exist. Nothing shows for an episode until its three weeks are complete, and the first episode sets the bar rather than receiving a score. In the episode panel, <b>▲</b> and <b>▼</b> mark above or below the show’s typical level and <b>≈</b> means right at it; hover or tap any label or mark for its definition. Watch and subscriber numbers exist per channel as well as blended — the panel shows each channel’s share watched beside the blend, in the channel’s color.</p>
  <p><b>Watching</b> comes from the verified YouTube analytics both hosts signed in to — not public counters. The share watched averages the two channels together, weighted by their views. The watch curve shows how much of the audience is still watching at each point of the video, blended the same way; the dashed line in the Watching view is a typical episode, drawn only once three episodes have real curves. Small pins on the panel’s curve are the moments the audience moved most — below the line where the most people left, above it where extra people were watching (a spot people skip to). Hover, tap, or tab to one for a short written note on what was being discussed at that stretch of the show; a model writes the note from the transcript, and moment timing comes from the live recording, so read both as close, not exact. Watch data is YouTube only — X does not report it — and an episode whose report has not arrived shows nothing there instead of a zero.</p>
  <p><b>Audience feedback</b> starts with YouTube comments and reply threads from both channels, plus X replies to the announce posts. A model removes spam, unrelated chatter, bare mentions, and questions that do not judge the show. Unclear labels are held for review and never shown. Praise, complaints, and mixed reactions are stored once; a mixed reaction appears in both reading lists with a ± mark. Theme counts are distinct people, and a theme stays hidden until at least three people share it. Neutral suggestions count toward how many people commented, but their text does not appear. Featured quotes must be praise and must also pass a separate negative-word check. Episodes from before X reply tracking say that replies are missing rather than showing a false zero.</p>
  <p><b>Show health</b> is saved once a day and reads the newest episode at its age against this show’s usual levels — a today read, not a running total over any fixed stretch of days. The words are written by a model over the day’s checked facts; when the model fails, a plain deterministic read is written instead so no day goes without one. Seven checks feed it (growth, audience quality, reach, live turnout, participation, subscribers, goodwill); each check is a pill whose dot shows its state — orange fragile, gray steady, green healthy, hollow when the check has no reading yet — with the fragile ones first, and only the checks that are honestly available on the saved date count. A promo-driven lift — a launch or an X reach more than double what a typical episode gets at the same age — is shown with its numbers but never scored, so promotion can neither flatter nor punish the number. A check that has to read an older episode because the newest is too young is carried at half weight and says which episode it read. Live turnout reads the whole live session — peak and average viewers, how many people watched live, and the minutes they watched all together; participation reads chatters per hundred people at the peak, chat messages an hour, how many minutes each live viewer stayed, and how much of the peak audience was still there in the last ten minutes, so a short show and a long one compare. Reach adds the share of YouTube views that YouTube itself brought through search and suggested videos. Each check’s state word comes from bands fitted to how much that check normally swings between episodes — never narrower than ten percent either side of usual, never wider than thirty — so a small dip on a measure that always jumps around reads steady, and the same dip on a measure that usually holds still reads fragile; the details behind each check say where its bands sit and why. Beside the score the band carries a direction word — building, holding, softening, or mixed — read from how each durable measure moved over the last few clean episodes, and the Where it’s heading column lists each one, with the range the next first week is expected to land in if it follows the last three clean launches: an expectation, never a result. Missing checks drop out instead of becoming zero, and the remaining checks share their weight (goodwill keeps its own weight, so an absent check can never lift it). Every check compares like with like: at the same age, or — until enough same-age history exists — as the earlier episodes stand now, and the row’s details say which. Typical means the last eight comparable episodes with promo outliers left out, and it needs at least three of them; a check with fewer shows Not in yet. When the saved read is behind the data the header says so, and after a week without a fresh read the score is withheld rather than shown as today’s. Each helping or needs-work bullet carries one stored number. A trend appears only after a week of real saved scores; missing days are never filled in. Hover, tap, or tab to any check’s name for the saved numbers behind it: the newest result against the show’s typical level, or the reason a check isn’t in yet. Today’s read shows the day’s saved headline; Expand opens the evidence behind the score — the helping and needs-work facts, the saved reasoning, and the saved scores since the first read under the current rules, drawn on a fixed scale with the usual level marked — and the top do-next actions from the recommendation list, in order; the full finding behind each one is in the list below the chart. The set of checks feeding the score can itself change between saved reads — a scoring rule ships, or a check gains or loses the history it needs — and when that happens the evidence under Expand says so, because a number resting on different checks is a different read even when it lands in the same place. Saved reads keep the scoring-rule version they were written under, and the trend only ever connects reads written under the same rules. The episode cards answer the longer question: each finished three-week score is permanent, so reading them left to right shows whether episodes keep clearing the show’s own bar.</p>
  <p><b>What matters</b> is the five things to do this week, in order — written by a model over the day’s show-health read (each check’s state, which way every measure is heading, the outlook, each launch word) and the full fact sheet, with the biggest lever first. Every number in an item is copied from a stored fact; an item whose numbers move out from under it is held back rather than shown. The category on each item is the decision it informs. Only these five appear — the same-age pace of the newest episode stays on its card and in the chart standings. The two at the top of the health card’s Do next are the same first two.</p>
  <p><b>Agents</b> (the link in the header) is the same show for an AI agent: one address, <a href="agent.md">agent.md</a>, rebuilt on every refresh from the stores this page reads, carrying the read, the five actions, every episode with its chapters and moments, the trajectory, and the definitions — with a dash and a reason wherever a number is missing. A companion file as data, an index, and a drop-in skill sit beside it. <b>Chapters</b> are model-written from each transcript and every timestamp and quote is checked against it; a timestamp links into the YouTube upload only when the transcript runs on that upload’s clock.</p>
  <p><b>Cadence</b>: snapshots every morning at 7:00 Phoenix, full refresh Mondays; new episodes are discovered and registered automatically. Snapshots stop 60 days after an episode’s premiere, long after its totals have settled. YouTube’s analytics arrive two to three days late for every episode alike, so “three weeks in” means the numbers as they stood about then.</p>`;
}

viewBtn.addEventListener("click", () => { viewMenu.hidden ? openViewMenu() : closeViewMenu(); });
viewBtn.addEventListener("keydown", (ev) => {
  if (ev.key === "ArrowDown" || ev.key === "ArrowUp") { ev.preventDefault(); openViewMenu(); }
});
viewMenu.addEventListener("keydown", (ev) => {
  const opts = [...viewMenu.querySelectorAll(".vopt")];
  const at = opts.indexOf(document.activeElement);
  if (ev.key === "Escape") { ev.preventDefault(); closeViewMenu({ focus: true }); }
  else if (ev.key === "ArrowDown") { ev.preventDefault(); opts[Math.min(at + 1, opts.length - 1)]?.focus(); }
  else if (ev.key === "ArrowUp") { ev.preventDefault(); opts[Math.max(at - 1, 0)]?.focus(); }
  else if (ev.key === "Home") { ev.preventDefault(); opts[0]?.focus(); }
  else if (ev.key === "End") { ev.preventDefault(); opts.at(-1)?.focus(); }
  else if (ev.key === "Tab") closeViewMenu();
});
document.addEventListener("click", (ev) => { if (!ev.target.closest?.(".ctsel")) closeViewMenu(); });
// reset is scoped to the current tab (it no longer teleports Live → Growth)
document.getElementById("reset").addEventListener("click", () => {
  state.mode = "standings"; state.metric = "views"; state.byDate = false; state.solo = null; state.panel = null; state.table = false;
  render();
});
const stamp = document.getElementById("stamp");
{
  const when = relativeDayWords(phoenixDateKey(DATA.generatedAt));
  // dot state is honest: green only when the data really is from today; when
  // the saved show-health read is behind the data it says so (D5 — the date
  // lives in the hover title, so no digit is added above the fold)
  const h = DATA.health;
  const behind = h && Number.isFinite(h.ageDays) && h.ageDays >= 1;
  stamp.innerHTML = `<i class="${when === "today" && !behind ? "" : "old"}" aria-hidden="true"></i>Data refreshed ${esc(when)}${behind ? ` · health read is ${h.withheld ? "withheld" : "behind"}` : ""}`;
  stamp.title = `Exact refresh: ${DATA.generatedAt}${h?.date ? ` · health read saved ${h.date}` : ""}`;
}

syncAgentsView();
