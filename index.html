<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%2359b0ff'/%3E%3Ccircle cx='8' cy='8' r='3' fill='%230b0e13'/%3E%3C/svg%3E" />
<title>Dive Radio — Episode Analytics</title>
<style>
  /* Design tokens (2026-08-22 redesign): 3-step surface ramp, 2 border tints,
     3 text tiers, one accent that data never wears. Type scale 11/12/13/14/16/
     20/28, weights 400/500/700, radii 4/8/12, 4px spacing grid. */
  :root {
    --bg: #0b0e13; --s1: #12161f; --s2: #1a212e;
    --border: rgba(148,163,184,.10); --border-strong: rgba(148,163,184,.18);
    --t1: #eef1f6; --t2: #b7c1d1; --t3: #8a94a8;
    --accent: #59b0ff; --good: #3ecf8e; --bad: #ff7a59; --amber: #d9a24a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--t1);
    font: 15px/1.5 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 20px 24px 24px; }
  button { font: inherit; }

  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 21px; margin: 0; letter-spacing: -.01em; font-weight: 700; }
  .stamp { color: var(--t3); font-size: 14px; margin-left: auto; }
  .stamp i { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    margin-right: 7px; vertical-align: 1px; background: var(--good); }
  .stamp i.old { background: var(--amber); }

  .tabs { display: flex; gap: 2px; margin: 8px 0 16px; border-bottom: 1px solid var(--border-strong); }
  .tabs button { background: none; border: 0; color: var(--t3); font-size: 15px;
    padding: 10px 16px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs button.on { color: var(--t1); border-bottom-color: var(--accent); font-weight: 700; }
  .tabs button:hover { color: var(--t1); }
  button:focus-visible, summary:focus-visible, .hs:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* ---- Card system (2026-08-23 redesign): every surface is a quiet card on
     the page ground — no ruled separators; whitespace and card edges carry the
     grouping. Kickers are the one sanctioned small-caps element. ---- */
  .card { background: var(--s1); border: 1px solid var(--border); border-radius: 14px;
    padding: 18px 20px; min-width: 0; }
  .kicker { font-size: 11.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
    color: var(--t3); margin-bottom: 12px; }

  /* ---- W12: show health — gauge, diagnosis, and today's-read cards ---- */
  .healthrow { display: grid; grid-template-columns: minmax(220px, 3fr) minmax(0, 6fr) minmax(230px, 3.4fr);
    gap: 14px; margin-bottom: 14px; }
  .healthrow .gaugewrap { display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding-top: 6px; }
  .gauge { width: 168px; height: 168px; position: relative; }
  .gauge svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .gauge .track { fill: none; stroke: var(--s2); stroke-width: 9; }
  .gauge .fill { fill: none; stroke: var(--accent); stroke-width: 9; stroke-linecap: round; }
  .gauge .tick { stroke: var(--border-strong); stroke-width: 2; }
  .gauge .num { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; }
  .gauge .num b { font-size: 46px; line-height: 1; font-weight: 700; letter-spacing: -.03em;
    font-variant-numeric: tabular-nums; }
  .gauge .num small { color: var(--t3); font-size: 13px; margin-top: 4px; font-weight: 500; }
  .healthrow .scale { color: var(--t3); font-size: 13px; }
  .healthrow .headline { margin: 0 0 14px; color: var(--t1); font-size: 17px; font-weight: 600;
    line-height: 1.42; text-wrap: pretty; }
  .checkrows { display: grid; }
  .checkrow { display: flex; align-items: center; gap: 12px; padding: 7px 0; font-size: 14px; }
  .checkrow + .checkrow { border-top: 1px solid var(--border); }
  .checkrow .cl { color: var(--t1); font-weight: 600; width: 108px; flex: none; }
  .checkrow .cs { color: var(--t3); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; }
  .checkrow .st { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; white-space: nowrap; }
  .checkrow .st i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
  .checkrow .st.healthy { color: var(--good); }
  .checkrow .st.steady { color: var(--t2); }
  .checkrow .st.fragile { color: var(--bad); }
  .checkrow .st.waiting { color: var(--t3); font-weight: 500; }
  .checkrow .st.waiting i { background: none; border: 1px solid var(--border-strong); }
  .hc-meta .updated { display: flex; align-items: center; gap: 9px; color: var(--t1); font-size: 15px;
    font-weight: 600; }
  .hc-meta .updated svg { width: 20px; height: 20px; color: var(--accent); flex: none; }
  .hc-meta .scope { color: var(--t3); font-size: 13.5px; line-height: 1.5; margin: 10px 0 0; }
  .hc-meta .why { display: inline-block; margin-top: 12px; background: none; border: 0; padding: 0;
    color: var(--accent); font-size: 14px; cursor: pointer; text-decoration: underline;
    text-underline-offset: 3px; }
  .health-evidence { grid-column: 1 / -1; }
  .health-evidence .evidence { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  .health-evidence h3 { margin: 0 0 6px; color: var(--t2); font-size: 14px; font-weight: 700; }
  .health-evidence ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 7px; }
  .health-evidence li { color: var(--t2); font-size: 14.5px; line-height: 1.45; }
  .health-evidence .waitlist { margin-top: 14px; color: var(--t3); font-size: 13.5px; line-height: 1.5; }
  .health-evidence .trend { width: 150px; height: 28px; margin-top: 14px; display: block; }
  .health-evidence .trend polyline { fill: none; stroke: var(--accent); stroke-width: 2; vector-effect: non-scaling-stroke; }
  .healthrow.empty { display: block; color: var(--t2); font-size: 15px; }

  /* ---- Primary answers: latest episode + growth trend cards ---- */
  .overview { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(280px, 1fr);
    gap: 14px; margin-bottom: 14px; }
  .overview.single { grid-template-columns: 1fr; }
  .hero { display: flex; gap: 24px; }
  .hero .main { flex: 1; min-width: 0; }
  .hero h2 { margin: 0; font-size: 19px; line-height: 1.3; font-weight: 700; text-wrap: balance; }
  .hero .metricline { display: flex; align-items: baseline; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .hero .big { font-size: 34px; line-height: 1; font-weight: 700; letter-spacing: -.02em;
    font-variant-numeric: tabular-nums; }
  .hero .big small { font-size: 14px; font-weight: 500; color: var(--t3); letter-spacing: 0; }
  .hero .mk { font-size: 14px; font-weight: 600; color: var(--amber); }
  .hero .platform-bar { display: flex; width: min(100%, 520px); height: 8px; overflow: hidden;
    border-radius: 4px; background: var(--s2); margin-top: 16px; }
  .hero .platform-bar .yt { background: #ff795b; }
  .hero .platform-bar .x { background: var(--accent); }
  .hero .splitlabels { display: flex; justify-content: space-between; width: min(100%, 520px);
    margin-top: 8px; color: var(--t3); font-size: 13.5px; }
  .hero .splitlabels i { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    margin-right: 6px; vertical-align: 1px; }
  .hero .state { color: var(--t3); font-size: 13.5px; margin-top: 14px; }
  .hero .unavailable { color: var(--t3); font-size: 15px; margin-top: 12px; }
  .hero .spark { width: min(34%, 320px); flex: none; display: flex; flex-direction: column; gap: 5px; justify-content: flex-end; }
  .hero .spark .cv { position: relative; height: 86px; width: 100%; }
  .hero .spark .cap { font-size: 13.5px; color: var(--t3); text-align: right; }

  .compound .cv2 { color: var(--t2); font-size: 15px; font-weight: 600; line-height: 1.4; margin: 0; }
  .compound .bars { display: flex; gap: 10px; align-items: flex-end; margin-bottom: 10px; }
  .compound .cbar { flex: 1; text-align: center; min-width: 0; }
  .compound .cbar .bwrap { height: 56px; display: flex; align-items: flex-end; justify-content: center; }
  .compound .cbar .b { width: 70%; max-width: 46px; border-radius: 4px 4px 0 0; min-height: 3px; }
  .compound .waitbox { border: 0; padding: 22px 0 12px; display: flex; flex-direction: column;
    align-items: center; gap: 12px; background:
      repeating-linear-gradient(to bottom, var(--border) 0 1px, transparent 1px 26px); }
  .compound .waitbox svg { width: 40px; height: 40px; color: var(--t3); background: var(--s1);
    border: 1px solid var(--border-strong); border-radius: 50%; padding: 9px; box-sizing: border-box; }
  .compound .waitbox .cv2 { background: var(--s1); padding: 2px 10px; }

  /* ---- Episode carousel: selector + legend + finished health reads,
     oldest → newest, latest always far right (locked rule) ---- */
  .carousel { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 6px; margin-bottom: 14px;
    scrollbar-width: thin; scroll-snap-type: x proximity; }
  .sitem { flex: 1 0 168px; min-width: 168px; scroll-snap-align: end; background: var(--s1);
    border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; cursor: pointer;
    position: relative; transition: border-color .15s, box-shadow .15s; color: inherit; text-align: left; }
  .sitem:hover { border-color: var(--border-strong); box-shadow: 0 4px 16px rgba(0,0,0,.35); }
  .sitem.newest { box-shadow: inset 0 0 0 1px rgba(89,176,255,.35); }
  .sitem.solo { border-color: var(--accent); background: var(--s2); }
  .sitem.dim { opacity: .38; }
  .sitem .r1 { display: flex; align-items: baseline; gap: 6px; font-size: 12px; font-weight: 700;
    color: var(--t3); letter-spacing: .04em; }
  .sitem .r1 .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; align-self: center; }
  .sitem .r1 .num { font-size: 17px; font-weight: 700; letter-spacing: -.01em; color: var(--t1); }
  .sitem .r1 .mk { font-size: 12px; font-weight: 600; color: var(--amber); margin-left: auto; }
  .sitem .t { font-size: 12.5px; color: var(--t2); white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; margin: 3px 0 0; display: block; }
  /* three-week health read: number + track, present ONLY once the read is done */
  .hs { display: flex; align-items: center; gap: 8px; min-height: 18px;
    font-size: 12px; color: var(--t3); cursor: help; }
  .sitem .hs { margin-top: 10px; }
  .hero .hs { max-width: 300px; }
  .hs b { font-size: 14px; color: var(--t1); font-variant-numeric: tabular-nums; }
  .hs .mk { color: var(--amber); font-weight: 600; }
  .hs .htrack { flex: 1; height: 4px; border-radius: 2px; background: var(--s2);
    position: relative; overflow: hidden; }
  .hs .htrack span { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: var(--accent); }
  .sitem .hs.quiet { font-size: 12px; color: var(--t3); cursor: default; }
  /* health tooltip — instant, works on tap; native title is neither */
  #rtt { position: fixed; z-index: 60; max-width: 300px; background: #0d1017; border: 1px solid var(--border-strong);
    border-radius: 10px; padding: 10px 12px; font-size: 14px; line-height: 1.45; color: var(--t2);
    box-shadow: 0 8px 24px rgba(0,0,0,.5); opacity: 0; pointer-events: none; transition: opacity .12s ease-out; }
  #rtt .h { font-weight: 700; color: var(--t1); margin-bottom: 4px; }
  #rtt .warn { color: var(--amber); margin-top: 4px; }
  #rtt .mut { color: var(--t3); margin-top: 4px; }
  /* ---- Layer 2: pinned episode detail panel ---- */
  @keyframes panelIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  .panel { background: var(--s2); border: 1px solid var(--border-strong); border-radius: 12px;
    padding: 14px 18px; margin-bottom: 12px; position: relative; font-size: 14px;
    animation: panelIn .16s ease-out; }
  @media (prefers-reduced-motion: reduce) { .panel { animation: none; } .sitem, .insight { transition: none; } }
  .panel .row.head { font-weight: 700; color: var(--t1); }
  .panel .val.big { font-size: 17px; }
  .panel .hint { color: var(--t3); font-size: 12px; font-weight: 400; }
  .panel .pchip { font-size: 12px; color: var(--amber); border: 1px solid rgba(217,162,74,.4);
    border-radius: 4px; padding: 1px 6px; font-weight: 600; }
  .panel .x { position: absolute; top: 8px; right: 12px; background: none; border: 0;
    color: var(--t3); font-size: 17px; cursor: pointer; padding: 4px; }
  .panel .x:hover { color: var(--t1); }
  .panel .h { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; }
  .panel .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 4px 28px; margin-top: 10px; }
  .panel .row { display: flex; align-items: center; gap: 8px; padding: 3px 0; color: var(--t2); }
  .panel .row .sq { width: 9px; height: 9px; border-radius: 3px; flex: none; }
  .panel .row .val { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--t1); }
  .panel .sect { border-top: 1px solid var(--border); margin-top: 10px; padding-top: 8px; }
  .panel .note { color: var(--amber); font-size: 13px; margin-top: 4px; }
  .panel .mut { color: var(--t3); font-size: 13px; margin-top: 4px; }
  .panel .q { color: var(--t2); font-size: 13.5px; margin: 6px 0; }
  .panel .q .by { color: var(--t3); }
  .panel .senti-link { color: var(--accent); cursor: pointer; text-decoration: underline; }
  .panel .themegrid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 8px; }
  .panel .themehead { color: var(--t2); font-size: 12px; font-weight: 700; margin-bottom: 3px; }
  .panel .themeitem { color: var(--t2); font-size: 13px; padding: 2px 0; }
  .panel .themeempty { color: var(--t3); font-size: 12px; line-height: 1.35; }

  /* ---- controls ---- */
  .controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-left: auto; }
  .seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 8px;
    overflow: hidden; background: var(--s1); }
  .seg button { background: transparent; border: 0; color: var(--t3); padding: 7px 14px;
    cursor: pointer; font-size: 14px; }
  .seg button.on { background: var(--s2); color: var(--t1); font-weight: 700; }
  .toggle { border: 1px solid var(--border); background: var(--s1); color: var(--t3);
    border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 14px; }
  .toggle.on { color: var(--t1); border-color: var(--border-strong); background: var(--s2); }
  .reset { color: var(--t3); font-size: 14px; background: none; border: 0;
    cursor: pointer; text-decoration: underline; }
  .reset:hover { color: var(--t1); }

  /* ---- chart card ---- */
  #chartcard { background: var(--s1); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px 10px; margin-bottom: 6px; }
  .chead { display: flex; align-items: center; gap: 10px; margin: 0 4px 8px; flex-wrap: wrap; }
  .chead .ct { font-size: 15px; font-weight: 700; }
  .chead .cs { font-size: 14px; color: var(--t3); }
  .chart-copy { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  #chartbox { height: 440px; position: relative; }
  #tablebox { overflow-x: auto; display: none; }
  /* visible scroll affordance (taste audit F1): macOS hides scrollbars, so a
     clipped column looked cut off instead of scrollable */
  #tablebox::-webkit-scrollbar { height: 8px; }
  #tablebox::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
  #tablebox::-webkit-scrollbar-track { background: transparent; }
  #tablebox table { border-collapse: collapse; width: 100%; font-size: 13.5px;
    font-variant-numeric: tabular-nums; }
  #tablebox th { text-align: right; color: var(--t3); font-size: 12px; text-transform: uppercase;
    letter-spacing: .06em; padding: 8px 10px; border-bottom: 1px solid var(--border-strong); white-space: nowrap; }
  #tablebox th:first-child, #tablebox td:first-child { text-align: left; }
  #tablebox td { padding: 7px 10px; border-bottom: 1px solid var(--border); text-align: right;
    color: var(--t2); white-space: nowrap; }
  #tablebox td.t { color: var(--t1); }
  #tablebox .mk { color: var(--amber); font-size: 12px; }
  .emptynote { color: var(--t3); font-size: 13px; margin: 6px 4px 0; }

  .tt { position: absolute; pointer-events: none; background: var(--s2); border: 1px solid var(--border-strong);
    border-radius: 8px; padding: 10px 12px; font-size: 13.5px; min-width: 216px; opacity: 0;
    transition: opacity .08s; z-index: 5; box-shadow: 0 10px 28px rgba(0,0,0,.45); }
  .tt .h { display: flex; align-items: center; gap: 7px; font-weight: 700; }
  .tt .meta { color: var(--t3); font-size: 12px; margin: 1px 0 7px; }
  .tt .big { font-size: 17px; font-weight: 700; }
  .tt .chg { font-size: 12px; color: var(--t3); margin-bottom: 2px; }
  .tt .div { border-top: 1px solid var(--border); margin: 7px 0 5px; }
  .tt .row { display: flex; align-items: center; gap: 7px; padding: 2.5px 0; font-size: 13px; color: var(--t2); }
  .tt .row .sq { width: 8px; height: 8px; border-radius: 2px; flex: none; }
  .tt .row .val { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--t1); }
  .tt .note { color: var(--amber); font-size: 12px; margin-top: 5px; }

  /* ---- insights: readable claim up front, recommendation one click away ---- */
  h2 { font-size: 16px; margin: 20px 0 8px; }
  .insights { display: grid; gap: 6px; }
  .cat-head { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    color: var(--t3); margin: 10px 0 2px; }
  .insight { background: var(--s1); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 14px; font-size: 14px; display: flex; align-items: flex-start; gap: 12px;
    cursor: pointer; transition: border-color .15s; }
  .insight:hover { border-color: var(--border-strong); }
  .insight .ic { width: 28px; height: 28px; border-radius: 8px; flex: none; display: flex;
    align-items: center; justify-content: center; margin-top: 1px; }
  .insight .ic svg { width: 15px; height: 15px; }
  .insight .body { flex: 1; min-width: 0; max-width: 78ch; }
  .insight .cat { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    margin-bottom: 1px; }
  .insight .txt { color: var(--t1); }
  .insight .cav { display: none; color: var(--t3); font-size: 12px; margin-top: 4px; }
  .insight .reveal { display: inline-block; margin-top: 6px; color: var(--good); font-size: 12px;
    font-weight: 700; letter-spacing: .02em; cursor: pointer; }
  .insight .reveal:hover { text-decoration: underline; }
  .insight .rec { display: none; margin-top: 6px; padding: 8px 12px; border-left: 2px solid var(--good);
    background: rgba(62,207,142,.06); border-radius: 0 6px 6px 0; color: var(--t2); font-size: 13.5px; }
  .insight.open .rec, .insight.open .cav { display: block; }
  .expander { background: none; border: 1px dashed var(--border-strong); border-radius: 8px;
    color: var(--t3); padding: 8px; cursor: pointer; font-size: 13.5px; }
  .expander:hover { color: var(--t1); border-color: var(--accent); }

  /* ---- drilldown modal ---- */
  #drill { position: fixed; inset: 0; background: rgba(4,6,10,.62); z-index: 50; display: none;
    align-items: flex-start; justify-content: center; padding: 6vh 16px; }
  #drill.on { display: flex; }
  .dcard { background: var(--s1); border: 1px solid var(--border-strong); border-radius: 12px;
    max-width: 680px; width: 100%; max-height: 82vh; display: flex; flex-direction: column;
    box-shadow: 0 24px 64px rgba(0,0,0,.6); }
  .dhead { display: flex; align-items: center; gap: 10px; padding: 14px 18px 10px; }
  .dhead .h { font-weight: 700; font-size: 15px; flex: 1; min-width: 0; }
  .dhead .x { background: none; border: 0; color: var(--t3); font-size: 19px; cursor: pointer; padding: 2px 6px; }
  .dhead .x:hover { color: var(--t1); }
  .dtabs { display: flex; gap: 6px; padding: 0 18px 10px; flex-wrap: wrap; }
  .dtabs button { border: 1px solid var(--border); background: var(--s1); color: var(--t3);
    border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer; }
  .dtabs button.on { background: var(--s2); color: var(--t1); border-color: var(--border-strong); font-weight: 700; }
  .dlist { overflow-y: auto; border-top: 1px solid var(--border); padding: 6px 18px 14px; }
  .drow { padding: 10px 0; border-bottom: 1px solid var(--border); }
  .drow:last-child { border-bottom: none; }
  .drow .m { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--t3); flex-wrap: wrap; }
  .drow .m .who { color: var(--t1); font-weight: 700; }
  .drow .m .src { border: 1px solid var(--border-strong); border-radius: 4px; padding: 0 5px;
    font-size: 12px; letter-spacing: .04em; }
  .drow .m .senti { margin-left: auto; font-size: 12px; }
  .drow .m .senti.positive { color: var(--good); } .drow .m .senti.negative { color: var(--bad); }
  .drow .m .senti.mixed { color: var(--amber); }
  .drow .txt { color: var(--t2); font-size: 14px; margin-top: 4px; white-space: pre-wrap; word-wrap: break-word; }
  .dempty { color: var(--t3); padding: 18px 0; text-align: center; }

  /* ---- about / footer ---- */
  details.about { margin-top: 20px; color: var(--t3); font-size: 13.5px; }
  details.about summary { cursor: pointer; color: var(--t3); }
  details.about summary:hover { color: var(--t1); }
  details.about .inner { border-left: 2px solid var(--border-strong); margin-top: 8px;
    padding: 2px 0 2px 14px; max-width: 78ch; }
  details.about p { margin: 6px 0; }
  details.about b { color: var(--t2); }
  footer { color: var(--t3); font-size: 13px; margin-top: 18px; }

  @media (max-width: 1020px) {
    .healthrow { grid-template-columns: minmax(200px, 1fr) minmax(0, 2fr); }
    .healthrow .hc-meta { grid-column: 1 / -1; }
  }
  @media (max-width: 720px) {
    .wrap { padding: 14px 14px 20px; }
    .healthrow, .overview { grid-template-columns: 1fr; }
    .gauge { width: 140px; height: 140px; }
    .gauge .num b { font-size: 38px; }
    .healthrow .headline { font-size: 16px; }
    .health-evidence .evidence { grid-template-columns: 1fr; gap: 16px; }
    .hero { flex-direction: column; gap: 10px; }
    .hero .spark { width: 100%; }
    .controls { width: 100%; margin-left: 0; }
    .card { padding: 15px 16px; }
    .sitem { flex: 0 0 168px; }
    #chartbox { height: 340px; }
    .stamp { margin-left: 0; width: 100%; }
    .panel .themegrid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Dive Radio</h1>
    <div class="stamp" id="stamp"></div>
  </header>

  <div class="tabs" id="view" role="tablist" aria-label="Dashboard view">

    <button type="button" role="tab" data-v="live">Live</button>
  </div>

  <section class="healthrow" id="health" aria-label="Show health"></section>
  <div class="overview" id="overview">
    <div class="card hero" id="hero"></div>
    <div class="card compound" id="compound" style="display:none"></div>
  </div>

  <div class="carousel" id="strip" role="list" aria-label="Episodes, oldest to newest"></div>
  <div class="panel" id="panel" style="display:none"></div>

  <div id="chartcard" class="card">
    <div class="chead">
      <div class="chart-copy"><span class="ct" id="ctitle"></span><span class="cs" id="cscope"></span></div>
      <div class="controls">
        <span class="seg growth-only" id="mode">
          <button type="button" data-v="standings">Totals</button>
          <button type="button" data-v="race">Over time</button>
        </span>
        <button type="button" class="toggle traj-only" id="bydate">Dates</button>
        <button type="button" class="toggle tbtn" id="tbtn">Data table</button>
        <button type="button" class="reset" id="reset">Reset</button>
      </div>
    </div>
    <div id="chartbox"><canvas id="chart"></canvas><div class="tt" id="tt"></div></div>
    <div id="tablebox"></div>
    <div class="emptynote" id="emptynote" style="display:none"></div>
  </div>

  <h2>What matters</h2>
  <div class="insights" id="insights"></div>

  <details class="about">
    <summary>About this data</summary>
    <div class="inner" id="about"></div>
  </details>

  <footer>Refreshes daily · new episodes registered automatically.</footer>
</div>

<div id="drill"><div class="dcard">
  <div class="dhead"><span class="h" id="dtitle"></span><button type="button" class="x" id="dclose" aria-label="Close feedback">×</button></div>
  <div class="dtabs" id="dtabs"></div>
  <div class="dlist" id="dlist"></div>
</div></div>

<script src="chart.umd.js"></script>
<script src="data.js"></script>
<script>
const DATA = window.DIVE_DATA;
const EPS = DATA.episodes;
const DAY = 86400000, WEEK = 7 * DAY, PHX = 7 * 3600000;
// Episode palette, 2026-08-22: E2 re-stepped (#8a6bd6 → #8e4ce0) to clear the
// normal-vision floor vs E1's slate; slots 3↔8 and 5↔7 swapped so no ACTIVE
// episode wears a status hue (#3ecf8e = --good, #ff7a59 = --bad now sit in
// the unused tail; anti-pattern "status color as series identity").
// E1 low-chroma and E6=platform-blue remain accepted, documented debts —
// episode identity is always doubled by labels (strip, end labels, tooltips).
const PALETTE = ["#6b7a94", "#8e4ce0", "#5eead4", "#e6c74a", "#ff5d8f", "#59b0ff", "#ff7a59", "#3ecf8e"];
const color = (e) => PALETTE[(e.ep - 1) % PALETTE.length];
const NEWEST = EPS[EPS.length - 1];
const FONT = getComputedStyle(document.body).fontFamily;
if (window.Chart) { Chart.defaults.font.family = FONT; Chart.defaults.font.size = 14; Chart.defaults.animation.duration = 300; }

// @ridd_design's near-white #d7dbe0 (chroma 0.008, the brightest mark on the
// page — read as "highlighted" in every bar) stepped down to a true light
// gray; still unmistakably "the gray one".
const PLAT_COLORS = {
  "yt:joindiveclub": "#ff4f5e", "yt:designertom": "#ffa14f",
  "x:ridd_design": "#b7c2d4", "x:designertom": "#59b0ff",
};
const TT_NAME = {
  "yt:joindiveclub": "Dive Club", "yt:designertom": "DesignerTom",
  "x:ridd_design": "@ridd_design", "x:designertom": "@designertom",
};
const YT_KEYS = ["yt:joindiveclub", "yt:designertom"];
const X_KEYS = ["x:ridd_design", "x:designertom"];
const GRID = "#1d2433", DIMLINE = "#3a4458";

// Strategy-impact categories: colors validated distinct from the platform
// colors AND the episode palette (OKLab ΔE, 2026-08-22). Falls back to an
// id-based mapping for data.js files built before categories shipped.
const CATS = {
  content:      { name: "Content",         color: "#a8b339", svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.1 5.4L20 10l-5.9 1.6L12 17l-2.1-5.4L4 10l5.9-1.6z"/></svg>` },
  distribution: { name: "Distribution",    color: "#32b5ae", svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v8M12 12l-6 6M12 12l6 6"/><circle cx="12" cy="4" r="1.6" fill="currentColor" stroke="none"/><circle cx="6" cy="18" r="1.6" fill="currentColor" stroke="none"/><circle cx="18" cy="18" r="1.6" fill="currentColor" stroke="none"/></svg>` },
  promotion:    { name: "Promotion",       color: "#c04a6e", svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4l10 4V6L4 10z"/><path d="M17 9a4 4 0 0 1 0 6"/></svg>` },
  audience:     { name: "Audience health", color: "#d946ef", svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-5 3 9 2-6 1.5 2H21"/></svg>` },
  data:         { name: "Data note",       color: "#8b95a7", svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor" stroke="none"/></svg>` },
};
const CAT_RANK = { content: 0, distribution: 1, promotion: 2, audience: 3, data: 4 };
function catKeyFor(ins) {
  if (ins.category && CATS[ins.category]) return ins.category;
  const id = ins.id;
  if (id === "pace-rank") return "content";
  if (id === "engagement" || id.startsWith("live")) return "audience";
  if (id === "host-split" || id === "reach-conversion" || id.startsWith("anomaly")) return "promotion";
  if (id === "flatline" || id === "platform-phase" || id === "watch-split" || id === "host-plays-split") return "distribution";
  return "data";
}

const state = { view: "growth", mode: "standings", byDate: false, solo: null, panel: null, table: false, allInsights: false, evidenceOpen: false };

function premiereMs(dateStr) {
  const [y,m,d] = dateStr.split("-").map(Number);
  return Date.UTC(y, m-1, d, 12) + PHX;
}
// Trajectory math sums YouTube views only — the one complete watch history.
// X broadcast plays have no series before 2026-08-21; the chart title states
// this scope in place (no fabricated history, no silently mixed units).
function sum(byDest) { let t = 0; for (const k of YT_KEYS) t += (byDest[k]?.views || 0); return t; }
function splitOf(byDest) { const o = {}; for (const k of YT_KEYS) o[k] = byDest[k]?.views || 0; return o; }
function splitDelta(cur, prev) { const o = {}; for (const k of YT_KEYS) o[k] = (cur[k]?.views || 0) - (prev?.[k]?.views || 0); return o; }
function fmtDate(ms) { return new Date(ms - PHX).toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" }); }
const ORDINAL_DAY = ["", "first", "second", "third", "fourth", "fifth", "sixth", "seventh", "eighth", "ninth", "tenth", "eleventh", "twelfth", "thirteenth", "fourteenth", "fifteenth", "sixteenth", "seventeenth", "eighteenth", "nineteenth", "twentieth", "twenty-first", "twenty-second", "twenty-third", "twenty-fourth", "twenty-fifth", "twenty-sixth", "twenty-seventh", "twenty-eighth", "twenty-ninth", "thirtieth", "thirty-first"];
const MONTH_NAME = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
function phoenixDateKey(value = Date.now()) {
  const parts = new Intl.DateTimeFormat("en-US", { timeZone: "America/Phoenix", year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(new Date(value));
  const take = (type) => parts.find(part => part.type === type)?.value;
  return `${take("year")}-${take("month")}-${take("day")}`;
}
function dateInWords(dateKey) {
  const [, month, day] = dateKey.split("-").map(Number);
  return `${MONTH_NAME[month - 1]} ${ORDINAL_DAY[day]}`;
}
function relativeDayWords(dateKey) {
  const today = phoenixDateKey();
  const days = Math.round((Date.parse(`${today}T12:00:00Z`) - Date.parse(`${dateKey}T12:00:00Z`)) / DAY);
  return days === 0 ? "today" : days === 1 ? "yesterday" : dateInWords(dateKey);
}
function kfmt(n) { if (Math.abs(n) >= 1000) return (n/1000).toFixed(Math.abs(n) >= 10000 ? 0 : 1).replace(/\.0$/,"") + "k"; return String(Math.round(n)); }
function nfmt(n) { return n.toLocaleString("en-US"); }
function metricText(value, missing = "–") { return value == null ? missing : nfmt(value); }
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function short(t) { return t.replace(/^Dive Radio:\s*/i, "").replace(/\s*\+?\s*Live Call-?Ins?$/i, "").replace(/[,\s]+$/, ""); }
function label(e) { return `E${e.ep} · ${short(e.title)}`; }
function heroMarker(e) {
  const tvi = e.latest.totalViewsInfo || {};
  if (!tvi.includesPlays) return "YT only";
  if (tvi.partial) return "some X plays missing";
  if (tvi.stale && tvi.asOf) return "X plays are old";
  return "";
}

/* W12 episode health: read-only render of the frozen store entry attached by
   build-data (definition-lock — no score math at render time, ever). An episode
   younger than three weeks carries only the date its read completes; nothing
   score-like renders for it anywhere. */
const CHECK_WORDS = { watch: "views", engagement: "engagement", retention: "how long people watch", live: "live turnout", conversion: "new subscribers", sentiment: "feedback" };
function healthOf(e) { return e.health && !e.health.pending && e.health.score != null ? e.health : null; }
function healthWaitDate(e) {
  const on = e.health?.readCompleteOn;
  return on ? `${on.slice(5, 7)}/${on.slice(8, 10)}` : "";
}
function healthChip(e) {
  const h = healthOf(e);
  if (!h) return "";
  const missing = (h.missingChecks || []).length > 0;
  const spoken = [`Episode health ${h.score} out of 100; 50 is typical.`];
  if (missing) spoken.push("Some checks are not in.");
  return `<span class="hs" data-hslug="${esc(e.slug)}" aria-label="${esc(spoken.join(" "))}">health <b data-fold-number>${h.score}</b>${missing ? `<span class="mk">*</span>` : ""}<span class="htrack" aria-hidden="true"><span style="width:${h.score}%"></span></span></span>`;
}

/* health tooltip (owner request 2026-08-22): every chip explains itself on
   hover or tap. One shared fixed-position box; reads the same store entry as
   every surface. */
function healthTipHTML(e, h) {
  let out = `<div class="h">Health ${h.score} — ${esc(short(e.title))}</div>`;
  out += `<div>Its first three weeks, measured against the show as it stood when it aired. 50 means a typical episode; newer episodes never change it.</div>`;
  if ((h.missingChecks || []).length) {
    out += `<div class="warn">* Not every check had honest numbers — missing ${h.missingChecks.map((c) => CHECK_WORDS[c] || c).join(" and ")}.</div>`;
  }
  return out;
}

function sameAgeSub(e) {
  const ytSum = (byDest) => YT_KEYS.reduce((a,k) => a + (byDest[k]?.views || 0), 0);
  const age = Date.parse(e.latest.ts) - premiereMs(e.premiere);
  const peers = [];
  for (const o of EPS) {
    if (o.slug === e.slug) continue;
    const prem = premiereMs(o.premiere);
    if (Date.parse(o.snapshots[0].ts) - prem > age) continue;
    if (Date.parse(o.snapshots[o.snapshots.length-1].ts) - prem < age) continue;
    let best = null;
    for (const s of o.snapshots) {
      const t = Date.parse(s.ts);
      if (t - prem <= age && (!best || t > best.t)) best = { t, v: ytSum(s.byDest) };
    }
    if (best) peers.push(best.v);
  }
  if (peers.length < 3) return null;
  peers.sort((a,b)=>a-b);
  const med = peers[Math.floor(peers.length/2)];
  if (med <= 0) return null;
  const cur = e.latest.ytTotal;
  if (!Number.isFinite(cur)) return null;
  return {
    pct: Math.round(((cur - med) / med) * 100),
    n: peers.length,
    rank: peers.filter((v) => v > cur).length + 1,
    of: peers.length + 1,
  };
}

/* ================= W10 saved show health ================= */
function healthTrend(points) {
  if (!Array.isArray(points) || points.length < 7) return "";
  const values = points.map(point => point.score);
  const lo = Math.min(...values), hi = Math.max(...values);
  const span = Math.max(1, hi - lo);
  const coords = values.map((value, index) => {
    const x = values.length === 1 ? 75 : Math.round(index / (values.length - 1) * 148) + 1;
    const y = Math.round(25 - (value - lo) / span * 22) + 1;
    return `${x},${y}`;
  }).join(" ");
  return `<svg class="trend" viewBox="0 0 150 28" role="img" aria-label="Saved health scores over time"><polyline points="${coords}"></polyline></svg>`;
}

/* Six-check diagnosis labels and states. The words stay plain; the exact saved
   numbers live one click away in the evidence card, never at glance layer. */
const CHECK_LABELS = {
  growth: ["Growth", "How new episodes start"],
  audienceQuality: ["Engagement", "Watching and reacting"],
  reachEfficiency: ["Reach", "X posts becoming plays"],
  livePull: ["Turnout", "Live audience"],
  conversion: ["Subscribers", "Subscriber pull"],
  sentiment: ["Goodwill", "How feedback reads"],
};
function checkState(score) {
  if (score == null) return ["waiting", "Not in yet"];
  if (score >= 55) return ["healthy", "Healthy"];
  if (score >= 45) return ["steady", "Steady"];
  return ["fragile", "Fragile"];
}

function buildHealth() {
  const el = document.getElementById("health");
  const h = DATA.health;
  if (!h || !Number.isFinite(h.score) || !h.headline || !Array.isArray(h.pros) || !Array.isArray(h.cons)) {
    el.className = "healthrow empty";
    el.innerHTML = `<div class="card">Health update is not available yet.</div>`;
    return;
  }
  const saved = relativeDayWords(h.date);
  const readState = h.readState === "early" ? " · Early read" : "";
  const R = 76, C = Math.round(2 * Math.PI * R * 10) / 10;
  const rows = (h.checks || []).map((c) => {
    const [label, sub] = CHECK_LABELS[c.key] || [c.key, ""];
    const [cls, word] = checkState(c.score);
    return `<div class="checkrow"><span class="cl">${label}</span><span class="cs">${sub}</span>
      <span class="st ${cls}"><i aria-hidden="true"></i>${word}</span></div>`;
  }).join("");
  const bullets = (items) => items.map(item => `<li>${esc(typeof item === "string" ? item : item.text)}</li>`).join("");
  const waiting = (h.checks || []).filter((c) => c.score == null && c.reason);
  const evidence = !state.evidenceOpen ? "" : `<div class="card health-evidence" id="evidence">
      <div class="kicker">Why this score</div>
      <div class="evidence"><div><h3>Helping</h3><ul>${bullets(h.pros)}</ul></div>
      <div><h3>Needs work</h3><ul>${bullets(h.cons)}</ul></div></div>
      ${waiting.length ? `<div class="waitlist">${waiting.map((c) => `${(CHECK_LABELS[c.key] || [c.key])[0]} isn’t in yet — ${esc(c.reason)}`).join("<br>")}</div>` : ""}
      ${healthTrend(h.trend?.points)}
    </div>`;
  el.className = "healthrow";
  el.innerHTML = `<div class="card hc-score">
      <div class="kicker">Show health</div>
      <div class="gaugewrap">
        <div class="gauge" role="img" aria-label="Show health ${h.score} out of 100. 50 is the show’s usual level.">
          <svg viewBox="0 0 168 168" aria-hidden="true">
            <circle class="track" cx="84" cy="84" r="${R}"></circle>
            <circle class="fill" cx="84" cy="84" r="${R}" stroke-dasharray="${Math.round(C * h.score / 100 * 10) / 10} ${C}"></circle>
          </svg>
          <div class="num"><b data-fold-number>${h.score}</b><small>of 100</small></div>
        </div>
        <div class="scale">50 is this show’s usual level</div>
      </div>
    </div>
    <div class="card hc-diag">
      <div class="kicker">Health diagnosis</div>
      <p class="headline">${esc(h.headline)}</p>
      <div class="checkrows">${rows}</div>
    </div>
    <div class="card hc-meta">
      <div class="kicker">Today’s read</div>
      <div class="updated"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Updated ${esc(saved)}${readState}</div>
      <p class="scope">Saved once a day: six checks that compare the newest episodes with this show’s usual levels. It reads today, not a running total — each episode’s own three-week score lives on its card below.</p>
      <button type="button" class="why" id="whyscore" aria-expanded="${state.evidenceOpen ? "true" : "false"}" aria-controls="evidence">Why this score ${state.evidenceOpen ? "−" : "+"}</button>
    </div>${evidence}`;
  document.getElementById("whyscore").addEventListener("click", () => { state.evidenceOpen = !state.evidenceOpen; render(); });
}

/* ================= hero: latest episode card ================= */
let sparkChart = null;
function buildHero() {
  const el = document.getElementById("hero");
  const e = NEWEST;
  const isLive = state.view === "live";
  const c = color(e);
  let html = `<div class="main"><div class="kicker">${isLive ? "Latest live session" : "Latest episode"}</div><h2>${esc(short(e.title))}</h2>`;

  if (isLive) {
    if (e.live) {
      html += `<div class="metricline"><div class="big"><span data-fold-number>${e.live.peak}</span> <small>peak live viewers</small></div></div>`;
    } else {
      html += `<div class="unavailable">Live data is not available for this episode.</div>`;
    }
  } else {
    const mk = heroMarker(e);
    const tv = e.latest.totalViews ?? e.latest.ytTotal;
    const totalText = tv == null ? `<span class="unavailable">Total views are not available.</span>` : `<span class="big"><span data-fold-number>${nfmt(tv)}</span> <small>total views</small></span>`;
    html += `<div class="metricline">${totalText}${mk ? `<span class="mk">${mk}</span>` : ""}</div>`;
    const yt = e.latest.ytTotal;
    const x = e.latest.xPlays;
    const splitReady = Number.isFinite(tv) && Number.isFinite(yt) && Number.isFinite(x) && tv > 0 && yt + x === tv;
    if (splitReady) {
      html += `<div class="platform-bar" role="img" aria-label="YouTube ${nfmt(yt)} views. X ${nfmt(x)} plays.">
        <span class="yt" style="flex:${yt}"></span><span class="x" style="flex:${x}"></span></div>
        <div class="splitlabels" aria-hidden="true"><span><i style="background:#ff795b"></i>YouTube</span><span><i style="background:var(--accent)"></i>X</span></div>`;
    } else {
      html += `<div class="unavailable">The YouTube and X split is not available.</div>`;
    }
    // Episode health never shows early: a finished read gets its chip; a young
    // episode states when its three-week read completes, nothing more.
    if (healthOf(e)) html += `<div class="state">${healthChip(e)}</div>`;
    else if (e.health?.pending) html += `<div class="state">Health score lands after ${healthWaitDate(e)}, once its first three weeks are in.</div>`;
  }

  html += `</div>`;
  // Sparkline is live-view only. In growth view it plotted YouTube-only
  // history on the total-views hero — spotlighting one platform on a card
  // about the whole picture (owner call, 2026-08-22). A total-views history
  // line can't replace it yet: X plays have no week-1 history before 8/21,
  // and we never fabricate history.
  if (isLive) html += `<div class="spark"><div class="cv"><canvas id="spark"></canvas></div><div class="cap">concurrent viewers by minute</div></div>`;
  el.innerHTML = html;

  if (sparkChart) { sparkChart.destroy(); sparkChart = null; }
  if (!isLive) return;
  const ctx = document.getElementById("spark");
  const pts = e.live ? e.live.series.map(p => ({ x: p.m, y: p.v })) : [];
  el.querySelector(".spark").style.visibility = pts.length > 1 ? "" : "hidden";
  if (pts.length > 1 && window.Chart) {
    sparkChart = new Chart(ctx, {
      type: "line",
      data: { datasets: [{ data: pts, borderColor: c, backgroundColor: c + "22", borderWidth: 2,
        pointRadius: 0, fill: true, tension: 0.3 }] },
      options: { responsive: true, maintainAspectRatio: false, animation: false,
        scales: { x: { type: "linear", display: false }, y: { display: false, beginAtZero: true } },
        plugins: { legend: { display: false }, tooltip: { enabled: false } }, events: [] },
    });
  }
}

/* ================= episode carousel (above the chart) ================= */
function buildStrip() {
  const isLive = state.view === "live";
  const strip = document.getElementById("strip");
  strip.innerHTML = "";
  // oldest → newest, left → right: the latest episode is always far right
  // (locked rule) — read in order, the finished health scores ARE the
  // trajectory of the show.
  for (const e of EPS) {
    const it = document.createElement("button");
    it.type = "button";
    it.className = "sitem" + (e.slug === NEWEST.slug ? " newest" : "");
    it.setAttribute("role", "listitem");
    it.dataset.slug = e.slug;
    let num = "";
    let spokenValue = "Data not available.";
    if (isLive) {
      if (e.live) {
        num = `<span class="num" data-fold-number>${e.live.peak}</span> peak`;
        spokenValue = `${e.live.peak} peak live viewers.`;
      } else {
        num = `<span class="num">not available</span>`;
      }
    } else {
      const mk = heroMarker(e);
      // number rides the identity row; the unit is stated once in the hero
      const total = e.latest.totalViews ?? e.latest.ytTotal;
      num = total == null ? `<span class="num">not available</span>` : `<span class="num" data-fold-number>${kfmt(total)}</span>${mk ? `<span class="mk">${mk}</span>` : ""}`;
      if (total != null) spokenValue = `${nfmt(total)} total views.${healthOf(e) ? ` Episode health ${healthOf(e).score} of 100.` : ""}`;
    }
    // Episode health, growth tab only: a finished three-week read shows its
    // score; the first episode says it set the baseline; younger episodes show
    // nothing score-like at all (their wait date lives in the click panel).
    let hs = "";
    if (!isLive) {
      if (healthOf(e)) hs = healthChip(e);
      else if (e.health && !e.health.pending && e.health.score == null) hs = `<span class="hs quiet">sets the baseline</span>`;
      else hs = `<span class="hs quiet" aria-hidden="true"></span>`;
    }
    it.innerHTML = `<span class="r1"><span class="dot" style="background:${color(e)}"></span>E${e.ep} ${num}</span>
      <span class="t">${esc(short(e.title))}</span>${hs}`;
    it.setAttribute("aria-label", `${label(e)}. ${spokenValue}`);
    it.addEventListener("click", () => {
      if (state.panel === e.slug) { state.panel = null; state.solo = null; }
      else { state.panel = e.slug; state.solo = e.slug; }
      render();
    });
    strip.appendChild(it);
  }
  // the strip scrolls when episodes outgrow the row; land it on the NEWEST
  // episode (far right) — the locked order rule keeps its value on any width
  strip.scrollLeft = strip.scrollWidth;
}

/* ================= detail panel (Layer 2) ================= */
function buildPanel() {
  const el = document.getElementById("panel");
  const e = EPS.find(x => x.slug === state.panel);
  if (!e) { el.style.display = "none"; el.innerHTML = ""; return; }
  // Numbers lead, labels recede. Unit words, methodology sentences, and the
  // late-reg explainer live in "About this data" — never repeated here.
  const bd = e.latest.byDest || {};
  const tvi = e.latest.totalViewsInfo || {};
  let html = `<button type="button" class="x" id="panelx" aria-label="Close episode details">×</button>`;
  html += `<div class="h"><span class="dot" style="background:${color(e)}"></span>${esc(label(e))}
    <span style="color:var(--t3);font-weight:400;font-size: 13px">· ${e.premiere.slice(5).replace("-", "/")}</span>
    ${e.partialHistory ? `<span class="pchip" title="tracking started late for this episode — totals are right, early weekly history is missing">tracked late</span>` : ""}</div>`;
  html += `<div class="grid"><div>`;
  const panelTotal = e.latest.totalViews ?? e.latest.ytTotal;
  html += `<div class="row head">Total views<span class="val big">${panelTotal == null ? "not available" : nfmt(panelTotal)}</span></div>`;
  const rows = [
    ["yt:joindiveclub", bd["yt:joindiveclub"]?.views],
    ["yt:designertom", bd["yt:designertom"]?.views],
    ["x:ridd_design", bd["x:ridd_design"]?.plays],
    ["x:designertom", bd["x:designertom"]?.plays],
  ];
  for (const [k, v] of rows) {
    html += `<div class="row"><span class="sq" style="background:${PLAT_COLORS[k]}"></span>${TT_NAME[k]}<span class="val">${v == null ? "–" : nfmt(v)}</span></div>`;
  }
  if (tvi.partial) html += `<div class="note">◐ ${tvi.have} of ${tvi.total} broadcasts — true total higher</div>`;
  else if (tvi.stale && tvi.asOf) html += `<div class="note">X plays as of ${tvi.asOf.slice(5, 10).replace("-", "/")}</div>`;
  else if (!tvi.includesPlays) html += `<div class="note">YT only — X plays unavailable</div>`;
  html += `</div><div>`;
  html += `<div class="row head">X reach <span class="hint">not in total</span><span class="val big">${e.latest.xImpressions == null ? "not available" : nfmt(e.latest.xImpressions)}</span></div>`;
  html += `<div class="row">@ridd_design<span class="val">${bd["x:ridd_design"]?.views == null ? "not available" : nfmt(bd["x:ridd_design"].views)}</span></div>`;
  html += `<div class="row">@designertom<span class="val">${bd["x:designertom"]?.views == null ? "not available" : nfmt(bd["x:designertom"].views)}</span></div>`;
  if (e.transcript) {
    html += `<div class="row"><a href="transcripts/${esc(e.slug)}.txt" download="${esc(short(e.title))} transcript.txt" style="color:var(--accent)">Download transcript</a><span class="val hint">timestamped</span></div>`;
  }
  if (e.live) {
    // one row grammar everywhere: label left, value right (owner call 2026-08-22
    // — no inline dot-separated stat lines in the panel)
    html += `<div class="row head" style="margin-top:6px">Live<span class="val big">${e.live.peak} <span class="hint">peak</span></span></div>`;
    html += `<div class="row">avg live viewers<span class="val">${e.live.avg}</span></div>`;
    html += `<div class="row">chat messages<span class="val">${nfmt(e.live.chatMessages)}</span></div>`;
    html += `<div class="row">duration<span class="val">${e.live.durationMin ?? "–"} min</span></div>`;
  }
  html += `</div></div>`;

  // Same-age YouTube pace belongs in the click layer, not on every glance
  // card. It uses the same stored snapshots as the pacing chart; nothing is
  // guessed when no comparable history exists.
  if (state.view !== "live") {
    const pace = sameAgeSub(e);
    const paceText = !pace
      ? `<span class="hint">no same-age comparison yet</span>`
      : pace.pct === 0
        ? "typical"
        : `${pace.pct > 0 ? "▲" : "▼"}${Math.abs(pace.pct)}% vs typical`;
    html += `<div class="sect"><div class="row head">YouTube views at the same age<span class="val big">${paceText}</span></div></div>`;
  }

  // W12 episode health: one row per check — the stored number + a plain
  // comparison. Missing checks say so; they are never rendered as zeros. A
  // young episode states when its read completes; no score renders early.
  const h = e.health;
  if (h?.pending) {
    html += `<div class="sect"><div class="row head">Episode health<span class="val hint">arrives after ${healthWaitDate(e)}</span></div>
      <div class="mut">Every episode is scored on its first three weeks against the show before it — nothing shows until that read is complete.</div></div>`;
  } else if (h && h.score == null) {
    html += `<div class="sect"><div class="row head">Episode health<span class="val hint">sets the baseline</span></div>
      <div class="mut">${esc(h.reason || "not enough honest numbers to score this episode")}.</div></div>`;
  } else if (h) {
    const CLABEL = {
      watch: "views at three weeks",
      engagement: "likes + comments per 1,000 views",
      retention: "how much people watch",
      live: "live turnout",
      conversion: "subscribers per 1,000 views",
      sentiment: "feedback leaning positive",
    };
    const plainRatio = (ratio) => {
      const pct = Math.round(Math.abs(ratio - 1) * 100);
      return pct <= 5 ? "typical" : ratio > 1 ? `${pct}% above typical` : `${pct}% below typical`;
    };
    html += `<div class="sect">`;
    html += `<div class="row head">Episode health<span class="val big">${h.score} <span class="hint">of 100 · 50 is typical</span></span></div>`;
    for (const [k, lab] of Object.entries(CLABEL)) {
      const c = h.checks?.[k];
      const fmtV = (v) => k === "live" ? `${v.peak} live · ${nfmt(v.chat)} chat` : (k === "retention" || k === "sentiment") ? `${v}%` : nfmt(v);
      let val = `<span class="hint">not in</span>`;
      if (c && c.ratio != null) val = `${fmtV(c.value)} <span class="hint">· ${plainRatio(c.ratio)}</span>`;
      html += `<div class="row">${lab}<span class="val">${val}</span></div>`;
    }
    const peers = Math.max(0, (h.windowIds || []).length - 1);
    html += `<div class="mut">Its first three weeks against the ${peers === 1 ? "episode" : `${peers} episodes`} before it — newer episodes never change this score.</div>`;
    if ((h.missingChecks || []).length) html += `<div class="note">* ${h.missingChecks.map((c) => CHECK_WORDS[c] || c).join(" and ")} had too little honest data and sat out</div>`;
  }

  const comments = e.comments;
  if (comments) {
    html += `<div class="sect">`;
    html += `<span class="row head" style="display:inline">Audience feedback</span> `;
    html += `<span class="senti-link" data-f="positive"><b style="color:var(--good)">${comments.enjoyCount}</b> enjoyed</span> · <span class="senti-link" data-f="negative"><b style="color:var(--bad)">${comments.complaintCount}</b> didn’t</span> · <span class="senti-link" data-f="all">${comments.uniqueCommenters} ${comments.uniqueCommenters === 1 ? "person" : "people"} commented →</span>`;
    if (comments.commentersPer1k != null) {
      html += `<div class="row">people commenting per 1,000 watches<span class="val">${comments.commentersPer1k}</span></div>`;
    } else {
      html += `<div class="note">${esc(comments.commentersPer1kNote)}</div>`;
    }
    const themeColumn = (title, themes) => `<div><div class="themehead">${title}</div>${themes.length
      ? themes.map((t) => `<div class="themeitem">${esc(t.theme)} — ${t.count} people</div>`).join("")
      : `<div class="themeempty">No clear theme yet.</div>`}</div>`;
    html += `<div class="themegrid">${themeColumn("What people enjoy", comments.enjoyThemes || [])}${themeColumn("What they don’t", comments.complaintThemes || [])}</div>`;
    if (comments.xCoverage === "missed") {
      html += `<div class="note">X replies missing — this episode aired before comment tracking started, and X only lets us search back 7 days. YouTube comments only.</div>`;
    }
    for (const q of (comments.featured || []).slice(0, 2)) {
      html += `<div class="q">“${esc(q.text.length > 110 ? q.text.slice(0, 108).trimEnd() + "…" : q.text)}” <span class="by">— ${esc(q.author)}${q.likes ? ` · ${q.likes}♥` : ""}</span></div>`;
    }
    html += `</div>`;
  }
  el.innerHTML = html;
  el.style.display = "";
  el.querySelector("#panelx").addEventListener("click", () => { state.panel = null; state.solo = null; render(); });
  el.querySelectorAll(".senti-link").forEach(a =>
    a.addEventListener("click", () => openDrill(e.slug, a.dataset.f)));
}

/* ================= drilldown modal (Layer 3) ================= */
const drillState = { slug: null, filter: "all" };
function openDrill(slug, filter) {
  const e = EPS.find(x => x.slug === slug);
  if (!e?.comments?.list) return;
  drillState.slug = slug;
  drillState.filter = filter || "all";
  renderDrill();
  document.getElementById("drill").classList.add("on");
}
function closeDrill() { document.getElementById("drill").classList.remove("on"); }
/* ================= growth-trend card: is the show growing? (PRD v2 W2) ================= */
function buildCompound() {
  const el = document.getElementById("compound");
  const rows = DATA.showTrend?.week1VelocityByEpisode || [];
  if (state.view === "live" || !rows.length) { el.style.display = "none"; el.innerHTML = ""; return; }
  const enriched = rows.map(r => ({ ...r, e: EPS.find(x => x.slug === r.slug) })).filter(r => r.e);
  const vals = enriched.filter(r => r.value != null);
  const max = Math.max(1, ...vals.map(r => r.value));
  // Direction stays hidden until three real first weeks exist. When it does
  // appear, the visual carries the exact stored values through accessible
  // labels without adding another row of glance-layer numbers.
  let verdict, cls = "";
  if (vals.length < 3) {
    el.innerHTML = `<div class="kicker">Growth trend</div>
      <div class="waitbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>
      <div class="cv2">Growth trend isn’t ready yet.</div></div>`;
    el.style.display = "";
    return;
  } else {
    const last = vals[vals.length - 1], prev = vals[vals.length - 2];
    const pct = Math.round(((last.value - prev.value) / prev.value) * 100);
    if (Math.abs(pct) <= 5) { verdict = "First-week audience is holding steady."; }
    else if (pct > 0) { verdict = "Each launch is starting stronger."; cls = "up"; }
    else { verdict = "New launches are starting softer."; cls = "down"; }
  }
  let bars = "";
  for (const r of vals) {
    bars += `<div class="cbar" role="img" aria-label="${esc(short(r.e.title))}: ${nfmt(r.value)} YouTube views in its first week">
      <div class="bwrap"><div class="b" style="height:${Math.max(6, Math.round((r.value / max) * 100))}%;background:${color(r.e)}"></div></div></div>`;
  }
  el.innerHTML = `<div class="kicker">Growth trend — first weeks</div><div class="bars">${bars}</div>
    <div class="cv2 ${cls}" style="${cls === "up" ? "color:var(--good)" : cls === "down" ? "color:var(--bad)" : ""}">${verdict}</div>`;
  el.style.display = "";
}

function renderDrill() {
  const e = EPS.find(x => x.slug === drillState.slug);
  if (!e) return;
  const list = e.comments.list || [];
  document.getElementById("dtitle").textContent = `Audience feedback — ${label(e)}`;
  const tabs = [["all", `All feedback ${list.length}`], ["positive", `Enjoyed ${e.comments.enjoyCount}`],
    ["negative", `Didn’t ${e.comments.complaintCount}`]];
  const tEl = document.getElementById("dtabs");
  tEl.innerHTML = "";
  for (const [f, lab] of tabs) {
    const b = document.createElement("button");
    b.textContent = lab;
    b.className = drillState.filter === f ? "on" : "";
    b.addEventListener("click", () => { drillState.filter = f; renderDrill(); });
    tEl.appendChild(b);
  }
  const rows = list.filter(c => drillState.filter === "all" ? true :
    drillState.filter === "positive" ? c.sentiment === "positive" || c.sentiment === "mixed" :
    c.sentiment === "negative" || c.sentiment === "mixed");
  const lEl = document.getElementById("dlist");
  const missedNote = e.comments?.xCoverage === "missed"
    ? `<div class="dempty" style="padding:8px 0 4px;font-size:12px">X replies missing for this episode — it aired before comment tracking started (X search reaches back 7 days). YouTube comments only.</div>` : "";
  lEl.innerHTML = (rows.length ? "" : `<div class="dempty">No feedback in this group.</div>`) + missedNote;
  for (const c of rows) {
    const d = document.createElement("div");
    d.className = "drow";
    d.innerHTML = `<div class="m"><span class="who">${esc(c.author)}</span>
      <span class="src">${c.source === "yt" ? "YouTube" : "X"}</span>
      ${c.likes ? `<span>${c.likes}♥</span>` : ""}
      <span class="senti ${c.sentiment}">${c.sentiment === "mixed" ? "± both" : c.sentiment === "positive" ? "enjoyed" : "didn’t"}</span></div>
      <div class="txt">${esc(c.text)}</div>`;
    lEl.appendChild(d);
  }
}
// stale-tooltip kill (taste audit F5): Chart.js external tooltips only hide on

// health-chip tooltip: delegated so it survives every re-render
const rtt = document.createElement("div");
rtt.id = "rtt";

function showRtt(badge) {
  const e = EPS.find(x => x.slug === badge.dataset.hslug);
  const r = e && healthOf(e);
  if (!r) return;
  rtt.innerHTML = healthTipHTML(e, r);
  const b = badge.getBoundingClientRect();
  rtt.style.opacity = 1;
  // measure after content is set; clamp inside the viewport, flip above if low
  const w = rtt.offsetWidth, h = rtt.offsetHeight;
  let x = Math.min(Math.max(b.left + b.width / 2 - w / 2, 8), window.innerWidth - w - 8);
  let y = b.bottom + 8;
  if (y + h > window.innerHeight - 8) y = b.top - h - 8;
  rtt.style.left = x + "px";
  rtt.style.top = y + "px";
}

document.addEventListener("mouseout", (ev) => { if (ev.target.closest?.(".hs[data-hslug]")) hideRtt(); });

document.addEventListener("focusout", (ev) => { if (ev.target.closest?.(".hs[data-hslug]")) hideRtt(); });

/* ================= chart titles / scope (unit trap fix) ================= */
function chartTitle() {
  if (state.view === "live") return ["Live viewers", "By minute"];
  if (state.mode === "standings") {
    const anyPartial = EPS.some(e => (e.latest.totalViewsInfo || {}).partial);
    return ["Episode views", "YouTube + X playback" + (anyPartial ? " · some X plays missing" : "")];
  }
  if (state.mode === "race") return ["Views after release", `YouTube only · ${state.byDate ? "by date" : "since release"}`];
  return ["Weekly YouTube views", "Episodes side by side"];
}

/* ================= charts ================= */
function seriesFor(e) {
  const prem = premiereMs(e.premiere);
  const pts = [];
  if (state.mode === "race") {
    for (const s of e.snapshots) {
      const t = Date.parse(s.ts);
      pts.push(state.byDate
        ? { x: t, y: sum(s.byDest), meta: { ts: s.ts, split: splitOf(s.byDest) } }
        : { x: Math.round(((t - prem) / DAY) * 10) / 10, y: sum(s.byDest), meta: { ts: s.ts, day: (t - prem) / DAY, split: splitOf(s.byDest) } });
    }
  } else {
    for (let i = 0; i < e.weekly.length; i++) {
      const cur = e.weekly[i].byDest;
      const prev = i === 0 ? null : e.weekly[i-1].byDest;
      const first = i === 0;
      const split = first ? splitOf(cur) : splitDelta(cur, prev);
      pts.push({
        x: state.byDate ? Date.parse(e.weekly[i].boundary) : e.weekly[i].week,
        y: YT_KEYS.reduce((a,k) => a + (split[k] || 0), 0),
        meta: { ts: e.weekly[i].boundary, week: e.weekly[i].week, split,
          note: first ? (e.partialHistory ? "views at registration (late-registered)" : "first tracked week") : null }
      });
    }
  }
  return pts;
}

const endLabels = {
  id: "endLabels",
  afterDatasetsDraw(chart) {
    if (chart.config.type !== "line") return;
    const { ctx, chartArea } = chart;
    const placed = [];
    const items = [];
    chart.data.datasets.forEach((ds, i) => {
      const meta = chart.getDatasetMeta(i);
      if (meta.hidden || !meta.data.length || ds.spark || ds.isAnnounce) return;
      const pt = meta.data[meta.data.length - 1];
      items.push({ x: pt.x, y: pt.y, text: "E" + ds.epNum, color: ds.labelColor || ds.borderColor });
    });
    items.sort((a, b) => a.y - b.y);
    ctx.save();
    ctx.font = `700 14px ${FONT}`;
    for (const it of items) {
      let y = it.y;
      for (const p of placed) if (Math.abs(y - p) < 15) y = p + 15;
      placed.push(y);
      const lx = Math.min(it.x + 8, chartArea.right + 4);
      if (Math.abs(y - it.y) > 6) {
        // leader line: keep a displaced label attached to its series
        ctx.strokeStyle = it.color; ctx.lineWidth = 1; ctx.globalAlpha = 0.6;
        ctx.beginPath(); ctx.moveTo(it.x + 2, it.y); ctx.lineTo(lx - 2, y - 4); ctx.stroke();
        ctx.globalAlpha = 1;
      }
      ctx.fillStyle = it.color;
      ctx.fillText(it.text, lx, y + 4);
    }
    ctx.restore();
  }
};

const barTotals = {
  id: "barTotals",
  afterDatasetsDraw(chart) {
    if (chart.config.options.indexAxis !== "y") return;
    const { ctx } = chart;
    const eps = chart.config._ordered || [];
    ctx.save();
    ctx.font = `700 13px ${FONT}`;
    ctx.textBaseline = "middle";
    const lastMeta = chart.getDatasetMeta(chart.data.datasets.length - 1);
    eps.forEach((e, i) => {
      const bar = lastMeta.data[i];
      if (!bar) return;
      const tvi = e.latest.totalViewsInfo || {};
      const mark = tvi.partial ? " ◐" : "";
      const total = e.latest.totalViews ?? e.latest.ytTotal;
      ctx.fillStyle = state.solo && state.solo !== e.slug ? DIMLINE : "#e8ecf4";
      ctx.fillText(total == null ? "not available" : nfmt(total) + mark, bar.x + 8, bar.y);
    });
    ctx.restore();
  }
};

function externalTooltip(context) {
  const { chart, tooltip } = context;
  const el = document.getElementById("tt");
  if (!tooltip.opacity || !tooltip.dataPoints?.length) { el.style.opacity = 0; return; }
  const isLive = state.view === "live";
